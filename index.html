ula.</p><p><strong>5. Hukuki yapı.</strong> Şahıs şirketi, limited, anonim. Her birinin avantajları ve dezavantajları var. Bir mali müşavirle konuş.</p><p><strong>6. Zihinsel hazırlık.</strong> Girişimcilik, bir duygusal yolculuktur. Yüksekler ve alçaklar. Zihinsel dayanıklılık, en önemli sermayedir.</p><h2>İş kurmanın aşamaları</h2><p><strong>1. Fikir.</strong> Bir sorun, bir ihtiyaç, bir eksik. İyi fikirler, genelde gözle görülür bir boşluktan doğar.</p><p><strong>2. Pazar araştırması.</strong> Potansiyel müşteriyle konuş. Ne istiyorlar? Ne kadar ödemeye razılar? Rakipler kimler?</p><p><strong>3. Minimum uygulanabilir ürün (MVP).</strong> En basit halini yap. Mükemmel olmasın; sadece çalışsın. Geri bildirim al, geliştir.</p><p><strong>4. İlk müşteriler.</strong> İlk 10 müşteriyi bul. Genelde ağdan gelirler. Onlara özel ilgi göster; onların geri bildirimi, altın değerindedir.</p><p><strong>5. Ölçekleme.</strong> Ürünü geliştir, ekibi büyüt, pazarlamayı artır. Ama acele etme; her aşamanın kendi zorlukları var.</p><p><strong>6. Sürdürme.</strong> İş, bir maratondur. İlk yıl zor, ikinci yıl daha zor, üçüncü yıl biraz nefes alırsın. Sabır, en büyük sermayedir.</p><h2>En yaygın hatalar</h2><ul><li><strong>Fikri test etmeden yatırım yapmak.</strong> Müşterinin ne istediğini sormadan ürün yapmak.</li><li><strong>Ortak seçiminde acele etmek.</strong> Yanlış ortak, işten daha büyük bir sorundur.</li><li><strong>Finansal disiplin eksikliği.</strong> Gelir-gider dengesini kurmamak.</li><li><strong>Sabırsızlık.</strong> İlk 6 ayda başarı beklemek.</li><li><strong>Kişisel hayatı ihmal etmek.</strong> İş, hayatın yerini almaz; bir parçasıdır.</li></ul><h2>Zor zamanlar</h2><p>Her girişimcinin hayatında zor zamanlar vardır. Satış olmaz, nakit biter, moral düşer. Bu anlarda, şu üç şeyi hatırla:</p><ol><li><strong>Neden başladığını hatırla.</strong> Amacın neydi? Sadece para mı, yoksa daha büyük bir amaç mı?</li><li><strong>Küçük hedeflere odaklan.</strong> Büyük hedef, uzak görünebilir. Bugünkü bir satış, yarınki bir görüşme — küçük adımlar.</li><li><strong>Yardım iste.</strong> Mentor, arkadaş, aile. Yalnız başarı, nadirdir.</li></ol><h2>Sonuç</h2><p>Girişimcilik, kolay değildir. Ama mümkündür. Ve doğru hazırlıkla, doğru zihniyetle, doğru ekiple, ödüllendiricidir.</p><p>Başlamak için mükemmel zaman yoktur. Ama hazır olduğun an, bir an gelir. O an, korkuya rağmen, adım at. Çünkü hayat, cesur olanları ödüllendirir.</p>`},

{id:38,cat:'Kariyer',date:'30 Temmuz 2026',read:'8 dk',tags:['Zaman','Verimlilik','Odak'],title:'Zaman Yönetimi: Erkekler İçin Pratik Sistem',excerpt:'Zamanı yönetmek, aslında kendini yönetmektir. Ve bu, öğrenilebilir bir beceridir.',lead:'Zamanı yönetmek, aslında kendini yönetmektir. Çoğu erkek, zamanı yönetemediğinden şikâyet eder. Ama aslında zamanı değil, dikkatini yönetemiyordur.',body:`<p>Herkesin 24 saati var. Ama bazı erkekler, o 24 saatte bir imparatorluk kurar. Bazıları ise hiçbir şey yapmaz. Aradaki fark, zaman değil, yönetimdir.</p><p>Zaman yönetimi, bir dizi teknik değildir. Bir zihniyettir. Zamanını, enerjini, dikkatini nereye koyduğun, hayatının nereye gittiğini belirler.</p><h2>Zaman yönetiminin üç ilkesi</h2><p><strong>1. Öncelik.</strong> Her şeyi yapamazsın. Bazı şeyleri yapmayacaksın. Önemli olanı, acil olandan ayır.</p><p><strong>2. Odaklanma.</strong> Aynı anda birden fazla iş yapmak (multitasking), bir efsanedir. Beyin, aynı anda iki bilişsel görevi yapamaz. Sadece hızlı geçiş yapar; ve her geçiş, enerji kaybıdır.</p><p><strong>3. Enerji.</strong> Zaman sabittir, enerji değişkendir. En verimli saatlerini, en önemli işlere ayır. Yorgunken önemli karar verme.</p><blockquote>Zamanı yönetmek, saatleri değil, hayatı yönetmektir.</blockquote><h2>Zaman tuzakları</h2><p><strong>Telefon.</strong> Günde ortalama 4 saat ekran süresi. Yılda 60 gün. Yani iki ay. Sadece telefonla.</p><p><strong>Sosyal medya.</strong> Sonsuz kaydırma. Beyin, her kaydırmada dopamin alır. Ama bu, üretkenlik değil, tüketimdir.</p><p><strong>Toplantılar.</strong> Çoğu toplantı, bir e-posta ile çözülebilecek şeyler için yapılır. Toplantıya gitmeden önce sor: Bu, mesajla halledilebilir mi?</p><p><strong>Mükemmeliyetçilik.</strong> Bir işi bitirmemek, başlamamaktan kötüdür. Mükemmel değil, bitmiş olsun.</p><p><strong>Erteleme.</strong> En büyük zaman hırsızı. Ama ertelediğin şey, çoğu zaman zor ya da belirsiz olduğu içindir. Parçala, başla, devam et.</p><h2>Pratik sistemler</h2><p><strong>1. Eisenhower Matrisi.</strong> Görevleri dört kutuya ayır:</p><ul><li>Önemli + Acil → Hemen yap.</li><li>Önemli + Acil değil → Planla.</li><li>Önemsiz + Acil → Delege et.</li><li>Önemsiz + Acil değil → Ele.</li></ul><p><strong>2. Pomodoro Tekniği.</strong> 25 dakika çalış, 5 dakika mola. 4 turdan sonra, 15–30 dakika uzun mola. Beynin odaklanma süresi sınırlıdır; bu teknik, o sınırı verimli kullanır.</p><p><strong>3. Time Blocking.</strong> Günü bloklara ayır. Sabah 9–11: derin iş. 11–12: e-posta. 12–13: öğle. 13–15: toplantı. Her iş, bir bloğa atanır.</p><p><strong>4. 1-3-5 Kuralı.</strong> Her gün: 1 büyük iş, 3 orta iş, 5 küçük iş. Fazlası, listeyi uzatır, verimliliği azaltır.</p><p><strong>5. Haftalık Gözden Geçirme.</strong> Her pazar, 30 dakika. Geçen hafta ne yaptım? Bu hafta ne yapacağım? Öncelikler neler?</p><h2>Derin iş</h2><p>Cal Newport'un kavramı: <strong>Derin iş</strong>, bilişsel olarak yoğun, odaklanma gerektiren iştir. Yazı yazmak, kod yazmak, strateji kurmak, tasarım yapmak. Bu tür iş, en yüksek değeri üretir.</p><p><strong>Sığ iş</strong> ise, düşük bilişsel yük gerektirir: e-posta, toplantı, mesaj. Gerekli ama verim düşük.</p><p>Kural: Her gün en az 2 saat derin iş yap. Bunun için: telefonu başka odaya koy, bildirimleri kapat, kapıyı kapat, belirli bir saat belirle.</p><h2>Erteleme ile savaşmak</h2><p>Erteleme, tembellik değildir. Bir duygusal kaçıştır. İş zor, belirsiz, korkutucu olduğu için ertelenir. Çözüm:</p><ul><li><strong>İşi parçala.</strong> Büyük iş, küçük parçalara ayrılsın. İlk adım, çok küçük olsun.</li><li><strong>2 dakika kuralı.</strong> 2 dakikadan az sürecek işi, hemen yap.</li><li><strong>Kendine ödül ver.</strong> İşi bitirdikten sonra, bir kahve, bir yürüyüş.</li><li><strong>Başla, mükemmel olmasın.</strong> Yazmaya başla, düzeltirsin. Başlamak, en zor kısımdır.</li><li><strong>Suçlama yerine merak.</strong> "Neden erteliyorum?" diye sor. Cevap, çözümü gösterir.</li></ul><h2>Sonuç</h2><p>Zaman yönetimi, bir ömürlük pratiktir. Bir günde öğrenilmez. Ama küçük adımlarla, büyük farklar yaratılır.</p><p>Bugün bir teknik seç. Yarın uygula. Bir hafta sonra değerlendir. Bir ay sonra, kendini daha üretken, daha sakin, daha mutlu hissedeceksin. Çünkü zaman, senin elinde.</p>`},

{id:39,cat:'Kariyer',date:'28 Temmuz 2026',read:'8 dk',tags:['Müzakere','İş','Kazanç'],title:'Müzakere Sanatı: İşte ve Hayatta Daha İyisini Almak',excerpt:'Müzakere, sadece iş görüşmelerinde değildir. Hayatın her alanında kullanılır. Ve öğrenilebilir bir beceridir.',lead:'Müzakere, sadece iş görüşmelerinde değildir. Hayatın her alanında kullanılır: maaş, araba, ev, ilişki, çocuk. Ve öğrenilebilir bir beceridir.',body:`<p>Çoğu erkek, müzakere etmekten kaçınır. "Ayıp", "kırıcı", "riskli" — bu düşünceler, erkeği geri tutar. Oysa müzakere, hayatın bir parçasıdır. Ve iyi müzakere eden erkek, hayatın her alanında daha iyi sonuçlar alır.</p><p>Müzakere, bir kavga değildir. Bir ortak çözüm arayışıdır. İki taraf da kazanabilir. İdeal müzakere, kazanan-kazanan bir sonuçtur.</p><h2>Müzakerenin temel ilkeleri</h2><p><strong>1. Hazırlık.</strong> Müzakerenin %80'i, masaya oturmadan önce yapılır. Bilgi topla: piyasa, rakip, alternatif, ihtiyaç.</p><p><strong>2. Bilgi.</strong> Karşı tarafın ne istediğini anla. Sadece kendi ihtiyaçlarına odaklanma. Karşı tarafın motivasyonunu bilirsen, çözüm bulmak kolaylaşır.</p><p><strong>3. Sınır.</strong> Kendi minimumunu belirle. Bu sınırın altına inersen, anlaşma yapma. Yürüyebilmek, en güçlü müzakere aracıdır.</p><p><strong>4. Esneklik.</strong> Konular üzerinde esnek ol. Belki maaş değil, izin. Belki nakit değil, hisse. Alternatifler yarat.</p><p><strong>5. Sessizlik.</strong> Sessizlik, güçlü bir araçtır. Teklif yapıldıktan sonra sus. Karşı taraf, konuşmak için baskı hisseder. Sessizlik, bilgi verir.</p><blockquote>Müzakere, karşı tarafı yenmek değildir. Birlikte bir çözüm bulmaktır. Ama bu çözüm, senin de lehine olmalı.</blockquote><h2>Maaş pazarlığı</h2><p>Maaş pazarlığı, en yaygın müzakere biçimidir. Ve en çok kaçınılanıdır. Oysa yapılması gerekir.</p><p><strong>Hazırlık.</strong> Piyasa araştırması yap. Aynı pozisyonda, aynı deneyimle, ne kadar kazanılıyor? Bu aralığı bil.</p><p><strong>Zamanlama.</strong> Teklif geldiğinde, hemen kabul etme. "Düşünmek için bir gün alabilir miyim?" de.</p><p><strong>Karşı teklif.</strong> İlk teklifi kabul etme; ama absürt de isteme. Piyasa aralığının üst sınırını iste. Genelde %5–15'lik bir artış mümkündür.</p><p><strong>Alternatifler.</strong> Sadece maaş değil, yan haklar da müzakere edilebilir: izin, prim, eğitim bütçesi, uzaktan çalışma, hisse.</p><p><strong>Yürüyebilmek.</strong> Eğer teklif yetersizse, kibarca reddet. Bazen bu, daha iyi bir teklif getirir. Bazen de iş, gerçekten uygun değildir.</p><h2>Günlük hayatta müzakere</h2><p><strong>Araba alırken.</strong> Satıcı, ilk teklifi yüksek yapar. Sen, düşük teklifle karşılık ver. Ortada buluşun.</p><p><strong>Ev kiralarken.</strong> Kira, depozito, sözleşme süresi — hepsi müzakere edilebilir. Özellikle uzun süreli kiralarda.</p><p><strong>Faturaları.</strong> İnternet, telefon, kredi kartı — hepsi müzakere edilebilir. Ara, sor, "daha iyi bir teklif var mı?" de.</p><p><strong>Çocukla.</strong> Her şey bir müzakeredir. "Ödevini şimdi yaparsan, akşam oyun oynayabilirsin." Bu, çocuğa müzakere öğretir.</p><p><strong>İlişkide.</strong> Nerede tatil, ne zaman çocuk, nasıl para harcanacak. Her karar, bir müzakeredir.</p><h2>Müzakere tuzakları</h2><p><strong>Duygusal tepki.</strong> Sinirlenmek, kaybettirir. Sakin kal.</p><p><strong>İlk teklifi hemen kabul etmek.</strong> Bu, karşı tarafa "daha iyisini verebilirdim" hissi verir. Ve sen, daha iyisini alamadın.</p><p><strong>Çok konuşmak.</strong> Konuşmak, bilgi verir. Karşı taraf, senin zayıflıklarını öğrenir. Az konuş, çok dinle.</p><p><strong>Blöf yapmak.</strong> Yürüyemeyeceğin bir tehdit, kaybettirir. Sadece gerçekten yürüyebileceğin durumlarda, yürüme tehdidi kullan.</p><p><strong>Kişisel algılamak.</strong> Müzakere, iş içindir. Karşı tarafın kişiliğiyle ilgili değildir.</p><h2>Kadınlar ve müzakere</h2><p>Araştırmalar, kadınların müzakere etmekte daha çok zorlandığını gösterir. Sebep: toplumsal beklentiler. "Agresif" görünmekten korkarlar.</p><p>Erkek olarak, bu farkı bil. İlişkinde eşinin müzakere etmesine destek ol. Kariyerinde kadın meslektaşlarına adil davran. Ve kendi müzakerelerinde, empati ve sağduyu dengesini kur.</p><h2>Sonuç</h2><p>Müzakere, bir yaşam becerisidir. Öğrenilir, geliştirilir, ustalaşılır. Bugün küçük bir müzakere yap. Yarın bir tane daha. Bir yıl sonra, hem işinde hem hayatında daha iyi sonuçlar alacaksın.</p><p>Ve en önemlisi: müzakerenin bir kavga olmadığını, bir ortaklık olduğunu öğreneceksin. İki taraf da kazanabilir.</p>`},

{id:40,cat:'Kariyer',date:'26 Temmuz 2026',read:'8 dk',tags:['Gelişim','Öğrenme','Kariyer'],title:'Mesleki Gelişim: Sürekli Öğrenmenin Gücü',excerpt:'Kariyer, bir merdiven değil, bir yolculuktur. Ve bu yolculukta, en büyük sermaye öğrenme kapasitesidir.',lead:'Kariyer, bir merdiven değil, bir yolculuktur. Ve bu yolculukta, en büyük sermaye, öğrenme kapasitesidir. Durmayan erkek, geri kalmaz.',body:`<p>Bir zamanlar, bir meslek öğrenir, ömür boyu yapardın. Bugün, meslekler 10 yılda bir değişir. Teknoloji, otomasyon, yapay zekâ — hepsi iş dünyasını dönüştürür. Bu dünyada ayakta kalmak, sürekli öğrenmeyi gerektirir.</p><p>Mesleki gelişim, sadece terfi için değildir. Kendini geliştirmek, kendine duyulan saygının göstergesidir. Ve bu saygı, kariyerinin her alanına yansır.</p><h2>Öğrenmenin üç türü</h2><p><strong>1. Derinleştirme.</strong> Kendi alanında daha derin bilgi. Bir yazılımcının yeni bir dil öğrenmesi, bir doktorun yeni bir tedavi öğrenmesi.</p><p><strong>2. Genişletme.</strong> Yan alanlarda bilgi. Bir mühendisin pazarlama öğrenmesi, bir pazarlamacının finans öğrenmesi. Bu, kariyer basamaklarını hızlandırır.</p><p><strong>3. Dönüşüm.</strong> Tamamen yeni bir alan. Kariyer değiştirmek. Bu, en zor ama bazen en gerekli olandır.</p><blockquote>Bir erkeğin kariyeri, ne kadar bildiğiyle değil, ne kadar hızlı öğrendiğiyle ölçülür.</blockquote><h2>Öğrenme alışkanlıkları</h2><p><strong>1. Günlük 30 dakika.</strong> Her gün, 30 dakika öğrenmeye ayır. Kitap, kurs, video, podcast — fark etmez. Ama her gün.</p><p><strong>2. Yılda 24 kitap.</strong> Ayda 2 kitap. Bu, çoğu insanın 10 katıdır. Ve 10 yılda, inanılmaz bir bilgi birikimi.</p><p><strong>3. Pratik.</strong> Öğrendiğini uygula. Sadece okumak, öğrenmek değildir. Yaz, kodla, konuş, öğret.</p><p><strong>4. Not al.</strong> Öğrendiğini yaz. Not, hatırlamayı güçlendirir ve tekrar edilebilir bir kaynak yaratır.</p><p><strong>5. Öğret.</strong> Öğrendiğini birine anlat. Bu, en iyi öğrenme yöntemidir. Anlatırken, eksiklerini görürsün.</p><h2>Kaynaklar</h2><p><strong>Kitaplar.</strong> En derin bilgi kaynağı. Ama seçici ol. Klasikler, çoğu zaman yeni kitaplardan daha değerlidir.</p><p><strong>Kurslar.</strong> Online platformlar (Coursera, Udemy, edX), yerel kurslar, üniversite programları. Pratik beceriler için ideal.</p><p><strong>Podcast'ler.</strong> Uzmanlardan bilgi. Yürürken, araba sürerken dinlenebilir.</p><p><strong>Konferanslar ve seminerler.</strong> Hem öğrenme hem ağ kurma fırsatı.</p><p><strong>Mentorluk.</strong> Deneyimli birinin rehberliği. Değeri paha biçilemez.</p><p><strong>Uygulama.</strong> En iyi öğrenme, yaparak öğrenmektir. Bir proje, bir girişim, bir yan iş.</p><h2>Zaman nasıl bulunur?</h2><p>"Zamanım yok" — en yaygın bahane. Ama gerçek şu: herkesin 24 saati var. Fark, nasıl kullandığındadır.</p><ul><li><strong>Sabah.</strong> 30 dakika erken kalk. Bu, günün en sakin zamanıdır.</li><li><strong>Yolda.</strong> Podcast dinle, kitap oku (sesli).</li><li><strong>Öğle tatili.</strong> 15 dakika oku.</li><li><strong>Akşam.</strong> 1 saat TV yerine, 30 dakika öğrenme.</li><li><strong>Hafta sonu.</strong> Cumartesi sabahı, 2 saat derin öğrenme.</li></ul><p>Bu, haftada 10 saatten fazla öğrenme demektir. Yılda 500 saat. Ve 500 saat, bir alanı öğrenmek için fazlasıyla yeterlidir.</p><h2>Öğrenmenin düşmanları</h2><p><strong>Konfor.</strong> Öğrenmek, rahatsız edicidir. Bilmediğin bir şeyle uğraşmak, yorucudur. Ama bu rahatsızlık, büyümenin işaretidir.</p><p><strong>Gurur.</strong> "Biliyorum" demek, öğrenmenin sonudur. Bilmediğini kabul etmek, öğrenmenin başlangıcıdır.</p><p><strong>Acele.</strong> Öğrenme, zaman alır. Hızlı sonuç beklemek, hayal kırıklığı doğurur. Sabırlı ol.</p><p><strong>Karşılaştırma.</strong> Başkalarıyla karşılaştırmak, motivasyonu kırar. Kendinle karşılaştır. Dün nasıldın, bugün nasılsın?</p><h2>Kariyer stratejisi</h2><p><strong>1. Hedef.</strong> Nereye gitmek istiyorsun? 5 yıl, 10 yıl, 20 yıl sonra ne olmak istiyorsun?</p><p><strong>2. Yol.</strong> Bu hedefe gitmek için hangi beceriler, hangi deneyimler, hangi ilişkiler gerekli?</p><p><strong>3. Plan.</strong> Yıllık, aylık, haftalık plan. Ne öğreneceksin, ne yapacaksın, ne okuyacaksın?</p><p><strong>4. Uygulama.</strong> Her gün küçük bir adım. Bir yıl sonra, büyük bir mesafe.</p><p><strong>5. Değerlendirme.</strong> Her çeyrek, planı gözden geçir. Ne işe yaradı, ne yaramadı?</p><h2>Sonuç</h2><p>Mesleki gelişim, bir maratondur. Sprint değil. Ama her adım, seni bir adım ileri taşır. Yıllar sonra, o adımların toplamı, seni beklediğin yerden çok daha ileri götürür.</p><p>Bugün 30 dakika öğrenmeye ayır. Yarın bir tane daha. Bir yıl sonra, hem bilgin hem kariyerin farklı olacak.</p>`},

{id:41,cat:'Kariyer',date:'24 Temmuz 2026',read:'8 dk',tags:['Denge','İş','Hayat'],title:'İş-Yaşam Dengesi: Mümkün mü, Yoksa Mit mi?',excerpt:'İş-yaşam dengesi, bir denge değil, bir önceliktir. Ve öncelik, herkesin kendi kararıdır.',lead:'İş-yaşam dengesi, modern erkeğin en büyük ikilemidir. Ama "denge" kelimesi yanıltıcıdır. Çünkü denge, statik bir şeydir. Hayat ise dinamik. Doğru kavram, öncelik.',body:`<p>Modern erkek, iki dünya arasında sıkışır: iş ve hayat. İkisini de ihmal etmemek, ikisinde de başarılı olmak ister. Ama zaman sınırlıdır. Ve her seçim, bir vazgeçiştir.</p><p>İş-yaşam dengesi, aslında yanlış bir kavramdır. Çünkü iş, hayatın bir parçasıdır. Onu hayattan ayırmak, ikisini de bozar. Doğru kavram, iş-hayat <em>entegrasyonu</em>dur.</p><h2>"Denge" neden yanıltıcı?</h2><p>Denge, statik bir şeydir. Terazinin iki kefesi, eşit ağırlıkta. Ama hayat, statik değildir. Bazı dönemlerde iş daha çok zaman ister; bazı dönemlerde aile. Denge, bu dinamizmi hesaba katmaz.</p><p>Ayrıca denge, her gün eşit dağılım demek değildir. Bir hafta çok çalışırsın, diğer hafta çok dinlenirsin. Yıl ortalamasında, denge kurulur.</p><blockquote>İş-yaşam dengesi, her gün eşit dağılım değildir. Her mevsimde doğru önceliktir.</blockquote><h2>Öncelikler</h2><p>Hayatında kaç alan var? Kariyer, aile, sağlık, ilişki, hobiler, maneviyat, topluluk. Her biri, zaman ve enerji ister. Ve hepsi aynı anda maksimum olamaz.</p><p>Bu yüzden, her mevsimde önceliği belirle. 30 yaşında kariyere odaklanabilirsin. 35 yaşında çocuk büyütmeye. 40 yaşında sağlığa. 45 yaşında topluma hizmet etmeye. Hayat, mevsimlerden oluşur.</p><p>Ama her mevsimde, diğer alanları ihmal etme. Kariyere odaklanırken, aile ve sağlığı koru. Aileye odaklanırken, kariyerde minimum seviyeyi tut. Sağlığı asla feda etme; o, her şeyin temelidir.</p><h2>Sınırlar koymak</h2><p>İş-yaşam entegrasyonu, sınırlarla mümkündür. Sınırlar:</p><ul><li><strong>Zaman sınırı.</strong> Akşam 7'den sonra iş yok. Hafta sonu iş yok (acil hariç).</li><li><strong>Mekân sınırı.</strong> Evde iş yapma. Ayrı bir oda, ayrı bir masa. Mümkünse, ofise git.</li><li><strong>Dijital sınır.</strong> Akşam 8'den sonra e-posta kontrolü yok. Bildirimleri kapat.</li><li><strong>Fiziksel sınır.</strong> Yorulduğunda dur. Tükenmişliğe izin verme.</li></ul><h2>Verimlilik: Az çalış, çok üret</h2><p>İş-yaşam dengesi için, çalışma saatlerini azaltmak gerekir. Ama bu, üretkenliği azaltmak zorunda değildir. Aksine, verimliliği artırarak, daha az saatte daha çok iş yapılabilir.</p><p>Verimlilik taktikleri:</p><ul><li><strong>Derin iş.</strong> Telefonsuz, kesintisiz 2–4 saat. Bu, 8 saatlik dağınık çalışmadan daha çok değer üretir.</li><li><strong>Toplantıları azalt.</strong> Çoğu toplantı, bir mesajla halledilebilir.</li><li><strong>E-postayı toplu kontrol et.</strong> Günde 2–3 kez, belirli saatlerde.</li><li><strong>Öncelik.</strong> En önemli işi, en verimli saatte yap.</li><li><strong>Delege.</strong> Yetki ver. Mikro yönetim, hem seni hem ekibi yorar.</li></ul><h2>Kaliteli zaman</h2><p>Aileye ayrılan zaman, sadece miktar değil, nitelik meselesidir. 2 saat telefonla birlikte oturmak, 30 dakika tam dikkatle oynamaktan daha az değerlidir.</p><p>Kaliteli zaman için:</p><ul><li><strong>Telefonu bırak.</strong> Başka odada dursun.</li><li><strong>Odaklan.</strong> Sadece o an, o kişiyle ol.</li><li><strong>Dinle.</strong> Gerçekten dinle. Sadece "hı hı" deme.</li><li><strong>Oyun oyna.</strong> Çocukla oyun, en iyi bağ kurma aracıdır.</li><li><strong>Ritüel kur.</strong> Her akşam 10 dakika, her hafta bir etkinlik.</li></ul><h2>Kendine de zaman</h2><p>İş-yaşam dengesi, sadece iş ve aile değildir. Kendine zaman da gerekir. Spor, hobi, arkadaş, yalnızlık. Bu zaman, sadece lüks değil, bir zorunluluktur.</p><p>Çünkü kendine bakmayan erkek, başkalarına da bakamaz. Tükenmiş bir baba, iyi bir baba değildir. Yorgun bir eş, iyi bir eş değildir. Kendini doldurmayan erkek, başkalarını da dolduramaz.</p><h2>Kültürel zorluklar</h2><p>Türkiye'de iş-yaşam dengesi, özellikle zordur. Uzun çalışma saatleri, düşük ücretler, kıdemli hiyerarşi, tatil kültürünün zayıflığı. Ama yine de, mümkündür.</p><p>Bazı işverenler, uzaktan çalışmaya izin verir. Bazıları, esnek saat. Araştır, müzakere et. Bazen, iş değiştirmek gerekir. Bazen, kendi işini kurmak.</p><h2>Sonuç</h2><p>İş-yaşam dengesi, bir denge değil, bir önceliktir. Her mevsimde, doğru önceliği belirlemektir. Ve her alanda, minimum bir seviyeyi korumaktır.</p><p>Bugün bir sınır koy. Akşam 7'den sonra iş yapma. Bu hafta, bir gün tamamen izin yap. Bir ay sonra, hem iş hem hayat kaliten artacak.</p>`},

{id:42,cat:'Stil',date:'22 Temmuz 2026',read:'7 dk',tags:['Ayakkabı','Stil','Bakım'],title:'Ayakkabı Rehberi: Erkek Ayakkabı Temelleri',excerpt:'Ayakkabı, bir erkeğin stilinin temelidir. İnsanlar ayakkabına bakar; farkında olmasan bile.',lead:'Ayakkabı, bir erkeğin stilinin temelidir. İnsanlar ayakkabına bakar; farkında olmasan bile. Bakımlı bir ayakkabı, tüm kıyafeti yükseltir. Bakımsız bir ayakkabı, pahalı bir takımı bile düşürür.',body:`<p>Çoğu erkek, kıyafete önem verir ama ayakkabıyı ihmal eder. Oysa ayakkabı, bir erkeğin stilinin en görünür parçasıdır. Ve en çok yargılanan parçası.</p><p>İyi haber şu: bir erkeğin gardırobunda sadece 4–5 çift kaliteli ayakkabı olması yeterlidir. Doğru seçim, doğru bakım, doğru kullanım.</p><h2>Erkek ayakkabısının 5 temel türü</h2><p><strong>1. Oxford.</strong> En resmi ayakkabı. Kapalı bağcık sistemi, ince taban. Takım elbiseyle giyilir. Siyah ya da koyu kahverengi.</p><p><strong>2. Derby.</strong> Oxford'a benzer ama açık bağcık sistemi. Biraz daha rahat, biraz daha az resmi. İş ve gündelik arası.</p><p><strong>3. Loafer.</strong> Bağcıksız, kolay giyilen. Rahat ve şık. Chino ve blazer ile mükemmel.</p><p><strong>4. Bot.</strong> Chelsea bot, chukka bot. Kış ayları için ideal. Hem resmi hem gündelik.</p><p><strong>5. Sneaker.</strong> Gündelik spor ayakkabı. Temiz ve sade olanı, casual kombinler için uygundur. Ama spor salonu için olanı, gündelik hayat için uygun değildir.</p><blockquote>Ayakkabı, bir erkeğin karakterini yansıtır. Ona gösterdiğin özen, kendine gösterdiğin özendir.</blockquote><h2>Renk seçimi</h2><p>Erkek ayakkabısında üç ana renk vardır:</p><ul><li><strong>Siyah.</strong> En resmi. Takım elbise, resmi toplantı, akşam etkinliği. İlk çift için ideal.</li><li><strong>Koyu kahverengi.</strong> İş dünyasının klasiği. Lacivert, gri, bej ile uyumlu.</li><li><strong>Açık kahverengi/taba.</strong> Gündelik ve casual. Chino, kot, bej pantolon ile ideal.</li></ul><p>Beyaz ayakkabı, yaz aylarında ve casual kombinlerde olabilir; ama resmi ortamlarda değil.</p><h2>Kaliteli ayakkabı nasıl seçilir?</h2><p><strong>1. Deri.</strong> Gerçek deri, sentetikten çok daha dayanıklı ve nefes alır. Tam taneli deri (full-grain), en kaliteli olanıdır.</p><p><strong>2. Dikiş.</strong> Goodyear dikişi, en dayanıklı olanıdır. Bu dikiş, ayakkabının tamir edilebilir olmasını sağlar.</p><p><strong>3. Taban.</strong> Deri taban, en klasik. Kauçuk taban, daha dayanıklı. Karma taban, hem şık hem pratik.</p><p><strong>4. Marka.</strong> Bazı markalar, sadece isim satar. Kalite, markada değil, malzemede ve işçilikte.</p><p><strong>5. Fiyat.</strong> Kaliteli bir çift ayakkabı, 2.000–5.000 TL arası olabilir. Ama 5–10 yıl gider. Ucuz ayakkabı, yılda bir yenilenir. Toplamda, pahalıya gelir.</p><h2>Ayakkabı bakımı</h2><p><strong>1. Temizlik.</strong> Her kullanımdan sonra, nemli bezle sil. Tozu ve kiri temizle.</p><p><strong>2. Boya.</strong> Haftada bir, ayakkabı boyası sür. Renk, parlaklık, koruma.</p><p><strong>3. Krem.</strong> Ayda bir, deri kremi sür. Derinin kurumasını engeller.</p><p><strong>4. Kurutma.</strong> Islak ayakkabıyı, oda sıcaklığında kurut. Kalorifer ya da saç kurutma makinesi, deriyi çatlatır.</p><p><strong>5. Saklama.</strong> Ayakkabı çekmecesi, ayakkabı kalıbı (shoe tree) kullan. Kalıp, ayakkabının şeklini korur.</p><p><strong>6. Değişim.</strong> Aynı ayakkabıyı her gün giyme. En az iki çift olsun, dönüşümlü giy. Her ayakkabı, bir gün dinlensin.</p><h2>Ayakkabı ve kıyafet uyumu</h2><p><strong>Kemer.</strong> Ayakkabının rengiyle uyumlu olmalı. Tam aynı olması şart değil, ama uyumlu.</p><p><strong>Pantolon.</strong> Klasik: ayakkabı, pantolondan bir ton koyu. Modern: kontrast olabilir.</p><p><strong>Çorap.</strong> Pantolonla aynı ton. Ayakkabıyla değil. Beyaz çorap, spor ayakkabı dışında asla.</p><p><strong>Ortam.</strong> Resmi ortamda klasik, gündelik ortamda rahat. Yanlış ayakkabı, tüm kombinasyonu bozar.</p><h2>Yaygın hatalar</h2><ul><li><strong>Spor ayakkabıyla takım elbise.</strong> Bazı istisnalar var ama genelde yanlış.</li><li><strong>Bakımsız ayakkabı.</strong> Çizik, kirli, solmuş. Tüm kıyafeti düşürür.</li><li><strong>Yanlış beden.</strong> Sıkı ya da bol. Ayak, ayakkabının içinde kaymamalı.</li><li><strong>Aynı ayakkabıyı her gün.</strong> Ayakkabının dinlenmeye ihtiyacı vardır.</li><li><strong>Beyaz çorap.</strong> Resmi kombinlerde asla.</li></ul><h2>Sonuç</h2><p>Ayakkabı, bir erkeğin stilinin temelidir. Ama daha ötesi, kendine duyduğu saygının göstergesidir. Bakımlı ayakkabı, sadece bir aksesuar değil, bir karakter işaretidir.</p><p>Bugün ayakkabılarını temizle. Yarın bir boya al. Bir hafta sonra, bir çift kaliteli ayakkabı için araştırma yap. Bir ay sonra, ayakkabı dolabın, bambaşka bir yer olacak.</p>`},

{id:43,cat:'Stil',date:'20 Temmuz 2026',read:'7 dk',tags:['Sakal','Bakım','Stil'],title:'Sakal Bakımı: Modern Erkeğin Rehberi',excerpt:'Sakal, bir erkeğin yüzüne karakter katar. Ama bakımsız sakal, karakter değil, kaos verir.',lead:'Sakal, bir erkeğin yüzüne karakter katar. Ama bakımsız sakal, karakter değil, kaos verir. Sakal, bir sorumluluktur. Düzenli bakım, doğru şekil, doğru ürünler.',body:`<p>Son yıllarda sakal, bir moda haline geldi. Ama moda, herkese uygun değildir. Sakal, yüz şekline, yaşa, mesleğe, kişiliğe uygun olmalıdır. Ve her şeyden önce, bakımlı olmalıdır.</p><p>Sakal, bir erkeğin yüzüne maskülen bir hava katar. Doğru şekilde bakıldığında, çene hattını belirginleştirir, yüzü uzatır ya da genişletir, yaşlılık belirtilerini örter. Ama bakımsız sakal, tam tersi etki yapar.</p><h2>Yüz şekline göre sakal</h2><p><strong>Oval yüz.</strong> Şanslısın. Her sakal şekli uyar. Kısa, orta, uzun.</p><p><strong>Yuvarlak yüz.</strong> Sakal, uzun ve sivri olmalı. Yanlar kısa, çene uzun. Bu, yüzü uzatır.</p><p><strong>Kare yüz.</strong> Kısa sakal, tam sakal. Uzun sakal, yüzü daha da kareleştirir.</p><p><strong>Uzun yüz.</strong> Yanlar dolgun, çene kısa. Bu, yüzü dengeler. Uzun sivri sakaldan kaçın.</p><p><strong>Üçgen yüz.</strong> Çene geniş, alın dar. Sakal, orta uzunlukta olsun. Aşırı dolgun, yüzü ağırlaştırır.</p><blockquote>Sakal, bir erkeğin yüzüne attığı imzadır. Ama imza, okunaklı olmalı.</blockquote><h2>Sakal türleri</h2><p><strong>1. Kısa sakal (stubble).</strong> 3–5 mm. Modern, genç, bakımı kolay. Haftada 2–3 kez tıraş makinesiyle.</p><p><strong>2. Orta sakal.</strong> 1–2 cm. Klasik, maskülen. Günlük bakım ister.</p><p><strong>3. Tam sakal.</strong> 3+ cm. Ciddi, olgun. Ciddi bakım ister.</p><p><strong>4. Keçi sakalı.</strong> Çene ve bıyık. Sanatsal, entelektüel.</p><p><strong>5. Van dyke.</strong> Bıyık + çene, ayrı. Klasik, tiyatral.</p><h2>Sakal bakımı</h2><p><strong>1. Yıkama.</strong> Haftada 3–4 kez, sakal şampuanıyla. Normal şampuan, sert, kurutur. Sakal şampuanı, yumuşak ve besleyici.</p><p><strong>2. Şekillendirme.</strong> Haftada 2–3 kez, tıraş makinesi ya da makas. Yanlar kısa, çene uzun. Boyun bölgesi, çene hattının bir santim altından kesilmeli.</p><p><strong>3. Yağ.</strong> Her gün, sakal yağı sür. Bu, sakalı yumuşatır, parlatır, kokar. Ayrıca cildi nemlendirir, kaşıntıyı azaltır.</p><p><strong>4. Tarama.</strong> Günde bir kez, sakal tarağı ya da fırçası ile tara. Bu, sakalı düzgünleştirir, dolaşıklığı çözer.</p><p><strong>5. Kesim.</strong> Çok uzun sakal, ayda bir berberde kesilmeli. Kendin de kesebilirsin ama dikkatli ol.</p><p><strong>6. Bıyık bakımı.</strong> Bıyık, sakaldan farklıdır. Düzenli kesim, doğru şekil. Yemek yerken, bıyığa dikkat.</p><h2>Doğru ürünler</h2><p><strong>Sakal şampuanı.</strong> Normal şampuan kullanma. Sakal şampuanı, yumuşak formüllü, besleyici.</p><p><strong>Sakal yağı.</strong> Doğal yağlar: jojoba, argan, hindistan cevizi. Günde birkaç damla yeterli.</p><p><strong>Sakal balmı.</strong> Daha yoğun, şekillendirici. Uzun sakallar için.</p><p><strong>Sakal tarağı.</strong> Ahşap tarak, statik yapmaz, saçı kırmaz.</p><p><strong>Sakal fırçası.</strong> Yaban domuzu kılı fırça, en iyisi. Doğal yağları yayar.</p><p><strong>Tıraş makinesi.</strong> Kaliteli bir makine, uzun vadede tasarruf. Ucuz makine, çeker, acıtır.</p><h2>Sakal sorunları</h2><p><strong>Kaşıntı.</strong> Yeni sakalın en yaygın sorunu. Sakal yağı ve düzenli yıkama ile azalır. Sabret, 2–3 haftada geçer.</p><p><strong>Kepek.</strong> Sakal kepeği, cilt kuruluğundan olur. Nemlendirici kullan, sakal yağı sür.</p><p><strong>Seyrek sakal.</strong> Genetik. Kabullenmek ya da kısa tutmak en iyisi. Uzun sakal, seyrekse kötü görünür.</p><p><strong>Yamuk uzama.</strong> Bazı bölgelerde uzar, bazılarında uzamaz. Düzenli kesim, dengeyi sağlar.</p><p><strong>Kızarıklık.</strong> Tıraş sonrası tahriş. Alkol içermeyen tıraş sonrası losyonu kullan.</p><h2>Ne zaman sakal, ne zaman tıraş?</h2><p><strong>Sakal.</strong> Uzun yüz, zayıf çene, genç görünüm, maskülen stil. Ayrıca, sakal büyütmek, erkeği daha olgun ve otoriter gösterir.</p><p><strong>Tıraş.</strong> Kısa yüz, dolgun çene, temiz görünüm, resmi meslek. Ayrıca, bazı kadınlar, temiz tıraşı tercih eder.</p><p>Doğru cevap: kendi yüzünü tanı, kendi tarzını bul, kendi kararını ver. Moda değil, sana uygun olanı seç.</p><h2>Sonuç</h2><p>Sakal, bir erkeğin yüzüne karakter katar. Ama karakter, bakımdan gelir. Bakımsız sakal, karakter değil, kaos verir.</p><p>Bugün sakalını yıka. Yarın bir yağ al. Bir hafta sonra, bir berbere git. Bir ay sonra, sakalın, senin imzan olacak.</p>`},

{id:44,cat:'Stil',date:'18 Temmuz 2026',read:'6 dk',tags:['Parfüm','Koku','Kimlik'],title:'Parfüm Seçimi: Koku ve Kimlik',excerpt:'Koku, hatıraların en güçlü tetikleyicisidir. Ve doğru parfüm, senin imzandır.',lead:'Koku, hatıraların en güçlü tetikleyicisidir. Bir koku, bir anı, bir kişiyi hatırlatır. Doğru parfüm, senin imzandır. Ama yanlış seçim, bir kâbustur.',body:`<p>Bir erkeğin kokusu, onun sessiz imzasıdır. Kelimelerden önce konuşur, hatıralarda kalır. Doğru parfüm, seni tanımlar. Yanlış parfüm, seni maskeler.</p><p>Parfüm seçimi, bir sanattır. Ve her sanat gibi, bilgi ve pratik ister. Bu yazı, bir erkeğin parfüm dünyasına giriş rehberidir.</p><h2>Parfüm notaları</h2><p>Her parfüm, üç katmandan oluşur:</p><p><strong>1. Üst notalar (top notes).</strong> İlk 15–30 dakika. Hafif, uçucu. Narenciye, nane, bergamot.</p><p><strong>2. Orta notalar (heart notes).</strong> 30 dakika – 2 saat. Parfümün karakteri. Çiçek, baharat, meyve.</p><p><strong>3. Alt notalar (base notes).</strong> 2 saat sonrası. Kalıcı, ağır. Odun, misk, amber, vanilya.</p><p>Bu üç katman, zamanla değişir. Bu yüzden bir parfümü kokladığında, ilk kokladığın şey, o parfümün tamamı değildir.</p><blockquote>Parfüm, bir hikâyedir. Ve hikâye, zamanla açılır.</blockquote><h2>Parfüm aileleri</h2><p><strong>1. Odunsu (woody).</strong> Sandal ağacı, sedir, vetiver. Maskülen, sıcak, toprak. Klasik erkek kokusu.</p><p><strong>2. Aromatik (aromatic).</strong> Lavanta, adaçayı, biberiye. Taze, ferah, klasik.</p><p><strong>3. Şipre (chypre).</strong> Bergamot, meşe yosunu, paçuli. Toprak, sofistike, klasik.</p><p><strong>4. Fougère.</strong> Lavanta, meşe yosunu, kumarin. Klasik berber kokusu. Birçok modern parfümün temeli.</p><p><strong>5. Oryantal (oriental).</strong> Amber, misk, vanilya, baharat. Sıcak, egzotik, akşam kokusu.</p><p><strong>6. Narenciye (citrus).</strong> Limon, portakal, greyfurt. Taze, yaz kokusu.</p><p><strong>7. Deri (leather).</strong> Deri, tütün, odun. Maskülen, karakterli, akşam kokusu.</p><h2>Konsantrasyon türleri</h2><p><strong>Eau de Cologne (EDC).</strong> %2–5 esans. 2–3 saat kalır. Hafif.</p><p><strong>Eau de Toilette (EDT).</strong> %5–15 esans. 3–5 saat kalır. Gündelik.</p><p><strong>Eau de Parfum (EDP).</strong> %15–20 esans. 5–8 saat kalır. Akşam.</p><p><strong>Parfum (Extrait).</strong> %20–40 esans. 8+ saat kalır. En yoğun.</p><p>Gündelik için EDT, akşam için EDP, özel günler için Parfum.</p><h2>Doğru parfüm nasıl seçilir?</h2><p><strong>1. Denemeden alma.</strong> Parfüm, ten üzerinde farklı kokar. Kağıt şeritte koklamak, yeterli değil. Koluna sık, 30 dakika bekle, kokla.</p><p><strong>2. Bir günde en fazla 3 parfüm dene.</strong> Burun, 3 kokudan sonra yorulur. Aynı gün çok parfüm denemek, kararını bulandırır.</p><p><strong>3. Kendi tenin.</strong> Herkesin teni farklıdır. Bir parfüm, arkadaşında harika kokar, sende kötü. Kendi teninde dene.</p><p><strong>4. Mevsim.</strong> Yaz için hafif (narenciye, aromatik). Kış için ağır (odunsu, oryantal).</p><p><strong>5. Ortam.</strong> İş için hafif, akşam için yoğun. Ofiste ağır parfüm, rahatsız edici.</p><p><strong>6. Yaş ve kişilik.</strong> Genç, hafif ve ferah. Olgun, derin ve sofistike. Kişilik, parfümde yansımalı.</p><h2>Nasıl sıkılır?</h2><p><strong>Nereye.</strong> Nabız noktaları: bilek, boyun, kulak arkası, göğüs. Bu bölgeler sıcak, koku yayılır.</p><p><strong>Ne kadar.</strong> 2–4 fıs. Fazlası, boğucu. Az, yeterli.</p><p><strong>Mesafe.</strong> Tendan 15–20 cm uzaktan. Çok yakın, koku yoğunlaşır.</p><p><strong>Ovma.</strong> Sıktıktan sonra, bilekleri ovma. Koku molekülleri kırılır.</p><p><strong>Nemlendirme.</strong> Kuru tende parfüm çabuk kaybolur. Nemlendirici sür, sonra parfüm.</p><h2>Yaygın hatalar</h2><ul><li><strong>Mağazada karar vermek.</strong> Parfüm, birkaç saat sonra farklı kokar. Eve gidip test et.</li><li><strong>Popüler olanı almak.</strong> Herkesin kullandığı parfüm, senin değildir. Kendine uygun olanı seç.</li><li><strong>Kışın yaz parfümü.</strong> Kokular, mevsimle uyumlu olmalı.</li><li><strong>Fazla sıkmak.</strong> Az, çoktur. Parfüm, fark edilmeden hissedilmeli.</li><li><strong>Kötü saklama.</strong> Parfüm, serin ve karanlık yerde saklanmalı. Banyo, kötü bir yerdir.</li></ul><h2>Kendine bir imza parfüm</h2><p>Bir erkeğin, kendine bir imza parfümü olmalı. Bir koku, seninle özdeşleşmeli. İnsanlar, o kokuyu duyunca, seni hatırlamalı.</p><p>Ama bu, tek parfüm demek değildir. 3–4 parfümün olabilir: gündelik, iş, akşam, özel gün. Her biri, farklı bir ruh halini yansıtır.</p><h2>Sonuç</h2><p>Parfüm, bir erkeğin sessiz imzasıdır. Doğru seçim, onu güçlendirir. Yanlış seçim, onu maskeler.</p><p>Bugün bir parfüm mağazasına git. Üç parfüm dene. Birini beğen. Eve git, 6 saat kokla. Beğendiysen, al. Beğenmediysen, tekrar dene. Sabırlı ol; doğru parfüm, bir kez bulunur, ömür boyu kalır.</p>`},

{id:45,cat:'Stil',date:'16 Temmuz 2026',read:'6 dk',tags:['Aksesuar','Cüzdan','Detay'],title:'Cüzdan ve Aksesuar: Detayların Gücü',excerpt:'Bir erkeğin cüzdanı, onun hayatıdır. Kirli, şişkin, yırtık bir cüzdan, tüm stili bozar.',lead:'Bir erkeğin cüzdanı, onun hayatıdır. Kirli, şişkin, yırtık bir cüzdan, tüm stili bozar. Küçük bir detay gibi görünür ama aslında bir karakter meselesidir.',body:`<p>Kıyafet, takım elbise, ayakkabı — hepsi önemli. Ama asıl fark, detaylarda gizlidir. Cüzdan, saat, kemer, çanta, kalem. Bu küçük parçalar, bir erkeğin stilini ya yükseltir ya da düşürür.</p><p>Aksesuar, gösteriş değildir. İşlev ve estetiğin dengesidir. Doğru aksesuar, fark edilmeden konuşur.</p><h2>Cüzdan</h2><p><strong>Boyut.</strong> Cüzdan, cebe sığmalı, şişmemeli. Şişkin bir cüzdan, hem çirkin hem rahatsız. Sadece gerekli olanları taşı.</p><p><strong>Malzeme.</strong> Gerçek deri. Sentetik, çabuk yıpranır. Tam taneli deri (full-grain), en dayanıklısı.</p><p><strong>Renk.</strong> Siyah ya da koyu kahverengi. Ayakkabı ve kemerle uyumlu.</p><p><strong>Tür.</strong> Bifold (ikiye katlanan), trifold (üçe katlanan), kartlık (sadece kartlar için). Modern tercih: kartlık, çünkü daha ince.</p><p><strong>İçerik.</strong> Sadece gerekli: kimlik, ehliyet, 2–3 kart, biraz nakit. Fazlası, cüzdanı şişirir.</p><blockquote>Cüzdanını açtığında, hayatını gösteriyorsun. Dağınıksa, hayatın da dağınık olabilir.</blockquote><h2>Saat</h2><p><strong>Klasik saat.</strong> Mekanik ya da otomatik. Deri kayış ya da metal kordon. Resmi ve klasik kombinler için.</p><p><strong>Spor saat.</strong> Dijital, kauçuk kayış. Gündelik ve spor için. Klasik kombinlerde olmaz.</p><p><strong>Akıllı saat.</strong> Apple Watch, Samsung Gear. Pratik ama her kombinle uyumlu değil. Resmi toplantılarda, klasik saat daha iyi.</p><p><strong>Boyut.</strong> Bileğe uygun. 38–42 mm arası, çoğu erkek için ideal. Çok büyük, gösterişli durur. Çok küçük, kaybolur.</p><p><strong>Renk uyumu.</strong> Saat kayışı, ayakkabı ve kemerle uyumlu olmalı. Siyah, kahverengi, metal.</p><h2>Kemer</h2><p>Kemer, hem işlevsel hem estetik. Ama her zaman görünmez. Göründüğünde, doğru olmalı.</p><p><strong>Renk.</strong> Ayakkabıyla uyumlu. Tam aynı olmasa da, aynı tonda. Siyah ayakkabı + siyah kemer. Kahverengi ayakkabı + kahverengi kemer.</p><p><strong>Tokalı.</strong> Basit, klasik. Gösterişli tokalar, dikkat dağıtır. İş ortamında sade, gündelikte biraz daha serbest.</p><p><strong>Genişlik.</strong> 3–3,5 cm ideal. Çok ince, zayıf gösterir. Çok kalın, kaba.</p><p><strong>Kullanım.</strong> Kemeri, pantolonun bel çizgisinde tut. Ne çok yüksek, ne çok düşük. Kemersiz pantolon, doğru bedendeyse mükemmel.</p><h2>Diğer aksesuarlar</h2><p><strong>Çanta.</strong> Bir erkeğin çantası olmalı. Sırt çantası (gündelik), evrak çantası (iş), el çantası (seyahat). Deri, sade, işlevsel.</p><p><strong>Kalem.</strong> İyi bir kalem, bir imza aracıdır. Dolma kalem, şık ve klasik. Ama pratik de olmalı.</p><p><strong>Mendil.</strong> Kumaş mendil, kağıt mendilden çok daha şık. Ceketin iç cebinde, beyaz ya da açık mavi.</p><p><strong>Kol düğmesi.</strong> Klasik gömlekler için. Sade, metal, kişisel bir dokunuş.</p><p><strong>Şapka.</strong> Güneşten korunmak için. Klasik: fötr, kasket, panama.</p><p><strong>Gözlük.</strong> Güneş gözlüğü, hem koruma hem stil. Yüz şekline uygun olmalı. Kaliteli cam, UV koruması.</p><h2>Ne kadar aksesuar?</h2><p>Kural: 2–3 aksesuar. Fazlası, gösterişli ve dağınık. Az, yeterli.</p><p>Örneğin: saat + cüzdan + kemer. Bu, bir erkeğin temel aksesuarıdır. Buna, ortama göre bir şey eklenebilir: mendil, gözlük, şapka.</p><p>Ama hepsi, uyumlu olmalı. Renk, stil, malzeme. Karmaşık aksesuar, kaos yaratır.</p><h2>Bakım</h2><p>Aksesuar, bakım ister. Deri ürünler, düzenli nemlendirme. Metal ürünler, düzenli temizlik. Saat, periyodik bakım.</p><p>Bakımsız aksesuar, tüm kombini düşürür. Bakımlı aksesuar, tüm kombini yükseltir.</p><h2>Sonuç</h2><p>Cüzdan ve aksesuar, bir erkeğin stilinin detaylarıdır. Ve detaylar, karakteri gösterir. Küçük bir parça, büyük bir fark yaratır.</p><p>Bugün cüzdanını gözden geçir. Gereksiz olanları çıkar, bakımını yap. Yarın bir aksesuara yatırım yap. Bir ay sonra, stilin, detaylarla daha güçlü olacak.</p>`},

{id:46,cat:'Zihin',date:'14 Temmuz 2026',read:'8 dk',tags:['Kitap','Okuma','Gelişim'],title:'Kitap Okuma Alışkanlığı: Yılda 50 Kitap Nasıl Okunur?',excerpt:'Bir erkeğin en büyük serveti, kafasında taşıdığı fikirlerdir. Ve fikirler, kitaplardan gelir.',lead:'Bir erkeğin en büyük serveti, banka hesabında değildir. Kafasında taşıdığı fikirlerdir. Ve fikirler, kitaplardan gelir. Yılda 50 kitap okumak, mümkündür. Sadece doğru sistem gerekir.',body:`<p>Ortalama bir insan, yılda 1–2 kitap okur. Çoğu erkek, "kitap okuyacak zamanım yok" der. Ama zaman değil, sistem meselesidir. Doğru sistemle, yılda 50 kitap okumak mümkündür.</p><p>Okumak, bir erkeğin hayatını değiştirir. Bilgi verir, ufuk açar, kelime dağarcığını genişletir, empati kurma yeteneğini artırır, zihni keskinleştirir. Ve en önemlisi: yalnız olmadığını hatırlatır.</p><h2>Yılda 50 kitap nasıl okunur?</h2><p>Matematik basit: 50 kitap ÷ 52 hafta = haftada yaklaşık 1 kitap. Bir kitap, ortalama 300 sayfa. Yani günde yaklaşık 43 sayfa.</p><p>43 sayfa, 30–45 dakika sürer. Yani günde 30–45 dakika okumak, yılda 50 kitap demektir.</p><p>Bu kadar zaman bulmak, aslında kolaydır. Çünkü çoğu erkek, günde 4 saat ekrana bakıyor. 30 dakikayı, ekrandan kesmek yeterli.</p><blockquote>Kitap okumak, zaman meselesi değildir. Öncelik meselesidir.</blockquote><h2>Zaman nasıl bulunur?</h2><p><strong>1. Sabah 15 dakika.</strong> Alarmı 15 dakika erken kur. Yataktan önce, telefon yerine kitap oku.</p><p><strong>2. Yolda.</strong> Metrobüs, otobüs, tren. Sesli kitap dinle, ya da oku.</p><p><strong>3. Öğle tatili.</strong> 15–20 dakika, yemek sonrası. Zihni dinlendirir.</p><p><strong>4. Akşam 20 dakika.</strong> Telefon yerine, kitap. Yatak başucunda bir kitap dursun.</p><p><strong>5. Hafta sonu.</strong> Cumartesi sabahı, 1 saat. Uzun okuma seansı.</p><p>Bu, günde ortalama 45–60 dakika okuma demektir. Fazlasıyla yeterli.</p><h2>Doğru kitabı seçmek</h2><p>Okuma alışkanlığı, zorla kurulmaz. İlgi alanlarına göre okumak gerekir. Başlangıçta, zor klasikler değil, akıcı kitaplar.</p><p><strong>Kurgu.</strong> Roman, öykü, polisiye, bilim-kurgu. Hikâye, okumayı kolaylaştırır.</p><p><strong>Kurgu dışı.</strong> Biyografi, tarih, felsefe, kişisel gelişim, bilim. Bilgi verir, ufuk açar.</p><p><strong>Klasikler.</strong> Zor ama değerli. Ama önce, okuma alışkanlığı kurulmalı. Sonra klasikler.</p><p><strong>Öneri.</strong> Başlangıç için: kısa romanlar, biyografiler, kişisel gelişim. Okuma hızı arttıkça, daha zor kitaplara geç.</p><h2>Okuma hızını artırmak</h2><p><strong>1. Subvokalizasyonu azalt.</strong> İçinden okurken, kelimeleri söyleme. Bu, hızı yavaşlatır. Gözle oku, zihinle anla.</p><p><strong>2. Göz hareketleri.</strong> Gözünü satır boyunca akıcı hareket ettir. Kelime kelime değil, bloklar halinde oku.</p><p><strong>3. Başparmak tekniği.</strong> Başparmağını satır boyunca kaydır. Gözün, parmağı takip eder. Hız artar.</p><p><strong>4. Pratik.</strong> Okuma hızı, pratikle artar. Yılda 50 kitap okuyan biri, 20 kitap okuyandan iki kat hızlı okur.</p><p><strong>5. Anlama.</strong> Hız, anlamadan bağımsız değildir. Hızlı okuyup anlamamak, anlamsızdır. Anlama, önce gelir.</p><h2>Not almak</h2><p>Okurken not al. Bu, hatırlamayı güçlendirir. Yöntemler:</p><p><strong>1. Altını çiz.</strong> Önemli cümleleri, kurşun kalemle.</p><p><strong>2. Kenar notu.</strong> Sayfa kenarlarına, kısa notlar.</p><p><strong>3. Özet.</strong> Kitabı bitirdikten sonra, bir sayfalık özet yaz.</p><p><strong>4. Alıntı defteri.</strong> Beğendiğin alıntıları, bir deftere yaz.</p><p><strong>5. Uygulama.</strong> Kitaptan öğrendiğini, hayatına uygula. Bu, en iyi öğrenme yöntemidir.</p><h2>Kitap türleri ve seçim</h2><p><strong>Kişisel gelişim.</strong> Faydalı ama abartma. Yılda 5–10 kitap yeterli. Fazlası, tekrar ve yüzeysellik.</p><p><strong>Felsefe.</strong> Derinlik katar. Ama zor. Yılda 3–5 kitap yeterli. Stoacılar, başlangıç için ideal.</p><p><strong>Tarih.</strong> Perspektif verir. Yılda 5–10 kitap.</p><p><strong>Biyografi.</strong> İlham verir. Yılda 5–10 kitap.</p><p><strong>Kurgu.</strong> Zihni dinlendirir. Yılda 10–15 kitap.</p><p><strong>Bilim.</strong> Ufuk açar. Yılda 5–10 kitap.</p><p><strong>Klasikler.</strong> Değerlidir ama az. Yılda 3–5 kitap.</p><p>Toplam: Yılda 50 kitap. Her tür, biraz.</p><h2>Kitap nereden alınır?</h2><p><strong>Satın alma.</strong> Yeni kitap pahalı. Ama bir kitap, bir ömür boyu değer verir. Ayda 4 kitap, 200–400 TL.</p><p><strong>Kütüphane.</strong> Ücretsiz. Ama her istediğin kitap olmayabilir.</p><p><strong>İkinci el.</strong> Sahaf, online platform. Ucuz ve bazen değerli.</p><p><strong>E-kitap.</strong> Kindle, Google Books. Pratik ama göz yorgunluğu.</p><p><strong>Sesli kitap.</strong> Audible, Storytel. Yolda, spor yaparken.</p><h2>Kötü alışkanlıkları bırakmak</h2><p><strong>1. "Zamanım yok."</strong> Yalan. Herkesin 24 saati var. Öncelik meselesi.</p><p><strong>2. "Sıkıcı."</strong> Yanlış kitap. İlgi alanına göre kitap seç.</p><p><strong>3. "Başlayıp bırakıyorum."</strong> Kitabı bitirme zorunluluğu yok. Sevmediysen, bırak. Ama yenisine başla.</p><p><strong>4. "Yavaş okuyorum."</strong> Pratikle hızlanır. Ayrıca, hız önemli değil; anlam önemli.</p><p><strong>5. "Kitaplar pahalı."</strong> Kütüphane, ikinci el, e-kitap. Seçenekler var.</p><h2>Sonuç</h2><p>Kitap okumak, bir erkeğin hayatını değiştirir. Bilgi, ufuk, hikmet, ilham. Ve tüm bunlar, günde 30–45 dakikayla mümkün.</p><p>Bugün bir kitap al. Yarın 10 sayfa oku. Bir hafta sonra, 70 sayfa. Bir ay sonra, bir kitap. Bir yıl sonra, 50 kitap. Ve o 50 kitap, seni bambaşka bir adam yapacak.</p>`},

{id:47,cat:'Zihin',date:'12 Temmuz 2026',read:'9 dk',tags:['Stoacılık','Felsefe','Zihin'],title:'Stoacıların Öğrettikleri: Modern Erkeğe Antik Bilgelik',excerpt:'Stoacılık, kaderi kabullenmek değildir. Kontrol edebildiğin şeye odaklanmaktır.',lead:'Stoacılık, kaderi kabullenmek değildir. Kontrol edebildiğin şeye odaklanmak, kontrol edemediğini bırakmaktır. Antik bir felsefe ama modern erkeğin en büyük ihtiyacı.',body:`<p>Stoacılık, MÖ 3. yüzyılda Yunanistan'da doğdu. Roma'da yükseldi. Marcus Aurelius, Seneca, Epictetus gibi isimlerle şekillendi. Ve 2.000 yıl sonra, bugün, modern erkeğin en ihtiyacı olan felsefe haline geldi.</p><p>Stoacılık, soğukkanlılık değildir. Duygusuzluk değildir. Kayıtsızlık değildir. Aksine, hayatın zorluklarıyla yüzleşmek, kontrol edebildiğin şeye odaklanmak, kontrol edemediğini kabul etmektir.</p><h2>Stoacılığın temel ilkeleri</h2><p><strong>1. Kontrol ayrımı.</strong> Bazı şeyler kontrolünde, bazıları değil. Kontrolünde olanlar: düşüncelerin, kararların, tepkilerin. Kontrolünde olmayanlar: başkalarının davranışı, hava durumu, ekonomi, hastalık, ölüm.</p><p>Bilge erkek, kontrolünde olana odaklanır; olmayanı kabul eder. Bu, kaygıyı azaltır, etkinliği artırır.</p><p><strong>2. Erdem en yüksek iyidir.</strong> Zenginlik, şöhret, sağlık — hepsi iyi olabilir ama erdem, tek gerçek iyidir. Erdem: bilgelik, cesaret, adalet, ölçülülük.</p><p><strong>3. Duygular değil, yargılar.</strong> Stoacılar, duyguların doğrudan olaylardan değil, olaylara dair yargılarımızdan kaynaklandığını söyler. Yani bir olay üzücüdür çünkü biz onu üzücü buluruz.</p><p><strong>4. Anı yaşa.</strong> Geçmiş gitti, gelecek belirsiz, elimizde sadece an var. Anı dolu dolu yaşa.</p><p><strong>5. Ölümü hatırla (memento mori).</strong> Ölümü hatırlamak, hayatı daha değerli kılar. Bugün son gününmüş gibi yaşa.</p><blockquote>Kontrol edemediğin şey için endişelenmek, kontrol edebildiğin şeyi de kaybetmektir.</blockquote><h2>Marcus Aurelius'un öğrettikleri</h2><p>Roma İmparatoru Marcus Aurelius, "Düşünceler" (Meditations) adlı eserini, kendine yazdığı notlar olarak kaleme aldı. Ve bu notlar, bugün hâlâ okunuyor.</p><p>Bazı alıntılar:</p><ul><li>"Mutluluğun, dış koşullara değil, iç tutumuna bağlıdır."</li><li>"Ne kadar az şeye ihtiyacın olursa, o kadar özgürsün."</li><li>"Bugün yapman gerekeni yap. Yarın, bugünün hatırasıdır."</li><li>"Engel, yolun kendisidir. Engeli sev."</li><li>"İçindeki kaynağı keşfet. İyilik, her zaman orada."</li></ul><h2>Seneca'nın öğrettikleri</h2><p>Seneca, Roma döneminin filozofu, devlet adamı, yazarı. "Ahlak Mektupları"nda, hayatın kısalığı, kaygı, ölüm üzerine yazdı.</p><p>Bazı alıntılar:</p><ul><li>"Hayat kısa değil; biz onu kısaltıyoruz."</li><li>"Zaman, elimizdeki tek servettir. Onu harcarken dikkatli ol."</li><li>"Zorluklar, karakteri gösterir."</li><li>"Umutsuzluğa kapılmak, korkaklıktır."</li><li>"Her gün, hayatın son günü gibi yaşa."</li></ul><h2>Epictetus'un öğrettikleri</h2><p>Epictetus, köle olarak doğdu, filozof olarak öldü. "Enkheiridion" (El Kitabı), Stoacılığın en pratik rehberidir.</p><p>Bazı alıntılar:</p><ul><li>"Özgürlük, arzularının kontrolüdür."</li><li>"Bize zarar veren şey, olaylar değil, olaylara dair görüşlerimizdir."</li><li>"Hakaret, karşı tarafın sorunudur."</li><li>"Başkalarının seni nasıl gördüğü, senin sorunun değildir."</li><li>"Her şeyi, iyi niyetle yap."</li></ul><h2>Modern erkeğe Stoacılık</h2><p><strong>1. Kaygı ile başa çıkmak.</strong> Kaygının büyük kısmı, kontrol edemediğin şeyler üzerinedir. Ekonomi, siyaset, gelecek, sağlık. Stoacılık, bu kaygıları azaltır.</p><p><strong>2. Öfkeyi yönetmek.</strong> Öfke, çoğu zaman yargıdan gelir. "Bu olmamalıydı." Ama oldu. Kabul et, tepkini seç. Öfke, bir seçimdir.</p><p><strong>3. Kayıplarla baş etmek.</strong> Kayıp acı verir ama bu acı, hayatın bir parçasıdır. Kaybı kabul et, acıyı yaşa, devam et. Bu, Stoacı bir tavırdır.</p><p><strong>4. Başarı ve başarısızlık.</strong> Başarı, dış koşullara bağlıdır. Ama erdem, senin elindedir. Başarısız olsan bile, doğru olanı yaptıysan, erdemlisin.</p><p><strong>5. Ölümü kabullenmek.</strong> Ölüm, kaçınılmazdır. Onu kabullenmek, hayatı daha dolu yaşamaya yol açar. Her gün, son gün gibi.</p><h2>Stoacı pratikler</h2><p><strong>1. Sabah meditasyonu.</strong> Gün başlamadan, 5 dakika. Bugün ne yapacağım? Neye odaklanacağım? Neyi bırakacağım?</p><p><strong>2. Akşam değerlendirmesi.</strong> Gün bitmeden, 5 dakika. Bugün ne yaptım? Ne doğruydu? Ne yanlıştı? Yarın ne yapacağım?</p><p><strong>3. Negatif görselleştirme.</strong> Kaybetmeyi hayal et. Sevdiğin insanı, sağlığını, işini. Bu, sahip olduğun şeyin değerini hatırlatır.</p><p><strong>4. Kontrol ayrımı egzersizi.</strong> Bir sorunla karşılaştığında, sor: Bu benim kontrolümde mi? Evetse, harekete geç. Hayırsa, kabul et.</p><p><strong>5. Memento mori.</strong> Her gün, ölümü hatırla. Bu, hayatı hafife almamayı, her anı dolu yaşamayı öğretir.</p><h2>Yanlış anlamalar</h2><p><strong>"Stoacılık, duygusuzluktur."</strong> Yanlış. Stoacılar, duyguları bastırmaz. Onları tanır, anlar, yönetir. Ama duyguların kölesi olmaz.</p><p><strong>"Stoacılık, kaderci bir felsefedir."</strong> Yanlış. Stoacılar, kaderi kabul eder ama harekete geçer. Kontrol edebildikleri şey için mücadele ederler.</p><p><strong>"Stoacılık, pasifliktir."</strong> Yanlış. Marcus Aurelius, Roma İmparatoru'ydu. Seneca, devlet adamı. Epictetus, öğretmen. Hepsi aktifti.</p><p><strong>"Stoacılık, dindir."</strong> Yanlış. Ama bazı dini değerlerle uyumludur. Hristiyanlık, İslam, Yahudilik — hepsi Stoacı düşünceden etkilenmiştir.</p><h2>Sonuç</h2><p>Stoacılık, 2.000 yıl önce doğdu ama bugün hâlâ geçerli. Çünkü insan doğası değişmedi. Kaygı, öfke, kayıp, ölüm — hepsi aynı.</p><p>Bugün bir Stoacı pratik dene. Sabah meditasyonu, akşam değerlendirmesi, kontrol ayrımı. Bir hafta sonra, bir fark hissedeceksin. Bir ay sonra, bir dönüşüm. Bir yıl sonra, bir karakter.</p>`},

{id:48,cat:'Zihin',date:'10 Temmuz 2026',read:'9 dk',tags:['Anlam','Felsefe','Varoluş'],title:'Hayatın Anlamı: Varoluşçu Bir Bakış',excerpt:'Hayatın anlamı, dışarıda aranmaz. İçeride inşa edilir. Ve her erkek, kendi anlamını yaratır.',lead:'Hayatın anlamı, dışarıda aranmaz. İçeride inşa edilir. Ve her erkek, kendi anlamını yaratır. Bu, hem bir özgürlük hem bir sorumluluktur.',body:`<p>Bir erkek, hayatının bir noktasında şu soruyu sorar: Neden yaşıyorum? Ne için? Hayatın bir anlamı var mı? Bu soru, felsefenin en eski sorusudur. Ve her nesil, kendi cevabını bulmak zorundadır.</p><p>Varoluşçuluk, bu soruya bir cevap sunar: Hayatın anlamı, dışarıda verili değildir. İçeride inşa edilir. Her insan, kendi anlamını yaratır. Bu, hem bir özgürlük hem bir sorumluluktur.</p><h2>Varoluşçuluğun temel fikri</h2><p>Varoluşçuluk, 19.–20. yüzyılda Kierkegaard, Nietzsche, Sartre, Camus gibi filozoflarla şekillendi. Temel fikri: <strong>Varoluş, özden önce gelir.</strong></p><p>Yani önce var oluruz, sonra ne olduğumuzu belirleriz. Bir bıçağın önceden bir amacı vardır (kesmek). Ama bir insanın önceden bir amacı yoktur. Kendi amacını, kendi seçimleriyle yaratır.</p><p>Bu, özgürlüktür. Ama aynı zamanda bir yüktür. Çünkü sorumluluk, tamamen sana aittir. Neysen, senin eserindir.</p><blockquote>İnsan, kendi hayatının yazarıdır. Ama yazar, boş sayfayla başlar.</blockquote><h2>Sartre: Özgürlüğe mahkûm</h2><p>Sartre, "İnsan özgür olmaya mahkûmdur" der. Çünkü seçim yapmak zorundayız. Seçmemek de bir seçimdir. Ve her seçim, bir sorumluluktur.</p><p>Sartre'a göre, insan kendi hayatını yaratır. Ama bu yaratım, kolay değildir. Kaygı, bulantı, sorumluluk — hepsi bu özgürlüğün kaçınılmaz yan etkileridir.</p><p>Bu yüzden çoğu insan, özgürlükten kaçar. Din, ideoloji, gelenek, otorite — hepsi, bu ağır özgürlüğü hafifletmek için vardır. Ama Sartre'a göre, bu bir kaçıştır. Gerçek, kendi özgürlüğünü kabul etmektir.</p><h2>Camus: Absürt ve isyan</h2><p>Camus, "Sisifos Söyleni"nde, absürt kavramını işler. Hayat, anlamsızdır. İnsan, anlam arar. Ama evren, sessizdir. Bu, absürttür.</p><p>Peki ne yapmalı? İki seçenek: intihar ya da isyan. Camus, intiharı reddeder. Onun yerine, isyanı önerir: Absürtlüğü kabul et, ama yine de yaşa. Anlam yarat, ama anlamın olmadığını bilerek.</p><p>Bu, Sisifos'un hikâyesidir. Sisifos, bir kayayı tepeye yuvarlamakla cezalandırılır. Kaya, her seferinde aşağı yuvarlanır. Sisifos, tekrar tepeye çıkar. Sonsuza kadar. Camus der ki: "Sisifos'u mutlu olarak düşünmek gerekir."</p><h2>Nietzsche: Üstinsan ve anlam yaratmak</h2><p>Nietzsche, "Tanrı öldü" der. Yani geleneksel anlam kaynakları, artık geçerli değildir. Ama bu, bir felaket değil, bir fırsattır.</p><p>Çünkü insan, artık kendi anlamını yaratabilir. Nietzsche'nin "üstinsan"ı, kendi değerlerini yaratan, kendi yolunu çizen, sürüye uymayan kişidir.</p><p>Bu, kolay değildir. Ama en cesur yol budur. Kendi anlamını yaratmak, kendi değerlerini kurmak, kendi hayatını yaşamak.</p><h2>Frankl: Anlam ve acı</h2><p>Viktor Frankl, Nazi toplama kamplarında hayatta kaldı. Ve gözlemledi: Hayatta kalanlar, bir anlamı olanlardı. Bir amaç, bir sevgi, bir iş, bir insan.</p><p>Frankl, "İnsanın Anlam Arayışı"nda şöyle der: "Yaşamak için bir 'neden'i olan insan, hemen her 'nasıl'a dayanabilir."</p><p>Frankl'a göre, anlam üç kaynaktan gelir: <strong>Bir iş yapmak</strong> (üretmek, yaratmak), <strong>birini sevmek</strong> (ilişki, bağ), <strong>acıya anlam katmak</strong> (kaçınılmaz acıyı dönüştürmek).</p><h2>Modern erkeğe anlam</h2><p><strong>1. Anlam, dışarıda değildir.</strong> Ne para, ne şöhret, ne güç — hiçbiri tek başına anlam vermez. Anlam, içeride inşa edilir.</p><p><strong>2. Anlam, eylemde bulunur.</strong> Sadece düşünmek, anlam yaratmaz. Bir şey yapmak, bir şey üretmek, birine yardım etmek gerekir.</p><p><strong>3. Anlam, ilişkide bulunur.</strong> Yalnız anlam, eksiktir. Sevgi, dostluk, aile, topluluk — hepsi anlam kaynağıdır.</p><p><strong>4. Anlam, acıyı dönüştürür.</strong> Kaçınılmaz acı, kaçış değil, dönüşüm gerektirir. Hastalık, kayıp, başarısızlık — hepsi bir anlam taşıyabilir.</p><p><strong>5. Anlam, seçimdir.</strong> Her gün, ne yapacağını seçersin. Ve bu seçimler, hayatının anlamını oluşturur.</p><h2>Kendi anlamını bulmak</h2><p><strong>1. Kendine sor.</strong> Ne yaparken kendini canlı hissediyorsun? Ne için uyanıyorsun? Neyi kaybetmekten korkarsın? Bu sorular, anlamın izleridir.</p><p><strong>2. Deneyle.</strong> Farklı şeyler dene. Farklı iş, farklı hobi, farklı insanlar. Anlam, genelde denenirken bulunur.</p><p><strong>3. Derinleş.</strong> Yüzeysel anlam, kalıcı değildir. Derinleşmek, bir şeye tamamen bağlanmak, ona zaman vermek.</p><p><strong>4. Paylaş.</strong> Anlam, sadece sana ait değildir. Başkalarıyla paylaşıldığında, büyür.</p><p><strong>5. Sabırlı ol.</strong> Anlam, bir günde bulunmaz. Bir yolculuktur. Her adım, bir keşif.</p><h2>Sonuç</h2><p>Hayatın anlamı, dışarıda verili değildir. İçeride inşa edilir. Ve bu, hem bir özgürlük hem bir sorumluluktur.</p><p>Bugün kendine sor: Hayatımın anlamı ne? Cevap, hemen gelmeyebilir. Ama soru, önemlidir. Çünkü soru, arayışı başlatır. Ve arayış, anlamın ta kendisidir.</p>`},

{id:49,cat:'Zihin',date:'8 Temmuz 2026',read:'8 dk',tags:['Ölüm','Sonluluk','Yaşam'],title:'Ölüm ve Erkek: Sonlulukla Yüzleşmek',excerpt:'Ölümü kabullenmek, hayatı daha dolu yaşamaktır. Ama çoğu erkek, ölümden kaçar.',lead:'Ölüm, her erkeğin kaçındığı bir konudur. Ama ölümden kaçmak, hayattan kaçmaktır. Ölümü kabullenmek, hayatı daha dolu yaşamaktır.',body:`<p>Modern toplum, ölümü gizler. Hastanelerde, huzurevlerinde, sessizce. Kimse ölümden bahsetmez. Kimse ölümü düşünmez. Ama ölüm, kaçınılmaz bir gerçektir. Ve ondan kaçmak, hayattan kaçmaktır.</p><p>Erkekler için ölüm, özellikle zordur. Çünkü erkekler, genelde zayıflık göstermez. Korku, keder, kayıp — hepsi bastırılır. Ama bastırılan ölüm korkusu, başka biçimlerde ortaya çıkar: kaygı, öfke, kontrol ihtiyacı, işkoliklik.</p><h2>Ölüm neden korkutur?</h2><p><strong>1. Belirsizlik.</strong> Ölümden sonra ne olacağını bilmiyoruz. Bilinmeyen, korkutur.</p><p><strong>2. Kayıp.</strong> Sahip olduğumuz her şeyi kaybedeceğiz. Sevdiğimiz insanları, deneyimlerimizi, benliğimizi.</p><p><strong>3. Anlamsızlık.</strong> Eğer öleceksek, her şey anlamsız mı? Bu soru, varoluşsal kaygı yaratır.</p><p><strong>4. Kontrol kaybı.</strong> Ölüm, kontrolümüz dışındadır. Kontrol edemediğimiz şey, korkutur.</p><blockquote>Ölümden korkan erkek, aslında yaşamdan korkar. Çünkü ölüm, yaşamın sonudur; ama yaşam, ölümün başlangıcıdır.</blockquote><h2>Ölümü kabullenmenin faydaları</h2><p><strong>1. Hayatı daha dolu yaşamak.</strong> Ölümü hatırlayan erkek, zamanı boşa harcamaz. Her an, değerlidir.</p><p><strong>2. Öncelikleri netleştirmek.</strong> Ölümü düşündüğünde, neyin önemli olduğunu görürsün. İş, para, statü — hepsi ikinci planda kalır. Aile, sevgi, anlam — hepsi öne çıkar.</p><p><strong>3. Kaygıyı azaltmak.</strong> Ölümü kabullenmek, diğer kaygıları da azaltır. Çünkü en büyük kaygı, ölüm kaygısıdır.</p><p><strong>4. Affetmeyi kolaylaştırmak.</strong> Ölümü hatırlayan erkek, kin tutmaz. Çünkü her an son olabilir.</p><p><strong>5. Şükretmeyi öğretmek.</strong> Sahip olduğun şeyin değeri, kaybettiğinde anlaşılır. Ölümü hatırlamak, bugünün değerini hatırlatır.</p><h2>Stoacı memento mori</h2><p>Stoacılar, "memento mori" (ölümü hatırla) derdi. Bu, bir korku değil, bir pratiktir. Her gün, ölümü hatırla. Bu, hayatı hafife almamayı öğretir.</p><p>Marcus Aurelius: "Yakında her şeyi unutacaksın. Yakında herkes seni unutacak." Bu cümle, karamsar değil, özgürleştiricidir. Çünkü küçük şeylere takılmamayı öğretir.</p><p>Seneca: "Her gün, hayatın son günü gibi yaşa." Bu, her anı dolu yaşamayı öğretir.</p><h2>Ölümle yüzleşme pratikleri</h2><p><strong>1. Kendi ölümünü hayal et.</strong> Bir dakika boyunca, kendi ölümünü hayal et. Cenazende ne söylenecek? Neyi ardında bıraktın? Bu, öncelikleri netleştirir.</p><p><strong>2. Ölen yakınlarını hatırla.</strong> Onları nasıl hatırlıyorsun? Neleri geride bıraktılar? Bu, senin de ne bırakacağını hatırlatır.</p><p><strong>3. Yaz.</strong> Kendi vasiyetini yaz. Ya da ölümünden sonra söylenmesini istediğin şeyleri. Bu, hayatını düşünmeye zorlar.</p><p><strong>4. Ölüm hakkında oku.</strong> Stoacılar, varoluşçular, dinler. Farklı bakış açıları, ölümü anlamlandırmaya yardımcı olur.</p><p><strong>5. Sevdiğin insanlarla konuş.</strong> Ölüm hakkında konuşmak, tabu değildir. Aksine, yakınlığı derinleştirir.</p><h2>Kayıp ve yas</h2><p>Yakın birini kaybettiğinde, yas tut. Bu, doğal ve gerekli bir süreçtir. Yas, sadece üzülmek değildir; bir dönüşüm sürecidir.</p><p>Yasın aşamaları: inkâr, öfke, pazarlık, depresyon, kabullenme. Herkes bu sırayı takip etmez; bazıları bazı aşamaları atlar, bazıları geri döner. Ama süreç, gereklidir.</p><p>Erkekler için yas, özellikle zordur. Çünkü ağlamak, "zayıflık" olarak görülür. Oysa ağlamak, iyileşmenin bir parçasıdır.</p><h2>Çocuklara ölümü öğretmek</h2><p>Çocuklar, ölümle ilgili sorular sorar. "Dede nereye gitti?" "Ben de ölecek miyim?" Bu sorular, geçiştirilmemeli. Yaşına uygun, dürüst bir cevap verilmelidir.</p><p>Çocuğa ölümü öğretmek, hayatı öğretmektir. Ölüm, hayatın bir parçasıdır. Ve çocuk, bunu öğrenerek büyür.</p><h2>Sonuç</h2><p>Ölüm, her erkeğin kaçındığı bir konudur. Ama ölümden kaçmak, hayattan kaçmaktır. Ölümü kabullenmek, hayatı daha dolu yaşamaktır.</p><p>Bugün bir dakika dur, kendi ölümünü düşün. Korkma. Sonra, bugün ne yapacağını düşün. Sana gerçekten önemli olan ne? Kimi arayacaksın? Neyi söyleyeceksin? Çünkü her an, son an olabilir. Ve her an, ilk an olabilir.</p>`},

{id:50,cat:'Zihin',date:'6 Temmuz 2026',read:'7 dk',tags:['Minnettarlık','Şükür','Mutluluk'],title:'Minnettarlık: Şükretmenin Gücü',excerpt:'Şükretmek, sahip olduğun şeylerin değerini görmektir. Ve bu, mutluluğun en basit yoludur.',lead:'Şükretmek, sahip olduğun şeylerin değerini görmektir. Ve bu, mutluluğun en basit yoludur. Ama modern erkek, şükretmeyi unutmuştur. Çünkü hep daha fazlasını ister.',body:`<p>Modern erkek, sürekli bir yarış içindedir. Daha fazla para, daha büyük ev, daha iyi araba, daha yüksek statü. Ama bu yarış, bir tuzaktır. Çünkü her kazanç, yeni bir istek doğurur. Ve mutluluk, hep bir sonraki hedefe ertelenir.</p><p>Minnettarlık, bu tuzağın panzehiridir. Minnettarlık, sahip olduğun şeylerin değerini görmektir. Küçük şeyleri fark etmek, büyük şeylere şükretmektir.</p><h2>Minnettarlık nedir?</h2><p>Minnettarlık, bir duygudur ama aynı zamanda bir pratiktir. Yani, öğrenilebilir ve geliştirilebilir. Doğuştan gelmez; tekrarla büyür.</p><p>Minnettarlık, sadece "iyi şeylere şükretmek" değildir. Zor şeylere de şükretmektir. Bir hastalık, bir kayıp, bir başarısızlık — hepsi bir ders, bir büyüme fırsatıdır.</p><blockquote>Minnettar erkek, sahip olduğuyla mutlu olandır. Minnettar olmayan erkek, sahip olmadığıyla mutsuz olandır.</blockquote><h2>Minnettarlığın faydaları</h2><p><strong>1. Mutluluk.</strong> Araştırmalar, minnettar insanların daha mutlu, daha az depresif olduğunu gösterir.</p><p><strong>2. Sağlık.</strong> Minnettarlık, kan basıncını düşürür, bağışıklığı güçlendirir, uykuyu iyileştirir.</p><p><strong>3. İlişkiler.</strong> Minnettar erkek, daha iyi eş, daha iyi baba, daha iyi arkadaştır. Çünkü fark eder ve takdir eder.</p><p><strong>4. Dayanıklılık.</strong> Minnettar erkek, zorluklarla daha iyi başa çıkar. Çünkü zorlukta bile bir anlam bulur.</p><p><strong>5. Performans.</strong> Minnettar çalışan, daha üretken, daha yaratıcı, daha işbirlikçi olur.</p><p><strong>6. Kaygı.</strong> Minnettarlık, kaygıyı azaltır. Çünkü dikkat, eksiklikten bolluğa kayar.</p><h2>Minnettarlık pratikleri</h2><p><strong>1. Minnettarlık günlüğü.</strong> Her akşam, üç şeye şükret. Yaz. Küçük şeyler olabilir: bir kahve, bir gülümseme, bir güneşli gün. Ama her gün.</p><p><strong>2. Sabah şükür.</strong> Sabah uyandığında, üç şeye şükret. Nefes alabiliyorsun, bir yatağın var, bugün bir fırsatın var. Basit ama etkili.</p><p><strong>3. Şükür mesajı.</strong> Haftada bir kez, birine teşekkür mesajı at. Onun sana ne kattığını söyle. Bu, hem seni hem onu mutlu eder.</p><p><strong>4. Minnettarlık yürüyüşü.</strong> Yürürken, gördüğün her şeye şükret. Ağaçlar, kuşlar, güneş, insanlar. Bu, minnettarlığı bir alışkanlık haline getirir.</p><p><strong>5. Zor şeylere şükür.</strong> Bir zorluk yaşadığında, sor: Bu bana ne öğretti? Bu, minnettarlığı derinleştirir.</p><h2>Minnettarlığın düşmanları</h2><p><strong>1. Karşılaştırma.</strong> Başkalarıyla karşılaştırmak, minnettarlığı öldürür. Hep daha iyisi vardır. Kendi yoluna odaklan.</p><p><strong>2. Beklenti.</strong> Sahip olduğun şeyi "hak ediyorsun" diye düşünürsen, minnettar olamazsın. Hiçbir şey garanti değildir.</p><p><strong>3. Acele.</strong> Sürekli koşan erkek, etrafındakileri göremez. Dur, nefes al, bak.</p><p><strong>4. Şikâyet.</strong> Şikâyet, minnettarlığın zıttıdır. Bir gün boyunca şikâyet etmemeyi dene. Zor ama öğretici.</p><p><strong>5. Dijital.</strong> Sosyal medya, sürekli "daha iyi" hayatları gösterir. Bu, minnettarlığı zayıflatır. Ekran süresini azalt.</p><h2>Şükür ve din</h2><p>Birçok dinde şükür, temel bir pratiktir. İslam'da "şükür", Hristiyanlık'ta "gratitude", Yahudilik'te "hakarat hatov", Budizm'de "metta". Hepsi, minnettarlığın ruhsal bir pratiktir.</p><p>Dindar olsan da olmasan da, minnettarlık pratiği, hayatını zenginleştirir. Çünkü minnettarlık, insani bir ihtiyaçtır.</p><h2>Zor zamanlarda minnettarlık</h2><p>Minnettarlık, sadece iyi zamanlarda değildir. Zor zamanlarda, daha da önemlidir. Bir kayıp, bir hastalık, bir başarısızlık — bu anlarda minnettarlık, bir sığınaktır.</p><p>Ama zor zamanlarda minnettar olmak, kolay değildir. Bu yüzden, minnettarlık pratiği, iyi zamanlarda kurulmalıdır. Bir kere alışkanlık haline geldiğinde, zor zamanlarda da devam eder.</p><h2>Sonuç</h2><p>Minnettarlık, mutluluğun en basit yoludur. Para, şöhret, güç — hiçbiri kalıcı mutluluk vermez. Ama minnettarlık, her koşulda mutluluğu mümkün kılar.</p><p>Bugün üç şeye şükret. Yaz. Yarın bir tane daha. Bir hafta sonra, bir fark hissedeceksin. Bir ay sonra, bir dönüşüm. Bir yıl sonra, bambaşka bir adam. Minnettar bir adam.</p>`}
];

  return `
  <div class="reader">

      <button type="button" class="back" data-action="home"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Tüm Yazılar</button>
      <span class="kicker">— ${esc(a.cat)}</span>
      <h1>${esc(a.title)}</h1>
      <div class="meta"><span>${esc(a.date)}</span><span class="dot"></span><span>${esc(a.read)} okuma</span><span class="dot"></span><span>Erkeklik Sanatı</span></div>
      <div class="content"><p class="lead">${esc(a.lead)}</p>${a.body}</div>
      <div class="tags">${a.tags.map(t=>`<span>#${esc(t)}</span>`).join('')}</div>
    </div>
  </div>`;
}

function renderAbout(){
  return `
  <div class="container">
    <div class="about-hero">
      <span class="kicker" style="font-family:'JetBrains Mono',monospace;font-size:.72rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);">— Hakkında</span>
      <h1 style="margin-top:16px;">Erkekliği yeniden <em style="font-style:italic;color:var(--accent);">düşünmek</em> üzerine.</h1>
      <p>Erkeklik Sanatı, erkeklerin karakter, beceri ve amaç bakımından daha sağlam bir hayat kurmalarına yardımcı olmak için kurulmuş bağımsız bir yayındır.</p>
    </div>
    <div class="about-grid">
      <div class="about-card"><div class="num">01</div><h3>Zamansız ilkeler</h3><p>Moda akımların değil, yüzyıllardır işe yarayan ilkelerin peşindeyiz.</p></div>
      <div class="about-card"><div class="num">02</div><h3>Modern gerçekler</h3><p>Gelenek körü körüne tekrarlanmaz. Bugünün dünyasında ne anlama geldiğini sorgularız.</p></div>
      <div class="about-card"><div class="num">03</div><h3>Pratik bilgi</h3><p>Her yazının sonunda uygulanabilir bir adım vardır.</p></div>
      <div class="about-card"><div class="num">04</div><h3>Bağımsız ses</h3><p>Algoritma bize ne yazacağımızı söylemez. Reklamveren değil, okur önce gelir.</p></div>
    </div>
    <div class="narrow" style="padding:20px 0 40px;">
      <div class="reader content" style="display:block;padding:0;">
        <h2>Neden varız?</h2>
        <p>Bugünün erkeği, tarihte hiç olmadığı kadar çok bilgiye, ama çok az rehberliğe sahip. Bir yanda "erkek adam ağlamaz" diyen katı bir gelenek; diğer yanda köklerinden kopmuş bir modernlik. İkisi de eksik.</p>
        <p>Biz üçüncü bir yol öneriyoruz: <strong>sorumluluk alan, ama duygularını bastırmayan; güçlü olan, ama kibirli olmayan; öğrenmeye devam eden, ama kendine dürüst kalan bir erkeklik.</strong></p>
        <blockquote>Erkeklik bir kalıp değil, bir yolculuktur. Varış yok, yön var.</blockquote>
        <p>Burada bulacağın her yazı, bu yolculuğun bir durağıdır. Acele etme. Oku. Düşün. Uygula.</p>
      </div>

}

function render(){
  const app = document.getElementById('app');
  if (!app) return;
  let html = '';
  if (state.view === 'article') html = renderArticle();
  else if (state.view === 'about') html = renderAbout();
  else html = renderHome();
  app.innerHTML = html;
  window.scrollTo({top:0, behavior:'auto'});
  triggerFade();
  animateCounters();
  attachNewsletter();
}

document.addEventListener('click', (e)=>{
  const el = e.target.closest('[data-action]');
  if (!el) return;
  e.preventDefault();
  e.stopPropagation();
  const action = el.getAttribute('data-action');

  if (action === 'home'){ state.view='home'; state.filter=''; closeMenu(); render(); }
  else if (action === 'about'){ state.view='about'; closeMenu(); render(); }
  else if (action === 'article'){ const id=parseInt(el.getAttribute('data-id'),10); if(!isNaN(id)){ state.view='article'; state.articleId=id; closeMenu(); render(); } }
  else if (action === 'cat'){
    const cat = el.getAttribute('data-cat') || '';
    state.view='home'; state.filter=cat; closeMenu(); render();
    setTimeout(()=>{ const g=document.querySelector('.articles-grid'); if(g){ const y=g.getBoundingClientRect().top+window.scrollY-100; window.scrollTo({top:y,behavior:'smooth'}); } }, 80);
  }
  else if (action === 'scroll'){ const t=document.getElementById(el.getAttribute('data-target')); if(t) t.scrollIntoView({behavior:'smooth',block:'start'}); }
  else if (action === 'theme'){ toggleTheme(); }
  else if (action === 'menu'){ toggleMenu(); }
  else if (action === 'top'){ window.scrollTo({top:0,behavior:'smooth'}); }
  else if (action === 'contact'){ alert('İletişim: merhaba@erkekliksanati.example'); }
  else if (action === 'privacy'){ alert('Bu site özgün bir yayındır. Art of Manliness ile bağlantısı yoktur.'); }
});

function updateThemeIcon(theme){
  const icon = document.getElementById('themeIcon');
  if (!icon) return;
  icon.innerHTML = theme === 'dark'
    ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>'
    : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
}
function toggleTheme(){
  const html = document.documentElement;
  const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e){}
  updateThemeIcon(next);
}
(function initTheme(){
  let theme = 'light';
  try {
    const saved = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    theme = saved || (prefersDark ? 'dark' : 'light');
  } catch(e){}
  document.documentElement.setAttribute('data-theme', theme);
  updateThemeIcon(theme);
})();

function toggleMenu(){ const m=document.getElementById('navMobile'); if(m) m.classList.toggle('open'); }
function closeMenu(){ const m=document.getElementById('navMobile'); if(m) m.classList.remove('open'); }

let fadeObserver;
function triggerFade(){
  if (fadeObserver) fadeObserver.disconnect();
  fadeObserver = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{ if(entry.isIntersecting){ entry.target.classList.add('in'); fadeObserver.unobserve(entry.target); } });
  }, {threshold:0.05, rootMargin:'0px 0px -40px 0px'});
  document.querySelectorAll('.fade:not(.in)').forEach(el=>fadeObserver.observe(el));
}

function animateCounters(){
  document.querySelectorAll('[data-count]').forEach(el=>{
    const target = parseInt(el.getAttribute('data-count'),10);
    if (isNaN(target)) return;
    const start = performance.now();
    const dur = 1400;
    function tick(now){
      const t = Math.min((now-start)/dur, 1);
      const ease = 1 - Math.pow(1-t, 3);
      el.textContent = Math.round(target*ease);
      if (t<1) requestAnimationFrame(tick); else el.textContent = target;
    }
    requestAnimationFrame(tick);
  });
}

function attachNewsletter(){
  const form = document.getElementById('newsletterForm');
  if (!form) return;
  form.addEventListener('submit', (e)=>{
    e.preventDefault();
    const input = form.querySelector('input');
    if (input && input.value) { alert('Teşekkürler! '+input.value+' adresi kaydedildi.'); input.value=''; }
  });
}

window.addEventListener('scroll', ()=>{
  const h = document.documentElement;
  const total = h.scrollHeight - h.clientHeight;
  const pct = total > 0 ? (h.scrollTop/total)*100 : 0;
  const bar = document.getElementById('progress');
  if (bar) bar.style.width = pct+'%';
  const bt = document.getElementById('backTop');
  if (bt) bt.classList.toggle('show', h.scrollTop > 500);
}, {passive:true});

render();
</script>
</body>
</html>
