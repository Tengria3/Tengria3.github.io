<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Erkeklik Sanatı — Zamansız Erdemler, Modern Bir Rehber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}

:root{
  --bg:#faf8f3;--bg-2:#f2ede3;--surface:#fff;--surface-2:#f7f3ec;
  --text:#171412;--text-2:#3d3833;--muted:#78716c;--border:#e7e0d3;--border-2:#d9d0bf;
  --accent:#c2410c;--accent-2:#9a3412;--gold:#b45309;
  --shadow:0 4px 16px -4px rgba(23,20,18,.08);--shadow-lg:0 24px 48px -16px rgba(23,20,18,.18);
  --radius:14px;--radius-lg:22px;--maxw:1240px;--narrow:720px;
  --ease:cubic-bezier(.22,1,.36,1);
}
[data-theme="dark"]{
  --bg:#0b0a09;--bg-2:#141210;--surface:#171412;--surface-2:#1f1b17;
  --text:#f5f0e8;--text-2:#d6cec2;--muted:#a29a8e;--border:#2a2520;--border-2:#3b342c;
  --accent:#fb923c;--accent-2:#fdba74;--gold:#fbbf24;
}

html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .3s,color .3s}
h1,h2,h3,h4{font-family:'Fraunces',Georgia,serif;font-weight:600;letter-spacing:-.02em;line-height:1.12;color:var(--text)}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit;text-align:left}

.container{max-width:var(--maxw);margin:0 auto;padding:0 24px;position:relative;z-index:2}
.narrow{max-width:var(--narrow);margin:0 auto}
.mono{font-family:'JetBrains Mono',monospace;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:500}

.progress{position:fixed;top:0;left:0;height:3px;width:0%;background:linear-gradient(90deg,var(--accent),var(--gold));z-index:200;transition:width .1s linear}

/* HEADER */
.site-header{position:sticky;top:0;z-index:100;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(160%) blur(18px);-webkit-backdrop-filter:saturate(160%) blur(18px);border-bottom:1px solid var(--border)}
.site-header .container{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;gap:24px}
.logo{display:flex;align-items:center;gap:9px;font-family:'Fraunces',serif;font-weight:700;font-size:1.4rem;letter-spacing:-.03em;color:var(--text);padding:0}
.logo .mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--gold));display:grid;place-items:center;color:#fff;font-size:1rem;font-weight:900;font-family:'Fraunces',serif;box-shadow:0 4px 12px -2px color-mix(in srgb,var(--accent) 40%,transparent);flex-shrink:0}
.logo em{font-style:normal;color:var(--accent)}

.nav{display:flex;align-items:center;gap:2px}
.nav button{padding:8px 14px;border-radius:8px;font-size:.9rem;font-weight:500;color:var(--text-2);transition:all .2s var(--ease);text-align:center}
.nav button:hover{color:var(--accent);background:var(--surface-2)}

.header-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--text-2);border:1px solid var(--border);background:var(--surface);transition:all .2s var(--ease);padding:0}
.icon-btn:hover{color:var(--accent);border-color:var(--accent)}
.icon-btn svg{width:17px;height:17px}
.menu-btn{display:none}

.nav-mobile{display:none;flex-direction:column;background:var(--surface);border-bottom:1px solid var(--border);padding:8px 24px 20px}
.nav-mobile.open{display:flex}
.nav-mobile button{padding:14px 0;border-bottom:1px solid var(--border);font-weight:500;color:var(--text-2);text-align:left;width:100%}
.nav-mobile button:last-child{border-bottom:none}

/* HERO */
.hero{position:relative;padding:90px 0 100px;overflow:hidden;background:radial-gradient(circle at 20% 0%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 55%),radial-gradient(circle at 85% 30%,color-mix(in srgb,var(--gold) 14%,transparent),transparent 50%),var(--bg)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(var(--border) 1px,transparent 1px) 0 0/100% 80px,linear-gradient(90deg,var(--border) 1px,transparent 1px) 0 0/80px 100%;mask-image:radial-gradient(circle at center,black 10%,transparent 75%);-webkit-mask-image:radial-gradient(circle at center,black 10%,transparent 75%);opacity:.5;pointer-events:none}
.hero-inner{position:relative;z-index:2;display:grid;grid-template-columns:1.25fr .85fr;gap:60px;align-items:center}
.hero-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:100px;font-size:.78rem;font-weight:500;background:var(--surface);border:1px solid var(--border);color:var(--text-2);margin-bottom:24px;box-shadow:var(--shadow)}
.hero-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}
.hero h1{font-size:clamp(2.4rem,5.2vw,4.4rem);font-weight:500;letter-spacing:-.035em;line-height:1.02;margin-bottom:24px}
.hero h1 em{font-style:italic;font-weight:400;background:linear-gradient(120deg,var(--accent),var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p.lead{font-size:1.15rem;color:var(--text-2);max-width:560px;margin-bottom:34px;line-height:1.6}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:44px}

.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border-radius:12px;font-size:.95rem;font-weight:600;background:var(--text);color:var(--bg);border:1px solid var(--text);transition:all .25s var(--ease);text-align:center}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.btn svg{width:15px;height:15px;flex-shrink:0}
.btn-accent{background:linear-gradient(135deg,var(--accent),var(--gold));color:#fff;border-color:transparent;box-shadow:0 8px 24px -8px color-mix(in srgb,var(--accent) 60%,transparent)}
.btn-accent:hover{box-shadow:0 14px 32px -8px color-mix(in srgb,var(--accent) 70%,transparent)}
.btn-ghost{background:transparent;color:var(--text);border-color:var(--border-2)}
.btn-ghost:hover{background:var(--surface);border-color:var(--accent);color:var(--accent)}

.hero-stats{display:flex;gap:40px;flex-wrap:wrap}
.stat .num{font-family:'Fraunces',serif;font-size:1.9rem;font-weight:600;letter-spacing:-.03em;line-height:1;color:var(--text)}
.stat .lbl{font-size:.78rem;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.1em;font-weight:500}

.hero-visual{position:relative;height:480px;display:flex;justify-content:center;align-items:center}
.float-card{position:absolute;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-lg);width:260px;transition:transform .6s var(--ease)}
.float-card .tag{font-size:.7rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;font-family:'JetBrains Mono',monospace}
.float-card .title{font-family:'Fraunces',serif;font-size:1.1rem;font-weight:600;line-height:1.3;letter-spacing:-.02em;margin-bottom:8px;color:var(--text)}
.float-card .meta{font-size:.78rem;color:var(--muted)}
.fc-1{top:20px;left:0;transform:rotate(-6deg);animation:float1 6s ease-in-out infinite}
.fc-2{bottom:40px;right:0;transform:rotate(5deg);animation:float2 7s ease-in-out infinite}
.fc-3{top:50%;left:50%;transform:translate(-50%,-50%) rotate(-2deg);z-index:3;width:290px;animation:float3 8s ease-in-out infinite}
@keyframes float1{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(-6deg) translateY(-12px)}}
@keyframes float2{0%,100%{transform:rotate(5deg) translateY(0)}50%{transform:rotate(5deg) translateY(-14px)}}
@keyframes float3{0%,100%{transform:translate(-50%,-50%) rotate(-2deg)}50%{transform:translate(-50%,calc(-50% - 10px)) rotate(-2deg)}}

/* SECTIONS */
section{padding:80px 0;position:relative}
.section-head{margin-bottom:44px;display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap}
.section-head .kicker{font-family:'JetBrains Mono',monospace;font-size:.72rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:12px;display:block}
.section-head h2{font-size:clamp(1.8rem,3.2vw,2.6rem);letter-spacing:-.03em;font-weight:500;max-width:640px}
.section-head p{color:var(--muted);margin-top:12px;max-width:520px;font-size:1rem}
.link-arrow{font-size:.88rem;font-weight:600;color:var(--accent);display:inline-flex;align-items:center;gap:6px;padding:6px 0}
.link-arrow:hover{gap:10px;transition:gap .2s}

/* BENTO */
.bento{display:grid;grid-template-columns:1.5fr 1fr 1fr;grid-template-rows:auto auto;gap:20px}
.bento-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;position:relative;overflow:hidden;transition:all .35s var(--ease);display:flex;flex-direction:column;text-align:left;width:100%}
.bento-item:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.bento-hero{grid-column:span 2;grid-row:span 2;min-height:420px;justify-content:flex-end;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 8%,var(--surface)),var(--surface))}
.bento-hero h3{font-size:clamp(1.6rem,2.6vw,2.2rem);letter-spacing:-.03em;font-weight:500;line-height:1.15;margin-bottom:14px}
.bento-item h3{font-size:1.18rem;font-weight:600;letter-spacing:-.02em;line-height:1.3;margin-bottom:10px}
.bento-item p{color:var(--muted);font-size:.92rem;line-height:1.6;flex:1}
.bento-item .tag{font-family:'JetBrains Mono',monospace;font-size:.68rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:14px;display:inline-block}
.bento-item .meta{font-size:.78rem;color:var(--muted);margin-top:16px;display:flex;align-items:center;gap:10px}
.bento-item .meta .dot{width:3px;height:3px;border-radius:50%;background:var(--muted)}

/* CATEGORIES */
.cats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.cat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px 20px;transition:all .3s var(--ease);position:relative;overflow:hidden;width:100%;text-align:left}
.cat-card:hover{border-color:var(--accent);transform:translateY(-3px)}
.cat-card .icon{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);color:var(--accent);margin-bottom:16px;transition:all .3s var(--ease)}
.cat-card:hover .icon{background:var(--accent);color:#fff;transform:rotate(-6deg) scale(1.05)}
.cat-card .icon svg{width:20px;height:20px}
.cat-card h3{font-size:1.02rem;font-weight:600;margin-bottom:4px}
.cat-card .count{font-size:.78rem;color:var(--muted);font-family:'JetBrains Mono',monospace}

/* FILTERS */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:32px}
.chip{padding:8px 16px;border-radius:100px;font-size:.84rem;font-weight:500;border:1px solid var(--border);background:var(--surface);color:var(--text-2);transition:all .2s var(--ease)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.active{background:var(--text);color:var(--bg);border-color:var(--text)}

/* ARTICLE GRID */
.articles-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
.art-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column;transition:all .35s var(--ease);width:100%;text-align:left}
.art-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg);border-color:var(--border-2)}
.art-visual{aspect-ratio:16/9;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--surface-2),var(--bg-2));display:grid;place-items:center}
.art-visual .mono-letter{font-family:'Fraunces',serif;font-size:5rem;font-weight:900;font-style:italic;color:color-mix(in srgb,var(--accent) 22%,transparent);line-height:1;transition:transform .5s var(--ease)}
.art-card:hover .art-visual .mono-letter{transform:scale(1.12) rotate(-3deg);color:color-mix(in srgb,var(--accent) 40%,transparent)}
.art-visual::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent 0 20px,color-mix(in srgb,var(--accent) 6%,transparent) 20px 21px);opacity:0;transition:opacity .35s}
.art-card:hover .art-visual::after{opacity:1}
.art-body{padding:22px;display:flex;flex-direction:column;flex:1}
.art-body .tag{font-family:'JetBrains Mono',monospace;font-size:.68rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.art-body h3{font-size:1.15rem;font-weight:600;line-height:1.3;letter-spacing:-.02em;margin-bottom:10px;transition:color .2s}
.art-card:hover .art-body h3{color:var(--accent)}
.art-body p{font-size:.9rem;color:var(--muted);line-height:1.6;flex:1;margin-bottom:16px}
.art-body .foot{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;color:var(--muted);padding-top:14px;border-top:1px solid var(--border)}
.art-body .foot .read{color:var(--accent);font-weight:600}

/* QUOTE */
.quote-band{background:var(--text);color:var(--bg);padding:90px 0;position:relative;overflow:hidden}
.quote-band::before{content:"";position:absolute;top:-40%;right:-10%;width:600px;height:600px;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 30%,transparent),transparent 65%);pointer-events:none}
.quote-band .container{position:relative;z-index:2;text-align:center;max-width:820px}
.quote-band blockquote{font-family:'Fraunces',serif;font-size:clamp(1.5rem,3.2vw,2.4rem);font-weight:400;font-style:italic;line-height:1.3;letter-spacing:-.02em;margin-bottom:28px}
.quote-band cite{font-style:normal;font-family:'JetBrains Mono',monospace;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:color-mix(in srgb,var(--bg) 65%,transparent)}

/* NEWSLETTER */
.newsletter{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:60px 40px;text-align:center;position:relative;overflow:hidden}
.newsletter::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--accent),var(--gold),var(--accent))}
.newsletter h2{font-size:clamp(1.7rem,3vw,2.3rem);letter-spacing:-.03em;font-weight:500;margin-bottom:12px}
.newsletter p{color:var(--muted);margin-bottom:28px;max-width:480px;margin-left:auto;margin-right:auto}
.newsletter form{display:flex;gap:10px;max-width:520px;margin:0 auto;flex-wrap:wrap}
.newsletter input{flex:1;min-width:220px;padding:14px 18px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.95rem;font-family:inherit;transition:border .2s}
.newsletter input:focus{outline:none;border-color:var(--accent)}
.newsletter small{display:block;color:var(--muted);font-size:.78rem;margin-top:14px}

/* READER */
.reader{padding:70px 0}
.reader .back{display:inline-flex;align-items:center;gap:8px;font-size:.88rem;font-weight:600;color:var(--accent);margin-bottom:40px;padding:6px 0}
.reader .back:hover{gap:12px;transition:gap .2s}
.reader .kicker{font-family:'JetBrains Mono',monospace;font-size:.72rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:18px;display:block}
.reader h1{font-size:clamp(2rem,4vw,3.2rem);font-weight:500;letter-spacing:-.03em;line-height:1.05;margin-bottom:22px}
.reader .meta{display:flex;align-items:center;gap:14px;padding-bottom:28px;margin-bottom:44px;border-bottom:1px solid var(--border);font-size:.86rem;color:var(--muted);flex-wrap:wrap}
.reader .meta .dot{width:4px;height:4px;border-radius:50%;background:var(--muted)}
.reader .content .lead{font-family:'Fraunces',serif;font-size:1.35rem;line-height:1.5;color:var(--text-2);font-style:italic;margin-bottom:36px;font-weight:400}
.reader .content p{margin-bottom:22px;font-size:1.08rem;line-height:1.75;color:var(--text-2)}
.reader .content h2{font-size:1.6rem;font-weight:600;letter-spacing:-.02em;margin:48px 0 18px;color:var(--text);position:relative;padding-left:18px}
.reader .content h2::before{content:"";position:absolute;left:0;top:.35em;bottom:.35em;width:3px;background:linear-gradient(180deg,var(--accent),var(--gold));border-radius:2px}
.reader .content ul,.reader .content ol{margin:0 0 24px 22px}
.reader .content li{margin-bottom:12px;font-size:1.05rem;line-height:1.7;color:var(--text-2)}
.reader .content li strong{color:var(--text);font-weight:600}
.reader .content blockquote{border-left:3px solid var(--accent);background:var(--surface-2);padding:22px 26px;margin:32px 0;border-radius:0 var(--radius) var(--radius) 0;font-family:'Fraunces',serif;font-style:italic;font-size:1.18rem;line-height:1.5;color:var(--text);letter-spacing:-.01em}
.reader .content strong{color:var(--text);font-weight:600}
.reader .tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:48px;padding-top:28px;border-top:1px solid var(--border)}
.reader .tags span{font-size:.78rem;padding:6px 14px;background:var(--surface-2);border-radius:100px;color:var(--text-2);font-weight:500}

/* ABOUT */
.about-hero{padding:80px 0 40px;text-align:center}
.about-hero h1{font-size:clamp(2rem,4vw,3.2rem);letter-spacing:-.03em;font-weight:500;margin-bottom:20px}
.about-hero p{font-size:1.15rem;color:var(--text-2);max-width:640px;margin:0 auto}
.about-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;margin:60px 0}
.about-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:30px}
.about-card .num{font-family:'Fraunces',serif;font-size:1.4rem;font-weight:600;color:var(--accent);margin-bottom:14px;letter-spacing:-.02em}
.about-card h3{font-size:1.15rem;font-weight:600;margin-bottom:10px}
.about-card p{color:var(--muted);font-size:.94rem;line-height:1.65}

/* FOOTER */
.site-footer{background:var(--surface);border-top:1px solid var(--border);padding:70px 0 30px;margin-top:40px}
.footer-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:48px;margin-bottom:50px}
.footer-brand .logo{margin-bottom:18px}
.footer-brand p{color:var(--muted);font-size:.92rem;max-width:320px;line-height:1.7}
.footer-col h4{font-family:'Inter',sans-serif;font-size:.76rem;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--text);margin-bottom:18px}
.footer-col button{display:block;color:var(--muted);font-size:.9rem;padding:6px 0;transition:color .2s;width:100%}
.footer-col button:hover{color:var(--accent)}
.footer-bottom{padding-top:30px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:.84rem;color:var(--muted);flex-wrap:wrap;gap:16px}

/* FADE */
.fade{opacity:0;transform:translateY(24px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.fade.in{opacity:1;transform:translateY(0)}

/* BACK TO TOP */
.back-top{position:fixed;bottom:28px;right:28px;width:46px;height:46px;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center;box-shadow:var(--shadow-lg);z-index:90;opacity:0;pointer-events:none;transition:all .3s var(--ease);padding:0}
.back-top.show{opacity:1;pointer-events:auto}
.back-top:hover{background:var(--accent);transform:translateY(-3px)}
.back-top svg{width:16px;height:16px}

/* RESPONSIVE */
@media (max-width:1020px){
  .hero-inner{grid-template-columns:1fr;gap:40px}
  .hero-visual{height:380px;max-width:520px;margin:0 auto}
  .bento{grid-template-columns:1fr 1fr}
  .bento-hero{grid-column:span 2;grid-row:auto}
  .footer-grid{grid-template-columns:1fr 1fr;gap:36px}
}
@media (max-width:700px){
  section{padding:60px 0}
  .hero{padding:50px 0 60px}
  .nav{display:none}
  .menu-btn{display:grid}
  .hero-stats{gap:24px}
  .stat .num{font-size:1.5rem}
  .hero-visual{height:340px}
  .float-card{width:220px;padding:16px}
  .fc-3{width:240px}
  .bento{grid-template-columns:1fr}
  .bento-hero{grid-column:auto;min-height:320px}
  .footer-grid{grid-template-columns:1fr;gap:32px}
  .newsletter{padding:40px 24px}
  .reader{padding:40px 0}

{ id:1, cat:'İlişkiler', date:'12 Ekim 2026', read:'9 dk', tags:['Arkadaşlık','Modern Hayat','Bağ Kurma'],
  title:'Erkekler Neden 30’undan Sonra Yalnızlaşır?',
  excerpt:'Telefonunda yüzlerce kişi var ama arayacak kimsen yok. Bu bir zayıflık değil, yapısal bir sorun — ve çözülebilir.',
  lead:'Birçok erkek, otuzuna geldiğinde telefonunda yüzlerce kişi varken gerçek bir dostu olmadığını fark eder. Bu, kişisel bir başarısızlık değildir. Yapısal bir sorundur — ve çözülebilir.',
  body:`<p>Yirmili yaşlarının sonuna doğru birçok erkek, tuhaf bir boşlukla karşılaşır. Üniversiteden, işten ya da mahalleden tanıdığı insanlar telefonunda kayıtlıdır. Ama cuma akşamı arayacak kimse yoktur.</p><h2>Erkek arkadaşlığı neden farklı kurulur?</h2><p>Kadınlar çoğunlukla yüz yüze konuşarak bağ kurar. Erkeklerse yan yana bir şey <em>yaparak</em>. Bu, klişe değil; sosyal psikolojinin on yıllardır tekrarladığı bir gözlemdir.</p><p>Bu yüzden erkek dostlukları çoğu zaman bir <strong>aktiviteye bağlıdır</strong>. Okul bitince, iş değişince, takım dağılınca dostluk sessizce solar.</p><blockquote>Dostluk, tesadüfen değil, tekrar tekrar tercih edilerek büyür.</blockquote><h2>Ne yapılabilir?</h2><ol><li><strong>Haftalık bir ritüel kurun.</strong> Aynı gün, aynı saat. Kahve, yürüyüş, halı saha.</li><li><strong>Derin sorular sorun.</strong> “Nasılsın?” yerine “Bu aralar seni en çok ne zorluyor?”</li><li><strong>Eski bir arkadaşı arayın.</strong> Yıllar sonra bile bir mesaj kapıyı aralar.</li><li><strong>Bir kulübe katılın.</strong> Satranç, koşu, marangozluk, kitap.</li><li><strong>Yardım isteyin.</strong> Zayıflığını göstermek güveni inşa eder.</li><li><strong>Sırlarınızı paylaşın.</strong> Yüzeysellik yakınlığı öldürür.</li><li><strong>Kendiniz olun.</strong> Rol yaparak kurulan dostluk kısa ömürlüdür.</li></ol><h2>Sonuç</h2><p>Yalnızlık bir kader değil, bir alışkanlıktır. Bugün tek bir mesajla başla. Üç ay sonra, o sessiz boşluğun yerini dolduran birkaç isim göreceksin.</p>` },

{ id:2, cat:'Karakter', date:'10 Ekim 2026', read:'7 dk', tags:['Alışkanlık','Disiplin','Sabah'],
  title:'Bir Erkeğin Sabah Rutini: Güne Sağlam Başlamanın 5 İlkesi',
  excerpt:'Sabah nasıl başlarsa gün öyle gider. İrade değil, sistem kur — ve gün ilk dakikadan senin olsun.',
  lead:'Sabah nasıl başlarsa, gün öyle gider. Ama iyi bir sabah irade gerektirmez — sistem gerektirir. İrade her gün tükenir; sistem kendini taşır.',
  body:`<p>Birçok erkek güne yenik başlar. Alarm çalar, telefon uzanır, ekran aydınlanır. Beş dakika diye başlayan kaydırma, yarım saat olur.</p><h2>1. Telefonu 30 dakika ertele</h2><p>Uyandığın ilk yarım saat, zihnin en savunmasız olduğu zamandır. Bu saatte ekrana bakmak, beynini başkalarının gündemine teslim etmektir.</p><h2>2. Su iç, hafif hareket et</h2><p>Gece boyunca beden susuz kalır. Bir bardak su ve beş dakika esneme, kanı harekete geçirir.</p><blockquote>Beden hareket etmeden, zihin de yerinden kalkmaz.</blockquote><h2>3. Günün üç hedefini yaz</h2><p>Kafandaki otuz şeyi kağıda dökmek zihni boşaltır. Ama üçten fazla yazmak, hedefleri değil dilekleri listeler.</p><h2>4. On dakika oku</h2><p>Ekran değil, kağıt. On dakika, ayda bir kitap demektir. Yılda on iki.</p><h2>5. Sessizlik, dua ya da nefes</h2><p>Dört saniye al, altı saniye ver. Beş tur. Bu kadar. Ama her gün.</p><h2>Sonuç</h2><p>Bu beş adımın hepsini her gün yapamayacaksın. Sorun değil. Önemli olan, bir gün kaçırdığında iki gün kaçırmamak.</p>` },

{ id:3, cat:'Beceri', date:'8 Ekim 2026', read:'6 dk', tags:['İletişim','Beden Dili','Karizma'],
  title:'İlk İzlenim Sanatı: İlk 30 Saniyede Güven Vermek',
  excerpt:'İnsanlar seni tanımak için yıllar harcamaz. İlk yarım dakikada bir izlenim oluşur ve kolay değişmez.',
  lead:'İnsanlar sizi tanımak için yıllar harcamaz. İlk 30 saniyede bir izlenim oluşur ve o izlenim kolay kolay değişmez. İyi haber: bu 30 saniye kontrol edilebilir.',
  body:`<p>Bir toplantıya girdiğinde, karşı tarafın zihninde üç şey hızla belirir: <em>Bu kişi tehdit mi? Güvenilir mi? İlgi çekici mi?</em> Bu üç soru saniyeler içinde cevaplanır.</p><h2>Beden dili</h2><ul><li><strong>Omuzlar geri, çene düz.</strong></li><li><strong>Göz teması.</strong> Kaçırmadan, dikmeden.</li><li><strong>El sıkışma.</strong> Sıkı ama kırıcı değil, iki saniye.</li><li><strong>Eller görünür olsun.</strong> Cepte saklanan eller güvensizlik verir.</li><li><strong>Yavaş hareket et.</strong> Aceleci beden kaygılı zihin demektir.</li></ul><blockquote>Karizma doğuştan değil, alışkanlıktır.</blockquote><h2>Konuşma</h2><p>İyi bir dinleyici, iyi bir konuşmacıdan daha etkileyicidir. Konuşurken yavaş, net ve kısa konuş.</p><h2>Giyim</h2><p>Ortama göre giyin. Ne fazla resmi, ne özensiz. Ama her şeyden önce <strong>temiz</strong>. Ütülü bir gömlek, pahalı bir takımdan çok konuşur.</p><h2>Sonuç</h2><p>Karşı taraf seni değil, senin ona verdiği hissi hatırlar. Bu his iyi olsun; gerisi kendiliğinden gelir.</p>` },

{ id:4, cat:'Aile', date:'6 Ekim 2026', read:'8 dk', tags:['Babalar','Çocuk','Aile'],
  title:'Baba Olmak: Her Gün 10 Dakikada Derin Bağ Kurmak',
  excerpt:'Çocuğun geçirdiği saatleri hatırlamaz; o saatlerde nasıl hissettiğini hatırlar.',
  lead:'Çocuğunuz sizinle geçirdiği saatleri hatırlamaz — o saatlerde nasıl hissettiğini hatırlar. Bu yüzden miktar değil, nitelik belirleyicidir.',
  body:`<p>Modern babalık, tarihin en zor ve en ödüllendirici rollerinden biridir. İyi haber şu: çocuk, babanın ne kadar zaman geçirdiğini değil, o zamanın nasıl geçtiğini hatırlar.</p><h2>10 Dakika Kuralı</h2><p>Her gün, telefonu bırakıp çocuğunuza tam on dakika ayırın. Sadece ona. Ne öğretmek için, ne disipline etmek için — <em>onunla olmak</em> için.</p><ul><li>Yanına oturun, göz hizasına inin.</li><li>Onun başlattığı konuşmayı takip edin.</li><li>“Sonra anlatırsın” demeyin. Şimdi dinleyin.</li><li>Fiziksel temas: omzuna dokunmak, saçını okşamak.</li></ul><blockquote>Bir babanın en büyük mirası, çocuğuna ayırdığı zamandır.</blockquote><h2>Dinleyin, öğretmeyin</h2><p>Bir çocuk anlatırken en çok yapılan hata, hemen çözüm sunmaktır. “Anlıyorum” demek, “şöyle yap” demekten daha güçlüdür.</p><h2>Sonuç</h2><p>Mükemmel bir baba olmaya çalışmayın. <strong>Sadece orada olan</strong> bir baba olun. Bugün orada olun. Yarın da.</p>` },

{ id:5, cat:'Beceri', date:'4 Ekim 2026', read:'10 dk', tags:['Pratik','Tamir','Bağımsızlık'],
  title:'Her Erkeğin Bilmesi Gereken 7 Temel Tamir Becerisi',
  excerpt:'Modern hayat erkeği beceriksizleştirdi. Oysa bir tornavida tutmak, özgüvenin en somut halidir.',
  lead:'Modern hayat, erkeği beceriksizleştirdi. Oysa bir tornavida tutmak, özgüvenin en somut halidir. Kendi işini yapan adam, kimseye mecbur olmayan adamdır.',
  body:`<p>Yüz yıl önce her erkek, evindeki basit tamirleri kendisi yapardı. Yüz yıl sonra, bir ampul değiştirmek için bile “usta” çağırıyoruz.</p><h2>1. Lastik değiştirmek</h2><p>Bagajda stepne, kriko ve bijon anahtarı bulundurun. Bir pazar öğleden sonrasını öğrenmeye ayırın.</p><h2>2. Sigorta kutusunu tanımak</h2><p>Hangi şalter hangi odayı kontrol ediyor, not alın. Üzerlerine bant ve kalemle yazın.</p><h2>3. Musluk contası değiştirmek</h2><p>Damlayan musluk, ayda onlarca litre suyu boşa akıtır. Contanın kendisi kuruş, tamirci çağrı ücreti kat kat pahalı.</p><blockquote>Kendi işini yapan adam, kimseye mecbur olmayan adamdır.</blockquote><h2>4. Duvar delmek</h2><p>Doğru matkap ucu, doğru dübel, doğru vida. Delmeden önce duvarın içinde ne olduğunu tahmin edin.</p><h2>5. Araç bakımı</h2><p>Ayda bir yağ, su, akü, lastik basıncı. Beş dakika. Ama binlerce lira tasarruf.</p><h2>6. Basit marangozluk</h2><p>Bir testere, bir matkap, bir zımpara. İlk projeyi basit tutun.</p><h2>7. İlk yardım</h2><p>Kanamayı durdurmak, yanığı soğutmak, Heimlich manevrası. Kızılay’ın ücretsiz eğitimleri var.</p><h2>Sonuç</h2><p>Bu beceriler bir erkeğe iç huzur verir: <em>Kendi başımın çaresine bakabilirim.</em> Bu huzur paha biçilemez.</p>` },

{ id:6, cat:'Zihin', date:'2 Ekim 2026', read:'7 dk', tags:['Duygular','Özdenetim','Zihin'],
  title:'Öfke Yönetimi: Sakin Kalan Erkek Daha Güçlüdür',
  excerpt:'Öfke kötü değildir. Kontrolsüz öfke kötüdür. Aradaki fark, güç ile zayıflık arasındaki farktır.',
  lead:'Öfke kötü değildir. Kontrolsüz öfke kötüdür. Aradaki fark, güçle zayıflık arasındaki farktır. Öfkesini taşıyan erkek güçlüdür; öfkesine yenilen değil.',
  body:`<p>Birçok erkek, öfkeyi ya bastırır ya patlatır. İkisi de yanlıştır. Doğru yol üçüncüsüdür: <strong>öfkeyi tanımak, anlamak ve yönlendirmek.</strong></p><h2>90 saniye kuralı</h2><p>Bir duygu dalgası, kimyasal olarak ortalama 90 saniye sürer. 90 saniyeyi geçtiğinde öfke devam ediyorsa, o artık biyolojik değil, zihinseldir — kendi düşüncelerimizle besliyoruzdur.</p><blockquote>Öfkeye yenilen erkek değil, öfkeyi taşıyan erkek güçlüdür.</blockquote><h2>Beş yöntem</h2><ol><li><strong>Nefes:</strong> 4 saniye al, 6 saniye ver. 5 tur.</li><li><strong>Ortamı değiştir:</strong> Masadan kalk, yürü.</li><li><strong>Yaz, sonra sil:</strong> Sansürsüz yaz, oku ve sil.</li><li><strong>Ertele:</strong> “Buna 1 saat sonra karar vereceğim.”</li><li><strong>Fizyolojiyi gör:</strong> Çene, omuz, göğüs gerginliğini fark et.</li></ol><h2>Sonuç</h2><p>Sakin kalan erkek zayıf değildir. Tam tersi. Öfkeye kapılmak kolaydır; sakin kalmak irade ve farkındalık gerektirir.</p>` },

{ id:7, cat:'Stil', date:'30 Eylül 2026', read:'6 dk', tags:['Stil','Takım Elbise','Giyim'],
  title:'İlk Takım Elbise Rehberi',
  excerpt:'Takım elbise, erkeğin zırhıdır. Ama yanlış seçilirse zırh değil, yük olur.',
  lead:'Takım elbise, erkeğin zırhıdır. Doğru seçildiğinde özgüveni iki katına çıkarır. Yanlış seçildiğinde ise bir yük olur.',
  body:`<p>Bir erkeğin hayatında takım elbise giymesi gereken birkaç an vardır: bir mülakat, bir düğün, bir cenaze, önemli bir toplantı. Bu anlarda üzerindeki elbise, kendisiyle ilgili verdiği bir mesajdır.</p><h2>Beden: en kritik üç nokta</h2><ul><li><strong>Omuzlar.</strong> Elbise omuzdan oturmalı.</li><li><strong>Göğüs ve bel.</strong> Göğüs düz, bel vücudu takip etmeli.</li><li><strong>Kollar ve paçalar.</strong> Manşet bir santim görünmeli.</li></ul><blockquote>Elbise seni değil, sen elbiseyi taşırsın.</blockquote><h2>Renk</h2><ul><li><strong>Lacivert.</strong> En esnek renk.</li><li><strong>Antrasit.</strong> Ciddi, otoriter, resmi.</li><li><strong>Siyah.</strong> Özel geceler ve cenazeler için.</li></ul><h2>Kumaş</h2><p>Cevap net: <strong>yün.</strong> Nefes alır, dökümü güzeldir, yıllarca dayanır. Polyesterden kaçının.</p><h2>Küçük detaylar</h2><ul><li><strong>Gömlek:</strong> Beyaz ya da açık mavi, desensiz.</li><li><strong>Kravat:</strong> İpek.</li><li><strong>Ayakkabı:</strong> Oxford tipi en klasik.</li><li><strong>Kemer:</strong> Ayakkabıyla aynı renk.</li><li><strong>Çorap:</strong> Pantolonla aynı ton. Beyaz asla.</li></ul><h2>Sonuç</h2><p>İyi bir terzi, ucuz elbiseyi pahalı gösterebilir. Doğru beden ve iyi terzi varsa, elbisenin fiyatı ikinci plandadır.</p>` },

{ id:8, cat:'Kariyer', date:'28 Eylül 2026', read:'8 dk', tags:['Para','Kariyer','Finans'],
  title:'30’lu Yaşlarda Para Yönetimi: Sistem Kurmak',
  excerpt:'Gelir arttıkça harcama artıyorsa, sorun gelirde değil, sistemde.',
  lead:'Çoğu erkek 30’lu yaşlarında ilk defa “iyi para” kazanır ama bir türlü birikim yapamaz. Sebep basit: sistem yok.',

const state = {

   YARDIMCI
   ============================================================ */
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

  return `
    <div class="reader">
      <div class="container narrow">

        <span class="kicker">— ${esc(a.cat)}</span>
        <h1>${esc(a.title)}</h1>
        <div class="meta">
          <span>${esc(a.date)}</span><span class="dot"></span>

  `;
}

/* ============================================================
   RENDER (tek giriş noktası)
   ============================================================ */
function render(){
  const app = document.getElementById('app');
  if (!app) return;

  let html = '';
  if (state.view === 'article') html = renderArticle();
  else if (state.view === 'about') html = renderAbout();
  else html = renderHome();

  app.innerHTML = html;
  window.scrollTo({top:0, behavior:'auto'});
  triggerFade();
  animateCounters();
  attachNewsletter();
}

/* ============================================================
   EVENT DELEGATION — TÜM TIKLAMALAR
   ============================================================ */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  e.preventDefault();
  e.stopPropagation();

  const action = el.getAttribute('data-action');

  if (action === 'home'){
    state.view = 'home';
    state.filter = '';
    closeMenu();
    render();
  }
  else if (action === 'about'){
    state.view = 'about';
    closeMenu();
    render();
  }
  else if (action === 'article'){
    const id = parseInt(el.getAttribute('data-id'), 10);
    if (!isNaN(id)){
      state.view = 'article';
      state.articleId = id;
      closeMenu();
      render();
    }
  }
  else if (action === 'cat'){
    const cat = el.getAttribute('data-cat') || '';
    state.view = 'home';
    state.filter = cat;
    closeMenu();
    render();
    setTimeout(() => {
      const grid = document.querySelector('.articles-grid');
      if (grid) {
        const y = grid.getBoundingClientRect().top + window.scrollY - 100;
        window.scrollTo({top: y, behavior:'smooth'});
      }
    }, 80);
  }
  else if (action === 'scroll'){
    const target = document.getElementById(el.getAttribute('data-target'));
    if (target) target.scrollIntoView({behavior:'smooth', block:'start'});
  }
  else if (action === 'theme'){
    toggleTheme();
  }
  else if (action === 'menu'){
    toggleMenu();
  }
  else if (action === 'top'){
    window.scrollTo({top:0, behavior:'smooth'});
  }
  else if (action === 'contact'){
    alert('İletişim: merhaba@erkekliksanati.example');
  }
  else if (action === 'privacy'){
    alert('Bu site özgün bir yayındır. Art of Manliness ile bağlantısı yoktur.');
  }
});

/* ============================================================
   TEMA
   ============================================================ */
function updateThemeIcon(theme){
  const icon = document.getElementById('themeIcon');
  if (!icon) return;
  icon.innerHTML = theme === 'dark'
    ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>'
    : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
}
function toggleTheme(){
  const html = document.documentElement;
  const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e){}
  updateThemeIcon(next);
}
(function initTheme(){
  let theme = 'light';
  try {
    const saved = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    theme = saved || (prefersDark ? 'dark' : 'light');
  } catch(e){}
  document.documentElement.setAttribute('data-theme', theme);
  updateThemeIcon(theme);
})();

/* ============================================================
   MENÜ
   ============================================================ */
function toggleMenu(){
  const m = document.getElementById('navMobile');
  if (m) m.classList.toggle('open');
}
function closeMenu(){
  const m = document.getElementById('navMobile');
  if (m) m.classList.remove('open');
}

/* ============================================================
   FADE IN
   ============================================================ */
let fadeObserver;
function triggerFade(){
  if (fadeObserver) fadeObserver.disconnect();
  fadeObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting){
        entry.target.classList.add('in');
        fadeObserver.unobserve(entry.target);
      }
    });
  }, {threshold:0.05, rootMargin:'0px 0px -40px 0px'});
  document.querySelectorAll('.fade:not(.in)').forEach(el => fadeObserver.observe(el));
}

/* ============================================================
   SAYAÇLAR
   ============================================================ */
function animateCounters(){
  const els = document.querySelectorAll('[data-count]');
  els.forEach(el => {
    const target = parseInt(el.getAttribute('data-count'), 10);
    if (isNaN(target)) return;
    const start = performance.now();
    const dur = 1400;
    function tick(now){
      const t = Math.min((now - start) / dur, 1);
      const ease = 1 - Math.pow(1 - t, 3);
      el.textContent = Math.round(target * ease);
      if (t < 1) requestAnimationFrame(tick);
      else el.textContent = target;
    }
    requestAnimationFrame(tick);
  });
}

/* ============================================================
   NEWSLETTER
   ============================================================ */
function attachNewsletter(){
  const form = document.getElementById('newsletterForm');
  if (!form) return;
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const input = form.querySelector('input');
    if (input && input.value) {
      alert('Teşekkürler! ' + input.value + ' adresi kaydedildi.');
      input.value = '';
    }
  });
}

/* ============================================================
   SCROLL PROGRESS + BACK TO TOP
   ============================================================ */
window.addEventListener('scroll', () => {
  const h = document.documentElement;
  const total = h.scrollHeight - h.clientHeight;
  const pct = total > 0 ? (h.scrollTop / total) * 100 : 0;
  const bar = document.getElementById('progress');
  if (bar) bar.style.width = pct + '%';
  const bt = document.getElementById('backTop');
  if (bt) bt.classList.toggle('show', h.scrollTop > 500);
}, {passive:true});

/* ============================================================
   BAŞLAT
   ============================================================ */
render();
</script>
