{id:69,cat:'İlişkiler',date:'20 Temmuz 2026',read:'8 dk',tags:['Evlilik','İlişki','Aşk'],title:'Uzun İlişkiler: Aşkı Canlı Tutmanın Sessiz Sanatı',excerpt:'Aşk, bir duygu değil, bir pratiktir.',lead:'Aşk, bir duygu değil, bir pratiktir. Ve her pratik gibi, her gün yapılırsa büyür, ihmal edilirse solar.',body:`<p>İlk yıl her şey kolaydır. Kalp hızlı atar, mesajlar uzun olur. Ama zamanla, o hızlı kalp yavaşlar. Bu, aşkın bittiği anlamına gelmez. Değiştiği anlamına gelir.</p><h2>Aşk bir pratiktir</h2><p>Uzun ilişkilerde aşk, bir <strong>karar</strong>dır. Her sabah o insanı tekrar seçmek.</p><blockquote>Aşk, bir anda olmaz. Her gün yeniden inşa edilir.</blockquote><h2>Küçük şeyler</h2><ul><li>Eve girdiğinde telefonu bırak, eşini selamla.</li><li>Çıkarken öp, sarıl.</li><li>İltifat et, her hafta.</li><li>Onun anlattığı bir şeyi hatırla, ertesi hafta sor.</li><li>Dokun: elini tut, saçını okşa.</li></ul><h2>Doğru kavga</h2><ol><li>Aynı takımda olduğunuzu hatırla.</li><li>Geçmişi deşme.</li><li>"Ben" dili kullan.</li><li>Dinle, cevap vermeden önce.</li><li>Özür dile, gerektiğinde.</li><li>Sarılarak bitir.</li></ol><h2>Sonuç</h2><p>Aşk, bir kıvılcım değil, bir ateştir. Ateşi canlı tutmak için her gün odun atmak gerekir.</p>`},
{id:70,cat:'İlişkiler',date:'18 Temmuz 2026',read:'7 dk',tags:['İletişim','İlişki','Dinleme'],title:'İlişkide İletişim: Konuşmak ve Dinlemek Sanatı',excerpt:'İlişkilerin çoğu, iletişim eksikliğinden biter.',lead:'İlişkilerin çoğu, iletişim eksikliğinden biter. Konuşmayı bilmek yeterli değildir; dinlemeyi de bilmek gerekir.',body:`<p>Bir ilişkide en büyük sorun, iletişim eksikliğidir. Ama bu, sadece konuşmamak değildir. Yanlış dinlemek de bir sorundur.</p><h2>Dinlemenin üç seviyesi</h2><p><strong>1. Pasif dinleme.</strong> Sadece duymak. Ama anlamamak.</p><p><strong>2. Aktif dinleme.</strong> Dikkat vermek, sorular sormak.</p><p><strong>3. Empatik dinleme.</strong> Karşı tarafın duygusunu anlamak.</p><blockquote>İnsanlar, anlaşılmak için dinlenmek ister, çözüm için değil.</blockquote><h2>İletişim tuzakları</h2><ul><li><strong>Suçlama.</strong> "Sen hep..." yerine "Ben hissediyorum..."</li><li><strong>Savunma.</strong> Cevap vermeden önce dinle.</li><li><strong>Genelleme.</strong> "Her zaman", "hiçbir zaman" — bunlar kavgayı büyütür.</li><li><strong>Konuyu değiştirme.</strong> Bir sorunu konuşurken, başka bir soruna atlama.</li></ul><h2>İyi iletişimin kuralları</h2><ol><li>Sakin bir zaman seç.</li><li>Göz teması kur.</li><li>Telefonu bırak.</li><li>"Ben" dili kullan.</li><li>Somut örnek ver.</li><li>Çözüm öner.</li><li>Teşekkür et.</li></ol><h2>Sonuç</h2><p>İyi iletişim, bir günde öğrenilmez. Ama her gün küçük adımlarla gelişir. Bugün eşini gerçekten dinle. Yarın bir tane daha.</p>`},
{id:71,cat:'İlişkiler',date:'16 Temmuz 2026',read:'7 dk',tags:['Güven','Kıskançlık','İlişki'],title:'Kıskançlık ve Güven: İlişkide Dengeyi Kurmak',excerpt:'Kıskançlık, sevginin göstergesi değildir. Güvensizliğin göstergesidir.',lead:'Kıskançlık, sevginin göstergesi değildir. Güvensizliğin göstergesidir. Ve güvensizlik, ilişkiyi yıkar.',body:`<p>Kıskançlık, modern ilişkilerde yaygın bir sorundur. Ve çoğu zaman, sevgiyle karıştırılır. "Seni kıskanıyorum çünkü seni seviyorum." Bu, yanlış bir denklemdir.</p><h2>Kıskançlık nedir?</h2><p>Kıskançlık, bir güvensizlik duygusudur. Kendini yetersiz görme, kaybetme korkusu, kontrol ihtiyacı. Kaynağı, karşı taraf değil, kendi içindedir.</p><blockquote>Kıskançlık, kaybetme korkusudur. Ama asıl kayıp, kıskançlıkla başlar.</blockquote><h2>Kıskançlık türleri</h2><p><strong>1. Sağlıklı kıskançlık.</strong> Hafif, geçici, sevgiyi hatırlatan.</p><p><strong>2. Toksik kıskançlık.</strong> Sürekli, kontrol edici, ilişkiyi yıkan.</p><h2>Güven nasıl kurulur?</h2><ol><li>Şeffaflık.</li><li>Tutarlılık.</li><li>Sözünü tutmak.</li><li>Yalan söylememek.</li><li>Kıskançlığı konuşmak.</li><li>Kendi güvensizliğini kabul etmek.</li></ol><h2>Sonuç</h2><p>Güven, bir günde kurulmaz. Ama bir günde yıkılır. Bugün eşine güven ver. Yarın bir tane daha.</p>`},
{id:72,cat:'İlişkiler',date:'14 Temmuz 2026',read:'8 dk',tags:['Ayrılık','Kayıp','İyileşme'],title:'Ayrılık: Kayıpla Baş Etmenin Yolları',excerpt:'Ayrılık, bir başarısızlık değildir. Bir kayıptır. Ve kayıp, yas tutmayı gerektirir.',lead:'Ayrılık, bir başarısızlık değildir. Bir kayıptır. Ve kayıp, yas tutmayı gerektirir. Ama erkekler, genellikle yas tutmayı bilmez.',body:`<p>Bir ilişki bittiğinde, bir kayıp yaşanır. Sadece bir insan değil, bir hayat, bir gelecek, bir kimlik kaybolur. Ve bu kayıp, yas tutmayı gerektirir.</p><h2>Yasın aşamaları</h2><ol><li><strong>İnkâr.</strong> "Bu gerçek olamaz."</li><li><strong>Öfke.</strong> "Bana nasıl bunu yapar?"</li><li><strong>Pazarlık.</strong> "Belki düzelir."</li><li><strong>Depresyon.</strong> "Hiçbir şey anlamlı değil."</li><li><strong>Kabullenme.</strong> "Tamam, bu bitti."</li></ol><p>Bu aşamalar sıralı değildir. Bazıları atlanır, bazıları tekrarlanır.</p><h2>Erkekler neden zorlanır?</h2><p>Erkekler, genellikle yas tutmayı bilmez. Ağlamak "zayıflık" olarak görülür. Konuşmak "gereksiz" sayılır. Ve duygular, bastırılır.</p><blockquote>Yas tutmamak, iyileşmemek demektir.</blockquote><h2>İyileşme yolları</h2><ul><li><strong>Ağla.</strong> Gözyaşı, bir şifadır.</li><li><strong>Konuş.</strong> Bir arkadaş, bir aile, bir terapist.</li><li><strong>Yaz.</strong> Duygularını kağıda dök.</li><li><strong>Hareket et.</strong> Spor, yürüyüş, doğa.</li><li><strong>Yeni bir şey öğren.</strong> Bir hobi, bir kurs, bir proje.</li><li><strong>Zaman ver.</strong> İyileşme, bir günde olmaz.</li></ul><h2>Ne yapmamalı?</h2><ul><li>Alkol, uyuşturucu.</li><li>Hızlı yeni bir ilişki.</li><li>Eski ilişkiyi sosyal medyadan takip etmek.</li><li>Karşı tarafı suçlamak.</li></ul><h2>Sonuç</h2><p>Ayrılık, acı verir. Ama bu acı, iyileşmenin parçasıdır. Bugün bir ağla. Yarın bir yürüyüş yap. Bir ay sonra, kendini daha iyi hissedeceksin.</p>`},
{id:73,cat:'İlişkiler',date:'12 Temmuz 2026',read:'7 dk',tags:['Arkadaşlık','Kadın-Erkek','Dostluk'],title:'Kadın-Erkek Dostluğu: Mümkün mü?',excerpt:'Kadın-erkek dostluğu mümkündür. Ama bazı kurallar gerektirir.',lead:'Kadın-erkek dostluğu mümkündür. Ama bazı kurallar gerektirir. Ve bazı zorlukları vardır. İşte bu dostluğun gerçekleri.',body:`<p>Kadın-erkek dostluğu, yüzyıllardır tartışılan bir konudur. Bazıları "mümkün değil" der. Bazıları "mümkün" der. Gerçek, ortada.</p><h2>Mümkün mü?</h2><p>Evet, mümkündür. Ama dikkat gerektirir. Kadın-erkek dostluğu, bazı riskleri barındırır: cinsel çekim, kıskançlık, beklentiler.</p><h2>Kurallar</h2><ol><li><strong>Net ol.</strong> Niyetinizi netleştirin. Romantik bir beklenti varsa, bunu açıkça konuşun.</li><li><strong>Sınır koy.</strong> Fiziksel ve duygusal sınırlar olsun.</li><li><strong>Eşleri dahil et.</strong> Bir partneriniz varsa, onu da dahil edin. Gizli buluşmalar, sorun yaratır.</li><li><strong>Kıyaslama yapma.</strong> "Eşim şöyle yapmaz, sen şöyle yapıyorsun" gibi cümleler, tehlikelidir.</li></ol><h2>Zorlukları</h2><ul><li>Cinsel çekim.</li><li>Kıskançlık (partner veya diğer arkadaşlar).</li><li>Dedikodu.</li><li>Beklentiler.</li></ul><blockquote>Dostluk, cinsiyetten bağımsızdır. Ama cinsiyet, dostluğu etkiler.</blockquote><h2>Sonuç</h2><p>Kadın-erkek dostluğu, mümkündür. Ama kolay değildir. Saygı, şeffaflık ve sınırlar gerektirir. Bugün bir kadın arkadaşınla konuş. Dürüst ol.</p>`},

/* ===== YENİ YAZILAR — AİLE (9) ===== */
{id:74,cat:'Aile',date:'10 Temmuz 2026',read:'8 dk',tags:['Babalar','Çocuk','Aile'],title:'Baba Olmak: Her Gün 10 Dakikada Derin Bağ Kurmak',excerpt:'Çocuğun geçirdiği saatleri hatırlamaz; o saatlerde nasıl hissettiğini hatırlar.',lead:'Çocuğunuz sizinle geçirdiği saatleri hatırlamaz — o saatlerde nasıl hissettiğini hatırlar. Bu yüzden miktar değil, nitelik belirleyicidir.',body:`<p>Modern babalık, tarihin en zor rollerinden biridir. İyi haber şu: <strong>çocuk, babanın ne kadar zaman geçirdiğini değil, o zamanın nasıl geçtiğini hatırlar.</strong></p><h2>10 Dakika Kuralı</h2><p>Her gün, telefonu bırakıp çocuğunuza tam on dakika ayırın. Sadece ona.</p><ul><li>Yanına oturun, göz hizasına inin.</li><li>Onun başlattığı konuşmayı takip edin.</li><li>"Sonra anlatırsın" demeyin.</li><li>Fiziksel temas: omzuna dokunmak, saçını okşamak.</li></ul><blockquote>Bir babanın en büyük mirası, çocuğuna ayırdığı zamandır.</blockquote><h2>Birlikte yapın</h2><p>Erkek çocuklar için: birlikte bir şey <em>yapmak</em>, birlikte konuşmaktan daha etkilidir. Bir oyuncak tamir etmek, bir kek pişirmek.</p><p>Kız çocuklar için: babalarından öğrendikleri şeyleri bir ömür boyu taşır.</p><h2>Dinleyin, öğretmeyin</h2><p>Bir çocuk anlatırken en çok yapılan hata, hemen çözüm sunmaktır. "Anlıyorum" demek, "şöyle yap" demekten daha güçlüdür.</p><h2>Sonuç</h2><p>Mükemmel bir baba olmaya çalışmayın. Sadece orada olan bir baba olun. Bugün orada olun. Yarın da.</p>`},
{id:75,cat:'Aile',date:'8 Temmuz 2026',read:'8 dk',tags:['Çocuk','Sınır','Disiplin'],title:'Çocuğa Sınır Koymak: Sevgi ve Disiplin Dengesi',excerpt:'Sınır koymayan ebeveyn, çocuğuna iyilik değil kötülük yapar.',lead:'Sınır koymayan ebeveyn, çocuğuna iyilik değil kötülük yapar. Sınır, sevginin bir biçimidir.',body:`<p>Modern ebeveynlik, iki uç arasında salınır: aşırı katı disiplin ve aşırı serbest bırakma. İkisi de yanlıştır. Doğru yol, sınırlı sevgi: hem sıcak, hem net.</p><h2>Sınır neden gereklidir?</h2><p>Çocuk, henüz dünyayı bilmez. Ne tehlikeli, ne değil; ne doğru, ne yanlış. Ebeveyn, bu haritayı çizer.</p><blockquote>Çocuğa sınır koymak, onu sevmemek değildir. Onu korumaktır.</blockquote><h2>Yaşa göre sınırlar</h2><p><strong>0–2 yaş.</strong> Fiziksel güvenlik sınırları.</p><p><strong>3–6 yaş.</strong> Sosyal sınırlar. Paylaş, sıra bekle.</p><p><strong>7–12 yaş.</strong> Sorumluluk sınırları.</p><p><strong>13–18 yaş.</strong> Özgürlük ve sorumluluk dengesi.</p><h2>Sınır koymanın ilkeleri</h2><ol><li>Net ol.</li><li>Tutarlı ol.</li><li>Sakin ol.</li><li>Sebebini açıkla.</li><li>Alternatif sun.</li><li>Doğal sonuçlar.</li><li>Fiziksel ceza yok.</li></ol><h2>Sonuç</h2><p>Sınır koymak, ebeveynliğin en zor ve en önemli işidir. Bugün bir sınır koy. Tutarlı ol.</p>`},
{id:76,cat:'Aile',date:'6 Temmuz 2026',read:'8 dk',tags:['Bütçe','Aile','Para'],title:'Aile Bütçesi: Birlikte Yönetmenin Yolları',excerpt:'Para, evlilikteki en yaygın çatışma sebebidir. Ama doğru sistemle, bu bir bağ kurma fırsatı olur.',lead:'Para, evlilikteki en yaygın çatışma sebebidir. Ama doğru sistemle, bu bir bağ kurma fırsatı olur.',body:`<p>Para konuşmak, çoğu çift için zordur. Oysa para, bir araçtır. Amaç, iyi bir hayat kurmaktır.</p><h2>Neden birlikte yönetilmeli?</h2><p>Tek başına bütçe yöneten eş, yorulur. Diğeri, kararların dışında kalır. Küskünlük birikir.</p><h2>Ortak hesap mı, ayrı hesap mı?</h2><p>Üç model vardır: tamamen ortak, tamamen ayrı, karma. Karma genellikle en sağlıklısıdır.</p><h2>Bütçe kurmanın altı adımı</h2><ol><li>Gelirleri topla.</li><li>Giderleri listele.</li><li>Öncelikleri belirle.</li><li>Bütçe dağılımı yap (%50/30/20).</li><li>Uygulamayı seçin.</li><li>Aylık gözden geçirin.</li></ol><blockquote>Para, bir aileyi yıkabilir. Ama aynı para, bir aileyi inşa edebilir.</blockquote><h2>Sonuç</h2><p>Bugün eşinle otur, bir kahve iç, parayı konuş. Suçlamadan, yargılamadan.</p>`},
{id:77,cat:'Aile',date:'4 Temmuz 2026',read:'7 dk',tags:['Kardeş','Aile','İlişki'],title:'Kardeş İlişkileri: Yetişkinlikte Bağı Korumak',excerpt:'Kardeşlik, ilk arkadaşlıktır. Yetişkinlikte korunmazsa, kaybedilir.',lead:'Kardeşlik, hayatın ilk ilişkisidir. Ama yetişkinlikte çoğu zaman zayıflar. Oysa kardeşlik, korunması gereken bir hazinedir.',body:`<p>Kardeşlik, hayatın en uzun ilişkisidir. Anne-babanla 40–50 yıl, eşinle 40–60 yıl. Ama kardeşinle 60–80 yıl.</p><h2>Neden uzaklaşılır?</h2><p>Farklı hayatlar, ailevi gerilimler, kıskançlık, zaman.</p><h2>Kardeşliği korumak</h2><ol><li>Düzenli iletişim.</li><li>Yargısız ol.</li><li>Geçmişi kapat.</li><li>Yardım et, ama sınır koy.</li><li>Anne-baba konusunda adil ol.</li><li>Ortak anılar yarat.</li></ol><blockquote>Kardeş, senin en eski arkadaşındır.</blockquote><h2>Sonuç</h2><p>Bugün kardeşini ara. Sadece halini hatırını sor. Çünkü kardeşlik, hayatın en eski arkadaşlığıdır.</p>`},
{id:78,cat:'Aile',date:'2 Temmuz 2026',read:'8 dk',tags:['Yaşlılık','Anne-Baba','Aile'],title:'Anne-Baba Yaşlanırken: Sorumluluğu Taşımak',excerpt:'Anne-baban yaşlandığında, roller değişir. Sen artık ebeveyn olursun.',lead:'Anne-baban yaşlandığında, roller değişir. Sen artık ebeveyn olursun. Bu, zor ama kutsal bir sorumluluktur.',body:`<p>Bir gün gelir, anne-baban yaşlanır. Hastalanır, güçsüzleşir, desteğe ihtiyaç duyar. Ve roller değişir.</p><h2>Duygusal zorluklar</h2><ul><li>Kayıp korkusu.</li><li>Suçluluk (yeterince iyi bakamıyor muyum?).</li><li>Öfke (neden ben?).</li><li>Yorgunluk.</li></ul><h2>Pratik zorluklar</h2><ul><li>Bakım.</li><li>Finansal yük.</li><li>Kardeşler arası anlaşmazlık.</li><li>Kendi ailenle denge.</li></ul><blockquote>Anne-babana bakmak, bir borç değil, bir onurdur.</blockquote><h2>Nasıl yönetilir?</h2><ol><li>Kardeşlerle konuş.</li><li>Profesyonel destek al.</li><li>Kendine de zaman ayır.</li><li>Onların onurunu koru.</li><li>Sevgiyi ifade et.</li></ol><h2>Sonuç</h2><p>Anne-babana bakmak, zor ama değerlidir. Bugün onları ara. Yarın ziyaret et.</p>`},
{id:79,cat:'Aile',date:'30 Haziran 2026',read:'7 dk',tags:['Gelenek','Aile','Bağ'],title:'Aile Gelenekleri Yaratmak: Bağları Güçlendirmek',excerpt:'Gelenekler, bir aileyi bir arada tutan görünmez iplerdir.',lead:'Gelenekler, bir aileyi bir arada tutan görünmez iplerdir. Ve her aile, kendi geleneklerini yaratabilir.',body:`<p>Gelenek, sadece bayramlar değildir. Gelenekler, günlük, haftalık, yıllık tekrarlardır. Ve bu tekrarlar, aileyi bir arada tutar.</p><h2>Gelenek türleri</h2><p><strong>Günlük.</strong> Akşam yemeği birlikte. Yatmadan önce 10 dakika sohbet.</p><p><strong>Haftalık.</strong> Cuma akşamı filmi. Cumartesi kahvaltısı. Pazar yürüyüşü.</p><p><strong>Aylık.</strong> Bir doğum günü kutlaması. Bir doğa gezisi.</p><p><strong>Yıllık.</strong> Bir tatil. Bir bayram. Bir yıl dönümü.</p><h2>Gelenek nasıl yaratılır?</h2><ol><li>Basit başla.</li><li>Tutarlı ol.</li><li>Herkesi dahil et.</li><li>Esnek ol.</li><li>Anı biriktir.</li></ol><blockquote>Gelenek, bir ailenin hikâyesidir.</blockquote><h2>Sonuç</h2><p>Bugün bir gelenek başlat. Küçük bir şey. Ama tutarlı ol.</p>`},
{id:80,cat:'Aile',date:'28 Haziran 2026',read:'7 dk',tags:['Oyun','Çocuk','Aile'],title:'Çocuklarla Oyun: Bağ Kurmanın En Saf Yolu',excerpt:'Bir çocukla oynamak, onunla konuşmaktan daha etkilidir.',lead:'Bir çocukla oynamak, onunla konuşmaktan daha etkilidir. Oyun, çocuğun dilidir. Ve o dili konuşan baba, çocuğunun kalbine girer.',body:`<p>Modern baba, çocuğuyla "kaliteli zaman" geçirmek ister. Ama bu zaman, genellikle konuşmayla geçer. Oysa çocuk, oyunla bağ kurar.</p><h2>Oyunun faydaları</h2><ul><li><strong>Bağ kurma.</strong> Oyun, en saf bağ kurma yoludur.</li><li><strong>Gelişim.</strong> Fiziksel, zihinsel, sosyal.</li><li><strong>Duygusal ifade.</strong> Çocuk, oyunla duygularını ifade eder.</li><li><strong>Stres azaltma.</strong> Hem çocuk hem baba için.</li></ul><h2>Oyun türleri</h2><p><strong>Fiziksel.</strong> Güreş, kovalamaca, top oyunları.</p><p><strong>Yaratıcı.</strong> Legolar, boyama, hikâye anlatma.</p><p><strong>Rol yapma.</strong> Doktor, itfaiyeci, korsan.</p><p><strong>Masa oyunları.</strong> Satranç, kart oyunları.</p><h2>Oyun kuralları</h2><ol><li>Telefonu bırak.</li><li>Çocuğun yönlendirmesine izin ver.</li><li>Kazanmaya çalışma.</li><li>Gül, eğlen.</li><li>Fiziksel temas kur.</li></ol><blockquote>Bir çocukla oynamak, ona "seni seviyorum ve seninle vakit geçirmek istiyorum" demenin en güçlü yoludur.</blockquote><h2>Sonuç</h2><p>Bugün çocuğunla 10 dakika oyna. Yarın bir 10 dakika daha.</p>`},
{id:81,cat:'Aile',date:'26 Haziran 2026',read:'7 dk',tags:['Yemek','Aile','Gelenek'],title:'Aile Yemekleri: Birlikte Sofraya Oturmanın Gücü',excerpt:'Birlikte yemek yiyen aileler, daha güçlü bağlara sahiptir.',lead:'Birlikte yemek yiyen aileler, daha güçlü bağlara sahiptir. Sofra, bir ailenin kalbidir.',body:`<p>Modern hayat, aileyi böldü. Herkes kendi odasında, kendi ekranında, kendi yemeğinde. Ama sofra, hâlâ birleştirici bir güçtür.</p><h2>Sofranın faydaları</h2><ul><li>İletişim artar.</li><li>Bağ güçlenir.</li><li>Çocuklar daha sağlıklı beslenir.</li><li>Ders başarısı yükselir.</li><li>Madde bağımlılığı riski azalır.</li></ul><h2>Sofra kuralları</h2><ol><li>Telefon yok.</li><li>TV yok.</li><li>Herkes sofrada.</li><li>Sohbet aç.</li><li>Yemek sonrası birlikte topla.</li></ol><h2>Sohbet konuları</h2><ul><li>"Bugün en iyi şey neydi?"</li><li>"Bugün seni ne zorladı?"</li><li>"Bu hafta ne yapmak istersin?"</li><li>"Bir şey öğrendin mi bugün?"</li></ul><blockquote>Sofra, sadece yemek yenen bir yer değildir. Ailenin kalbidir.</blockquote><h2>Sonuç</h2><p>Bugün ailenle birlikte yemek ye. Telefonu bırak. Sohbet et.</p>`},
{id:82,cat:'Aile',date:'24 Haziran 2026',read:'7 dk',tags:['İletişim','Aile','Dinleme'],title:'Aile İçi İletişim: Konuşmak ve Anlamak',excerpt:'Aile içi iletişim, sevginin görünmez dilidir.',lead:'Aile içi iletişim, sevginin görünmez dilidir. Ama modern hayat, bu dili zayıflatıyor. Ve zayıflayan iletişim, aileyi bölüyor.',body:`<p>Bir ailenin en büyük sorunu, iletişim eksikliğidir. Herkes konuşur, ama kimse dinlemez. Herkes söyler, ama kimse anlamaz.</p><h2>İletişim tuzakları</h2><ul><li><strong>Ekran.</strong> Aynı odada, ama farklı dünyalarda.</li><li><strong>Acele.</strong> "Sonra konuşuruz."</li><li><strong>Yargılama.</strong> "Sen neden böyle yaptın?"</li><li><strong>Karşılaştırma.</strong> "Kardeşin gibi ol."</li><li><strong>Sessizlik.</strong> Küskünlük, konuşulmayan şeyler.</li></ul><h2>Sağlıklı iletişim</h2><ol><li>Düzenli aile toplantıları.</li><li>Herkesin dinlendiği bir ortam.</li><li>"Ben" dili.</li><li>Aktif dinleme.</li><li>Empati.</li><li>Özür dileme.</li></ol><blockquote>Aile içi iletişim, sevginin somut halidir.</blockquote><h2>Sonuç</h2><p>Bugün ailenle otur. Telefonları bırakın. Konuşun. Dinleyin. Anlayın.</p>`},

/* ===== YENİ YAZILAR — KARİYER (8) ===== */
{id:83,cat:'Kariyer',date:'22 Haziran 2026',read:'8 dk',tags:['Para','30 Yaş','Finans'],title:'30’lu Yaşlarda Para Yönetimi: Sistem Kurmak',excerpt:'Gelir arttıkça harcama artıyorsa, sorun gelirde değil, sistemde.',lead:'Çoğu erkek 30’lu yaşlarında ilk defa "iyi para" kazanır ama bir türlü birikim yapamaz. Sebep basit: sistem yok.',body:`<p>Yirmili yaşlarınızda az kazanır, çok harcarsınız. Otuzlu yaşlarınızda daha çok kazanırsınız — ama yine çok harcarsınız. Buna <em>yaşam tarzı enflasyonu</em> denir.</p><h2>50/30/20 kuralı</h2><ul><li><strong>%50 — İhtiyaçlar.</strong></li><li><strong>%30 — İstekler.</strong></li><li><strong>%20 — Birikim ve yatırım.</strong></li></ul><blockquote>Para, kazandığın değil, tuttuğun kadardır.</blockquote><h2>Önce borç, sonra yatırım</h2><p>Kredi kartı borcu, en pahalı borçtur. Hiçbir yatırım o faizi yenemez.</p><h2>Acil durum fonu</h2><p>3–6 aylık giderinizi kenarda tutun.</p><h2>Otomatikleştir</h2><p>Maaş yattığı gün, otomatik transferle %20 birikime gitsin.</p><h2>Sonuç</h2><p>Para yönetimi, kazanma değil <strong>tutma</strong> sanatıdır. Sistem kurun. Otomatikleştirin. Unutun.</p>`},
{id:84,cat:'Kariyer',date:'20 Haziran 2026',read:'9 dk',tags:['Girişimcilik','İş','Risk'],title:'Girişimcilik: Kendi İşini Kurmanın Gerçekleri',excerpt:'Girişimcilik, özgürlük değildir. Ama özgürlüğün bir yoludur.',lead:'Girişimcilik, çoğu erkeğin hayalidir. Ama çoğu erkek, hayalin gerçekliğini bilmez.',body:`<p>Modern kültür, girişimciliği yüceltir. "Kendi patronun ol", "pasif gelir", "finansal özgürlük" — bu sözler, bir vaat gibi sunulur. Oysa gerçek, çok daha zorlu.</p><h2>Girişimcilik nedir, ne değildir?</h2><p><strong>Özgürlük müdür?</strong> Kısmen. Kendi kararlarını verirsin. Ama müşteriler, çalışanlar, yatırımcılar — hepsi senin patronundur.</p><p><strong>Kolay para mıdır?</strong> Hayır. İlk yıllar, genelde maaşsız ya da düşük maaşla çalışırsın.</p><p><strong>Herkes için midir?</strong> Hayır. Bazı insanlar, sabit maaş ister. Bu bir zayıflık değil, bir tercihtir.</p><blockquote>Girişimcilik, bir kaçış değildir. Bir inşadır.</blockquote><h2>Hazırlık</h2><ol><li>Finansal yastık (6–12 ay).</li><li>Beceri.</li><li>Ağ.</li><li>Fikir testi.</li><li>Hukuki yapı.</li><li>Zihinsel hazırlık.</li></ol><h2>En yaygın hatalar</h2><ul><li>Fikri test etmeden yatırım yapmak.</li><li>Ortak seçiminde acele etmek.</li><li>Sabırsızlık.</li><li>Kişisel hayatı ihmal etmek.</li></ul><h2>Sonuç</h2><p>Girişimcilik, kolay değildir. Ama mümkündür. Hazır olduğun an, korkuya rağmen, adım at.</p>`},
{id:85,cat:'Kariyer',date:'18 Haziran 2026',read:'8 dk',tags:['Müzakere','İş','Kazanç'],title:'Müzakere Sanatı: İşte ve Hayatta Daha İyisini Almak',excerpt:'Müzakere, sadece iş görüşmelerinde değildir. Hayatın her alanında kullanılır.',lead:'Müzakere, sadece iş görüşmelerinde değildir. Hayatın her alanında kullanılır. Ve öğrenilebilir bir beceridir.',body:`<p>Çoğu erkek, müzakere etmekten kaçınır. "Ayıp", "kırıcı", "riskli" — bu düşünceler, erkeği geri tutar.</p><h2>Temel ilkeler</h2><ol><li>Hazırlık.</li><li>Bilgi.</li><li>Sınır.</li><li>Esneklik.</li><li>Sessizlik.</li></ol><blockquote>Müzakere, karşı tarafı yenmek değildir. Birlikte bir çözüm bulmaktır.</blockquote><h2>Maaş pazarlığı</h2><p>Hazırlık, zamanlama, karşı teklif, alternatifler, yürüyebilmek.</p><h2>Günlük hayatta müzakere</h2><p>Araba, ev, faturalar, çocuk, ilişki. Her karar, bir müzakeredir.</p><h2>Tuzaklar</h2><ul><li>Duygusal tepki.</li><li>İlk teklifi hemen kabul etmek.</li><li>Çok konuşmak.</li><li>Blöf yapmak.</li><li>Kişisel algılamak.</li></ul><h2>Sonuç</h2><p>Müzakere, bir yaşam becerisidir. Bugün küçük bir müzakere yap.</p>`},
{id:86,cat:'Kariyer',date:'16 Haziran 2026',read:'8 dk',tags:['Gelişim','Öğrenme','Kariyer'],title:'Mesleki Gelişim: Sürekli Öğrenmenin Gücü',excerpt:'Kariyer, bir merdiven değil, bir yolculuktur.',lead:'Kariyer, bir merdiven değil, bir yolculuktur. Ve bu yolculukta, en büyük sermaye, öğrenme kapasitesidir.',body:`<p>Bir zamanlar, bir meslek öğrenir, ömür boyu yapardın. Bugün, meslekler 10 yılda bir değişir.</p><h2>Öğrenmenin üç türü</h2><p><strong>Derinleştirme.</strong> Kendi alanında daha derin bilgi.</p><p><strong>Genişletme.</strong> Yan alanlarda bilgi.</p><p><strong>Dönüşüm.</strong> Tamamen yeni bir alan.</p><blockquote>Bir erkeğin kariyeri, ne kadar bildiğiyle değil, ne kadar hızlı öğrendiğiyle ölçülür.</blockquote><h2>Öğrenme alışkanlıkları</h2><ol><li>Günlük 30 dakika.</li><li>Yılda 24 kitap.</li><li>Pratik.</li><li>Not al.</li><li>Öğret.</li></ol><h2>Zaman nasıl bulunur?</h2><ul><li>Sabah 30 dakika.</li><li>Yolda podcast.</li><li>Öğle tatili.</li><li>Akşam 1 saat TV yerine.</li><li>Hafta sonu 2 saat.</li></ul><h2>Sonuç</h2><p>Bugün 30 dakika öğrenmeye ayır. Bir yıl sonra, kariyerin farklı olacak.</p>`},
{id:87,cat:'Kariyer',date:'14 Haziran 2026',read:'8 dk',tags:['Denge','İş','Hayat'],title:'İş-Yaşam Dengesi: Mümkün mü, Yoksa Mit mi?',excerpt:'İş-yaşam dengesi, bir denge değil, bir önceliktir.',lead:'İş-yaşam dengesi, modern erkeğin en büyük ikilemidir. Ama "denge" kelimesi yanıltıcıdır.',body:`<p>Modern erkek, iki dünya arasında sıkışır: iş ve hayat. İkisini de ihmal etmemek ister. Ama zaman sınırlıdır.</p><h2>"Denge" neden yanıltıcı?</h2><p>Denge, statik bir şeydir. Hayat ise dinamik. Doğru kavram, öncelik.</p><blockquote>İş-yaşam dengesi, her gün eşit dağılım değildir. Her mevsimde doğru önceliktir.</blockquote><h2>Öncelikler</h2><p>30 yaşında kariyere odaklan. 35'te çocuk büyütmeye. 40'ta sağlığa. 45'te topluma.</p><h2>Sınırlar</h2><ul><li>Zaman sınırı.</li><li>Mekân sınırı.</li><li>Dijital sınır.</li><li>Fiziksel sınır.</li></ul><h2>Verimlilik</h2><p>Az çalış, çok üret. Derin iş, toplantıları azalt, delegasyon.</p><h2>Sonuç</h2><p>Bugün bir sınır koy. Akşam 7'den sonra iş yapma.</p>`},
{id:88,cat:'Kariyer',date:'12 Haziran 2026',read:'8 dk',tags:['Liderlik','Ekip','Kariyer'],title:'Liderlik: Sessiz Gücün İfadesi',excerpt:'Liderlik, bağırmak değildir. Sessizce yön vermektir.',lead:'Liderlik, bağırmak değildir. Sessizce yön vermektir. Ve gerçek lider, ekibine hizmet eden kişidir.',body:`<p>Modern dünyada liderlik, çoğu zaman yanlış anlaşılır. Lider, bağıran, emreden, kontrol eden kişi sanılır. Oysa gerçek lider, hizmet eden, örnek olan, yol açan kişidir.</p><h2>Liderlik türleri</h2><p><strong>1. Emreden lider.</strong> Otoriteye dayanır. Kısa vadede etkili, uzun vadede yıkıcı.</p><p><strong>2. Hizmet eden lider.</strong> Ekibe hizmet eder. Uzun vadede en güçlü.</p><p><strong>3. Örnek olan lider.</strong> Kendi davranışıyla yön verir.</p><blockquote>Gerçek lider, kendisini takip edenlere hizmet eden kişidir.</blockquote><h2>Liderlik becerileri</h2><ol><li>Dinleme.</li><li>Empati.</li><li>Net iletişim.</li><li>Kararlılık.</li><li>Sorumluluk.</li><li>Örnek olma.</li></ol><h2>Sonuç</h2><p>Liderlik, bir unvan değil, bir pratiktir. Bugün bir kişiye yardım et. Yarın bir tane daha.</p>`},
{id:89,cat:'Kariyer',date:'10 Haziran 2026',read:'7 dk',tags:['Ağ','İlişki','Kariyer'],title:'Networking: İnsan İlişkilerinin Gücü',excerpt:'Kariyerin, ne bildiğinle değil, kimi tanıdığınla ilgilidir.',lead:'Kariyerin, ne bildiğinle değil, kimi tanıdığınla ilgilidir. Ama networking, kartvizit toplamak değildir.',body:`<p>Birçok erkek, networking'i sevmez. "Yapay", "çıkarcı", "yorucu" bulur. Oysa networking, insan ilişkileridir. Ve insan ilişkileri, hayatın temelidir.</p><h2>Networking nedir?</h2><p>Networking, karşılıklı fayda sağlayan ilişkiler kurmaktır. Sadece tanıdık toplamak değildir. Derin, anlamlı bağlar kurmaktır.</p><blockquote>İnsanlar, senden hoşlandıkları için seninle çalışır. Yeteneğin ikinci plandadır.</blockquote><h2>Networking nasıl yapılır?</h2><ol><li>Önce ver, sonra al.</li><li>Samimi ol.</li><li>Takip et.</li><li>Dinle.</li><li>Değer kat.</li><li>Sabırlı ol.</li></ol><h2>Nerede networking?</h2><ul><li>Konferanslar.</li><li>Sektör etkinlikleri.</li><li>Spor kulüpleri.</li><li>Online topluluklar.</li><li>Gönüllü işler.</li></ul><h2>Yaygın hatalar</h2><ul><li>Sadece ihtiyaç duyduğunda aramak.</li><li>Sürekli satmak.</li><li>Dinlememek.</li><li>Takip etmemek.</li></ul><h2>Sonuç</h2><p>Bugün bir kişiye ulaş. Sadece merhaba de. Belki bir fayda sağla. İlişkiler, zamanla büyür.</p>`},
{id:90,cat:'Kariyer',date:'8 Haziran 2026',read:'7 dk',tags:['Başarısızlık','Dayanıklılık','Kariyer'],title:'Başarısızlıkla Baş Etmek: Düşmek, Kalmak Değildir',excerpt:'Başarısızlık, bir son değildir. Bir ders, bir başlangıçtır.',lead:'Başarısızlık, bir son değildir. Bir ders, bir başlangıçtır. Ve başarısız olmayan erkek, hiçbir şey denememiş erkektir.',body:`<p>Her başarılı erkeğin arkasında, bir dizi başarısızlık vardır. Başarısızlık, kaçınılmazdır. Önemli olan, ondan ne öğrendiğindir.</p><h2>Başarısızlık nedir?</h2><p>Başarısızlık, bir sonuçtur. Bir denemenin işe yaramamasıdır. Ama bu, senin değerini belirlemez. Sadece bir denemenin sonucudur.</p><h2>Başarısızlık türleri</h2><p><strong>1. Öğrenme başarısızlığı.</strong> Yeni bir şey denerken olur. En değerli olanıdır.</p><p><strong>2. Tekrarlayan başarısızlık.</strong> Aynı hatayı tekrar tekrar yapmak. Bu, öğrenmediğini gösterir.</p><p><strong>3. Kaçınılmaz başarısızlık.</strong> Kontrolün dışındaki sebeplerden olur. Bunu kabullenmek gerekir.</p><blockquote>Başarısızlık, düşmek değildir. Düştükten sonra kalkmamaktır.</blockquote><h2>Başarısızlıkla baş etme</h2><ol><li>Duyguyu yaşa.</li><li>Analiz et.</li><li>Sorumluluk al.</li><li>Ders al.</li><li>Tekrar dene.</li><li>Yardım iste.</li></ol><h2>Sonuç</h2><p>Başarısızlık, bir öğretmendir. Onu dinle. Ders al. Ve devam et.</p>`},

{id:91,cat:'Stil',date:'6 Haziran 2026',read:'7 dk',tags:['Parfüm','Koku','Kimlik'],title:'Parfüm Seçimi: Koku ve Kimlik',excerpt:'Koku, hatıraların en güçlü tetikleyicisidir.',lead:'Koku, hatıraların en güçlü tetikleyicisidir. Bir koku, bir anı, bir kişiyi hatırlatır. Doğru parfüm, senin imzandır.',body:`<p>Bir erkeğin kokusu, onun sessiz imzasıdır. Kelimelerden önce konuşur, hatıralarda kalır.</p><h2>Parfüm notaları</h2><p><strong>1. Üst notalar.</strong> İlk 15–30 dakika. Hafif, uçucu.</p><p><strong>2. Orta notalar.</strong> 30 dakika – 2 saat. Parfümün karakteri.</p><p><strong>3. Alt notalar.</strong> 2 saat sonrası. Kalıcı, ağır.</p><blockquote>Parfüm, bir hikâyedir. Ve hikâye, zamanla açılır.</blockquote><h2>Parfüm aileleri</h2><p>Odunsu, aromatik, şipre, fougère, oryantal, narenciye, deri.</p><h2>Konsantrasyon</h2><p>EDC (hafif), EDT (gündelik), EDP (akşam), Parfum (özel).</p><h2>Doğru parfüm nasıl seçilir?</h2><ol><li>Denemeden alma.</li><li>Bir günde en fazla 3 parfüm dene.</li><li>Kendi teninde test et.</li><li>Mevsime uygun.</li><li>Ortama uygun.</li><li>Kişiliğine uygun.</li></ol><h2>Sonuç</h2><p>Bugün bir parfüm mağazasına git. Üç parfüm dene. Eve git, 6 saat kokla.</p>`},
{id:92,cat:'Stil',date:'4 Haziran 2026',read:'7 dk',tags:['Renk','Kombin','Stil'],title:'Renk Uyumu ve Kombin: Stilin Temeli',excerpt:'Renk, bir erkeğin stilinin en güçlü aracıdır.',lead:'Renk, bir erkeğin stilinin en güçlü aracıdır. Ve doğru kullanıldığında, sıradan kıyafetleri bile şık gösterir.',body:`<p>Çoğu erkek, renk konusunda kararsızdır. Ne giyeceğini bilmez. Oysa birkaç temel kural, tüm kombinleri çözer.</p><h2>Temel renkler</h2><p><strong>Nötrler:</strong> Siyah, beyaz, gri, lacivert, kahverengi, bej.</p><p><strong>Vurgular:</strong> Kırmızı, yeşil, mavi, sarı.</p><h2>Renk kuralları</h2><ol><li>En fazla 3 renk.</li><li>Nötrleri baz al.</li><li>Bir vurgu rengi ekle.</li><li>Ten rengine dikkat et.</li><li>Mevsime uygun.</li></ol><blockquote>Renk, bir erkeğin sessiz konuşmasıdır.</blockquote><h2>Kombin örnekleri</h2><p><strong>Klasik:</strong> Lacivert ceket, beyaz gömlek, gri pantolon.</p><p><strong>Gündelik:</strong> Kot pantolon, beyaz tişört, kahverengi ceket.</p><p><strong>Yazlık:</strong> Bej pantolon, açık mavi gömlek, kahverengi ayakkabı.</p><h2>Sonuç</h2><p>Bugün gardırobunu gözden geçir. Renkleri uyumlu hale getir.</p>`},
{id:93,cat:'Stil',date:'2 Haziran 2026',read:'7 dk',tags:['Kış','Gardırop','Stil'],title:'Kışlık Gardırop: Soğukta Şık Olmak',excerpt:'Kış, stilin en zorlu sınavıdır.',lead:'Kış, stilin en zorlu sınavıdır. Soğukta şık olmak, hem ısınmak hem iyi görünmek demektir.',body:`<p>Kış geldiğinde, çoğu erkek ya donar ya da bir çuval gibi giyinir. Oysa doğru parçalarla, hem sıcak hem şık olmak mümkündür.</p><h2>Temel parçalar</h2><ul><li><strong>Palto.</strong> Yün, uzun. Lacivert, gri ya da siyah.</li><li><strong>Kazak.</strong> Yün, ince. Balıkçı yaka ya da V yaka.</li><li><strong>Gömlek.</strong> Flanel ya da kalın pamuk.</li><li><strong>Pantolon.</strong> Yün karışımı, kalın.</li><li><strong>Bot.</strong> Chelsea ya da chukka.</li><li><strong>Atkı.</strong> Yün, sade.</li><li><strong>Bere.</strong> Kaşmir ya da yün.</li><li><strong>Eldiven.</strong> Deri, sade.</li></ul><h2>Katmanlama</h2><ol><li>İç katman: atlet, gömlek.</li><li>Orta katman: kazak, hırka.</li><li>Dış katman: palto, mont.</li></ol><blockquote>Kış, bir erkeğin stilini test eder.</blockquote><h2>Renk paleti</h2><p>Lacivert, gri, kahverengi, siyah, bordo, hardal.</p><h2>Sonuç</h2><p>Kışa hazırlan. Az ama kaliteli parçalarla.</p>`},
{id:94,cat:'Stil',date:'31 Mayıs 2026',read:'7 dk',tags:['Yaz','Gardırop','Stil'],title:'Yazlık Gardırop: Sıcakta Serin ve Şık',excerpt:'Yaz, hafifliğin ve zarafetin mevsimidir.',lead:'Yaz, hafifliğin ve zarafetin mevsimidir. Ama sıcakta şık olmak, doğru parçalarla mümkündür.',body:`<p>Yaz geldiğinde, çoğu erkek ya terler ya da şortla gezer. Oysa doğru parçalarla, serin ve şık olmak mümkündür.</p><h2>Temel parçalar</h2><ul><li><strong>Keten gömlek.</strong> Nefes alır, hafif. Beyaz, açık mavi, bej.</li><li><strong>Polo.</strong> Pamuk, klasik.</li><li><strong>Chino pantolon.</strong> Hafif, bej, lacivert, gri.</li><li><strong>Şort.</strong> Diz üstü, chino.</li><li><strong>Loafer.</strong> Deri, bağcıksız.</li><li><strong>Sneaker.</strong> Temiz, beyaz.</li><li><strong>Şapka.</strong> Panama, hasır.</li><li><strong>Güneş gözlüğü.</strong> Kaliteli, yüz şekline uygun.</li></ul><h2>Renk paleti</h2><p>Beyaz, bej, açık mavi, pastel tonlar.</p><blockquote>Yaz, hafifliğin mevsimidir. Ama özensizlik değil.</blockquote><h2>Sonuç</h2><p>Yaza hazırlan. Az ama doğru parçalarla.</p>`},
{id:95,cat:'Stil',date:'29 Mayıs 2026',read:'7 dk',tags:['Gömlek','Stil','Beden'],title:'Gömlek Seçimi: Beden, Kumaş, Yaka',excerpt:'Gömlek, bir erkeğin gardırobunun temelidir.',lead:'Gömlek, bir erkeğin gardırobunun temelidir. Doğru gömlek, tüm kombini yükseltir. Yanlış gömlek, her şeyi bozar.',body:`<p>Bir erkeğin gardırobunda en az 5 gömlek olmalıdır. Beyaz, açık mavi, ince çizgili, desenli, gündelik.</p><h2>Beden</h2><ul><li>Omuzlar oturmalı.</li><li>Göğüs bölgesi hareket alanı bırakmalı.</li><li>Kollar, bileği bir santim geçmeli.</li><li>Yaka, iki parmak girecek kadar rahat olmalı.</li></ul><h2>Kumaş</h2><p><strong>Pamuk.</strong> Klasik, nefes alır.</p><p><strong>Keten.</strong> Yaz için, kırışır ama şık.</p><p><strong>Oxford.</strong> Kalın, gündelik.</p><p><strong>Poplin.</strong> İnce, resmi.</p><h2>Yaka türleri</h2><p>Düz, İtalyan, düğmeli, yakasız.</p><blockquote>Gömlek, bir erkeğin derisidir.</blockquote><h2>Sonuç</h2><p>Gardırobunu gözden geçir. Eski, yıpranmış gömlekleri çıkar.</p>`},
{id:96,cat:'Stil',date:'27 Mayıs 2026',read:'7 dk',tags:['Saç','Bakım','Stil'],title:'Saç Bakımı: Erkeğin İmzası',excerpt:'Saç, bir erkeğin yüzünün çerçevesidir.',lead:'Saç, bir erkeğin yüzünün çerçevesidir. Doğru saç modeli, yüzü güzelleştirir. Yanlış saç modeli, yüzü bozar.',body:`<p>Bir erkeğin saçı, ilk izlenimin önemli bir parçasıdır. Bakımlı saç, özgüven verir. Bakımsız saç, her şeyi düşürür.</p><h2>Yüz şekline göre saç</h2><p><strong>Oval:</strong> Her model uyar.</p><p><strong>Yuvarlak:</strong> Kısa yanlar, uzun üstler.</p><p><strong>Kare:</strong> Kısa, keskin hatlar.</p><p><strong>Uzun:</strong> Yanlar hacimli, üstler kısa.</p><p><strong>Üçgen:</strong> Üstler hacimli, yanlar kısa.</p><h2>Saç bakımı</h2><ol><li>Doğru şampuan.</li><li>Saç kremi (haftada 2–3 kez).</li><li>Saç serumu.</li><li>Berber ziyareti (4–6 haftada bir).</li><li>Saç kurutma, doğru sıcaklıkta.</li></ol><h2>Saç dökülmesi</h2><p>Genetik, stres, beslenme, hormonal. Erken önlem al.</p><blockquote>Saç, bir erkeğin sessiz imzasıdır.</blockquote><h2>Sonuç</h2><p>Bugün saçını yıka. Yarın bir berbere git. Doğru modeli bul.</p>`},

{id:97,cat:'Zihin',date:'25 Mayıs 2026',read:'6 dk',tags:['Sessizlik','Farkındalık','Zihin'],title:'Sessizliğin Gücü: Gürültülü Dünyada Zihni Dinlendirmek',excerpt:'Berrak düşünce, sessizlikte doğar.',lead:'Modern erkek, sabahtan akşama kadar bir ekrana bakıyor. Beyin hiç susmuyor. Oysa berrak düşünce, sessizlikte doğar.',body:`<p>Bugün bir erkeğin zihni, tarihte hiç olmadığı kadar meşguldür.</p><h2>Günde 10 dakika</h2><p>Günün bir bölümünde on dakika boyunca hiçbir şey yapmayın. Telefon yok, müzik yok, konuşma yok.</p><blockquote>Sessizlik zayıflık değil, derinliktir.</blockquote><h2>Kulaklıksız yürüyüş</h2><p>Yarım saatlik bir yürüyüş, zihni iki saatlik ekran tatilinden daha iyi dinlendirir.</p><h2>Yazma</h2><p>Her akşam beş satır. Kafanızdaki düğümler kağıda dökülünce çözülür.</p><h2>Telefon orucu</h2><p>Haftada bir gün telefonu bırakın.</p><h2>Sonuç</h2><p>En derin sular, en sessiz akar.</p>`},
{id:98,cat:'Zihin',date:'23 Mayıs 2026',read:'8 dk',tags:['Kitap','Okuma','Gelişim'],title:'Kitap Okuma Alışkanlığı: Yılda 50 Kitap Nasıl Okunur?',excerpt:'Bir erkeğin en büyük serveti, kafasında taşıdığı fikirlerdir.',lead:'Bir erkeğin en büyük serveti, banka hesabında değildir. Kafasında taşıdığı fikirlerdir. Ve fikirler, kitaplardan gelir.',body:`<p>Ortalama bir insan, yılda 1–2 kitap okur. Doğru sistemle, yılda 50 kitap okumak mümkündür.</p><h2>Yılda 50 kitap nasıl okunur?</h2><p>50 kitap ÷ 52 hafta = haftada 1 kitap. 300 sayfa ÷ 7 gün = günde 43 sayfa. 43 sayfa, 30–45 dakika sürer.</p><blockquote>Kitap okumak, zaman meselesi değildir. Öncelik meselesidir.</blockquote><h2>Zaman nasıl bulunur?</h2><ol><li>Sabah 15 dakika.</li><li>Yolda.</li><li>Öğle tatili.</li><li>Akşam 20 dakika.</li><li>Hafta sonu.</li></ol><h2>Doğru kitabı seçmek</h2><p>İlgi alanlarına göre. Akıcı kitaplar. Klasikler, sonra.</p><h2>Not almak</h2><p>Altını çiz, kenar notu, özet, alıntı defteri, uygula.</p><h2>Sonuç</h2><p>Bugün bir kitap al. Yarın 10 sayfa oku. Bir yıl sonra, 50 kitap.</p>`},
{id:99,cat:'Zihin',date:'21 Mayıs 2026',read:'9 dk',tags:['Stoacılık','Felsefe','Zihin'],title:'Stoacıların Öğrettikleri: Modern Erkeğe Antik Bilgelik',excerpt:'Stoacılık, kaderi kabullenmek değildir. Kontrol edebildiğin şeye odaklanmaktır.',lead:'Stoacılık, 2.000 yıl önce doğdu ama bugün hâlâ geçerli. Çünkü insan doğası değişmedi.',body:`<p>Stoacılık, MÖ 3. yüzyılda Yunanistan'da doğdu. Roma'da yükseldi. Marcus Aurelius, Seneca, Epictetus gibi isimlerle şekillendi.</p><h2>Temel ilkeler</h2><p><strong>1. Kontrol ayrımı.</strong> Bazı şeyler kontrolünde, bazıları değil.</p><p><strong>2. Erdem en yüksek iyidir.</strong></p><p><strong>3. Duygular değil, yargılar.</strong></p><p><strong>4. Anı yaşa.</strong></p><p><strong>5. Memento mori.</strong></p><blockquote>Kontrol edemediğin şey için endişelenmek, kontrol edebildiğin şeyi de kaybetmektir.</blockquote><h2>Marcus Aurelius</h2><p>"Mutluluğun, dış koşullara değil, iç tutumuna bağlıdır."</p><h2>Seneca</h2><p>"Hayat kısa değil; biz onu kısaltıyoruz."</p><h2>Epictetus</h2><p>"Özgürlük, arzularının kontrolüdür."</p><h2>Stoacı pratikler</h2><ol><li>Sabah meditasyonu.</li><li>Akşam değerlendirmesi.</li><li>Negatif görselleştirme.</li><li>Kontrol ayrımı egzersizi.</li><li>Memento mori.</li></ol><h2>Sonuç</h2><p>Bugün bir Stoacı pratik dene. Bir yıl sonra, bir karakter.</p>`},
{id:100,cat:'Zihin',date:'19 Mayıs 2026',read:'9 dk',tags:['Anlam','Felsefe','Varoluş'],title:'Hayatın Anlamı: Varoluşçu Bir Bakış',excerpt:'Hayatın anlamı, dışarıda aranmaz. İçeride inşa edilir.',lead:'Hayatın anlamı, dışarıda aranmaz. İçeride inşa edilir. Ve her erkek, kendi anlamını yaratır.',body:`<p>Bir erkek, hayatının bir noktasında şu soruyu sorar: Neden yaşıyorum? Bu soru, felsefenin en eski sorusudur.</p><h2>Varoluşçuluğun temel fikri</h2><p><strong>Varoluş, özden önce gelir.</strong> Yani önce var oluruz, sonra ne olduğumuzu belirleriz.</p><blockquote>İnsan, kendi hayatının yazarıdır. Ama yazar, boş sayfayla başlar.</blockquote><h2>Sartre</h2><p>"İnsan özgür olmaya mahkûmdur."</p><h2>Camus</h2><p>"Sisifos'u mutlu olarak düşünmek gerekir."</p><h2>Nietzsche</h2><p>"Tanrı öldü." Yani insan, artık kendi anlamını yaratabilir.</p><h2>Frankl</h2><p>"Yaşamak için bir 'neden'i olan insan, hemen her 'nasıl'a dayanabilir."</p><h2>Anlam nasıl bulunur?</h2><ol><li>Kendine sor.</li><li>Deneyle.</li><li>Derinleş.</li><li>Paylaş.</li><li>Sabırlı ol.</li></ol><h2>Sonuç</h2><p>Bugün kendine sor: Hayatımın anlamı ne?</p>`},
{id:101,cat:'Zihin',date:'17 Mayıs 2026',read:'8 dk',tags:['Ölüm','Sonluluk','Yaşam'],title:'Ölüm ve Erkek: Sonlulukla Yüzleşmek',excerpt:'Ölümü kabullenmek, hayatı daha dolu yaşamaktır.',lead:'Ölüm, her erkeğin kaçındığı bir konudur. Ama ölümden kaçmak, hayattan kaçmaktır.',body:`<p>Modern toplum, ölümü gizler. Ama ölüm, kaçınılmaz bir gerçektir. Ve ondan kaçmak, hayattan kaçmaktır.</p><h2>Ölüm neden korkutur?</h2><p>Belirsizlik, kayıp, anlamsızlık, kontrol kaybı.</p><blockquote>Ölümden korkan erkek, aslında yaşamdan korkar.</blockquote><h2>Kabullenmenin faydaları</h2><ol><li>Hayatı daha dolu yaşamak.</li><li>Öncelikleri netleştirmek.</li><li>Kaygıyı azaltmak.</li><li>Affetmeyi kolaylaştırmak.</li><li>Şükretmeyi öğretmek.</li></ol><h2>Stoacı memento mori</h2><p>Marcus Aurelius: "Yakında her şeyi unutacaksın."</p><p>Seneca: "Her gün, hayatın son günü gibi yaşa."</p><h2>Pratikler</h2><p>Kendi ölümünü hayal et, ölen yakınlarını hatırla, yaz, oku, konuş.</p><h2>Sonuç</h2><p>Bugün bir dakika dur, kendi ölümünü düşün. Sonra, bugün ne yapacağını düşün.</p>`},
{id:102,cat:'Zihin',date:'15 Mayıs 2026',read:'8 dk',tags:['Farkındalık','Mindfulness','Zihin'],title:'Farkındalık: Anı Yaşama Sanatı',excerpt:'Farkındalık, meditasyon değildir. Anı yaşamaktır.',lead:'Farkındalık, meditasyon değildir. Anı yaşamaktır. Şimdi, burada, tamamen burada olmaktır.',body:`<p>Modern erkek, genellikle geçmişte ya da gelecekte yaşar. Şimdiki an, sürekli kaçar. Oysa hayat, sadece şimdiki anda olur.</p><h2>Farkındalık nedir?</h2><p>Farkındalık, dikkatini şimdiki ana getirmektir. Yargılamadan, direnç göstermeden, sadece fark etmektir.</p><h2>Günlük farkındalık</h2><ul><li>Sabah kahveni fark ederek iç.</li><li>Duş alırken suyu hisset.</li><li>Yürürken ayak seslerini duy.</li><li>Yemek yerken tadına var.</li><li>Konuşurken gerçekten dinle.</li></ul><blockquote>Geçmiş gitti, gelecek belirsiz, elimizde sadece an var.</blockquote><h2>Faydaları</h2><ol><li>Stres azalır.</li><li>Kaygı düşer.</li><li>Uyku iyileşir.</li><li>İlişkiler güçlenir.</li><li>Kararlar netleşir.</li></ol><h2>Sonuç</h2><p>Bugün bir farkındalık pratiği yap. Küçük bir şey. Bir nefes. Bir adım. Bir yudum.</p>`},
{id:103,cat:'Zihin',date:'13 Mayıs 2026',read:'7 dk',tags:['Meditasyon','Zihin','Sakinlik'],title:'Meditasyon Rehberi: Zihni Eğitmek',excerpt:'Meditasyon, zihni boşaltmak değildir. Zihni eğitmektir.',lead:'Meditasyon, zihni boşaltmak değildir. Zihni eğitmektir. Ve eğitilmiş zihin, hayatın en güçlü aracıdır.',body:`<p>Meditasyon, çoğu erkek için yabancı bir kavramdır. "Oturup hiçbir şey yapmak" gibi görünür. Oysa meditasyon, aktif bir pratiktir.</p><h2>Meditasyon nedir?</h2><p>Meditasyon, dikkatini belirli bir nesneye (nefes, ses, düşünce) yönlendirmektir. Düşünceler gelir, onları fark edersin, nazikçe geri dönersin.</p><h2>Temel meditasyon</h2><ol><li>Sessiz bir yer bul.</li><li>Rahat otur.</li><li>Gözlerini kapat.</li><li>Nefesini izle.</li><li>Düşünceler gelirse, nazikçe nefese dön.</li><li>5–10 dakika başla.</li><li>Her gün aynı saatte yap.</li></ol><blockquote>Meditasyon, zihni sakinleştirmez. Zihni tanır.</blockquote><h2>Faydaları</h2><ul><li>Stres azalır.</li><li>Kaygı düşer.</li><li>Konsantrasyon artar.</li><li>Empati gelişir.</li><li>Uyku iyileşir.</li></ul><h2>Yaygın engeller</h2><p>"Zamanım yok", "Zihnim susmuyor", "Sıkıcı". Hepsi normal. Sabret, devam et.</p><h2>Sonuç</h2><p>Bugün 5 dakika meditasyon yap. Yarın bir tane daha.</p>`},
{id:104,cat:'Zihin',date:'11 Mayıs 2026',read:'8 dk',tags:['Dayanıklılık','Zorluk','Zihin'],title:'Zihinsel Dayanıklılık: Zorluklara Göğüs Germek',excerpt:'Dayanıklılık, doğuştan gelmez. İnşa edilir.',lead:'Dayanıklılık, doğuştan gelmez. İnşa edilir. Ve bir erkeğin en büyük sermayesi, zihinsel dayanıklılığıdır.',body:`<p>Hayat, zorluklarla doludur. Kayıplar, başarısızlıklar, hayal kırıklıkları. Dayanıklı erkek, bu zorluklarla başa çıkar. Dayanıksız erkek, onlar tarafından yıkılır.</p><h2>Dayanıklılık nedir?</h2><p>Dayanıklılık, zorluklara rağmen ayakta kalma kapasitesidir. Zorluklardan kaçmak değil, onlarla yüzleşmektir.</p><h2>Dayanıklılığı oluşturan şeyler</h2><ol><li><strong>Anlam.</strong> Bir amaç, bir neden.</li><li><strong>İlişki.</strong> Destek veren insanlar.</li><li><strong>Deneyim.</strong> Geçmiş zorluklar.</li><li><strong>Sağlık.</strong> Beden ve zihin.</li><li><strong>İnanç.</strong> Bir değer sistemi.</li></ol><blockquote>Dayanıklılık, düşmemek değil, her düştüğünde kalkmaktır.</blockquote><h2>Nasıl gelişir?</h2><ol><li>Küçük zorluklarla yüzleş.</li><li>Konfor alanını genişlet.</li><li>Kendine güven.</li><li>Yardım iste.</li><li>Anlam yarat.</li></ol><h2>Sonuç</h2><p>Bugün küçük bir zorlukla yüzleş. Yarın bir tane daha.</p>`},
{id:105,cat:'Zihin',date:'9 Mayıs 2026',read:'7 dk',tags:['İç Konuşma','Öz Şefkat','Zihin'],title:'Kendinle Konuşma Sanatı: İç Sesi Eğitmek',excerpt:'İç sesin, en güçlü öğretmenin ya da en acımasız eleştirmenin olabilir.',lead:'İç sesin, en güçlü öğretmenin ya da en acımasız eleştirmenin olabilir. Onu eğitmek, hayatını değiştirir.',body:`<p>Herkesin kafasında bir iç ses vardır. Bu ses, bazen cesaret verir, bazen yıkar. Fark, onu nasıl eğittiğinde.</p><h2>İç sesin iki hali</h2><p><strong>Yıkıcı iç ses.</strong> "Yapamazsın", "Yetersizsin", "Başarısız olacaksın".</p><p><strong>Yapıcı iç ses.</strong> "Deneyeceğim", "Öğreniyorum", "Bu zor ama mümkün".</p><h2>İç sesi eğitmek</h2><ol><li>Fark et.</li><li>Sorgula.</li><li>Yeniden çerçevele.</li><li>Kendine şefkat göster.</li><li>Pratik yap.</li></ol><blockquote>Kendine nasıl konuşuyorsan, hayatın öyle şekillenir.</blockquote><h2>Örnekler</h2><p>"Aptalım" → "Hata yaptım, düzelteceğim."</p><p>"Yapamayacağım" → "Henüz öğrenmedim."</p><p>"Herkes benden iyi" → "Herkesin yolu farklı."</p><h2>Sonuç</h2><p>Bugün iç sesini dinle. Yıkıcı cümleleri fark et. Yapıcı olanlarla değiştir.</p>`}

        <div>
          <span class="kicker">— Bu Hafta Öne Çıkanlar</span>
          <h2>${state.filter ? esc(state.filter) + ' Kategorisi' : 'Yeni ve derinlemesine yazılar'}</h2>
          <p>${state.filter ? 'Seçtiğiniz kategoriden en güncel yazılar.' : 'Her yazı; zamansız bir ilkeyi, modern hayatın gerçekleriyle buluşturur.'}</p>
        </div>
        <button type="button" class="link-arrow" data-action="cat" data-cat="">Tüm yazılar →</button>
      </div>
      <div class="bento">${bentoHTML}</div>
    </div>
  </section>
  <section>
    <div class="container">
      <div class="section-head fade"><div><span class="kicker">— Keşfet</span><h2>Kategoriler</h2></div></div>
      <div class="cats-grid">${catsHTML}</div>
    </div>
  </section>
  <section>
    <div class="container">
      <div class="section-head fade"><div><span class="kicker">— Kütüphane</span><h2>${esc(title)}</h2></div></div>
      <div class="filters">${chipsHTML}</div>
      <div class="articles-grid">${cardsHTML}</div>
    </div>
  </section>
  <section class="quote-band">
    <div class="container">
      <blockquote>“İnsan, kendisini bekleyen işi yapmadığı her gün, biraz daha küçülür.”</blockquote>
      <cite>— Erkeklik Sanatı</cite>
    </div>
  </section>
  <section>
    <div class="container">
      <div class="newsletter fade">
        <h2>Her pazar, tek bir sağlam fikir.</h2>
        <p>Spam yok. Reklam yok. Sadece haftanın en iyi yazısı ve düşünmeye değer bir soru.</p>
        <form id="newsletterForm"><input type="email" placeholder="merhaba@ornek.com" required><button type="submit" class="btn btn-accent">Abone Ol</button></form>
        <small>İstediğin zaman çıkabilirsin. Sözümüz söz.</small>
      </div>
    </div>
  </section>`;
}

function renderArticle(){
  const a = ARTICLES.find(x=>x.id===state.articleId);
  if(!a) return '<div class="container" style="padding:80px 24px;text-align:center;"><p>Yazı bulunamadı.</p></div>';
  return `
  <div class="reader">
    <div class="container narrow">
      <button type="button" class="back" data-action="home"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Tüm Yazılar</button>
      <span class="kicker">— ${esc(a.cat)}</span>
      <h1>${esc(a.title)}</h1>
      <div class="meta"><span>${esc(a.date)}</span><span class="dot"></span><span>${esc(a.read)} okuma</span><span class="dot"></span><span>Erkeklik Sanatı</span></div>
      <div class="content"><p class="lead">${esc(a.lead)}</p>${a.body}</div>
      <div class="tags">${a.tags.map(t=>`<span>#${esc(t)}</span>`).join('')}</div>
    </div>
  </div>`;
}

function renderAbout(){
  return `
  <div class="container">
    <div class="about-hero">
      <span class="kicker" style="font-family:'JetBrains Mono',monospace;font-size:.72rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);">— Hakkında</span>
      <h1 style="margin-top:16px;">Erkekliği yeniden <em style="font-style:italic;color:var(--accent);">düşünmek</em> üzerine.</h1>
      <p>Erkeklik Sanatı, erkeklerin karakter, beceri ve amaç bakımından daha sağlam bir hayat kurmalarına yardımcı olmak için kurulmuş bağımsız bir yayındır.</p>
    </div>
    <div class="about-grid">
      <div class="about-card"><div class="num">01</div><h3>Zamansız ilkeler</h3><p>Moda akımların değil, yüzyıllardır işe yarayan ilkelerin peşindeyiz.</p></div>
      <div class="about-card"><div class="num">02</div><h3>Modern gerçekler</h3><p>Gelenek körü körüne tekrarlanmaz. Bugünün dünyasında ne anlama geldiğini sorgularız.</p></div>
      <div class="about-card"><div class="num">03</div><h3>Pratik bilgi</h3><p>Her yazının sonunda uygulanabilir bir adım vardır.</p></div>
      <div class="about-card"><div class="num">04</div><h3>Bağımsız ses</h3><p>Algoritma bize ne yazacağımızı söylemez. Reklamveren değil, okur önce gelir.</p></div>
    </div>
    <div class="narrow" style="padding:20px 0 40px;">
      <div class="reader content" style="display:block;padding:0;">
        <h2>Neden varız?</h2>
        <p>Bugünün erkeği, tarihte hiç olmadığı kadar çok bilgiye, ama çok az rehberliğe sahip. Bir yanda "erkek adam ağlamaz" diyen katı bir gelenek; diğer yanda köklerinden kopmuş bir modernlik. İkisi de eksik.</p>
        <p>Biz üçüncü bir yol öneriyoruz: <strong>sorumluluk alan, ama duygularını bastırmayan; güçlü olan, ama kibirli olmayan; öğrenmeye devam eden, ama kendine dürüst kalan bir erkeklik.</strong></p>
        <blockquote>Erkeklik bir kalıp değil, bir yolculuktur. Varış yok, yön var.</blockquote>
        <p>Burada bulacağın her yazı, bu yolculuğun bir durağıdır. Acele etme. Oku. Düşün. Uygula.</p>
      </div>
    </div>
  </div>`;
}

function render() {
  if (state.view === 'home') app.innerHTML = renderHome();
  else if (state.view === 'article') app.innerHTML = renderArticle();
  else if (state.view === 'about') app.innerHTML = renderAbout();
  triggerFade();
  animateCounters();
  window.scrollTo(0, 0);
}

document.addEventListener('click', e => {
  const target = e.target.closest('[data-action]');
  if(!target) return;
  e.preventDefault(); e.stopPropagation();
  const action = target.getAttribute('data-action');
  if (action === 'home'){ state.view='home'; state.filter=''; closeMenu(); render(); }
  else if (action === 'about'){ state.view='about'; closeMenu(); render(); }
  else if (action === 'article'){
    const id = parseInt(target.getAttribute('data-id'),10);
    if(!isNaN(id)){ state.view='article'; state.articleId=id; closeMenu(); render(); }
  }
  else if (action === 'cat'){
    const cat = target.getAttribute('data-cat') || '';
    state.view='home'; state.filter=cat; closeMenu(); render();
  }
  else if (action === 'scroll'){
    const el = document.getElementById(target.getAttribute('data-target'));
    if (el) el.scrollIntoView({behavior:'smooth'});
  }
  else if (action === 'top') window.scrollTo({top:0, behavior:'smooth'});
  else if (action === 'privacy') alert('Bu site özgün bir yayındır.');
  else if (action === 'contact') alert('İletişim: merhaba@erkekliksanati.example');
});

const menuBtn = document.getElementById('menuBtn');
const navMobile = document.getElementById('navMobile');
function closeMenu(){ if(navMobile) navMobile.classList.remove('open'); }
if(menuBtn && navMobile){ menuBtn.addEventListener('click', ()=>navMobile.classList.toggle('open')); }

const themeToggle = document.getElementById('themeToggle');
const html = document.documentElement;
function updateThemeIcon(theme){
  const icon = document.getElementById('themeIcon');
  if(!icon) return;
  icon.innerHTML = theme==='dark' ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>' : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
}
if(themeToggle){ themeToggle.addEventListener('click', ()=>{
  const next = html.getAttribute('data-theme')==='dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  updateThemeIcon(next);
});}
const savedTheme = localStorage.getItem('theme') || 'light';
html.setAttribute('data-theme', savedTheme);
updateThemeIcon(savedTheme);

const backTop = document.getElementById('backTop');
const progress = document.getElementById('progress');
window.addEventListener('scroll', ()=>{
  if (window.scrollY > 500) backTop?.classList.add('visible');
  else backTop?.classList.remove('visible');
  const scrollTop = window.scrollY;
  const docHeight = document.body.scrollHeight - window.innerHeight;
  const scrollPercent = (scrollTop / docHeight) * 100;
  if (progress) progress.style.width = scrollPercent + '%';
});

let fadeObserver;
function triggerFade(){
  if (fadeObserver) fadeObserver.disconnect();
  fadeObserver = new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){ entry.target.classList.add('in'); fadeObserver.unobserve(entry.target); }
    });
  }, {threshold:0.05, rootMargin:'0px 0px -40px 0px'});
  document.querySelectorAll('.fade:not(.in)').forEach(el=>fadeObserver.observe(el));
}

function animateCounters(){
  document.querySelectorAll('[data-count]').forEach(el=>{
    const target = parseInt(el.getAttribute('data-count'));
    let current = 0;
    const increment = target / 50;
    const timer = setInterval(()=>{
      current += increment;
      if (current >= target){ el.textContent = target; clearInterval(timer); }
      else el.textContent = Math.floor(current);
    }, 20);
  });
}

render();
</script>
</body>
</html>
