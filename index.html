
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Müzik Stüdyosu - Gerçek Vokal</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#0a0014,#1a0030,#0a0014);color:#e8d5f5;min-height:100vh;overflow-x:hidden}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 20px rgba(168,85,247,.4)}50%{box-shadow:0 0 50px rgba(168,85,247,.8)}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
@keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-30px) scale(1.1)}}
.orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.25;animation:orbFloat 15s ease-in-out infinite;z-index:0}
.orb1{top:10%;left:10%;width:300px;height:300px;background:rgba(168,85,247,.4)}
.orb2{bottom:10%;right:10%;width:350px;height:350px;background:rgba(236,72,153,.4);animation-delay:5s}
.orb3{top:50%;left:50%;width:250px;height:250px;background:rgba(99,102,241,.3);animation-delay:10s}
.container{max-width:900px;margin:0 auto;padding:1rem;position:relative;z-index:10}
header{text-align:center;padding:2rem 1rem}
.logo{width:80px;height:80px;background:linear-gradient(135deg,#7c3aed,#ec4899);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:2.5rem;margin:0 auto 1rem;animation:pulse 3s ease-in-out infinite}
h1{font-size:2rem;background:linear-gradient(90deg,#a855f7,#ec4899,#f9a8d4,#ec4899,#a855f7);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 4s linear infinite;margin-bottom:.5rem}
.subtitle{color:rgba(196,181,253,.7);font-size:.95rem}
.card{background:rgba(20,10,40,.5);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(168,85,247,.3);border-radius:20px;padding:1.5rem;margin-bottom:1.5rem}
.card:hover{border-color:rgba(168,85,247,.5)}
label{display:block;margin-bottom:.75rem;font-weight:700;font-size:1.1rem;color:#e8d5f5}
label span{margin-right:.5rem}
textarea{width:100%;background:rgba(0,0,0,.3);border:1px solid rgba(168,85,247,.3);border-radius:12px;padding:1rem;color:#e8d5f5;font-size:1rem;font-family:inherit;resize:vertical;line-height:1.6}
textarea:focus{outline:none;border-color:rgba(168,85,247,.6);box-shadow:0 0 0 3px rgba(168,85,247,.2)}
textarea::placeholder{color:rgba(168,85,247,.4)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
.option{padding:1rem;background:rgba(0,0,0,.3);border:1px solid rgba(168,85,247,.3);border-radius:12px;text-align:center;cursor:pointer;transition:all .3s}
.option:hover{background:rgba(168,85,247,.15);border-color:rgba(168,85,247,.5)}
.option.selected{background:linear-gradient(135deg,rgba(124,58,237,.5),rgba(236,72,153,.5));border-color:rgba(168,85,247,.8);transform:scale(1.05);box-shadow:0 5px 20px rgba(168,85,247,.3)}
.option .icon{font-size:2rem;margin-bottom:.25rem}
.option .text{font-size:.85rem;font-weight:600}
input[type=range]{width:100%;height:8px;background:rgba(168,85,247,.2);border-radius:999px;outline:none;-webkit-appearance:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;background:linear-gradient(135deg,#7c3aed,#ec4899);border-radius:50%;cursor:pointer;box-shadow:0 0 10px rgba(168,85,247,.5)}
.btn-create{width:100%;padding:1.25rem;background:linear-gradient(135deg,#7c3aed,#a855f7,#ec4899);color:#fff;border:none;border-radius:16px;font-size:1.25rem;font-weight:700;cursor:pointer;transition:all .3s;box-shadow:0 0 30px rgba(168,85,247,.5);margin-bottom:1.5rem}
.btn-create:hover{box-shadow:0 0 50px rgba(168,85,247,.8);transform:translateY(-2px)}
.btn-create:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-stop{width:100%;padding:1.25rem;background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff;border:none;border-radius:16px;font-size:1.25rem;font-weight:700;cursor:pointer;transition:all .3s;box-shadow:0 0 30px rgba(239,68,68,.5);margin-bottom:1.5rem}
.btn-stop:hover{box-shadow:0 0 50px rgba(239,68,68,.8);transform:translateY(-2px)}
.vocal-display{text-align:center;padding:2rem}
.vocal-icon{font-size:3rem;animation:float 2s ease-in-out infinite;margin-bottom:1rem}
.vocal-text{font-size:1.75rem;font-weight:700;min-height:4rem;display:flex;align-items:center;justify-content:center;background:linear-gradient(90deg,#a855f7,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;padding:0 1rem;line-height:1.4}
.progress{width:100%;height:8px;background:rgba(168,85,247,.2);border-radius:999px;overflow:hidden;margin-top:1.5rem}
.progress-fill{height:100%;background:linear-gradient(90deg,#a855f7,#ec4899);transition:width .3s;border-radius:999px}
.visualizer{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:60px;margin:1.5rem 0}
.vis-bar{width:4px;background:linear-gradient(to top,#a855f7,#ec4899);border-radius:2px;transition:height .1s}
.info{font-size:.85rem;color:rgba(196,181,253,.6);text-align:center;margin-top:1rem}
.features{display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem;margin-top:1rem}
@media(max-width:600px){.features{grid-template-columns:1fr}}
.feature{display:flex;align-items:center;gap:.5rem;font-size:.9rem}
.feature span:first-child{font-size:1.2rem}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<div class="container">
<header>
<div class="logo">🎤</div>
<h1>AI Müzik Stüdyosu</h1>
<p class="subtitle">Şarkı sözlerini yaz, gerçek sesle söylensin!</p>
</header>

<div class="card">
<label><span>📝</span> Şarkı Sözleri (Her satır ayrı söylenir)</label>
<textarea id="lyrics" rows="10" placeholder="Şarkı sözlerini buraya yaz...

Örnek:
Gece yıldızlar altında
Seninle dans ediyorum
Kalbim seninle atıyor
Bu an hiç bitmesin

Her satır gerçek sesle söylenecek!"></textarea>
</div>

<div class="card">
<label><span>✨</span> Şarkı Tarzı (Prompt - Opsiyonel)</label>
<textarea id="prompt" rows="2" placeholder="Nasıl bir şarkı istiyorsun? Örnek: Yaz geceleri için romantik pop"></textarea>
</div>

<div class="card">
<label><span>🎸</span> Müzik Türü</label>
<div class="grid" id="genreGrid"></div>
</div>

<div class="card">
<label><span>💫</span> Ruh Hali (Vokal tonunu etkiler)</label>
<div class="grid" id="moodGrid"></div>
</div>

<div class="card">
<label><span>⏱️</span> Tempo: <span id="tempoValue">120</span> BPM</label>
<input type="range" id="tempo" min="60" max="180" value="120">
</div>

<div id="buttonContainer">
<button class="btn-create" id="createBtn" onclick="createSong()">
🎤 Şarkıyı Oluştur ve Söyle
</button>
</div>

<div id="vocalContainer" style="display:none">
<div class="card">
<div class="vocal-display">
<div class="vocal-icon">🎤</div>
<div class="vocal-text" id="vocalText">...</div>
<div class="visualizer" id="visualizer"></div>
<div class="progress">
<div class="progress-fill" id="progressFill" style="width:0%"></div>
</div>
<p class="info">✨ Gerçek ses sentezi ile söyleniyor</p>
</div>
</div>
<button class="btn-stop" onclick="stopSong()">
⏹️ Durdur
</button>
</div>

<div class="card">
<h3 style="font-size:1.1rem;margin-bottom:1rem"><span style="font-size:1.5rem;margin-right:.5rem">✨</span> Neler Var?</h3>
<div class="features">
<div class="feature"><span>🎤</span><span>Gerçek vokal (ses sentezi)</span></div>
<div class="feature"><span>🥁</span><span>Gerçekçi drum beat</span></div>
<div class="feature"><span>🎸</span><span>Bass + Melodi + Akor</span></div>
<div class="feature"><span>🎵</span><span>6 farklı tür</span></div>
<div class="feature"><span>💫</span><span>6 farklı ruh hali</span></div>
<div class="feature"><span>⏱️</span><span>Ayarlanabilir tempo</span></div>
</div>
</div>
</div>

<script>
// Data
const genres = [
  {id:'pop',name:'Pop',icon:'🎤'},
  {id:'rock',name:'Rock',icon:'🎸'},
  {id:'hiphop',name:'Hip Hop',icon:'🎧'},
  {id:'electronic',name:'Electronic',icon:'🎹'},
  {id:'rnb',name:'R&B',icon:'🎵'},
  {id:'jazz',name:'Jazz',icon:'🎷'}
];

const moods = [
  {id:'happy',name:'Neşeli',icon:'😊'},
  {id:'sad',name:'Hüzünlü',icon:'😢'},
  {id:'romantic',name:'Romantik',icon:'💕'},
  {id:'energetic',name:'Enerjik',icon:'⚡'},
  {id:'chill',name:'Sakin',icon:'🌙'},
  {id:'epic',name:'Epik',icon:'🔥'}
];

let selectedGenre = 'pop';
let selectedMood = 'happy';
let tempo = 120;
let isPlaying = false;
let audioCtx = null;
let intervals = [];
let visualizerInterval = null;

// Init
function init() {
  createStars();
  renderGenres();
  renderMoods();
  setupTempo();
  loadVoices();
}

function createStars() {
  const c = document.getElementById('stars');
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.width = s.style.height = (Math.random() * 3 + 1) + 'px';
    s.style.animationDelay = Math.random() * 3 + 's';
    c.appendChild(s);
  }
}

function renderGenres() {
  document.getElementById('genreGrid').innerHTML = genres.map(g =>
    '<div class="option' + (g.id === selectedGenre ? ' selected' : '') + '" onclick="selectGenre(\'' + g.id + '\')" id="g-' + g.id + '">' +
    '<div class="icon">' + g.icon + '</div>' +
    '<div class="text">' + g.name + '</div></div>'
  ).join('');
}

function renderMoods() {
  document.getElementById('moodGrid').innerHTML = moods.map(m =>
    '<div class="option' + (m.id === selectedMood ? ' selected' : '') + '" onclick="selectMood(\'' + m.id + '\')" id="m-' + m.id + '">' +
    '<div class="icon">' + m.icon + '</div>' +
    '<div class="text">' + m.name + '</div></div>'
  ).join('');
}

function selectGenre(id) {
  selectedGenre = id;
  document.querySelectorAll('[id^="g-"]').forEach(e => e.classList.remove('selected'));
  document.getElementById('g-' + id).classList.add('selected');
}

function selectMood(id) {
  selectedMood = id;
  document.querySelectorAll('[id^="m-"]').forEach(e => e.classList.remove('selected'));
  document.getElementById('m-' + id).classList.add('selected');
}

function setupTempo() {
  const slider = document.getElementById('tempo');
  slider.addEventListener('input', function() {
    tempo = parseInt(this.value);
    document.getElementById('tempoValue').textContent = tempo;
  });
}

function loadVoices() {
  window.speechSynthesis.getVoices();
}

// Audio functions
function playKick(time) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.frequency.setValueAtTime(150, time);
  osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.5);
  gain.gain.setValueAtTime(0.8, time);
  gain.gain.exponentialRampToValueAtTime(0.01, time + 0.5);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(time);
  osc.stop(time + 0.5);
}

function playSnare(time) {
  const bufferSize = audioCtx.sampleRate * 0.2;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'highpass';
  filter.frequency.value = 1000;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.3, time);
  gain.gain.exponentialRampToValueAtTime(0.01, time + 0.2);
  noise.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  noise.start(time);
  noise.stop(time + 0.2);
}

function playHiHat(time) {
  const bufferSize = audioCtx.sampleRate * 0.05;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'highpass';
  filter.frequency.value = 5000;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.1, time);
  gain.gain.exponentialRampToValueAtTime(0.01, time + 0.05);
  noise.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);
  noise.start(time);
  noise.stop(time + 0.05);
}

function getDrumPattern() {
  const p = {
    pop: {kick:[1,0,0,0,1,0,0,0],snare:[0,0,1,0,0,0,1,0],hihat:[1,1,1,1,1,1,1,1]},
    rock: {kick:[1,0,0,0,1,0,1,0],snare:[0,0,1,0,0,0,1,0],hihat:[1,1,1,1,1,1,1,1]},
    hiphop: {kick:[1,0,0,1,0,0,1,0],snare:[0,0,1,0,0,0,1,0],hihat:[1,1,0,1,1,0,1,1]},
    electronic: {kick:[1,0,0,0,1,0,0,0],snare:[0,0,0,0,1,0,0,0],hihat:[1,1,1,1,1,1,1,1]},
    rnb: {kick:[1,0,0,0,0,0,1,0],snare:[0,0,1,0,0,0,0,1],hihat:[1,0,1,1,1,0,1,1]},
    jazz: {kick:[1,0,0,0,0,0,1,0],snare:[0,0,0,0,1,0,0,0],hihat:[1,0,1,0,1,0,1,0]}
  };
  return p[selectedGenre] || p.pop;
}

function getScale() {
  const s = {
    happy:[0,2,4,5,7,9,11], sad:[0,2,3,5,7,8,10],
    romantic:[0,2,4,5,7,9,11], energetic:[0,2,4,7,9],
    chill:[0,2,3,5,7,8,10], epic:[0,2,4,5,7,9,11]
  };
  return s[selectedMood] || s.happy;
}

function getChordProgression() {
  const isMinor = selectedMood === 'sad' || selectedMood === 'romantic' || selectedMood === 'chill';
  const p = {
    pop: {major:[0,5,3,4],minor:[0,3,5,4]},
    rock: {major:[0,3,4,0],minor:[0,3,5,4]},
    hiphop: {major:[0,3,5,4],minor:[0,3,5,4]},
    electronic: {major:[0,5,3,4],minor:[0,3,5,4]},
    rnb: {major:[0,2,5,4],minor:[0,3,5,4]},
    jazz: {major:[0,2,5,4],minor:[0,3,6,4]}
  };
  return (p[selectedGenre] || p.pop)[isMinor ? 'minor' : 'major'];
}

function startDrums() {
  const pattern = getDrumPattern();
  const beatDur = 60 / tempo / 2;
  let beat = 0;
  const id = setInterval(() => {
    const t = audioCtx.currentTime;
    if (pattern.kick[beat % 8]) playKick(t);
    if (pattern.snare[beat % 8]) playSnare(t);
    if (pattern.hihat[beat % 8]) playHiHat(t);
    beat++;
  }, beatDur * 1000);
  intervals.push(id);
}

function startBass() {
  const beatDur = 60 / tempo / 2;
  let beat = 0;
  const id = setInterval(() => {
    if (beat % 2 === 0) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();
      osc.type = 'sawtooth';
      osc.frequency.value = 40 + (beat % 8) * 3;
      filter.type = 'lowpass';
      filter.frequency.value = 200;
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }
    beat++;
  }, beatDur * 1000);
  intervals.push(id);
}

function startMelody() {
  const beatDur = 60 / tempo;
  const scale = getScale();
  let beat = 0;
  const id = setInterval(() => {
    const noteIndex = scale[beat % scale.length];
    const freq = 440 * Math.pow(2, (noteIndex - 9) / 12);
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.4);
    beat++;
  }, beatDur * 1000);
  intervals.push(id);
}

function startChords() {
  const beatDur = 60 / tempo * 4;
  const prog = getChordProgression();
  let chordIdx = 0;
  const id = setInterval(() => {
    const root = prog[chordIdx % prog.length];
    [root, root + 4, root + 7].forEach(note => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = 220 * Math.pow(2, (note - 9) / 12);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 2);
    });
    chordIdx++;
  }, beatDur * 1000);
  intervals.push(id);
}

function startVocal() {
  const lyricsText = document.getElementById('lyrics').value;
  const lines = lyricsText.split('\n').filter(l => l.trim());
  if (lines.length === 0) return;
  
  let lineIdx = 0;
  const beatDur = 60000 / tempo;
  
  function speakLine() {
    if (!isPlaying) return;
    if (lineIdx >= lines.length) lineIdx = 0;
    
    const line = lines[lineIdx];
    document.getElementById('vocalText').textContent = line;
    document.getElementById('progressFill').style.width = ((lineIdx + 1) / lines.length * 100) + '%';
    
    const utter = new SpeechSynthesisUtterance(line);
    utter.lang = 'tr-TR';
    utter.rate = selectedMood === 'energetic' ? 1.3 : selectedMood === 'chill' ? 0.7 : selectedMood === 'sad' ? 0.85 : 1.0;
    utter.pitch = selectedMood === 'happy' ? 1.3 : selectedMood === 'sad' ? 0.7 : selectedMood === 'romantic' ? 1.1 : selectedMood === 'epic' ? 0.9 : 1.0;
    utter.volume = 0.9;
    
    const voices = window.speechSynthesis.getVoices();
    const trVoice = voices.find(v => v.lang.startsWith('tr'));
    if (trVoice) utter.voice = trVoice;
    
    window.speechSynthesis.speak(utter);
    lineIdx++;
  }
  
  speakLine();
  const id = setInterval(speakLine, beatDur * 2.5);
  intervals.push(id);
}

function startVisualizer() {
  const vis = document.getElementById('visualizer');
  vis.innerHTML = '';
  for (let i = 0; i < 40; i++) {
    const bar = document.createElement('div');
    bar.className = 'vis-bar';
    bar.style.height = '5px';
    vis.appendChild(bar);
  }
  
  visualizerInterval = setInterval(() => {
    const bars = vis.querySelectorAll('.vis-bar');
    bars.forEach(bar => {
      bar.style.height = (Math.random() * 50 + 5) + 'px';
    });
  }, 100);
}

async function createSong() {
  const lyricsText = document.getElementById('lyrics').value.trim();
  if (!lyricsText) {
    alert('Lütfen şarkı sözü yaz!');
    return;
  }
  
  // Init audio
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  await audioCtx.resume();
  
  isPlaying = true;
  
  // Show vocal container, hide button
  document.getElementById('buttonContainer').style.display = 'none';
  document.getElementById('vocalContainer').style.display = 'block';
  
  // Start all audio
  startDrums();
  startBass();
  startMelody();
  startChords();
  startVocal();
  startVisualizer();
}

function stopSong() {
  isPlaying = false;
  
  // Clear all intervals
  intervals.forEach(id => clearInterval(id));
  intervals = [];
  
  if (visualizerInterval) {
    clearInterval(visualizerInterval);
    visualizerInterval = null;
  }
  
  // Stop speech
  window.speechSynthesis.cancel();
  
  // Close audio
  if (audioCtx) {
    audioCtx.close();
    audioCtx = null;
  }
  
  // Reset UI
  document.getElementById('buttonContainer').style.display = 'block';
  document.getElementById('vocalContainer').style.display = 'none';
  document.getElementById('vocalText').textContent = '...';
  document.getElementById('progressFill').style.width = '0%';
}

window.addEventListener('load', init);
</script>
</body>
</html>
