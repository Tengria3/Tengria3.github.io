        }

        function render() {
            if (state.view === 'home') app.innerHTML = renderHome();
            else if (state.view === 'article') app.innerHTML = renderArticle();
            else if (state.view === 'about') app.innerHTML = renderAbout();
            
            triggerFade();
            animateCounters();
            window.scrollTo(0, 0);
        }

        // Event Listeners
        document.addEventListener('click', e => {
            const target = e.target.closest('[data-action]');
            if (!target) return;
            e.preventDefault();
            e.stopPropagation();
            
            const action = target.getAttribute('data-action');
            
            if (action === 'home') {
                state.view = 'home';
                state.filter = '';
                closeMenu();
                render();
            } else if (action === 'about') {
                state.view = 'about';
                closeMenu();
                render();
            } else if (action === 'article') {
                const id = parseInt(target.getAttribute('data-id'), 10);
                if (!isNaN(id)) {
                    state.view = 'article';
                    state.articleId = id;
                    closeMenu();
                    render();
                }
            } else if (action === 'cat') {
                const cat = target.getAttribute('data-cat') || '';
                state.view = 'home';
                state.filter = cat;
                closeMenu();
                render();
            } else if (action === 'scroll') {
                const targetId = target.getAttribute('data-target');
                const el = document.getElementById(targetId);
                if (el) el.scrollIntoView({ behavior: 'smooth' });
            } else if (action === 'top') {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else if (action === 'privacy') {
                alert('Bu site özgün bir yayındır.');
            }
        });

        // Mobile Menu
        const menuBtn = document.getElementById('menuBtn');
        const navMobile = document.getElementById('navMobile');
        
        function closeMenu() {
            if (navMobile) navMobile.classList.remove('open');
        }

        if (menuBtn && navMobile) {
            menuBtn.addEventListener('click', () => {
                navMobile.classList.toggle('open');
            });
        }

        // Theme Toggle
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;
        
        function updateThemeIcon(theme) {
            const icon = document.getElementById('themeIcon');
            if (!icon) return;
            icon.innerHTML = theme === 'dark' ? 
                '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>' : 
                '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
        }

        if (themeToggle) {
            themeToggle.addEventListener('click', () => {
                const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                html.setAttribute('data-theme', next);
                localStorage.setItem('theme', next);
                updateThemeIcon(next);
            });
        }

        // Init Theme
        const savedTheme = localStorage.getItem('theme') || 'light';
        html.setAttribute('data-theme', savedTheme);
        updateThemeIcon(savedTheme);

        // Scroll Effects
        const backTop = document.getElementById('backTop');
        const progress = document.getElementById('progress');

        window.addEventListener('scroll', () => {
            // Show/Hide Back to Top
            if (window.scrollY > 500) {
                backTop?.classList.add('visible');
            } else {
                backTop?.classList.remove('visible');
            }

            // Update Progress Bar
            const scrollTop = window.scrollY;
            const docHeight = document.body.scrollHeight - window.innerHeight;
            const scrollPercent = (scrollTop / docHeight) * 100;
            if (progress) progress.style.width = scrollPercent + '%';
        });

        // Fade Animation Observer
        let fadeObserver;
        function triggerFade() {
            if (fadeObserver) fadeObserver.disconnect();
            fadeObserver = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('in');
                        fadeObserver.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.05, rootMargin: '0px 0px -40px 0px' });
            document.querySelectorAll('.fade:not(.in)').forEach(el => fadeObserver.observe(el));
        }

        // Counter Animation
        function animateCounters() {
            document.querySelectorAll('[data-count]').forEach(el => {
                const target = parseInt(el.getAttribute('data-count'));
                let current = 0;
                const increment = target / 50;
                const timer = setInterval(() => {
                    current += increment;
                    if (current >= target) {
                        el.textContent = target;
                        clearInterval(timer);
                    } else {
                        el.textContent = Math.floor(current);
                    }
                }, 20);
            });
        }

        // Initial Render
        render();
    </script>
