<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erkeklik Sanatı — Zamansız Erdemler, Modern Bir Rehber</title>
    <meta name="description" content="Karakter, beceri, sağlık ve ilişkiler üzerine zamansız erdemler ve modern rehberler sunan bağımsız bir yayın.">
    
    <!-- SEO & Social Tags -->
    <meta property="og:title" content="Erkeklik Sanatı — Zamansız Erdemler, Modern Bir Rehber">
    <meta property="og:description" content="Derinlemesine yazılar ve pratik rehberler ile erkekliği yeniden düşünmek.">
    <meta property="og:type" content="website">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        
        :root{
            --bg:#faf8f3;--bg-2:#f2ede3;--surface:#fff;--surface-2:#f7f3ec;
            --text:#171412;--text-2:#3d3833;--muted:#78716c;
            --border:#e7e0d3;--border-2:#d9d0bf;
            --accent:#c2410c;--accent-2:#9a3412;--gold:#b45309;
            --shadow:0 4px 16px -4px rgba(23,20,18,.08);
            --shadow-lg:0 24px 48px -16px rgba(23,20,18,.18);
            --radius:14px;--radius-lg:22px;
            --maxw:1240px;--narrow:720px;
            --ease:cubic-bezier(.22,1,.36,1)
        }

        [data-theme="dark"]{
            --bg:#0b0a09;--bg-2:#141210;--surface:#171412;--surface-2:#1f1b17;
            --text:#f5f0e8;--text-2:#d6cec2;--muted:#a29a8e;
            --border:#2a2520;--border-2:#3b342c;
            --accent:#fb923c;--accent-2:#fdba74;--gold:#fbbf24
        }

        html{scroll-behavior:smooth}
        body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .3s,color .3s}
        
        h1,h2,h3,h4{font-family:'Fraunces',Georgia,serif;font-weight:600;letter-spacing:-.02em;line-height:1.12;color:var(--text)}
        a{color:inherit;text-decoration:none}
        
        .container{max-width:var(--maxw);margin:0 auto;padding:0 24px;width:100%}
        .narrow{max-width:var(--narrow);margin:0 auto;padding:0 24px}

        /* Header */
        .site-header{position:sticky;top:0;z-index:100;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(160%) blur(18px);-webkit-backdrop-filter:saturate(160%) blur(18px);border-bottom:1px solid var(--border)}
        .site-header .container{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;gap:24px}
        
        .logo{display:flex;align-items:center;gap:9px;font-family:'Fraunces',serif;font-weight:700;font-size:1.4rem;letter-spacing:-.03em;color:var(--text);padding:0;background:none;border:none;cursor:pointer}
        .logo .mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--gold));display:grid;place-items:center;color:#fff;font-size:1rem;font-weight:900;font-family:'Fraunces',serif;box-shadow:0 4px 12px -2px color-mix(in srgb,var(--accent) 40%,transparent);flex-shrink:0}
        .logo em{font-style:normal;color:var(--accent)}
        
        .nav{display:flex;align-items:center;gap:2px}
        .nav button{padding:8px 14px;border-radius:8px;font-size:.9rem;font-weight:500;color:var(--text-2);transition:all .2s var(--ease);background:none;border:none;cursor:pointer}
        .nav button:hover{color:var(--accent);background:var(--surface-2)}
        
        .header-actions{display:flex;align-items:center;gap:8px}
        .icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--text-2);border:1px solid var(--border);background:var(--surface);transition:all .2s var(--ease);padding:0;cursor:pointer}
        .icon-btn:hover{color:var(--accent);border-color:var(--accent)}
        .icon-btn svg{width:17px;height:17px}
        
        .menu-btn{display:none}
        .nav-mobile{display:none;flex-direction:column;background:var(--surface);border-bottom:1px solid var(--border);padding:8px 24px 20px}
        .nav-mobile.open{display:flex}
        .nav-mobile button{padding:14px 0;border-bottom:1px solid var(--border);font-weight:500;color:var(--text-2);width:100%;background:none;border-left:none;border-right:none;border-top:none;cursor:pointer;text-align:left}
        .nav-mobile button:last-child{border-bottom:none}

        /* Hero Section */
        .hero{position:relative;padding:90px 0 100px;overflow:hidden;background:radial-gradient(circle at 20% 0%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 55%),radial-gradient(circle at 85% 30%,color-mix(in srgb,var(--gold) 14%,transparent),transparent 50%),var(--bg)}
        .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(var(--border) 1px,transparent 1px) 0 0/100% 80px,linear-gradient(90deg,var(--border) 1px,transparent 1px) 0 0/80px 100%;mask-image:radial-gradient(circle at center,black 10%,transparent 75%);-webkit-mask-image:radial-gradient(circle at center,black 10%,transparent 75%);opacity:.5;pointer-events:none}
        
        .hero-inner{position:relative;z-index:2;display:grid;grid-template-columns:1.25fr .85fr;gap:60px;align-items:center}
        
        .hero-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:100px;font-size:.78rem;font-weight:500;background:var(--surface);border:1px solid var(--border);color:var(--text-2);margin-bottom:24px;box-shadow:var(--shadow)}
        .hero-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
        @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}
        
        .hero h1{font-size:clamp(2.4rem,5.2vw,4.4rem);font-weight:500;letter-spacing:-.035em;line-height:1.02;margin-bottom:24px}
        .hero h1 em{font-style:italic;font-weight:400;background:linear-gradient(120deg,var(--accent),var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
        .hero p.lead{font-size:1.15rem;color:var(--text-2);max-width:560px;margin-bottom:34px;line-height:1.6}
        
        .hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:44px}
        .btn{display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border-radius:12px;font-size:.95rem;font-weight:600;background:var(--text);color:var(--bg);border:1px solid var(--text);transition:all .25s var(--ease);cursor:pointer}
        .btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
        .btn svg{width:15px;height:15px;flex-shrink:0}
        .btn-accent{background:linear-gradient(135deg,var(--accent),var(--gold));color:#fff;border-color:transparent;box-shadow:0 8px 24px -8px color-mix(in srgb,var(--accent) 60%,transparent)}
        .btn-ghost{background:transparent;color:var(--text);border-color:var(--border-2)}
        .btn-ghost:hover{background:var(--surface);border-color:var(--accent);color:var(--accent)}
        
        .hero-stats{display:flex;gap:40px;flex-wrap:wrap}
        .stat .num{font-family:'Fraunces',serif;font-size:1.9rem;font-weight:600;letter-spacing:-.03em;line-height:1;color:var(--text)}
        .stat .lbl{font-size:.78rem;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.1em;font-weight:500}
        
        .hero-visual{position:relative;height:480px;display:flex;justify-content:center;align-items:center}
        .float-card{position:absolute;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-lg);width:260px;transition:transform .6s var(--ease)}
        .float-card .tag{font-size:.7rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;font-family:'JetBrains Mono',monospace}
        .float-card .title{font-family:'Fraunces',serif;font-size:1.1rem;font-weight:600;line-height:1.3;letter-spacing:-.02em;margin-bottom:8px;color:var(--text)}
        .float-card .meta{font-size:.78rem;color:var(--muted)}
        
        .fc-1{top:20px;left:0;transform:rotate(-6deg);animation:float1 6s ease-in-out infinite}
        .fc-2{bottom:40px;right:0;transform:rotate(5deg);animation:float2 7s ease-in-out infinite}
        .fc-3{top:50%;left:50%;transform:translate(-50%,-50%) rotate(-2deg);z-index:3;width:290px;animation:float3 8s ease-in-out infinite}
        
        @keyframes float1{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(-6deg) translateY(-12px)}}
        @keyframes float2{0%,100%{transform:rotate(5deg) translateY(0)}50%{transform:rotate(5deg) translateY(-14px)}}
        @keyframes float3{0%,100%{transform:translate(-50%,-50%) rotate(-2deg)}50%{transform:translate(-50%,calc(-50% - 10px)) rotate(-2deg)}}

        section{padding:80px 0;position:relative}
        
        .section-head{margin-bottom:44px;display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap}
        .section-head .kicker{font-family:'JetBrains Mono',monospace;font-size:.72rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:12px;display:block}
        .section-head h2{font-size:clamp(1.8rem,3.2vw,2.6rem);letter-spacing:-.03em;font-weight:500;max-width:640px}
        .section-head p{color:var(--muted);margin-top:12px;max-width:520px;font-size:1rem}
        
        .link-arrow{font-size:.88rem;font-weight:600;color:var(--accent);display:inline-flex;align-items:center;gap:6px;padding:6px 0;background:none;border:none;cursor:pointer}

        /* Bento Grid */
        .bento{display:grid;grid-template-columns:1.5fr 1fr 1fr;grid-template-rows:auto auto;gap:20px}
        .bento-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;transition:all .35s var(--ease);display:flex;flex-direction:column;width:100%;cursor:pointer;text-align:left}
        .bento-item:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--shadow-lg)}
        .bento-hero{grid-column:span 2;grid-row:span 2;min-height:420px;justify-content:flex-end;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 8%,var(--surface)),var(--surface))}
        .bento-hero h3{font-size:clamp(1.6rem,2.6vw,2.2rem);font-weight:500;line-height:1.15;margin-bottom:14px}
        .bento-item h3{font-size:1.18rem;font-weight:600;line-height:1.3;margin-bottom:10px}
        .bento-item p{color:var(--muted);font-size:.92rem;line-height:1.6;flex:1}
        .bento-item .tag{font-family:'JetBrains Mono',monospace;font-size:.68rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:14px;display:inline-block}
        .bento-item .meta{font-size:.78rem;color:var(--muted);margin-top:16px;display:flex;align-items:center;gap:10px}
        .bento-item .meta .dot{width:3px;height:3px;border-radius:50%;background:var(--muted)}

        /* Categories */
        .cats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
        .cat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px 20px;transition:all .3s var(--ease);width:100%;cursor:pointer;text-align:left}
        .cat-card:hover{border-color:var(--accent);transform:translateY(-3px)}
        .cat-card .icon{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);color:var(--accent);margin-bottom:16px;transition:all .3s var(--ease)}
        .cat-card:hover .icon{background:var(--accent);color:#fff;transform:rotate(-6deg) scale(1.05)}
        .cat-card .icon svg{width:20px;height:20px}
        .cat-card h3{font-size:1.02rem;font-weight:600;margin-bottom:4px}
        .cat-card .count{font-size:.78rem;color:var(--muted);font-family:'JetBrains Mono',monospace}

        /* Filters & Articles Grid */
        .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:32px}
        .chip{padding:8px 16px;border-radius:100px;font-size:.84rem;font-weight:500;border:1px solid var(--border);background:var(--surface);color:var(--text-2);transition:all .2s var(--ease);cursor:pointer}
        .chip:hover{border-color:var(--accent);color:var(--accent)}
        .chip.active{background:var(--text);color:var(--bg);border-color:var(--text)}

        .articles-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
        .art-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column;transition:all .35s var(--ease);width:100%;cursor:pointer;text-align:left}
        .art-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg);border-color:var(--border-2)}
        .art-visual{aspect-ratio:16/9;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--surface-2),var(--bg-2));display:grid;place-items:center}
        .art-visual .mono-letter{font-family:'Fraunces',serif;font-size:5rem;font-weight:900;font-style:italic;color:color-mix(in srgb,var(--accent) 22%,transparent);line-height:1;transition:transform .5s var(--ease)}
        .art-card:hover .art-visual .mono-letter{transform:scale(1.12) rotate(-3deg);color:color-mix(in srgb,var(--accent) 40%,transparent)}
        .art-body{padding:22px;display:flex;flex-direction:column;flex:1}
        .art-body .tag{font-family:'JetBrains Mono',monospace;font-size:.68rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
        .art-body h3{font-size:1.15rem;font-weight:600;line-height:1.3;margin-bottom:10px;transition:color .2s}
        .art-card:hover .art-body h3{color:var(--accent)}
        .art-body p{font-size:.9rem;color:var(--muted);line-height:1.6;flex:1;margin-bottom:16px}
        .art-body .foot{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;color:var(--muted);padding-top:14px;border-top:1px solid var(--border)}
        .art-body .foot .read{color:var(--accent);font-weight:600}

        /* Quote Band */
        .quote-band{background:var(--text);color:var(--bg);padding:90px 0;position:relative;overflow:hidden}
        .quote-band::before{content:"";position:absolute;top:-40%;right:-10%;width:600px;height:600px;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 30%,transparent),transparent 65%);pointer-events:none}
        .quote-band .container{position:relative;z-index:2;text-align:center;max-width:820px}
        .quote-band blockquote{font-family:'Fraunces',serif;font-size:clamp(1.5rem,3.2vw,2.4rem);font-weight:400;font-style:italic;line-height:1.3;letter-spacing:-.02em;margin-bottom:28px}
        .quote-band cite{font-style:normal;font-family:'JetBrains Mono',monospace;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:color-mix(in srgb,var(--bg) 65%,transparent)}

        /* Newsletter */
        .newsletter{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:60px 40px;text-align:center;position:relative;overflow:hidden}
        .newsletter::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--accent),var(--gold),var(--accent))}
        .newsletter h2{font-size:1.8rem;margin-bottom:12px}
        .newsletter p{color:var(--muted);margin-bottom:24px;max-width:400px;margin-inline:auto}
        #newsletterForm{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
        #newsletterForm input{padding:12px 16px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);min-width:250px;font-family:inherit}
        .newsletter small{display:block;color:var(--muted);font-size:.78rem;margin-top:14px}

        /* Reader View */
        .reader{padding:70px 0}
        .reader .back{display:inline-flex;align-items:center;gap:8px;font-size:.88rem;font-weight:600;color:var(--accent);margin-bottom:40px;padding:6px 0;background:none;border:none;cursor:pointer}
        .reader .kicker{font-family:'JetBrains Mono',monospace;font-size:.72rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:18px;display:block}
        .reader h1{font-size:clamp(2rem,4vw,3.2rem);font-weight:500;letter-spacing:-.03em;line-height:1.05;margin-bottom:22px}
        .reader .meta{display:flex;align-items:center;gap:14px;padding-bottom:28px;margin-bottom:44px;border-bottom:1px solid var(--border);font-size:.86rem;color:var(--muted);flex-wrap:wrap}
        .reader .meta .dot{width:4px;height:4px;border-radius:50%;background:var(--muted)}
        .reader .content .lead{font-family:'Fraunces',serif;font-size:1.35rem;line-height:1.5;color:var(--text-2);font-style:italic;margin-bottom:36px;font-weight:400}
        .reader .content p{margin-bottom:22px;font-size:1.08rem;line-height:1.75;color:var(--text-2)}
        .reader .content h2{font-size:1.6rem;font-weight:600;letter-spacing:-.02em;margin:48px 0 18px;color:var(--text);position:relative;padding-left:18px}
        .reader .content h2::before{content:"";position:absolute;left:0;top:.35em;bottom:.35em;width:3px;background:linear-gradient(180deg,var(--accent),var(--gold));border-radius:2px}
        .reader .content ul,.reader .content ol{margin:0 0 24px 22px}
        .reader .content li{margin-bottom:12px;font-size:1.05rem;line-height:1.7;color:var(--text-2)}
        .reader .content li strong{color:var(--text);font-weight:600}
        .reader .content blockquote{border-left:3px solid var(--accent);background:var(--surface-2);padding:22px 26px;margin:32px 0;border-radius:0 var(--radius) var(--radius) 0;font-family:'Fraunces',serif;font-style:italic;font-size:1.18rem;line-height:1.5;color:var(--text)}
        .reader .content strong{color:var(--text);font-weight:600}
        .reader .tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:48px;padding-top:28px;border-top:1px solid var(--border)}
        .reader .tags span{font-size:.78rem;padding:6px 14px;background:var(--surface-2);border-radius:100px;color:var(--text-2);font-weight:500}

        /* About Page */
        .about-hero{padding:80px 0 40px;text-align:center}
        .about-hero h1{font-size:clamp(2rem,4vw,3.2rem);letter-spacing:-.03em;font-weight:500;margin-bottom:20px}
        .about-hero p{font-size:1.15rem;color:var(--text-2);max-width:640px;margin:0 auto}
        .about-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;margin:60px 0}
        .about-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:30px}
        .about-card .num{font-family:'Fraunces',serif;font-size:1.4rem;font-weight:600;color:var(--accent);margin-bottom:14px}
        .about-card h3{font-size:1.15rem;font-weight:600;margin-bottom:10px}
        .about-card p{color:var(--muted);font-size:.94rem;line-height:1.65}

        /* Footer */
        .site-footer{background:var(--surface);border-top:1px solid var(--border);padding:70px 0 30px;margin-top:40px}
        .footer-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:48px;margin-bottom:50px}
        .footer-brand .logo{margin-bottom:18px}
        .footer-brand p{color:var(--muted);font-size:.92rem;max-width:320px;line-height:1.7}
        .footer-col h4{font-family:'Inter',sans-serif;font-size:.76rem;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--text);margin-bottom:18px}
        .footer-col button{display:block;color:var(--muted);font-size:.9rem;padding:6px 0;transition:color .2s;width:100%;background:none;border:none;cursor:pointer;text-align:left}
        .footer-col button:hover{color:var(--accent)}
        .footer-bottom{padding-top:30px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:.84rem;color:var(--muted);flex-wrap:wrap;gap:16px}

        /* Back to Top */
        .back-top{position:fixed;bottom:30px;right:30px;width:48px;height:48px;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center;border:none;cursor:pointer;opacity:0;visibility:hidden;transition:all .3s var(--ease);z-index:90;box-shadow:var(--shadow-lg)}
        .back-top.visible{opacity:1;visibility:visible}
        .back-top:hover{transform:translateY(-3px)}
        .back-top svg{width:20px;height:20px}

        /* Progress Bar */
        .progress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--gold));z-index:1000;transition:width .1s linear;width:0}

        /* Animations */
        .fade{opacity:0;transform:translateY(20px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
        .fade.in{opacity:1;transform:translateY(0)}

        /* Responsive */
        @media (max-width:1020px){
            .hero-inner{grid-template-columns:1fr;gap:40px}
            .hero-visual{height:380px;max-width:520px;margin:0 auto}
            .bento{grid-template-columns:1fr 1fr}
            .bento-hero{grid-column:span 2;grid-row:auto}
            .footer-grid{grid-template-columns:1fr 1fr;gap:36px}
        }
        @media (max-width:700px){
            section{padding:60px 0}
            .hero{padding:50px 0 60px}
            .nav{display:none}
            .menu-btn{display:grid}
            .hero-stats{gap:24px}
            .stat .num{font-size:1.5rem}
            .hero-visual{height:340px}
            .float-card{width:220px;padding:16px}
            .fc-3{width:240px}
            .bento{grid-template-columns:1fr}
            .bento-hero{grid-column:auto;min-height:320px}

        const ARTICLES=[
            {id:1,cat:'İlişkiler',date:'12 Ekim 2026',read:'9 dk',tags:['Arkadaşlık','Modern Hayat','Bağ Kurma'],title:'Erkekler Neden 30’undan Sonra Yalnızlaşır?',excerpt:'Telefonunda yüzlerce kişi var ama arayacak kimsen yok. Bu bir zayıflık değil, yapısal bir sorun — ve çözülebilir.',lead:'Birçok erkek, otuzuna geldiğinde telefonunda yüzlerce kişi varken gerçek bir dostu olmadığını fark eder. Bu, kişisel bir başarısızlık değildir. Yapısal bir sorundur — ve çözülebilir.',body:`<p>Yirmili yaşlarının sonuna doğru birçok erkek, tuhaf bir boşlukla karşılaşır. Üniversiteden, işten ya da mahalleden tanıdığı insanlarla bağlar gevşer. Mesajlaşmalar azalır, buluşmalar iptal olur. Otuzlu yaşlara gelindiğinde ise, acil bir durumda aranabilecek tek bir isim bile kalmamış olabilir.</p><p>Bu yalnızlık, modern yaşamın getirdiği bir yan etkidir. İş temposu, dijital iletişim, şehirleşme... Hepsi, derin bağlar kurmayı zorlaştırır. Ama bu kader değildir.</p><h2>Neden oluyor?</h2><p><strong>1. Enerji Dağılımı:</strong> Gençken enerji sosyal ortamlara harcanır. Yetişkinlikte ise kariyer ve aile öncelik kazanır. Arkadaşlıklar, listenin en altına düşer.</p><p><strong>2. Rekabet Kültürü:</strong> Erkekler arasında samimiyet, bazen zaaf olarak algılanır. Duygular paylaşılmaz, sadece "hal hatır" sorulur.</p><p><strong>3. Pasif Bekleyiş:</strong> "Onlar arasın" bekleyişi yaygındır. Her iki taraf da harekete geçmeyince, sessizlik büyür.</p><h2>Ne yapmalı?</h2><p><strong>Aktif Olun:</strong> İlk mesajı atan siz olun. Randevulaşın. Plan yapın.</p><p><strong>Ortak Aktivite Bulun:</strong> Sadece oturup konuşmak yerine, birlikte bir şeyler yapın. Spor, oyun, proje. Ortak amaç, bağı güçlendirir.</p><p><strong>Vakit Ayırın:</strong> Arkadaşlık, bakımlı bir bahçe gibidir. Sulamazsanız, solar.</p><p><strong>Duygusal Derinlik Katın:</strong> Sadece hava durumu hakkında değil, hayalleriniz, korkularınız ve hedefleriniz hakkında konuşun.</p><blockquote>Sessizlik, iletişimin yokluğu değildir. Bazen, en derin anlaşmanın başlangıcıdır.</blockquote><h2>Pratik Adımlar</h2><ul><li>Eski arkadaşlarınıza ulaşın. "Nasılsın?" demek için bir bahaneye ihtiyacınız yok.</li><li>Yeni hobiler edinin. Kurslara katılın, kulüplere üye olun.</li><li>Çocuklarınız varsa, onların arkadaşlarıyla tanışın. Ebeveyn grupları, yeni dostluklar için iyi bir kaynaktır.</li><li>Online topluluklardan offline buluşmalara geçin.</li></ul><h2>Sonuç</h2><p>Yalnızlık bir kader değil, bir alışkanlıktır. Ve her alışkanlık gibi, yerine yenisini koymadıkça kırılmaz. Bugün tek bir mesajla başla. Yarın bir kahveyle. Ertesi hafta bir yürüyüşle. Üç ay sonra, o sessiz boşluğun yerini dolduran birkaç isim göreceksin.</p><p>Erkek dostluğu, hayatın en büyük sığınağıdır. İnşa etmesi zaman alır; ama bir kez inşa edildi mi, hayat boyu ayakta kalır.</p>`},
            {id:2,cat:'Karakter',date:'10 Ekim 2026',read:'8 dk',tags:['Alışkanlık','Disiplin','Sabah'],title:'Bir Erkeğin Sabah Rutini: Güne Sağlam Başlamanın 5 İlkesi',excerpt:'Sabah nasıl başlarsa gün öyle gider. İrade değil, sistem kur — ve gün ilk dakikadan senin olsun.',lead:'Sabah nasıl başlarsa, gün öyle gider. Ama iyi bir sabah irade gerektirmez — sistem gerektirir. İrade her gün tükenir; sistem kendini taşır.',body:`<p>Birçok erkek güne yenik başlar. Alarm çalar, telefon uzanır, ekran aydınlanır. Beş dakika diye başlayan kaydırma, yarım saat olur. Kalktığında ise gün çoktan başlamıştır — ama sen henüz başlamamışsındır.</p><p>Güne hakim olmak, kontrolü ele almaktır. İşte bunu sağlayan beş temel ilke:</p><h2>1. Telefonu Uzak Tut</h2><p>Uyanır uyanmaz telefona sarılmak, beynini dış dünyanın gürültüsüne açar. Bildirimler, haberler, mesajlar... Bunlar, senin gündemin değil, başkalarının ajandasıdır. İlk 30 dakika telefonu görmeden geçir.</p><h2>2. Su İç</h2><p>Gece boyunca dehidrate olursun. Vücudun susuzdur. Bir bardak su içmek, metabolizmanı canlandırır ve zihnini netleştirir. Kahveden önce su.</p><h2>3. Hareket Et</h2><p>Yoğun bir antrenman şart değil. Esneme hareketleri, kısa bir yürüyüş veya yoga... Önemli olan kan akışını hızlandırmak ve bedeni uyandırmaktır. Hareket, motivasyonu tetikler.</p><h2>4. Gününü Planla</h2><p>En önemli üç görevini belirle. Geri kalanı bonus olsun. Net bir plan, karar yorgunluğunu önler. Ne yapacağını bilmek, enerjini korur.</p><h2>5. Zihinsel Hazırlık</h2><p>Birkaç dakika meditasyon veya günlük tutma. Düşüncelerini kağıda dökmek, zihni temizler. Minnettarlık listesi oluşturmak, pozitif bir çerçeve sağlar.</p><blockquote>Rutin, özgürlüğün düşmanı değil, anahtarıdır.</blockquote><h2>Sonuç</h2><p>Sabah rutini, sihirli bir formül değildir. Ama küçük adımlarla büyük değişimler yaratır. Bugün birini dene. Yarın birini ekle. Bir ay sonra, güne farklı başlayacaksın. Ve o fark, günün tamamını etkileyecek.</p>`},
            {id:3,cat:'Beceri',date:'8 Ekim 2026',read:'7 dk',tags:['İletişim','Beden Dili','Karizma'],title:'İlk İzlenim Sanatı: İlk 30 Saniyede Güven Vermek',excerpt:'İnsanlar seni tanımak için yıllar harcamaz. İlk yarım dakikada bir izlenim oluşur ve kolay değişmez.',lead:'İnsanlar sizi tanımak için yıllar harcamaz. İlk 30 saniyede bir izlenim oluşur ve o izlenim kolay kolay değişmez. İyi haber: bu 30 saniye kontrol edilebilir.',body:`<p>Bir toplantıya girdiğinde, bir davete katıldığında ya da biriyle ilk kez tanıştığında, karşı tarafın zihninde üç şey hızla belirir: <em>Bu kişi tehdit mi?</em>, <em>Bu kişi güvenilir mi?</em>, <em>Bu kişi benim gibi mi?</em></p><p>Cevaplar, sözcüklerden önce gelir. Beden dili, ses tonu ve göz teması, asıl mesajı verir.</p><h2>Göz Teması: Dengeli Ol</h2><p>Çok fazla bakmak ürkütücü, hiç bakmamak güvensizdir. Yaklaşık %60–70 oranında göz teması, ideal kabul edilir. Dinlerken bak, konuşurken ara sıra kaçır. Bu, doğal ve ilgi dolu görünmeni sağlar.</p><h2>Duruş: Açık ve Rahat</h2><p>Kollarını kavuşturmak, savunmacı bir duruştur. Omuzların geride, göğsün açık olmalı. Hafifçe eğilmek, ilgiyi gösterir. Ayakta dururken ağırlığını eşit dağıt. Titrek eller, stres belirtisidir. Ellerin cepte olmamalı, serbest ve rahat durmalı.</p><h2>Selamlaşma: Kararlı Ol</h2><p>El sıkışırken avucunu yukarı çevirme (boyun eğme sinyali). Dikey el pozisyonu, eşitliği gösterir. Sıkı ama nazik bir tutuş, güven verir. Göz temasıyla birlikte gülümse. Samimi bir gülümseme, duvarları yıkar.</p><h2>Ses Tonu: Sakin ve Net</h2><p>Hızlı konuşmak, heyecanlı veya gergin olduğunuzu ima eder. Yavaşlamak, otorite ve sakinlik kazandırır. Sesini alçaltmak yerine, netliğini artır. Kelimeleri yutma. Duraksamak, düşündüğünü gösterir; bu da zeka işaretidir.</p><h2>Kıyafet: Bağlama Uygun</h2><p>Ortama göre giyinmek, nezaket göstergesidir. Ne fazla resmi, ne özensiz. Temiz, ütülü ve bakımlı olmak yeterlidir. Pahalı markalar değil, detaylar dikkat çeker.</p><blockquote>Karizma doğuştan değil, alışkanlıktır.</blockquote><h2>Sonuç</h2><p>İlk izlenim, tek seferde mükemmel olmak zorunda değildir. Önemli olan, kasıtlı olmaktır. Farkında olmadan yapılan hataları minimize etmek, bilinçli davranışlarla mümkün olur. Bir sonraki tanışmanda, bu detaylara odaklan. Farkı hissedeceksin.</p>`},
            {id:5,cat:'Beceri',date:'4 Ekim 2026',read:'10 dk',tags:['Pratik','Tamir','Bağımsızlık'],title:'Her Erkeğin Bilmesi Gereken 7 Temel Tamir Becerisi',excerpt:'Modern hayat erkeği beceriksizleştirdi. Oysa bir tornavida tutmak, özgüvenin en somut halidir.',lead:'Modern hayat, erkeği beceriksizleştirdi. Oysa bir tornavida tutmak, özgüvenin en somut halidir. Kendi işini yapan adam, kimseye mecbur olmayan adamdır.',body:`<p>Yüz yıl önce her erkek, evindeki basit tamirleri kendisi yapardı. Yüz yıl sonra, bir ampul değiştirmek için bile "usta" çağırıyoruz. Bu sadece bir pratiklik kaybı değil; bir özgüven kaybıdır.</p><p>Bir şeyi kendi elinle tamir etmek, kendine olan güveni somutlaştırır. Bu yüzden aşağıdaki yedi beceri, lüks değil, bir erkeğin temel donanımıdır.</p><h2>1. Lastik Değiştirmek</h2><p>Yolda kalma ihtimali binde bir olsa bile, o binde bir geldiğinde yanınızda kimse olmayacak. Bagajda stepne, kriko ve bijon anahtarı bulundurun. Arabanızı tanıyın: kriko nereye oturur, bijonlar hangi yöne açılır, stepnenin hava basıncı kaç olmalı?</p><p>YouTube'da milyonlarca video var. Bir pazar öğleden sonrasını ayırın. Öğrendikten sonra asla unutmayacaksınız.</p><h2>2. Sigorta Kutusunu Tanımak</h2><p>Elektrik kesildiğinde panik yapan erkek, sigortasını tanımayan erkektir. Evin sigorta kutusunu açın. Hangi şalter hangi odayı kontrol ediyor, not alın. Bir kağıt bant ve kalem ile üzerlerine yazın.</p><p>Sigorta atınca ne yapılır? Önce o cihazı fişten çekin. Sonra şalteri kaldırın. Atma devam ederse, o hatta bağlı bir cihazda sorun var demektir.</p><h2>3. Musluk Tamiri</h2><p>Damlayan bir musluk, hem su israfı hem de sinir bozucudur. Çoğu zaman conta değişimi yeterlidir. Contaları söküp marketten aynı modeli bulmak, basit bir iştir. Silikon uygulaması da önemlidir.</p><h2>4. Duvara Tablo Asmak</h2><p>Dübel seçimi kritiktir. Beton duvar mı, alçıpan mı? Doğru matkap ucu ve dübel tipi, tablonun düşmesini engeller. Su terazisi kullanmak, estetik açıdan zorunludur.</p><h2>5. Basit Elektrik İşleri</h2><p>Lamba kablosu değişimi, priz kapağı takma gibi işler tehlikesizdir. Ana şalteri kapatmayı unutmayın. Renk kodlarını öğrenin: Faz (kahverengi/siyah), Nötr (mavi), Toprak (sarı-yeşil).</p><h2>6. Basit Marangozluk ve Ahşap İşleri</h2><p>Bir çekmece rafı, bir kitaplık, bir tamir — ahşap işleri, erkeğin el becerisini geliştirir. Sadece üç aletle başlayın: bir testere, bir matkap, bir zımpara. İlk projeyi basit tutun. Yanlış keserseniz, düzeltmek yerine yeni tahta alın.</p><p>Bu beceri, size sadece mobilya kazandırmaz. Sabrı ve el-göz koordinasyonunu da öğretir.</p><h2>7. İlk Yardım</h2><p>Bu listeye son ama en önemli madde. Kanamayı durdurmak, yanığı soğutmak, kırığa müdahale etmek, boğulmakta olan birine Heimlich manevrası yapmak — bu beceriler hayat kurtarır.</p><p>Kızılay'ın ücretsiz ilk yardım eğitimleri var. Bir hafta sonunuzu ayırın. Öğrendiğiniz bilgiyi asla umarız kullanmanız gerekmez; ama gerekirse, o an sizin elinizde olacak.</p><h2>Sonuç</h2><p>Bu yedi beceri, bir erkeği "erkek" yapmaz. Bunu zaten yapan şey başkadır. Ama bu beceriler, erkeğe bir tür <strong>iç huzur</strong> verir: <em>Kendi başımın çaresine bakabilirim.</em> Bu huzur, paha biçilemez.</p><p>Bugün birini öğrenmeye başlayın. Haftaya bir kaputu aç. Sadece bak. Yarın, bir kontrol yap. Bir hafta sonra, bir şeyi tamir et. Bir ay sonra, artık arabanı tanıyor olacaksın. Ve o tanıma, sana bir güven verecek: kendi başının çaresine bakabilirim.</p>`},
            {id:6,cat:'Zihin',date:'2 Ekim 2026',read:'7 dk',tags:['Duygular','Özdenetim','Zihin'],title:'Öfke Yönetimi: Sakin Kalan Erkek Daha Güçlüdür',excerpt:'Öfke kötü değildir. Kontrolsüz öfke kötüdür. Aradaki fark, güç ile zayıflık arasındaki farktır.',lead:'Öfke kötü değildir. Kontrolsüz öfke kötüdür. Aradaki fark, güçle zayıflık arasındaki farktır. Öfkesini taşıyan erkek güçlüdür; öfkesine yenilen erkek değil.',body:`<p>Birçok erkek, öfkeyi ya bastırır ya patlatır. İkisi de yanlıştır. Bastırmak, içeride çürütür; patlatmak, dışarıda yıkar. Doğru yol, üçüncüsüdür: <strong>öfkeyi tanımak, anlamak ve yönetmek.</strong></p><h2>Öfke Nedir?</h2><p>Öfke, birincil bir duygu değildir. Genellikle başka duyguların maskesidir. Korku, utanç, hayal kırıklığı, çaresizlik... Bunlar, öfke altında gizlenir. Öfkelendiğinde kendine sor: "Aslında ne hissediyorum?"</p><h2>Fizyolojik Tepki</h2><p>Öfke anında adrenalin salgılanır. Kalp atışı hızlanır, kaslar gerilir. Bu, savaş ya da kaç tepkisidir. Modern dünyada, bu tepki genellikle uygunsuzdur. Trafikte, ofiste, evde... Fiziksel mücadele yoktur. Bu yüzden, fizyolojik tepkiyi sakinleştirmek gerekir.</p><h2>Stratejiler</h2><p><strong>1. Durakla:</strong> Tepki vermeden önce 10 saniye bekle. Derin nefes al. Bu süre, prefrontal korteksin devreye girmesini sağlar. Mantık, duyguyu yener.</p><p><strong>2. Yeniden Çerçevele:</strong> "Bu beni saygısızlığa uğrattı" yerine, "Bu kişi muhtemelen zor bir gün geçiriyor" de. Empati, öfkeyi yumuşatır.</p><p><strong>3. Alan Yarat:</strong> Tartışmadan uzaklaş. "Şu an konuşamayacağım, yarın devam edelim" de. Kaçmak değil, stratejik geri çekilmektir.</p><p><strong>4. Yaz:</strong> Hislerini kağıda dök. Yazmak, duyguları organize eder ve yoğunluğunu azaltır.</p><blockquote>Sakin kalan erkek, zayıf değildir. Tam tersi. Öfkeye kapılmak kolaydır; sakin kalmak, güçtür.</blockquote><h2>Sonuç</h2><p>Öfke yönetimi, duygusal zekanın temelidir. Hayatında kontrol sahibi olmak istiyorsan, önce kendi öfkeni kontrol et. Bu, uzun vadeli bir maratondur. Mükemmelliği hedefleme. Sadece daha iyi olmaya çalış. Her gün biraz daha sakin, biraz daha bilinçli.</p>`},
            {id:7,cat:'Stil',date:'30 Eylül 2026',read:'6 dk',tags:['Stil','Takım Elbise','Giyim'],title:'İlk Takım Elbise Rehberi: Doğru Beden, Doğru Renk, Doğru Kumaş',excerpt:'Takım elbise, erkeğin zırhıdır. Ama yanlış seçilirse zırh değil, yük olur.',lead:'Takım elbise, erkeğin zırhıdır. Doğru seçildiğinde özgüveni iki katına çıkarır. Yanlış seçildiğinde ise bir yük olur.',body:`<p>Bir erkeğin hayatında birkaç an vardır ki takım elbise giymesi gerekir: bir mülakat, bir düğün, bir cenaze, önemli bir toplantı, bir ödül töreni. Bu anlarda üzerindeki elbise, sadece bir kumaş parçası değildir. Kendisiyle ilgili verdiği bir mesajdır.</p><p>İyi bir takım elbise, ucuz olmak zorunda değildir. Ama <em>doğru</em> olmak zorundadır. Doğru beden, doğru renk, doğru kumaş.</p><h2>Beden: En Kritik Üç Nokta</h2><p>Bir takım elbisenin bedeni, üç yerden değerlendirilir. Bu üç yer oturuyorsa, elbise size oturmuş demektir.</p><ul><li><strong>Omuzlar.</strong> Elbise omuzdan oturmalı; ne sarkmalı, ne sıkmış gibi durmalı. Omuz, elbisenin geri kalanının temelidir. Omuz olmuyorsa, elbise olmuyor demektir — çünkü omuz daraltılamaz, sadece genişletilebilir.</li><li><strong>Göğüs ve Bel.</strong> Göğüs bölgesi düz durmalı, ama hareket alanı bırakmalı. Bel, vücudun doğal hattını takip etmeli. Ne torba gibi, ne korse gibi.</li><li><strong>Kollar ve Paçalar.</strong> Ceketin kolları, gömleğin manşetini bir santim göstermelidir. Pantolon paçası, ayakkabının üstüne hafifçe değmeli — ne topukta toplanmalı, ne bilekte kesilmeli.</li></ul><blockquote>Elbise seni değil, sen elbiseyi taşırsın. Bunu unutma.</blockquote><h2>Renk: Klasikten Şaşma</h2><p>İlk takım elbise için önerilen renkler: <strong>Lacivert</strong> ve <strong>Koyu Gri</strong>. Siyah, sadece cenaze ve gece davetleri içindir. Gündüz giyilen siyah takım, garson veya güvenlik görevlisi izlenimi verebilir.</p><p>Lacivert, güven ve profesyonellik simgesidir. Koyu gri, nötr ve şıktır. Her ikisi de beyaz, açık mavi veya pembe gömleklerle uyumludur.</p><h2>Kumaş: Mevsime Uygun</h2><p>Yün, en dayanıklı ve terletmeyen kumaştır. Sentetik karışımlar ucuzdur ama hava almaz. Ter kokusu, stilinizi bitirir. Yaz için keten veya pamuk karışımı, kış için kalın yün tercih edin.</p><h2>Sonuç</h2><p>İyi bir takım elbise, ucuz olmak zorunda değildir. Ama iyi bir terzi, ucuz olan elbiseyi pahalı gösterebilir. Bu yüzden satın almadan önce iki şeyi düşün: <strong>doğru beden</strong> ve <strong>iyi terzi.</strong> Bu ikisi varsa, elbisenin fiyatı ikinci plandadır.</p><p>Unutma: elbise, seni daha iyi bir insan yapmaz. Ama kendine duyduğun saygıyı gösterir. Bu saygı, herkesin gözünde bir karizmadır.</p>`},
            {id:12,cat:'Sağlık',date:'20 Eylül 2026',read:'7 dk',tags:['Uyku','Sağlık','Zihin'],title:'Uyku ve Zihin Sağlığı: Erkeklerin En Çok İhmal Ettiği İlaç',excerpt:'Kronik uykusuzluk sadece yorgunluk değildir. Öfke, kaygı ve düşük testosteronun da sebebidir.',lead:'Kronik uykusuzluk, sadece yorgunluk değildir. Öfke, kaygı, karar bozukluğu ve düşük testosteronun da sebebidir. Ve çoğu erkek, uykusuzluğunu bir "başarı" olarak görür.',body:`<p>Bir erkeğin en büyük yanılgılarından biri, az uyumayı bir erdem sanmaktır. "Ben 5 saatle idare ederim", "Uyku tembelliktir", "Gece çalışmak daha verimli" — bu cümleler, modern erkek mitlerinin parçasıdır. Ama bilimsel gerçekler farklıdır.</p><h2>Uyku Eksikliğinin Bedeli</h2><p>Uyku, beynin temizlenme sürecidir. Toksinler atılır, bilgiler konsolide edilir. Uyku eksikliğinde:</p><ul><li><strong>Konsantrasyon düşer.</strong> Dikkat dağınıklığı artar.</li><li><strong>Duygusal denge bozulur.</strong> Öfke ve kaygı seviyesi yükselir.</li><li><strong>Testosteron azalır.</strong> Kronik uykusuzluk, testosteron seviyesini %10-15 düşürebilir.</li><li><strong>Bağışıklık sistemi zayıflar.</strong> Hastalıklara açık hale gelirsiniz.</li></ul><h2>İyileştirmenin Yedi Yolu</h2><ol><li><strong>Aynı saatte yat, aynı saatte kalk.</strong> Hafta sonu bile. Vücut bir ritme alışır ve bu ritme güvenmek ister.</li><li><strong>Yatmadan 1 saat önce ekranı bırak.</strong> Mavi ışık, melatonin (uyku hormonu) üretimini bozar. Alternatif: kitap, sohbet, sessizlik.</li><li><strong>Odayı karanlık ve serin yap.</strong> İdeal sıcaklık: 18–20 derece. Tam karanlık için kalın perde ya da uyku maskesi.</li><li><strong>Kafeini öğleden sonra kes.</strong> Kafeinin yarı ömrü 5–6 saattir. Öğleden sonra 3’te içilen kahve, akşam 9'da hâlâ etkidedir.</li><li><strong>Alkol tüketimini azalt.</strong> Alkol, uykuya dalışı kolaylaştırır ama uyku kalitesini bozar. REM uykusunu baskılar.</li><li><strong>Düzenli egzersiz yap.</strong> Egzersiz, uykuyu derinleştirir. Ama yatmadan hemen önce ağır spor yapma.</li><li><strong>Rutin oluştur.</strong> Ilık bir duş, hafif esneme, okuma... Beynine "uyku vakti" sinyalini ver.</li></ol><blockquote>Uyku, lüks değil, ihtiyaçtır. Onu ihmal eden, sağlığını borçlandırır.</blockquote><h2>Sonuç</h2><p>Uyku, performansınızı artıran en etkili araçtır. Daha az uyuyarak daha çok çalışmak, bir illüzyondur. Gerçek verimlilik, dinlenmiş bir zihinle mümkündür. Bu gece, erken yat. Yarın, farkı göreceksin.</p>`},
            {id:13,cat:'Kariyer',date:'18 Eylül 2026',read:'7 dk',tags:['Kariyer','Mülakat','İş'],title:'Mülakat Sanatı: İşe Alınmanın Görünmeyen Kuralları',excerpt:'İyi bir CV kapıyı açar. Ama mülakatta kazanan şey, CV değildir.',lead:'İyi bir CV, kapıyı aralar. Ama mülakatta kazanan şey CV değildir. Karşı taraf, senin ne bildiğini zaten biliyor. Şimdi merak ettiği şu: sen nasıl bir insansın?',body:`<p>Bir mülakata giren çoğu erkek, yanlış sorulara hazırlanır. "Kendinizden bahsedin", "güçlü yönleriniz neler", "zayıf yönleriniz neler" — bu sorular, artık klişe. İyi bir mülakatçı, bunları sormaz bile. Asıl konular:</p><ul><li>Problemleri nasıl çözdün?</li><li>Takım içinde nasıl çalıştın?</li><li>Başarısızlıktan ne öğrendin?</li><li>Bizi neden seçtin?</li></ul><h2>Hikâye Anlat, Madde Sayma</h2><p>"5 yıl şu şirkette çalıştım, sonra buraya geçtim, orada şu projeyi yönettim" — bu bir özgeçmiş okumasıdır. Mülakatçının umurunda değil. O, hikâyenin içindeki <em>seni</em> görmek istiyor.</p><p>STAR tekniği: <strong>S</strong>ituation (Durum), <strong>T</strong>ask (Görev), <strong>A</strong>ction (Aksiyon), <strong>R</strong>esult (Sonuç). Her cevabında bu dörtlüyü kullan.</p><blockquote>İnsanlar veriyi unutur, hikâyeyi hatırlar.</blockquote><h2>Zayıflıklarını Sorduğunda</h2><p>"Zayıf yönüm mükemmeliyetçilik" demek, en kötü cevaptır. Yapay ve sahte. Gerçek bir zayıflık söyle ve <em>ne yaptığını</em> ekle. "Sunum yaparken heyecanlanırım; bu yüzden her sunumdan önce üç kez prova yapıyorum. Son iki yılda beş büyük sunum yaptım ve hepsi iyi geçti."</p><p>Bu cevap, hem dürüstlüğü hem de çözüm üretme becerisini gösterir. İkisi de işe alınmanın anahtarıdır.</p><h2>Sen de Soru Sor</h2><p>Mülakat tek yönlü değildir. Karşı taraf da seni değerlendiriyor; sen de onları. İyi bir aday, mülakatın sonunda üç-dört soru sorar. Bu, hem ilgi gösterir hem de doğru kararı vermene yardımcı olur.</p><ul><li>"Bu pozisyonda başarılı olmanın ölçütü nedir?"</li><li>"Ekibin en büyük zorluğu şu an ne?"</li><li>"Şirket kültürünüzü nasıl tanımlarsınız?"</li></ul><h2>Sonuç</h2><p>Mülakat, bir sınav değil, bir diyaloğdur. Karşındaki insanı tanı, kendini anlat. Doğal ol, ama hazırlıklı ol. Unutma: işe alınan kişi, en yetenekli değil, en uyumlu ve en potansiyelli kişidir.</p>`},
            {id:18,cat:'Karakter',date:'8 Eylül 2026',read:'8 dk',tags:['Duygular','Erkeklik','Ağlamak'],title:'Erkekler ve Gözyaşı: Ağlamanın Gücü',excerpt:'"Erkek adam ağlamaz" cümlesi, bir erkeğin duygusal hayatını çürütmüştür.',lead:'"Erkek adam ağlamaz" — bu cümle, çoğu erkeğin çocukluğundan itibaren duyduğu en ağır yalan. Ağlamak zayıflık değildir. Ağlamak, duygunun bedenden taşmasıdır. Ve taşmayan duygu, içeride çürür.',body:`<p>Bir erkek, çocukluğundan itibaren şu cümleyle büyür: "Ağlama, erkek adam ağlamaz." Bu cümle, bir disiplin aracı olarak söylenir. Ama sonuç, bir ömür boyu taşınan bir duygusal kilittir.</p><h2>Ağlamanın Biyolojisi</h2><p>Gözyaşı, stresi azaltır. Kortizol seviyesini düşürür. Ağlamak, bedenin kendini temizleme mekanizmasıdır. Engellenen ağlama, bedende birikir. Baş ağrısı, mide spazmı, kronik yorgunluk... Bunlar, bastırılmış duyguların fiziksel yansımalarıdır.</p><h2>Duygusal Zeka ve Ağlama</h2><p>Duygularını tanıyan erkek, empati kurabilir. Kendi acısını yaşayan, başkasının acısını da anlar. Ağlamayan erkek, duygusal olarak körleşir. İlişkileri yüzeysel kalır. Eşiyle, çocuğuyla, dostuyla derin bağlar kuramaz.</p><h2>Toplumun Algısı</h2><p>Toplum, ağlayan erkeği zayıf görür. Ama bu, eski bir kalıptır. Modern psikoloji, duygusal ifadeyi güç olarak tanımlar. Cesur erkek, duygularından kaçmaz. Onlarla yüzleşir.</p><blockquote>Ağlamak, yenilgi değil, cesaret eylemidir.</blockquote><h2>Sonuç</h2><p>Erkek adam ağlamaz, yalanı, yüzyıllar boyunca milyonlarca erkeği duygusal olarak sakat bıraktı. Bu zinciri kır. Kendin için kır. Oğlun için kır. Torunun için kır.</p><p>Ağla, gerektiğinde. Yalnız da, bir dostun omzunda da. Ama ağla. Çünkü gözyaşı, zayıflık değil, bir arınma, bir şifa, bir özgürlüktür. Ağlamayan erkek, yarı bir adamdır.</p>`},
            {id:19,cat:'Karakter',date:'6 Eylül 2026',read:'8 dk',tags:['Yalnızlık','İç Huzur','Kendilik'],title:'Kendinle Baş Başa: Yalnızlığın Sanatı',excerpt:'Yalnız kalamayan erkek, kendini hiç tanımaz. Çünkü kendini tanımak, sessizlikte olur.',lead:'Yalnız kalabilmek, bir erkeğin en büyük güçlerinden biridir. Çünkü kendini tanımak, ancak sessizlikte, kalabalıksız, gürültüsüz, ekransız bir alanda olur.',body:`<p>Modern erkek, yalnızlıktan korkar. Boş bir akşam, boş bir hafta sonu, kimsenin aramadığı bir gün — hepsi bir tür başarısızlık gibi görünür. Oysa yalnızlık, bir başarısızlık değil, bir fırsattır.</p><h2>Yalnızlık vs. Tek Başınalık</h2><p>Tek başınalık, fiziksel bir durumdur. Kimse yanında değildir. Yalnızlık ise ruhsal bir seçimdir. Kendi şirketinle vakit geçirmek, kendi düşüncelerinle sohbet etmek, kendi ruhunla yüzleşmek. Bu besler, çünkü insan ruhsal bir varlıktır.</p><p>İkisini karıştıran erkek, tek başınalıktan kaçar. Oysa kaçtığı şey, aslında kendisidir.</p><blockquote>Kendisiyle baş başa kalamayan erkek, hayatı boyunca başkalarının şirketinde kendini arar. Ve bulamaz.</blockquote><h2>Yalnızlığın Üç Katmanı</h2><p><strong>Birinci katman: Fiziksel yalnızlık.</strong> Kimsenin olmadığı bir oda, bir yürüyüş, bir yolculuk. Bu, en kolay katmandır. Sadece kimseyi çağırmazsın, olur biter.</p><p><strong>İkinci katman: Dijital oruç.</strong> Telefondan, internetten, sosyal medyadan uzak durmak. Gürültüyü kesmek. Bu, zihni sakinleştirir.</p><p><strong>Üçüncü katman: Ruhsal derinlik.</strong> Meditasyon, dua, felsefe, sanat. Kendi değerlerini sorgulamak. Kim olduğunu, ne istediğini, niçin yaşadığını düşünmek. Bu, en zor ama en verimli katmandır.</p><h2>Yaratıcılık ve Yalnızlık</h2><p>Büyük sanatçılar, düşünürler, liderler... Hepsi, yalnız kaldıkları anlarda keşifler yaptı.</p><p>Yalnızlık, yaratıcılığın kuluçka odasıdır. Kalabalık, üretimi hızlandırır ama derinliği öldürür. Derin olmak istiyorsan, yalnız kal.</p><h2>Sonuç</h2><p>Yalnızlık bir ceza değil, bir armağandır. Onu kucaklayan erkek, kendini bulur. Onu reddeden erkek, sürekli başkalarında kendini arar — ve bulamaz.</p><p>Bugün bir saat yalnız kal. Yarın iki. Bir ay sonra, kendinle tanışmış olacaksın. Ve o tanışma, hayatının geri kalanını değiştirecek.</p>`},
            {id:22,cat:'Beceri',date:'31 Ağustos 2026',read:'7 dk',tags:['Araba','Motor','Bakım'],title:'Araba Motorunu Tanımak: Kaputun Altında Ne Var?',excerpt:'Arabanı tanımayan erkek, yolda kalınca panikler. Tanıyan erkek ise çözer.',lead:'Çoğu erkek, arabasını sadece kullanır. Ama tanımaz. Kaputu açtığında, ne gördüğünü bilmez. Oysa bir erkeğin arabasını tanıması, bağımsızlığının ve güvenliğinin temelidir.',body:`<p>Modern hayat, erkeği araba kullanmaya alıştırdı ama araba tanımaya alıştırmadı. Servise gider, cüzdanı açar, çıkar. Oysa bir erkeğin arabası hakkında temel bilgiye sahip olması, hem para tasarrufu sağlar hem de acil durumlarda hayat kurtarır.</p><h2>Temel Parçalar</h2><ul><li><strong>Motor Yağı:</strong> Motorun kanıdır. Seviyesini ve rengini kontrol et. Koyu siyahsa, değişim zamanı gelmiştir.</li><li><strong>Soğutma Suyu:</strong> Motoru aşırı ısınmadan korur. Genleşme deposundaki seviyeyi izle. Azaldıysa, sızıntı olabilir.</li><li><strong>Akü:</strong> Araç çalışmıyorsa, ilk bakılacak yer aküdür. Kutuplardaki oksitlenmeyi temizle.</li><li><strong>Fren Balataları:</strong> Sürtünme sesi geliyorsa, balatalar bitmiştir. Acil servis gerektirir.</li></ul><h2>Aylık Kontrol Listesi</h2><p>Her ay, 5 dakikanı ayırıp şu kontrolleri yap:</p><ol><li><strong>Yağ seviyesi.</strong> Motor soğukken çubuğu çıkar, sil, tekrar sok, çıkar. İki çizgi arasında olmalı.</li><li><strong>Motor suyu.</strong> Genleşme deposuna bak. Min-Max arası olmalı.</li><li><strong>Fren hidroliği.</strong> Min çizgisinin altındaysa, servise git. Fren, ciddi bir iştir.</li><li><strong>Cam suyu.</strong> Bittiğinde ekle. Yaz aylarında da lazım (böcekler için).</li><li><strong>Akü kutupları.</strong> Beyaz tortu varsa, sıcak su ve fırça ile temizle.</li></ol><h2>Sonuç</h2><p>Arabayı tanımak, onu sürmekten fazlasıdır. Ona saygı duymaktır. Bakımlı bir araba, güvenli bir yolculuktur. Ve güvenli bir yolculuk, huzurlu bir hayattır.</p><p>Bugün kaputu aç. Sadece bak. Yarın, bir kontrol yap. Bir hafta sonra, bir şeyi tamir et. Bir ay sonra, artık arabanı tanıyor olacaksın. Ve o tanıma, sana bir güven verecek: kendi başının çaresine bakabilirim.</p>`},
            {id:29,cat:'İlişkiler',date:'17 Ağustos 2026',read:'8 dk',tags:['İlişki','Kadın','Anlayış'],title:'Kadınları Anlamak: Klişelerden Kurtulmak',excerpt:'Kadınları anlamak, bir kod çözmek değildir. Bir insanı tanımaktır.',lead:'"Kadınları anlamak imkânsız" derler. Bu, hem yanlış hem de tehlikeli bir klişedir. Kadınlar, farklı bir tür değildir. Sadece farklı bir bireydir. Ve her birey gibi, tanınmayı bekler.',body:`<p>Erkekler arasında yaygın bir söylenti vardır: "Kadınlar anlaşılmaz." Bu, bir klişedir. Ama tehlikeli bir klişedir. Çünkü "anlaşılmaz" dediğin şeyi anlamaya çalışmayı bırakırsın. Ve ilişki, anlayışsızlıkla ölür.</p><h2>Klişeleri Kırmak</h2><p><strong>Klişe: "Kadınlar mantıksızdır."</strong> Gerçek: Kadınlar, farklı bir veri setiyle karar verir. Duygular, deneyimler, sosyal bağlar... Bunlar, erkeklerin göz ardı ettiği faktörlerdir. Mantıksız değil, farklı rasyoneldir.</p><p><strong>Klişe: "Kadınlar çok konuşur."</strong> Gerçek: Kadınlar, iletişim kurar. Erkekler, bilgi aktarır. İkisi de geçerli yöntemdir. Ama kadınlar için konuşmak, bağ kurmaktır.</p><p><strong>Klişe: "Kadınlar duygusaldır."</strong> Gerçek: Kadınlar, duygularını ifade etmeye teşvik edilir. Erkekler, bastırmaya. Duygu aynı; ifade farklı.</p><p><strong>Klişe: "Kadınlar para sever."</strong> Gerçek: Kadınlar, güvenlik sever. Para, güvenliğin bir biçimidir. Ama tek biçimi değildir.</p><p><strong>Klişe: "Kadınlar anlaşılmaz."</strong> Gerçek: Kadınlar, erkeklerin kendilerini dinlemediğini düşünür. Anlaşılmamak, anlaşılmaz olmak değildir.</p><blockquote>Kadınları anlamak, bir kod çözmek değildir. Bir insanı tanımaktır. Ve her insan, tanınmayı hak eder.</blockquote><h2>Kadınları Tanımak, İnsanları Tanımaktır</h2><p>Her kadın farklıdır. Bir kadını tanıdığınızda, kadınları tanımış olmazsınız. Sadece o kadını tanımış olursunuz. Genellemeler, tanımaya değil, tanımamaya hizmet eder.</p><p>Bu yüzden sorular sorun. Merak edin. Dinleyin. Kendi deneyiminizi dayatmayın. Onun deneyimini öğrenin.</p><h2>Kendini de Tanı</h2><p>Kadınları anlamak, kendini anlamaktan geçer. Kendi duygularını tanımayan erkek, başkasının duygularını da tanıyamaz. Kendi ihtiyaçlarını bilmeyen erkek, başkasının ihtiyaçlarını da bilemez.</p><p>Bu yüzden önce kendine bak. Kendi korkularını, isteklerini, sınırlarını bil. Sonra karşındakini anlamaya çalış.</p><h2>Sonuç</h2><p>Kadınları anlamak, bir bilim değildir. Bir sanattır. Ve her sanat gibi, pratikle gelişir. Bugün bir kadını dinle. Gerçekten dinle. Sormadan, yargılamadan, çözüm sunmadan.</p><p>Belki bir şey öğrenirsin. Belki çok şey. Belki de en önemlisi: karşındaki kişinin, senin gibi bir insan olduğunu hatırlarsın.</p>`},
            {id:30,cat:'İlişkiler',date:'15 Ağustos 2026',read:'7 dk',tags:['Buluşma','İlişki','Modern'],title:'İlk Buluşma: Modern Zamanlarda Erkek Olmak',excerpt:'İlk buluşma, bir performans değildir. Bir tanışmadır. Sen de karşı tarafı tanımaya gidiyorsun.',lead:'İlk buluşma, çoğu erkek için bir sınav gibi gelir. Oysa bir sınav değildir. Bir tanışmadır. Sen de karşı tarafı tanımaya gidiyorsun. Yani iki taraf da değerlendiriyor.',body:`<p>Modern buluşma dünyası, karmaşıklaştı. Uygulamalar, mesajlar, beklentiler, kurallar. Ama özünde, iki insanın bir masada oturup birbirini tanımaya çalışmasıdır. Bu, basit bir süreçtir.</p><h2>Hazırlık</h2><p><strong>Mekan Seçimi:</strong> Gürültülü bir bar değil, sohbet edilebilecek bir kafe veya restoran. İlk buluşmada yemek yerine kahve veya aperatif daha iyidir. Çıkış süresini kontrol edebilirsin.</p><p><strong>Kıyafet:</strong> Temiz, bakımlı, ortama uygun. Aşırı formal olma, ama özensiz de olma. Kendini rahat hissettiğin kıyafet, özgüvenini yansıtır.</p><p><strong>Zamanlama:</strong> Geç kalma. Erken gitme. Tam vaktinde ol. Bu, saygı göstergesidir.</p><h2>Sohbet Konuları</h2><p><strong>Olumlu konular:</strong></p><ul><li>Hobiler, ilgi alanları, tutkular.</li><li>Seyahat, kitaplar, filmler, müzik.</li><li>Çocukluk, aile, memleket.</li><li>Hayaller, hedefler, ilhamlar.</li><li>Komik hikâyeler, çocukluk anıları.</li></ul><p><strong>Kaçınılacak konular:</strong></p><ul><li>Eski ilişkiler.</li><li>Politika ve din (ilk buluşmada).</li><li>Para, maaş, maddi durum.</li><li>Şikâyet, dedikodu, negatiflik.</li><li>Evlilik, çocuk, gelecek planı (çok erken).</li></ul><h2>Ödeme</h2><p>Erkek olarak, ödemeyi teklif et. Ama ısrar etme. Karşı taraf "paylaşalım" derse, kabul et. Modern dünyada, cinsiyet rolleri esnektir. Önemli olan, nezaket ve saygıdır.</p><h2>Sonuç</h2><p>İlk buluşma, mükemmel olmak zorunda değildir. Sadece gerçek olmak zorundadır. Rol yapma. Kendin ol. Eğer uyum yoksa, bu bir başarısızlık değildir. Bir filtredir. Doğru kişiyi bulana kadar filtrelemeye devam et.</p><p>Ve unutma: Karşı taraf da seni değerlendiriyor. Bu, karşılıklı bir süreçtir. Rahat ol.</p>`},
            {id:31,cat:'İlişkiler',date:'13 Ağustos 2026',read:'7 dk',tags:['Arkadaşlık','Rekabet','Erkek'],title:'Arkadaşlık ve Rekabet: Erkekler Arası Dinamikler',excerpt:'Erkek arkadaşlığı, rekabeti içinde barındırır. Ama doğru yönetilirse, bu bir güç olur.',lead:'Erkek arkadaşlığı, kadın arkadaşlığından farklıdır. İçinde rekabet barındırır. Ama bu rekabet, bir zayıflık değildir. Doğru yönetilirse, bir güçtür.',body:`<p>İki erkek bir araya geldiğinde, ilk birkaç dakika içinde bir tür hiyerarşi kurulur. Kim daha güçlü, kim daha zeki, kim daha komik, kim daha başarılı. Bu, ilkel bir dürtüdür. Ama modern erkek, bunu bilinçli yönetebilir.</p><h2>Sağlıklı Rekabet</h2><p>Sağlıklı rekabet, birbirini motive eder. "O koştu, ben de koşmalıyım." "O terfi aldı, ben de çalışmalıyım." Bu, büyüme iticisidir. Kazananı tebrik eder, kaybedeni desteklersin. Bağ, zamanla zayıflar, ama kopmaz.</p><p><strong>Toksik Rekabet.</strong> Birbirini küçültür. Kaybedenle alay eder. Kazananı çekemez. Zamanla bağ kopar, düşmanlık başlar.</p><p>Aradaki fark, niyet. Sağlıklı rekabette, "seni geçmek istiyorum ama senin iyiliğini de istiyorum." Toksik rekabette, "seni geçmek istiyorum, ne olursan ol."</p><h2>Erkek Arkadaşlığında Sırlar</h2><p>Erkekler, çoğu zaman duygularını paylaşmaz. Ama yakın dostluklarda, bazı sırlar paylaşılır. Bu paylaşım, güvenin göstergesidir.</p><p>Bir arkadaşın sana sırrını verdiğinde, bu bir onurdur. Onu koru. Kimseye söyleme. Sadakat, erkek arkadaşlığının temel taşıdır.</p><h2>Sonuç</h2><p>Rekabet, kaçınılmazdır. Ama onu düşmanlığa dönüştürmemek senin elindedir. Arkadaşlarını rakip değil, partner olarak gör. Birlikte yükselin. Çünkü tek başına zirveye çıkmak, yalnız bir zaferdir. Beraber çıkmak ise, anlamlı bir maceradır.</p>`},
            {id:32,cat:'İlişkiler',date:'11 Ağustos 2026',read:'7 dk',tags:['Aile','Sınır','İlişki'],title:'Aile ile Sınır Koymak: Sevmek, Boyun Eğmek Değildir',excerpt:'Ailenle sağlıklı bir ilişki kurmak, sınır koymaktan geçer. Sınır, sevgisizlik değil, saygıdır.',lead:'Ailenle sağlıklı bir ilişki kurmak, sınır koymaktan geçer. Ama çoğu erkek, sınır koymayı sevgisizlik sanır. Oysa sınır, sevgisizlik değil, saygıdır. Hem kendine hem karşı tarafa.',body:`<p>Türkiye'de erkek olmak, aileyle iç içe olmak demektir. Aile, sadece akrabalık değildir; bir kimlik, bir aidiyet, bir güvenlik ağıdır. Ama aynı zamanda, bir baskı mekanizması da olabilir.</p><h2>Neden Sınır Koymak Zor?</h2><p><strong>Suçluluk Duygusu:</strong> "Annemi üzmemeliyim", "Babama saygısızlık etmemeliyim". Bu cümleler, çocukluktan beri kafamıza kazınmıştır. Ama yetişkin bir birey olarak, kendi hayatını kurmak hakkındır.</p><p><strong>Kültürel Baskı:</strong> "Evlat anne-babasını dinler". Bu, geleneksel bir normdur. Ama modern dünyada, bağımsızlık ve sorumluluk dengesi aranır.</p><h2>Sınır Nasıl Konur?</h2><p><strong>Net Ol:</strong> "Hayır" demek, suçluluk duymak zorunda değildir. Nazik ama kararlı ol. "Seni seviyorum ama bu konuda farklı düşünüyoruz."</p><p><strong>Tutarlı Ol:</strong> Bir gün izin ver, ertesi gün yasaklama. Bu, kafa karıştırır. Sınırların, prensiplerin olsun.</p><p><strong>Alternatif Sun:</strong> "Bu cumartesi gelemem ama pazar öğleden sonra müsaitim." Reddetmek, tamamen kapanmak değildir.</p><h2>Sonuç</h2><p>Sınır koymak, sevgisizlik değildir. Aksine, sağlıklı bir ilişkinin temelidir. Sınırsız ilişkiler, tükenmişliğe ve kırgınlığa yol açar. Kendine saygı duy ki, başkaları da sana saygı duysun.</p><p>Aileni sev. Ama onlara boyun eğme. Kendi yolunu kur. Bu, ihanet değil, olgunluktur.</p>`},
            {id:33,cat:'Aile',date:'9 Ağustos 2026',read:'8 dk',tags:['Evlilik','Ortaklık','Eş'],title:'Eş Olmak: Evlilikte Ortaklık Kurmak',excerpt:'Evlilik, bir yarış değildir. Bir ortaklıktır. Kazanan ya da kaybeden yoktur; sadece birlikte büyüme vardır.',lead:'Evlilik, bir yarış değildir. Bir ortaklıktır. Ama çoğu erkek, evliliği bir "kontrol" ilişkisi olarak görür. Oysa sağlıklı evlilik, iki bütün insanın ortak bir hayat kurmasıdır.',body:`<p>Evlilik, çoğu erkeğin hayatının en büyük kararıdır. Ama çoğu erkek, bu karara yeterince hazırlanmaz. Ne duygusal, ne ekonomik, ne de felsefi olarak. Ve sonuç, hayal kırıklığıdır.</p><h2>Tuzaklar</h2><p><strong>Tuzak 1: Erkek, "geçim kaynağı" rolüne sıkışır.</strong> Para getirir ama duygusal olarak evden uzaklaşır. Eş, yalnız kalır. Çocuk, babasız büyür.</p><p><strong>Tuzak 2: Kadın, "ev yöneticisi" rolüne sıkışır.</strong> Çocuk, temizlik, yemek — hepsi ona yüklenir. Kariyeri, hayalleri ertelenir. Küskünlük birikir.</p><p><strong>Tuzak 3: Roller katılaşır.</strong> "Ben para getiriyorum, sen evi yönet." Bu, bir iş sözleşmesidir, evlilik değil. Zamanla soğukluk ve kopukluk yaratır.</p><p><strong>Tuzak 4: İletişim kaybolur.</strong> Sohbet, sadece lojistik olur. "Faturalar ödendi mi?", "Çocuğu aldın mı?". Duygusal bağ, kopar.</p><h2>Ortaklık Nasıl Kurulur?</h2><p><strong>Paylaş:</strong> Yükleri, kararları, hayalleri paylaş. Tek taraflı fedakarlık, sürdürülebilir değildir.</p><p><strong>Dinle:</strong> Eşinin sözünü kesme. Yargılama. Anlamaya çalış. Bazen sadece dinlemek, çözmekten daha iyidir.</p><p><strong>Destekle:</strong> Eşinin hayallerini kendi hayalin gibi sahiplen. Büyümesine engel olma. Teşvik et.</p><p><strong>Zaman Ayır:</strong> Sadece ebeveyn veya çalışan olarak değil, eş olarak vakit geçirin. Randevulaşın. Flört edin.</p><blockquote>Evlilik, iki yarım insanın bir bütünü oluşturması değildir. İki bütün insanın, ortak bir bütünden daha büyük bir şey yaratmasıdır.</blockquote><h2>Sonuç</h2><p>Eş olmak, bir unvan değil, bir eylemdir. Her gün yeniden seçmektir. Zorluklar karşısında pes etmemek, birlikte gülmek, birlikte ağlamak. Bu, emek ister. Ama verilen emek, hayatın en güzel meyvesini verir: Sağlam bir yuva.</p>`},
            {id:38,cat:'Kariyer',date:'30 Temmuz 2026',read:'8 dk',tags:['Zaman','Verimlilik','Odak'],title:'Zaman Yönetimi: Erkekler İçin Pratik Sistem',excerpt:'Zamanı yönetmek, aslında kendini yönetmektir. Ve bu, öğrenilebilir bir beceridir.',lead:'Zamanı yönetmek, aslında kendini yönetmektir. Çoğu erkek, zamanı yönetemediğinden şikâyet eder. Ama aslında zamanı değil, dikkatini yönetemiyordur.',body:`<p>Herkesin 24 saati var. Ama bazı erkekler, o 24 saatte bir imparatorluk kurar. Bazıları ise hiçbir şey yapmaz. Aradaki fark, zaman değil, yönetimdir.</p><p>Zaman yönetimi, bir dizi teknik değildir. Bir zihniyettir. Önceliklendirmek, delegasyona açık olmak ve odaklanmak.</p><h2>Pomodoro Tekniği</h2><p>25 dakika çalış, 5 dakika mola ver. Dört turdan sonra 15-30 dakika uzun mola. Bu, zihnin tazelenmesini sağlar. Uzun süreli çalışma, verimi düşürür. Beyin, aynı anda iki bilişsel görevi yapamaz. Multitasking, bir mittir.</p><h2>Eisenhower Matrisi</h2><p>Görevleri dört kategoriye ayır:</p><ul><li><strong>Acele ve Önemli:</strong> Hemen yap.</li><li><strong>Önemli ama Acele Değil:</strong> Planla.</li><li><strong>Acele ama Önemsiz:</strong> Devret.</li><li><strong>Ne Acele Ne Önemli:</strong> Ele.</li></ul><p>Çoğu erkek, "acele" olanlara odaklanır. Ama "önemli" olanlar, uzun vadeli başarıyı getirir. Stratejik düşün.</p><h2>Delegasyon</h2><p>Her şeyi kendin yapma. Güvendiğin insanlara iş devret. Bu, zayıflık değil, liderliktir. Kontrol manyağı olmak, verimi öldürür.</p><h2>Sabır ve Tutarlılık</h2><p>Sistemler, bir gecede çalışmaz. Deneme-yanılma sürecidir. Ama vazgeçme. Sabır, en büyük sermayedir.</p><blockquote>Zaman, geri dönüşü olmayan tek kaynaktır. Onu harcama, yatır.</blockquote><h2>Sonuç</h2><p>Zaman yönetimi, daha çok iş yapmak değildir. Daha az ama daha kaliteli iş yapmaktır. Odaklan. Önceliklendir. Ve kendine şefkat göster. Yorulduğunda, dur. Dinlen. Çünkü dinlenmiş bir zihin, taze bir zihindir.</p>`},
            {id:42,cat:'Stil',date:'22 Temmuz 2026',read:'7 dk',tags:['Ayakkabı','Stil','Bakım'],title:'Ayakkabı Rehberi: Erkek Ayakkabı Temelleri',excerpt:'Ayakkabı, bir erkeğin stilinin temelidir. İnsanlar ayakkabına bakar; farkında olmasan bile.',lead:'Ayakkabı, bir erkeğin stilinin temelidir. İnsanlar ayakkabına bakar; farkında olmasan bile. Bakımlı bir ayakkabı, tüm kıyafeti yükseltir. Bakımsız bir ayakkabı, pahalı bir takımı bile düşürür.',body:`<p>Çoğu erkek, kıyafete önem verir ama ayakkabıyı ihmal eder. Oysa ayakkabı, bir erkeğin stilinin en görünür parçasıdır. Ve en çok yargılanan.</p><h2>Temel Modeller</h2><p><strong>Oxford:</strong> Kapalı bağcık sistemi. Resmi ve klasik. Takım elbiseyle ideal.</p><p><strong>Derby:</strong> Açık bağcık sistemi. Daha rahat. Casual takım elbiselerle uyumlu.</p><p><strong>Monk Strap:</strong> Tokalı. Şık ve farklı. Ofis ortamında dikkat çeker.</p><p><strong>Loafer:</strong> Bağcıksız. Yazlık ve gündelik. Sokak stilinde popüler.</p><p><strong>Brogue:</strong> Delikli desen. Klasik ama sportif. Köy havası verir.</p><h2>Renk ve Kombin</h2><p><strong>Siyah:</strong> Resmi. Gece davetleri, cenaze, iş görüşmesi. Kot pantolonla kombinlenmez.</p><p><strong>Kahverengi:</strong> Gündelik ve semi-formal. Lacivert takım elbiseyle mükemmel uyum sağlar.</p><p><strong>Bordo/Taba:</strong> Cesur seçenekler. Stil sahibi erkekler için.</p><p><strong>Beyaz:</strong> Sadece spor. Resmi kombinlerde asla.</p><h2>Bakım</h2><p>Ayakkabı, bakım ister. Her giydikten sonra fırçala. Nemlendirici krem sür. Kalıp kullan, şeklini korusun. Aynı ayakkabıyı üst üste giyme. Derinin nefes almasına izin ver.</p><h2>Yaygın Hatalar</h2><ul><li><strong>Spor ayakkabıyla takım elbise.</strong> Bazı istisnalar var ama genelde yanlış.</li><li><strong>Bakımsız ayakkabı.</strong> Çizik, kirli, solmuş. Tüm kıyafeti düşürür.</li><li><strong>Yanlış beden.</strong> Sıkı ya da bol. Ayak, ayakkabının içinde kaymamalı.</li><li><strong>Aynı ayakkabıyı her gün.</strong> Ayakkabının dinlenmeye ihtiyacı vardır.</li><li><strong>Beyaz çorap.</strong> Resmi kombinlerde asla.</li></ul><h2>Sonuç</h2><p>Ayakkabı, bir erkeğin stilinin temelidir. Ama daha ötesi, kendine duyduğu saygının göstergesidir. Bakımlı ayakkabı, sadece bir aksesuar değil, bir karakter işaretidir.</p><p>Bugün ayakkabılarını temizle. Yarın bir boya al. Bir hafta sonra, bir çift kaliteli ayakkabı için araştırma yap. Bir ay sonra, ayakkabı dolabın, bambaşka bir yer olacak.</p>`},
            {id:43,cat:'Stil',date:'20 Temmuz 2026',read:'7 dk',tags:['Sakal','Bakım','Stil'],title:'Sakal Bakımı: Modern Erkeğin Rehberi',excerpt:'Sakal, bir erkeğin yüzüne karakter katar. Ama bakımsız sakal, karakter değil, kaos verir.',lead:'Sakal, bir erkeğin yüzüne karakter katar. Ama bakımsız sakal, karakter değil, kaos verir. Sakal, bir sorumluluktur. Düzenli bakım, doğru şekil, doğru ürünler.',body:`<p>Son yıllarda sakal, bir moda haline geldi. Ama moda, herkese uygun değildir. Sakal, yüz şekline, yaşa, mesleğe, kişiliğe uygun olmalıdır. Ve her şeyden önce, bakımlı olmalıdır.</p><p>Sakal, bir erkeğin yüzüne maskülen bir hava katar. Doğru şekilde bakıldığında, çene hattını belirginleştirir, yüzü uzatır ya da genişletir, yaşlılık belirtilerini örter. Ama bakımsız sakal, tam tersi etki yapar.</p><h2>Yüz Şekline Göre Sakal</h2><p><strong>Oval yüz.</strong> Şanslısın. Her sakal şekli uyar. Kısa, orta, uzun.</p><p><strong>Yuvarlak yüz.</strong> Sakal, uzun ve sivri olmalı. Yanlar kısa, çene uzun. Bu, yüzü uzatır.</p><p><strong>Kare yüz.</strong> Kısa sakal, tam sakal. Uzun sakal, yüzü daha sert gösterir. Yumuşatmak için kenarları kısalt.</p><p><strong>Uzun yüz.</strong> Yanları dolgun tut. Çene kısmını kısa bırak. Bu, yüzü genişletir.</p><h2>Sakal Türleri</h2><p><strong>1. Stubble (Kirli Sakal).</strong> 3–5 mm. Modern, genç, bakımı kolay. Haftada 2–3 kez tıraş makinesiyle.</p><p><strong>2. Orta Sakal.</strong> 1–2 cm. Klasik, maskülen. Günlük bakım ister.</p><p><strong>3. Tam Sakal.</strong> 3+ cm. Ciddi, olgun. Ciddi bakım ister.</p><p><strong>4. Keçi Sakalı.</strong> Çene ve bıyık. Sanatsal, entelektüel.</p><p><strong>5. Van Dyke.</strong> Bıyık + çene, ayrı. Klasik, tiyatral.</p><h2>Sakal Bakımı</h2><p><strong>1. Yıkama.</strong> Haftada 3–4 kez, sakal şampuanıyla. Normal şampuan, sert, kurutur. Sakal şampuanı, yumuşak ve besleyici.</p><p><strong>2. Şekillendirme.</strong> Haftada 2–3 kez makine ile kenarları temizle. Ense ve yanak çizgisi net olmalı.</p><p><strong>3. Nemlendirme.</strong> Sakal yağı veya balsam. Her gün kullan. Kaşıntıyı önler, parlaklık verir.</p><p><strong>4. Tarama.</strong> Fırça veya tarak. Karışıklığı önler, şekli korur.</p><h2>Sakal mı, Tıraş mı?</h2><p><strong>Sakal.</strong> Oval yüz, zayıf çene, genç görünüm, maskülen stil. Ayrıca, sakal büyütmek, erkeği daha olgun ve otoriter gösterir.</p><p><strong>Tıraş.</strong> Kısa yüz, dolgun çene, temiz görünüm, resmi meslek. Ayrıca, bazı kadınlar, temiz tıraşı tercih eder.</p><p>Doğru cevap: kendi yüzünü tanı, kendi tarzını bul, kendi kararını ver. Moda değil, sana uygun olanı seç.</p><h2>Sonuç</h2><p>Sakal, bir erkeğin yüzüne karakter katar. Ama karakter, bakımdan gelir. Bakımsız sakal, karakter değil, kaos verir.</p><p>Bugün sakalını yıka. Yarın bir yağ al. Bir hafta sonra, bir berbere git. Bir ay sonra, sakalın, senin imzan olacak.</p>`},
            {id:45,cat:'Stil',date:'16 Temmuz 2026',read:'6 dk',tags:['Aksesuar','Cüzdan','Detay'],title:'Cüzdan ve Aksesuar: Detayların Gücü',excerpt:'Bir erkeğin cüzdanı, onun hayatıdır. Kirli, şişkin, yırtık bir cüzdan, tüm stili bozar.',lead:'Bir erkeğin cüzdanı, onun hayatıdır. Kirli, şişkin, yırtık bir cüzdan, tüm stili bozar. Küçük bir detay gibi görünür ama aslında bir karakter meselesidir.',body:`<p>Kıyafet, takım elbise, ayakkabı — hepsi önemli. Ama asıl fark, detaylarda gizlidir. Cüzdan, saat, kemer, çanta, kalem. Bu küçük parçalar, bir erkeğin stilini ya yükseltir ya da düşürür.</p><p>Aksesuar, gösteriş değildir. İşlev ve estetiğin dengesidir. Doğru aksesuar, fark edilmeden konuşur.</p><h2>Cüzdan</h2><p><strong>Boyut.</strong> Cüzdan, cebe sığmalı, şişmemeli. Şişkin bir cüzdan, hem çirkin hem rahatsız. Sadece gerekli olanları taşı.</p><p><strong>Malzeme.</strong> Gerçek deri. Sentetik, çabuk yıpranır. Tam taneli deri (full-grain), en dayanıklısı.</p><p><strong>Renk.</strong> Siyah ya da koyu kahverengi. Ayakkabı ve kemerle uyumlu.</p><p><strong>Tür.</strong> Bifold (ikiye katlanan), trifold (üçe katlanan), kartlık (minimalist). Minimalist trend, yükseliyor.</p><h2>Saat</h2><p><strong>Klasik Saat.</strong> Deri kayış, metal kordon. Resmi ve klasik kombinler için.</p><p><strong>Spor Saat.</strong> Dijital, kauçuk kayış. Gündelik ve spor için. Klasik kombinlerde olmaz.</p><p><strong>Akıllı Saat.</strong> Apple Watch, Samsung Gear. Pratik ama her kombinle uyumlu değil. Resmi toplantılarda, klasik saat daha iyi.</p><p><strong>Boyut.</strong> Bileğe uygun. 38–42 mm arası, çoğu erkek için ideal. Çok büyük, gösterişli durur. Çok küçük, kaybolur.</p><p><strong>Renk uyumu.</strong> Saat kayışı, ayakkabı ve kemerle uyumlu olmalı. Siyah, kahverengi, metal.</p><h2>Kemer</h2><p>Kemer, hem işlevsel hem estetik. Ama her zaman görünmez. Göründüğünde, doğru olmalı.</p><p><strong>Renk.</strong> Ayakkabıyla uyumlu. Tam aynı olmasa da, aynı tonda. Siyah ayakkabı + siyah kemer. Kahverengi ayakkabı + kahverengi kemer.</p><p><strong>Tokalı.</strong> Basit, klasik. Gösterişli tokalar, dikkat dağıtır. İş ortamında sade, gündelikte biraz daha serbest.</p><p><strong>Genişlik.</strong> 3–3,5 cm ideal. Çok ince, zayıf gösterir. Çok kalın, kaba.</p><p><strong>Kullanım.</strong> Kemeri, pantolonun bel çizgisinde tut. Ne çok yüksek, ne çok düşük. Kemersiz pantolon, doğru bedendeyse mükemmel.</p><h2>Diğer Aksesuarlar</h2><p><strong>Çanta.</strong> Bir erkeğin çantası olmalı. Sırt çantası (gündelik), evrak çantası (iş), el çantası (seyahat). Deri, sade, işlevsel.</p><p><strong>Kalem.</strong> İyi bir kalem, bir imza aracıdır. Dolma kalem, şık ve klasik. Ama pratik de olmalı.</p><p><strong>Mendil.</strong> Kumaş mendil, kağıt mendilden çok daha şık. Ceketin iç cebinde, beyaz ya da açık mavi.</p><p><strong>Kol Düğmesi.</strong> Fransız manşetli gömlekler için. Metal, inci, mine. Detay, zarafet katar.</p><h2>Uyum Kuralı</h2><p>Cüzdan + kemer. Bu, bir erkeğin temel aksesuarıdır. Buna, ortama göre bir şey eklenebilir: mendil, gözlük, şapka.</p><p>Ama hepsi, uyumlu olmalı. Renk, stil, malzeme. Karmaşık aksesuar, kaos yaratır.</p><h2>Bakım</h2><p>Aksesuar, bakım ister. Deri ürünler, düzenli nemlendirme. Metal ürünler, düzenli temizlik. Saat, periyodik bakım.</p><p>Bakımsız aksesuar, tüm kombini düşürür. Bakımlı aksesuar, tüm kombini yükseltir.</p><h2>Sonuç</h2><p>Cüzdan ve aksesuar, bir erkeğin stilinin detaylarıdır. Ve detaylar, karakteri gösterir. Küçük bir parça, büyük bir fark yaratır.</p><p>Bugün cüzdanını gözden geçir. Gereksiz olanları çıkar, bakımını yap. Yarın bir aksesuara yatırım yap. Bir ay sonra, stilin, detaylarla daha güçlü olacak.</p>`}
        ];

                 bentoPicks.push(ARTICLES[bentoPicks.length]);

                    <p>${esc(a.excerpt)}</p>

                        <span class="tag">${esc(a.cat)}</span>

                        <div class="foot"><span>${esc(a.date)}</span><span class="read">${esc(a.read)} →</span></div>
                    </div>
                </button>
            `).join('') : '<p style="color:var(--muted);grid-column:1/-1;">Bu kategoride henüz yazı yok.</p>';

            return `
            <section class="hero">
                <div class="container hero-inner">
                    <div>
                        <div class="hero-badge"><span class="dot"></span>Her pazar yeni bir yazı · Bağımsız yayın</div>
                        <h1>Zamansız erdemler,<br><em>modern bir erkek</em> için.</h1>
                        <p class="lead">Karakter, beceri, sağlık ve ilişkiler üzerine derinlemesine yazılar. Erkekliği bir kalıp değil, bir yolculuk olarak görenler için.</p>
                        <div class="hero-cta">
                            <button type="button" class="btn btn-accent" data-action="scroll" data-target="featured">Yazıları Keşfet 
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
                            </button>
                            <button type="button" class="btn btn-ghost" data-action="about">Hakkımızda</button>
                        </div>
                        <div class="hero-stats">
                            <div class="stat"><div class="num" data-count="50">0</div><div class="lbl">Özgün Yazı</div></div>
                            <div class="stat"><div class="num" data-count="8">0</div><div class="lbl">Kategori</div></div>
                            <div class="stat"><div class="num" data-count="380">0</div><div class="lbl">Dakika Ortalama</div></div>
                        </div>
                    </div>
                    <div class="hero-visual">
                        <div class="float-card fc-1">
                            <div class="tag">Karakter</div>
                            <div class="title">Sessizlik zayıflık değil, derinliktir.</div>
                            <div class="meta">6 dk okuma</div>
                        </div>
                        <div class="float-card fc-2">
                            <div class="tag">İlişkiler</div>
                            <div class="title">Erkekler neden 30’undan sonra yalnızlaşır?</div>
                            <div class="meta">9 dk okuma</div>
                        </div>
                        <div class="float-card fc-3">
                            <div class="tag">Beceri</div>
                            <div class="title">Her erkeğin bilmesi gereken 7 temel tamir</div>
                            <div class="meta">10 dk okuma</div>
                        </div>
                    </div>
                </div>
            </section>

            <section id="featured">
                <div class="container">
                    <div class="section-head fade">
                        <div>
                            <span class="kicker">— Bu Hafta Öne Çıkanlar</span>
                            <h2>Yeni ve derinlemesine yazılar</h2>
                            <p>Her yazı; zamansız bir ilkeyi, modern hayatın gerçekleriyle buluşturur.</p>
                        </div>
                        <button type="button" class="link-arrow" data-action="cat" data-cat="">Tüm yazılar →</button>
                    </div>
                    <div class="bento">${bentoHTML}</div>
                </div>
            </section>

            <section>
                <div class="container">
                    <div class="section-head fade">

                            <span class="kicker">— Keşfet</span>

                        </div>
                    </div>
                    <div class="cats-grid">${catsHTML}</div>
                </div>
            </section>

            <section>
                <div class="container">
                    <div class="section-head fade">
                        <div>

                        </div>

                </div>

            <section class="quote-band">
                <div class="container">
                    <blockquote>“İnsan, kendisini bekleyen işi yapmadığı her gün, biraz daha küçülür.”</blockquote>

        }

        function renderArticle() {
            const a = ARTICLES.find(x => x.id === state.articleId);
            if (!a) return '<div class="container" style="padding:80px 24px;text-align:center;"><p>Yazı bulunamadı.</p></div>';
            return `
            <div class="reader">
                <div class="container narrow">

                    </div>

        function renderAbout() {
            return `
            <div class="container">
                <div class="about-hero">

                    <p>Erkeklik Sanatı, erkeklerin karakter, beceri ve amaç bakımından daha sağlam bir hayat kurmalarına yardımcı olmak için kurulmuş bağımsız bir yayındır.</p>

                    <div class="reader content" style="display:block;padding:0;">
                        <h2>Neden varız?</h2>
                        <p>Bugünün erkeği, tarihte hiç olmadığı kadar çok bilgiye, ama çok az rehberliğe sahip. Bir yanda "erkek adam ağlamaz" diyen katı bir gelenek; diğer yanda köklerinden kopmuş bir modernlik. İkisi de eksik.</p>
                        <p>Biz üçüncü bir yol öneriyoruz: <strong>sorumluluk alan, ama duygularını bastırmayan; güçlü olan, ama kibirli olmayan; öğrenmeye devam eden, ama kendine dürüst kalan bir erkeklik.</strong></p>
                        <blockquote>Erkeklik bir kalıp değil, bir yolculuktur. Varış yok, yön var.</blockquote>
                        <p>Burada bulacağın her yazı, bu yolculuğun bir durağıdır. Acele etme. Oku. Düşün. Uygula.</p>
                        
                        <h2>İki Tuzağı Tanı</h2>
                        <p><strong>Birinci tuzak: katı gelenek.</strong> Bu tuzağa düşen erkek, duygularını bastırır. Ağlamaz, korkmaz, yorulmaz. Sürekli güçlü görünmek zorundadır. Bu tutum, kısa vadede saygı kazandırır; uzun vadede içini çürütür. Yalnızlık, öfke, depresyon — bunlar bu tuzağın kaçınılmaz sonuçlarıdır.</p>
                        <p><strong>İkinci tuzak: köksüz modernlik.</strong> Bu tuzağa düşen erkek, her şeyi reddeder. Ailesini, geleneği, dini, aidiyeti. Kendini "modern" ve "özgür" ilan eder. Ama bu özgürlük, çoğu zaman bir boşluktur. Kim olduğunu, neye bağlı olduğunu, niçin yaşadığını bilemez.</p>
                        <p>İkisi de eksiktir. İkisi de bir insanı tam yapmaz.</p>

                        <h2>Üçüncü Yol</h2>
                        <p>Sağlam bir erkeklik, ne tam gelenek ne tam modernliktir. İkisinden de öğrenir. Ve üçüncü bir yol kurar.</p>
                        <ul>
                            <li><strong>Sorumluluk al.</strong> Aile, iş, çevre, ülke. Sorumluluktan kaçan erkek, özgür değildir; sadece kayıptır. Gerçek özgürlük, taşıdığın yükü kabul etmekle başlar.</li>
                            <li><strong>Duyguları tanı.</strong> Bastırmak değil, ifade etmek. Öfke, üzüntü, sevinç... Hepsi insanidir. Onları inkâr etme, yönetmeyi öğren.</li>
                            <li><strong>Köklerini bil.</strong> Nereden geldiğini bilmeyen, nereye gittiğini de bilemez. Aileni tanı, tarihini oku, kültürünü anla. Bunları reddetmek zorunda değilsin; ama bilmek zorundasın.</li>
                            <li><strong>Kendine dürüst ol.</strong> Başkasının hayatını yaşamak, en yaygın erkeklik tuzağıdır. Babanın istediği meslek, annenin hayal ettiği evlilik, çevrenin beklediği başarı — bunlar senin değil, onların hayatıdır.</li>
                            <li><strong>Topluluğa katıl.</strong> İnsan, yalnız yaşayamaz. Bir dernek, bir cemaat, bir mahalle, bir takım. Kendinden büyük bir şeye ait olmak, köksüzlüğü iyileştirir.</li>
                        </ul>
                        <blockquote>Erkeklik bir kalıp değil, bir yolculuktur. Varış yok, yön var.</blockquote>

                        <h2>Türkiye’nin Kendine Has Zorluğu</h2>
                        <p>Bu ülkede erkek olmak, aynı zamanda bir <em>geçiş</em> meselesidir. Bir ayağın Anadolu'da, diğeri İstanbul'da. Bir yanın gelenekten, diğer yanın modernlikten. Bu geçiş, kolay değildir. Ama bu toprakların erkeği, bu geçişi yüzyıllardır yapıyor. Yani bir maharet var.</p>
                        <p>Bu maharet, denge kurmaktır. Ne geçmişi tamamen reddetmek, ne bugüne tamamen teslim olmak. İkisinden de doğru olanı almak. Ve kendi yolunu kurmak.</p>

                        <h2>Sonuç</h2>
                        <p>Erkeklik, bir sınav değildir. Bir yolculuktur. Kimse mükemmel erkek olarak doğmaz. Kimse mükemmel erkek olarak ölmez. Ama herkes, her gün biraz daha iyi olabilir. Biraz daha dürüst, biraz daha cesur, biraz daha şefkatli, biraz daha sağlam.</p>
                        <p>Bu topraklarda erkek olmak, tam da bu yüzden zordur ve güzeldir. Çünkü burada, iki dünyayı birleştirmek gibi bir iş vardır. Ve bu iş, bir erkeğin ömürlük işidir.</p>
