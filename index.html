/* ===== MEVCUT YAZILAR (20) ===== */
{id:1,cat:'İlişkiler',date:'12 Ekim 2026',read:'9 dk',tags:['Arkadaşlık','Modern Hayat','Bağ Kurma'],title:'Erkekler Neden 30’undan Sonra Yalnızlaşır?',excerpt:'Telefonunda yüzlerce kişi var ama arayacak kimsen yok. Bu bir zayıflık değil, yapısal bir sorun — ve çözülebilir.',lead:'Birçok erkek, otuzuna geldiğinde telefonunda yüzlerce kişi varken gerçek bir dostu olmadığını fark eder. Bu, kişisel bir başarısızlık değildir. Yapısal bir sorundur — ve çözülebilir.',body:`<p>Yirmili yaşlarının sonuna doğru birçok erkek, tuhaf bir boşlukla karşılaşır. Üniversiteden, işten ya da mahalleden tanıdığı insanlarla bağlar gevşer. Mesajlaşmalar azalır, buluşmalar iptal olur. Otuzlu yaşlara gelindiğinde ise, acil bir durumda aranabilecek tek bir isim bile kalmamış olabilir.</p><p>Bu yalnızlık, modern yaşamın getirdiği bir yan etkidir. İş temposu, dijital iletişim, şehirleşme... Hepsi, derin bağlar kurmayı zorlaştırır. Ama bu kader değildir.</p><h2>Neden oluyor?</h2><p><strong>1. Enerji Dağılımı:</strong> Gençken enerji sosyal ortamlara harcanır. Yetişkinlikte ise kariyer ve aile öncelik kazanır. Arkadaşlıklar, listenin en altına düşer.</p><p><strong>2. Rekabet Kültürü:</strong> Erkekler arasında samimiyet, bazen zaaf olarak algılanır. Duygular paylaşılmaz, sadece "hal hatır" sorulur.</p><p><strong>3. Pasif Bekleyiş:</strong> "Onlar arasın" bekleyişi yaygındır. Her iki taraf da harekete geçmeyince, sessizlik büyür.</p><h2>Ne yapmalı?</h2><p><strong>Aktif Olun:</strong> İlk mesajı atan siz olun. Randevulaşın. Plan yapın.</p><p><strong>Ortak Aktivite Bulun:</strong> Sadece oturup konuşmak yerine, birlikte bir şeyler yapın. Spor, oyun, proje. Ortak amaç, bağı güçlendirir.</p><p><strong>Vakit Ayırın:</strong> Arkadaşlık, bakımlı bir bahçe gibidir. Sulamazsanız, solar.</p><p><strong>Duygusal Derinlik Katın:</strong> Sadece hava durumu hakkında değil, hayalleriniz, korkularınız ve hedefleriniz hakkında konuşun.</p><blockquote>Sessizlik, iletişimin yokluğu değildir. Bazen, en derin anlaşmanın başlangıcıdır.</blockquote><h2>Pratik Adımlar</h2><ul><li>Eski arkadaşlarınıza ulaşın. "Nasılsın?" demek için bir bahaneye ihtiyacınız yok.</li><li>Yeni hobiler edinin. Kurslara katılın, kulüplere üye olun.</li><li>Çocuklarınız varsa, onların arkadaşlarıyla tanışın. Ebeveyn grupları, yeni dostluklar için iyi bir kaynaktır.</li><li>Online topluluklardan offline buluşmalara geçin.</li></ul><h2>Sonuç</h2><p>Yalnızlık bir kader değil, bir alışkanlıktır. Bugün tek bir mesajla başla. Üç ay sonra, o sessiz boşluğun yerini dolduran birkaç isim göreceksin.</p>`},
{id:2,cat:'Karakter',date:'10 Ekim 2026',read:'8 dk',tags:['Alışkanlık','Disiplin','Sabah'],title:'Bir Erkeğin Sabah Rutini: Güne Sağlam Başlamanın 5 İlkesi',excerpt:'Sabah nasıl başlarsa gün öyle gider. İrade değil, sistem kur — ve gün ilk dakikadan senin olsun.',lead:'Sabah nasıl başlarsa, gün öyle gider. Ama iyi bir sabah irade gerektirmez — sistem gerektirir. İrade her gün tükenir; sistem kendini taşır.',body:`<p>Birçok erkek güne yenik başlar. Alarm çalar, telefon uzanır, ekran aydınlanır. Beş dakika diye başlayan kaydırma, yarım saat olur. Kalktığında ise gün çoktan başlamıştır — ama sen henüz başlamamışsındır.</p><p>Güne hakim olmak, kontrolü ele almaktır. İşte bunu sağlayan beş temel ilke:</p><h2>1. Telefonu Uzak Tut</h2><p>Uyanır uyanmaz telefona sarılmak, beynini dış dünyanın gürültüsüne açar. İlk 30 dakika telefonu görmeden geçir.</p><h2>2. Su İç</h2><p>Gece boyunca dehidrate olursun. Bir bardak su içmek, metabolizmanı canlandırır ve zihnini netleştirir. Kahveden önce su.</p><h2>3. Hareket Et</h2><p>Yoğun bir antrenman şart değil. Esneme hareketleri, kısa bir yürüyüş veya yoga... Hareket, motivasyonu tetikler.</p><h2>4. Gününü Planla</h2><p>En önemli üç görevini belirle. Net bir plan, karar yorgunluğunu önler.</p><h2>5. Zihinsel Hazırlık</h2><p>Birkaç dakika meditasyon veya günlük tutma. Düşüncelerini kağıda dökmek, zihni temizler. Minnettarlık listesi oluşturmak, pozitif bir çerçeve sağlar.</p><blockquote>Rutin, özgürlüğün düşmanı değil, anahtarıdır.</blockquote><h2>Sonuç</h2><p>Sabah rutini, sihirli bir formül değildir. Ama küçük adımlarla büyük değişimler yaratır. Bugün birini dene. Yarın birini ekle. Bir ay sonra, güne farklı başlayacaksın.</p>`},
{id:3,cat:'Beceri',date:'8 Ekim 2026',read:'7 dk',tags:['İletişim','Beden Dili','Karizma'],title:'İlk İzlenim Sanatı: İlk 30 Saniyede Güven Vermek',excerpt:'İnsanlar seni tanımak için yıllar harcamaz. İlk yarım dakikada bir izlenim oluşur ve kolay değişmez.',lead:'İnsanlar sizi tanımak için yıllar harcamaz. İlk 30 saniyede bir izlenim oluşur ve o izlenim kolay kolay değişmez. İyi haber: bu 30 saniye kontrol edilebilir.',body:`<p>Bir toplantıya girdiğinde, bir davete katıldığında ya da biriyle ilk kez tanıştığında, karşı tarafın zihninde üç şey hızla belirir: <em>Bu kişi tehdit mi?</em>, <em>Bu kişi güvenilir mi?</em>, <em>Bu kişi benim gibi mi?</em></p><p>Cevaplar, sözcüklerden önce gelir. Beden dili, ses tonu ve göz teması, asıl mesajı verir.</p><h2>Göz Teması: Dengeli Ol</h2><p>Çok fazla bakmak ürkütücü, hiç bakmamak güvensizdir. Yaklaşık %60–70 oranında göz teması, ideal kabul edilir.</p><h2>Duruş: Açık ve Rahat</h2><p>Kollarını kavuşturmak, savunmacı bir duruştur. Omuzların geride, göğsün açık olmalı. Ellerin cepte olmamalı, serbest ve rahat durmalı.</p><h2>Selamlaşma: Kararlı Ol</h2><p>El sıkışırken dikey el pozisyonu, eşitliği gösterir. Sıkı ama nazik bir tutuş, güven verir.</p><h2>Ses Tonu: Sakin ve Net</h2><p>Hızlı konuşmak, heyecanlı veya gergin olduğunuzu ima eder. Yavaşlamak, otorite ve sakinlik kazandırır.</p><blockquote>Karizma doğuştan değil, alışkanlıktır.</blockquote><h2>Sonuç</h2><p>İlk izlenim, tek seferde mükemmel olmak zorunda değildir. Önemli olan, kasıtlı olmaktır. Bir sonraki tanışmanda, bu detaylara odaklan.</p>`},
{id:5,cat:'Beceri',date:'4 Ekim 2026',read:'10 dk',tags:['Pratik','Tamir','Bağımsızlık'],title:'Her Erkeğin Bilmesi Gereken 7 Temel Tamir Becerisi',excerpt:'Modern hayat erkeği beceriksizleştirdi. Oysa bir tornavida tutmak, özgüvenin en somut halidir.',lead:'Modern hayat, erkeği beceriksizleştirdi. Oysa bir tornavida tutmak, özgüvenin en somut halidir. Kendi işini yapan adam, kimseye mecbur olmayan adamdır.',body:`<p>Yüz yıl önce her erkek, evindeki basit tamirleri kendisi yapardı. Yüz yıl sonra, bir ampul değiştirmek için bile "usta" çağırıyoruz.</p><h2>1. Lastik Değiştirmek</h2><p>Bagajda stepne, kriko ve bijon anahtarı bulundurun. Bir pazar öğleden sonrasını öğrenmeye ayırın.</p><h2>2. Sigorta Kutusunu Tanımak</h2><p>Hangi şalter hangi odayı kontrol ediyor, not alın. Sigorta atınca önce cihazı fişten çekin, sonra şalteri kaldırın.</p><h2>3. Musluk Tamiri</h2><p>Damlayan musluk, çoğu zaman conta değişimiyle çözülür. Contaları söküp marketten aynı modeli bulmak, basit bir iştir.</p><h2>4. Duvara Tablo Asmak</h2><p>Dübel seçimi kritiktir. Beton mu, alçıpan mı? Doğru matkap ucu ve dübel, tablonun düşmesini engeller.</p><h2>5. Basit Elektrik İşleri</h2><p>Lamba kablosu değişimi, priz kapağı takma gibi işler tehlikesizdir. Ana şalteri kapatmayı unutmayın.</p><h2>6. Basit Marangozluk</h2><p>Bir testere, bir matkap, bir zımpara. İlk projeyi basit tutun.</p><h2>7. İlk Yardım</h2><p>Kanamayı durdurmak, yanığı soğutmak, Heimlich manevrası. Kızılay'ın ücretsiz eğitimleri var.</p><blockquote>Kendi işini yapan adam, kimseye mecbur olmayan adamdır.</blockquote><h2>Sonuç</h2><p>Bu yedi beceri, erkeğe bir tür iç huzur verir: <em>Kendi başımın çaresine bakabilirim.</em> Bu huzur, paha biçilemez.</p>`},
{id:6,cat:'Zihin',date:'2 Ekim 2026',read:'7 dk',tags:['Duygular','Özdenetim','Zihin'],title:'Öfke Yönetimi: Sakin Kalan Erkek Daha Güçlüdür',excerpt:'Öfke kötü değildir. Kontrolsüz öfke kötüdür. Aradaki fark, güç ile zayıflık arasındaki farktır.',lead:'Öfke kötü değildir. Kontrolsüz öfke kötüdür. Aradaki fark, güçle zayıflık arasındaki farktır. Öfkesini taşıyan erkek güçlüdür; öfkesine yenilen erkek değil.',body:`<p>Birçok erkek, öfkeyi ya bastırır ya patlatır. İkisi de yanlıştır. Doğru yol, üçüncüsüdür: <strong>öfkeyi tanımak, anlamak ve yönetmek.</strong></p><h2>Öfke Nedir?</h2><p>Öfke, birincil bir duygu değildir. Genellikle başka duyguların maskesidir. Korku, utanç, hayal kırıklığı, çaresizlik... Bunlar, öfke altında gizlenir.</p><h2>Fizyolojik Tepki</h2><p>Öfke anında adrenalin salgılanır. Kalp atışı hızlanır, kaslar gerilir. Bu, savaş ya da kaç tepkisidir. Modern dünyada, bu tepki genellikle uygunsuzdur.</p><h2>Stratejiler</h2><p><strong>1. Durakla:</strong> Tepki vermeden önce 10 saniye bekle. Derin nefes al.</p><p><strong>2. Yeniden Çerçevele:</strong> "Bu beni saygısızlığa uğrattı" yerine, "Bu kişi muhtemelen zor bir gün geçiriyor" de.</p><p><strong>3. Alan Yarat:</strong> Tartışmadan uzaklaş. "Şu an konuşamayacağım, yarın devam edelim" de.</p><p><strong>4. Yaz:</strong> Hislerini kağıda dök. Yazmak, duyguları organize eder.</p><blockquote>Sakin kalan erkek, zayıf değildir. Tam tersi.</blockquote><h2>Sonuç</h2><p>Öfke yönetimi, duygusal zekanın temelidir. Mükemmelliği hedefleme. Sadece daha iyi olmaya çalış.</p>`},
{id:7,cat:'Stil',date:'30 Eylül 2026',read:'6 dk',tags:['Stil','Takım Elbise','Giyim'],title:'İlk Takım Elbise Rehberi: Doğru Beden, Doğru Renk, Doğru Kumaş',excerpt:'Takım elbise, erkeğin zırhıdır. Ama yanlış seçilirse zırh değil, yük olur.',lead:'Takım elbise, erkeğin zırhıdır. Doğru seçildiğinde özgüveni iki katına çıkarır. Yanlış seçildiğinde ise bir yük olur.',body:`<p>Bir erkeğin hayatında birkaç an vardır ki takım elbise giymesi gerekir: bir mülakat, bir düğün, bir cenaze, önemli bir toplantı.</p><h2>Beden: En Kritik Üç Nokta</h2><ul><li><strong>Omuzlar.</strong> Elbise omuzdan oturmalı; ne sarkmalı, ne sıkmış gibi durmalı.</li><li><strong>Göğüs ve Bel.</strong> Göğüs bölgesi düz durmalı, bel vücudun doğal hattını takip etmeli.</li><li><strong>Kollar ve Paçalar.</strong> Ceketin kolları, gömleğin manşetini bir santim göstermelidir.</li></ul><blockquote>Elbise seni değil, sen elbiseyi taşırsın.</blockquote><h2>Renk: Klasikten Şaşma</h2><p>İlk takım elbise için önerilen renkler: <strong>Lacivert</strong> ve <strong>Koyu Gri</strong>. Siyah, sadece cenaze ve gece davetleri içindir.</p><h2>Kumaş: Mevsime Uygun</h2><p>Yün, en dayanıklı ve terletmeyen kumaştır. Sentetik karışımlar ucuzdur ama hava almaz.</p><h2>Sonuç</h2><p>İyi bir terzi, ucuz olan elbiseyi pahalı gösterebilir. Doğru beden ve iyi terzi varsa, elbisenin fiyatı ikinci plandadır.</p>`},
{id:12,cat:'Sağlık',date:'20 Eylül 2026',read:'7 dk',tags:['Uyku','Sağlık','Zihin'],title:'Uyku ve Zihin Sağlığı: Erkeklerin En Çok İhmal Ettiği İlaç',excerpt:'Kronik uykusuzluk sadece yorgunluk değildir. Öfke, kaygı ve düşük testosteronun da sebebidir.',lead:'Kronik uykusuzluk, sadece yorgunluk değildir. Öfke, kaygı, karar bozukluğu ve düşük testosteronun da sebebidir. Ve çoğu erkek, uykusuzluğunu bir "başarı" olarak görür.',body:`<p>Bir erkeğin en büyük yanılgılarından biri, az uyumayı bir erdem sanmaktır. "Ben 5 saatle idare ederim" — bu cümleler, modern erkek mitlerinin parçasıdır.</p><h2>Uyku Eksikliğinin Bedeli</h2><ul><li><strong>Konsantrasyon düşer.</strong> Dikkat dağınıklığı artar.</li><li><strong>Duygusal denge bozulur.</strong> Öfke ve kaygı seviyesi yükselir.</li><li><strong>Testosteron azalır.</strong> Kronik uykusuzluk, testosteron seviyesini %10-15 düşürebilir.</li><li><strong>Bağışıklık sistemi zayıflar.</strong></li></ul><h2>İyileştirmenin Yedi Yolu</h2><ol><li>Aynı saatte yat, aynı saatte kalk.</li><li>Yatmadan 1 saat önce ekranı bırak.</li><li>Odayı karanlık ve serin yap (18–20 derece).</li><li>Kafeini öğleden sonra kes.</li><li>Alkol tüketimini azalt.</li><li>Düzenli egzersiz yap.</li><li>Rutin oluştur: ılık duş, hafif esneme, okuma.</li></ol><blockquote>Uyku, lüks değil, ihtiyaçtır.</blockquote><h2>Sonuç</h2><p>Uyku, performansınızı artıran en etkili araçtır. Bu gece, erken yat. Yarın, farkı göreceksin.</p>`},
{id:13,cat:'Kariyer',date:'18 Eylül 2026',read:'7 dk',tags:['Kariyer','Mülakat','İş'],title:'Mülakat Sanatı: İşe Alınmanın Görünmeyen Kuralları',excerpt:'İyi bir CV kapıyı açar. Ama mülakatta kazanan şey, CV değildir.',lead:'İyi bir CV, kapıyı aralar. Ama mülakatta kazanan şey CV değildir. Karşı taraf, senin ne bildiğini zaten biliyor. Şimdi merak ettiği şu: sen nasıl bir insansın?',body:`<p>Bir mülakata giren çoğu erkek, yanlış sorulara hazırlanır.</p><h2>Hikâye Anlat, Madde Sayma</h2><p>STAR tekniği: <strong>S</strong>ituation (Durum), <strong>T</strong>ask (Görev), <strong>A</strong>ction (Aksiyon), <strong>R</strong>esult (Sonuç).</p><blockquote>İnsanlar veriyi unutur, hikâyeyi hatırlar.</blockquote><h2>Zayıflıklarını Sorduğunda</h2><p>Gerçek bir zayıflık söyle ve <em>ne yaptığını</em> ekle. Sahtelik hemen fark edilir.</p><h2>Sen de Soru Sor</h2><ul><li>"Bu pozisyonda başarılı olmanın ölçütü nedir?"</li><li>"Ekibin en büyük zorluğu şu an ne?"</li><li>"Şirket kültürünüzü nasıl tanımlarsınız?"</li></ul><h2>Sonuç</h2><p>Mülakat, bir sınav değil, bir diyaloğdur. İşe alınan kişi, en yetenekli değil, en uyumlu ve en potansiyelli kişidir.</p>`},
{id:18,cat:'Karakter',date:'8 Eylül 2026',read:'8 dk',tags:['Duygular','Erkeklik','Ağlamak'],title:'Erkekler ve Gözyaşı: Ağlamanın Gücü',excerpt:'"Erkek adam ağlamaz" cümlesi, bir erkeğin duygusal hayatını çürütmüştür.',lead:'"Erkek adam ağlamaz" — bu cümle, çoğu erkeğin çocukluğundan itibaren duyduğu en ağır yalan. Ağlamak zayıflık değildir.',body:`<p>Bir erkek, çocukluğundan itibaren şu cümleyle büyür: "Ağlama, erkek adam ağlamaz."</p><h2>Ağlamanın Biyolojisi</h2><p>Gözyaşı, stresi azaltır. Kortizol seviyesini düşürür. Ağlamak, bedenin kendini temizleme mekanizmasıdır.</p><h2>Duygusal Zeka ve Ağlama</h2><p>Duygularını tanıyan erkek, empati kurabilir. Ağlamayan erkek, duygusal olarak körleşir.</p><blockquote>Ağlamak, yenilgi değil, cesaret eylemidir.</blockquote><h2>Sonuç</h2><p>Bu zinciri kır. Kendin için kır. Oğlun için kır. Ağla, gerektiğinde. Ağlamayan erkek, yarı bir adamdır.</p>`},
{id:19,cat:'Karakter',date:'6 Eylül 2026',read:'8 dk',tags:['Yalnızlık','İç Huzur','Kendilik'],title:'Kendinle Baş Başa: Yalnızlığın Sanatı',excerpt:'Yalnız kalamayan erkek, kendini hiç tanımaz. Çünkü kendini tanımak, sessizlikte olur.',lead:'Yalnız kalabilmek, bir erkeğin en büyük güçlerinden biridir.',body:`<p>Modern erkek, yalnızlıktan korkar. Oysa yalnızlık, bir başarısızlık değil, bir fırsattır.</p><h2>Yalnızlık vs. Tek Başınalık</h2><p>Tek başınalık, fiziksel bir durumdur. Yalnızlık ise ruhsal bir seçimdir.</p><blockquote>Kendisiyle baş başa kalamayan erkek, hayatı boyunca başkalarının şirketinde kendini arar.</blockquote><h2>Yalnızlığın Üç Katmanı</h2><p><strong>Fiziksel yalnızlık</strong>, <strong>dijital oruç</strong>, <strong>ruhsal derinlik</strong>.</p><h2>Sonuç</h2><p>Yalnızlık bir ceza değil, bir armağandır. Bugün bir saat yalnız kal. Bir ay sonra, kendinle tanışmış olacaksın.</p>`},
{id:22,cat:'Beceri',date:'31 Ağustos 2026',read:'7 dk',tags:['Araba','Motor','Bakım'],title:'Araba Motorunu Tanımak: Kaputun Altında Ne Var?',excerpt:'Arabanı tanımayan erkek, yolda kalınca panikler. Tanıyan erkek ise çözer.',lead:'Çoğu erkek, arabasını sadece kullanır. Ama tanımaz.',body:`<p>Modern hayat, erkeği araba kullanmaya alıştırdı ama araba tanımaya alıştırmadı.</p><h2>Temel Parçalar</h2><ul><li><strong>Motor Yağı:</strong> Motorun kanıdır. Seviyesini ve rengini kontrol et.</li><li><strong>Soğutma Suyu:</strong> Motoru aşırı ısınmadan korur.</li><li><strong>Akü:</strong> Araç çalışmıyorsa, ilk bakılacak yer aküdür.</li><li><strong>Fren Balataları:</strong> Sürtünme sesi geliyorsa, acil servis gerekir.</li></ul><h2>Aylık Kontrol Listesi</h2><ol><li>Yağ seviyesi.</li><li>Motor suyu.</li><li>Fren hidroliği.</li><li>Cam suyu.</li><li>Akü kutupları.</li></ol><h2>Sonuç</h2><p>Arabayı tanımak, ona saygı duymaktır. Bakımlı bir araba, güvenli bir yolculuktur.</p>`},
{id:29,cat:'İlişkiler',date:'17 Ağustos 2026',read:'8 dk',tags:['İlişki','Kadın','Anlayış'],title:'Kadınları Anlamak: Klişelerden Kurtulmak',excerpt:'Kadınları anlamak, bir kod çözmek değildir. Bir insanı tanımaktır.',lead:'"Kadınları anlamak imkânsız" derler. Bu, hem yanlış hem de tehlikeli bir klişedir.',body:`<p>Erkekler arasında yaygın bir söylenti vardır: "Kadınlar anlaşılmaz." Bu, tehlikeli bir klişedir.</p><h2>Klişeleri Kırmak</h2><p><strong>"Kadınlar mantıksızdır."</strong> Gerçek: Farklı bir veri setiyle karar verir.</p><p><strong>"Kadınlar çok konuşur."</strong> Gerçek: İletişim kurar. Erkekler bilgi aktarır.</p><p><strong>"Kadınlar duygusaldır."</strong> Gerçek: Duygularını ifade etmeye teşvik edilirler.</p><blockquote>Kadınları anlamak, bir kod çözmek değildir. Bir insanı tanımaktır.</blockquote><h2>Sonuç</h2><p>Bugün bir kadını dinle. Gerçekten dinle. Sormadan, yargılamadan, çözüm sunmadan.</p>`},
{id:30,cat:'İlişkiler',date:'15 Ağustos 2026',read:'7 dk',tags:['Buluşma','İlişki','Modern'],title:'İlk Buluşma: Modern Zamanlarda Erkek Olmak',excerpt:'İlk buluşma, bir performans değildir. Bir tanışmadır.',lead:'İlk buluşma, çoğu erkek için bir sınav gibi gelir. Oysa bir sınav değildir.',body:`<p>Modern buluşma dünyası, karmaşıklaştı. Ama özünde, iki insanın bir masada oturup birbirini tanımaya çalışmasıdır.</p><h2>Hazırlık</h2><p><strong>Mekan Seçimi:</strong> Sohbet edilebilecek bir kafe. İlk buluşmada yemek yerine kahve daha iyidir.</p><p><strong>Kıyafet:</strong> Temiz, bakımlı, ortama uygun.</p><p><strong>Zamanlama:</strong> Geç kalma. Erken gitme.</p><h2>Sohbet Konuları</h2><p><strong>Olumlu:</strong> Hobiler, seyahat, kitaplar, hayaller.</p><p><strong>Kaçınılacak:</strong> Eski ilişkiler, siyaset, para, şikâyet.</p><h2>Sonuç</h2><p>İlk buluşma, mükemmel olmak zorunda değildir. Sadece gerçek olmak zorundadır.</p>`},
{id:31,cat:'İlişkiler',date:'13 Ağustos 2026',read:'7 dk',tags:['Arkadaşlık','Rekabet','Erkek'],title:'Arkadaşlık ve Rekabet: Erkekler Arası Dinamikler',excerpt:'Erkek arkadaşlığı, rekabeti içinde barındırır. Ama doğru yönetilirse, bu bir güç olur.',lead:'Erkek arkadaşlığı, kadın arkadaşlığından farklıdır. İçinde rekabet barındırır.',body:`<p>İki erkek bir araya geldiğinde, ilk birkaç dakika içinde bir tür hiyerarşi kurulur.</p><h2>Sağlıklı Rekabet</h2><p>Birbirini motive eder. "O koştu, ben de koşmalıyım." Bu, büyüme iticisidir.</p><h2>Toksik Rekabet</h2><p>Birbirini küçültür. Kaybedenle alay eder. Bağ kopar.</p><h2>Erkek Arkadaşlığında Sırlar</h2><p>Bir arkadaşın sana sırrını verdiğinde, bu bir onurdur. Sadakat, erkek arkadaşlığının temel taşıdır.</p><h2>Sonuç</h2><p>Arkadaşlarını rakip değil, partner olarak gör. Birlikte yükselin.</p>`},
{id:32,cat:'İlişkiler',date:'11 Ağustos 2026',read:'7 dk',tags:['Aile','Sınır','İlişki'],title:'Aile ile Sınır Koymak: Sevmek, Boyun Eğmek Değildir',excerpt:'Ailenle sağlıklı bir ilişki kurmak, sınır koymaktan geçer.',lead:'Ailenle sağlıklı bir ilişki kurmak, sınır koymaktan geçer. Ama çoğu erkek, sınır koymayı sevgisizlik sanır.',body:`<p>Türkiye'de erkek olmak, aileyle iç içe olmak demektir.</p><h2>Neden Sınır Koymak Zor?</h2><p><strong>Suçluluk Duygusu:</strong> "Annemi üzmemeliyim" — bu cümleler, çocukluktan beri kafamıza kazınmıştır.</p><p><strong>Kültürel Baskı:</strong> "Evlat anne-babasını dinler".</p><h2>Sınır Nasıl Konur?</h2><p><strong>Net Ol:</strong> "Hayır" demek, suçluluk duymak zorunda değildir.</p><p><strong>Tutarlı Ol:</strong> Bir gün izin ver, ertesi gün yasaklama.</p><p><strong>Alternatif Sun:</strong> Reddetmek, tamamen kapanmak değildir.</p><h2>Sonuç</h2><p>Sınır koymak, sevgisizlik değildir. Aksine, sağlıklı bir ilişkinin temelidir.</p>`},
{id:33,cat:'Aile',date:'9 Ağustos 2026',read:'8 dk',tags:['Evlilik','Ortaklık','Eş'],title:'Eş Olmak: Evlilikte Ortaklık Kurmak',excerpt:'Evlilik, bir yarış değildir. Bir ortaklıktır.',lead:'Evlilik, bir yarış değildir. Bir ortaklıktır. Ama çoğu erkek, evliliği bir "kontrol" ilişkisi olarak görür.',body:`<p>Evlilik, çoğu erkeğin hayatının en büyük kararıdır.</p><h2>Tuzaklar</h2><p><strong>Tuzak 1: Erkek, "geçim kaynağı" rolüne sıkışır.</strong></p><p><strong>Tuzak 2: Kadın, "ev yöneticisi" rolüne sıkışır.</strong></p><p><strong>Tuzak 3: Roller katılaşır.</strong></p><p><strong>Tuzak 4: İletişim kaybolur.</strong></p><h2>Ortaklık Nasıl Kurulur?</h2><p><strong>Paylaş, Dinle, Destekle, Zaman Ayır.</strong></p><blockquote>Evlilik, iki bütün insanın, ortak bir bütünden daha büyük bir şey yaratmasıdır.</blockquote><h2>Sonuç</h2><p>Eş olmak, bir unvan değil, bir eylemdir.</p>`},
{id:38,cat:'Kariyer',date:'30 Temmuz 2026',read:'8 dk',tags:['Zaman','Verimlilik','Odak'],title:'Zaman Yönetimi: Erkekler İçin Pratik Sistem',excerpt:'Zamanı yönetmek, aslında kendini yönetmektir.',lead:'Zamanı yönetmek, aslında kendini yönetmektir. Çoğu erkek, zamanı yönetemediğinden şikâyet eder.',body:`<p>Herkesin 24 saati var. Ama bazı erkekler, o 24 saatte bir imparatorluk kurar.</p><h2>Pomodoro Tekniği</h2><p>25 dakika çalış, 5 dakika mola ver.</p><h2>Eisenhower Matrisi</h2><ul><li><strong>Acele ve Önemli:</strong> Hemen yap.</li><li><strong>Önemli ama Acele Değil:</strong> Planla.</li><li><strong>Acele ama Önemsiz:</strong> Devret.</li><li><strong>Ne Acele Ne Önemli:</strong> Ele.</li></ul><h2>Delegasyon</h2><p>Her şeyi kendin yapma. Bu, zayıflık değil, liderliktir.</p><blockquote>Zaman, geri dönüşü olmayan tek kaynaktır.</blockquote><h2>Sonuç</h2><p>Zaman yönetimi, daha az ama daha kaliteli iş yapmaktır.</p>`},
{id:42,cat:'Stil',date:'22 Temmuz 2026',read:'7 dk',tags:['Ayakkabı','Stil','Bakım'],title:'Ayakkabı Rehberi: Erkek Ayakkabı Temelleri',excerpt:'Ayakkabı, bir erkeğin stilinin temelidir.',lead:'Ayakkabı, bir erkeğin stilinin temelidir. İnsanlar ayakkabına bakar; farkında olmasan bile.',body:`<p>Çoğu erkek, kıyafete önem verir ama ayakkabıyı ihmal eder.</p><h2>Temel Modeller</h2><p><strong>Oxford, Derby, Monk Strap, Loafer, Brogue.</strong></p><h2>Renk ve Kombin</h2><p><strong>Siyah:</strong> Resmi. <strong>Kahverengi:</strong> Gündelik ve semi-formal. <strong>Bordo/Taba:</strong> Cesur seçenekler.</p><h2>Bakım</h2><p>Ayakkabı, bakım ister. Her giydikten sonra fırçala.</p><h2>Yaygın Hatalar</h2><ul><li>Spor ayakkabıyla takım elbise.</li><li>Bakımsız ayakkabı.</li><li>Yanlış beden.</li><li>Aynı ayakkabıyı her gün.</li><li>Beyaz çorap.</li></ul><h2>Sonuç</h2><p>Bakımlı ayakkabı, kendine duyduğun saygının göstergesidir.</p>`},
{id:43,cat:'Stil',date:'20 Temmuz 2026',read:'7 dk',tags:['Sakal','Bakım','Stil'],title:'Sakal Bakımı: Modern Erkeğin Rehberi',excerpt:'Sakal, bir erkeğin yüzüne karakter katar. Ama bakımsız sakal, kaos verir.',lead:'Sakal, bir erkeğin yüzüne karakter katar. Ama bakımsız sakal, karakter değil, kaos verir.',body:`<p>Son yıllarda sakal, bir moda haline geldi.</p><h2>Yüz Şekline Göre Sakal</h2><p><strong>Oval:</strong> Her sakal şekli uyar. <strong>Yuvarlak:</strong> Uzun ve sivri. <strong>Kare:</strong> Kısa, tam. <strong>Uzun:</strong> Yanlar dolgun.</p><h2>Sakal Türleri</h2><p>Stubble, Orta Sakal, Tam Sakal, Keçi Sakalı, Van Dyke.</p><h2>Sakal Bakımı</h2><p>Yıkama, şekillendirme, nemlendirme, tarama.</p><h2>Sonuç</h2><p>Sakal, bakımdan gelir. Bir ay sonra, sakalın, senin imzan olacak.</p>`},
{id:45,cat:'Stil',date:'16 Temmuz 2026',read:'6 dk',tags:['Aksesuar','Cüzdan','Detay'],title:'Cüzdan ve Aksesuar: Detayların Gücü',excerpt:'Bir erkeğin cüzdanı, onun hayatıdır.',lead:'Bir erkeğin cüzdanı, onun hayatıdır. Kirli, şişkin, yırtık bir cüzdan, tüm stili bozar.',body:`<p>Kıyafet, takım elbise, ayakkabı — hepsi önemli. Ama asıl fark, detaylarda gizlidir.</p><h2>Cüzdan</h2><p>Boyut, malzeme, renk, tür.</p><h2>Saat</h2><p>Klasik, spor, akıllı. Boyut, renk uyumu.</p><h2>Kemer</h2><p>Renk ayakkabıyla uyumlu. Tokalı, sade.</p><h2>Uyum Kuralı</h2><p>Cüzdan + kemer. Temel aksesuar.</p><h2>Sonuç</h2><p>Detaylar, karakteri gösterir.</p>`},

/* ===== YENİ YAZILAR — KARAKTER (7) ===== */
{id:46,cat:'Karakter',date:'4 Eylül 2026',read:'8 dk',tags:['Söz','Güven','Onur'],title:'Sözünün Erü Olmak: Verdiğin Sözün Ağırlığı',excerpt:'Verdiğin sözün arkasında duran erkek, kimsenin hatırlamadığı yeminleri tutan erkektir.',lead:'Bir erkeğin itibarı, ne kadar kazandığıyla değil, verdiği sözü ne kadar tuttuğuyla ölçülür. Sözünün erü olmak, sadece bir ahlak kuralı değil, bir hayat tarzıdır.',body:`<p>Bir erkeğin gerçek serveti, banka hesabında değildir. Verdiği sözün arkasında durma kapasitesinde, elinin sıkılığında, söylediği şeyin eyleme dönüşmesinde ölçülür.</p><p>"Sizi arayacağım", "yarın uğrarım", "bu hafta hallederim" — bu cümleler, artık birer nezaket kalıbı. Kimse gerçekten aramıyor, kimse gerçekten uğramıyor. Ve bu, kolektif bir itibar kaybı yaratıyor.</p><h2>Söz neden ağırdır?</h2><p>Bir söz verdiğinde, karşı taraf bir beklenti içine girer. Beklenti, bir tür güven yatırımıdır. Ve o yatırım boşa çıktığında, sadece hayal kırıklığı değil, güvenin kendisi çöker.</p><p>Bir erkeğin sözünü tutmaması, sadece bir randevuyu kaçırmak değildir. Karşı tarafın gözünde, tüm gelecek sözlerin değerini düşürmektir.</p><blockquote>Verdiği sözü tutan erkek, kimsenin görmediği yerde bile aynıdır. İşte karakter budur.</blockquote><h2>Kolay söz, ağır bedel</h2><p>Erkekler, hayır diyememekten dolayı çok fazla söz verir. "Olur, hallederim" demek kolaydır. Ama yapmak zordur. Ve yapamayınca, hem kendi itibarını hem de karşı tarafın zamanını harcamış olur.</p><p>Bu yüzden söz vermek, bir sorumluluk kabul etmektir. Söylemeden önce üç soru sor:</p><ol><li><strong>Bunu gerçekten yapabilir miyim?</strong> Yetenek, zaman, kaynak — hepsi yeterli mi?</li><li><strong>Bunu yapmak ister miyim?</strong> İçten istemediğin bir şeyi yapmak, hem sana hem karşı tarafa zarar verir.</li><li><strong>Bunun bedeli nedir?</strong> Verdiğin söz, başka bir sözü bozacak mı?</li></ol><h2>Küçük sözler, büyük adamlar</h2><p>Söz tutmak, büyük vaatlerle başlamaz. Küçük şeylerle başlar. "Yarın 9'da orada olacağım" dediğinde, 9'da orada olmak. "Seni arayacağım" dediğinde, aramak.</p><p>Bunlar, hayatın mikroskobik anlarıdır. Ama bu anlar, bir erkeğin tüm hayatını inşa eder. Çünkü karakter, büyük kararlarda değil, küçük tekrarlarda ortaya çıkar.</p><h2>Sözünden döndüğünde</h2><p>Bazen tutamayacağın bir söz verirsin. Bu durumda tek çözüm vardır: dürüstlük. Geciktirmeden söyle. "Sana söz vermiştim ama yetiştiremedim. Özür dilerim. Şu yeni tarihte halledeceğim."</p><h2>Sonuç</h2><p>Sözünün erü olmak, kolay değildir. Ama en doğru yoldur. Her verdiğin sözü tutmak, seni küçültmez; bilakis büyütür. Bugün bir söz ver. Küçük bir söz. Ve tut.</p>`},
{id:47,cat:'Karakter',date:'2 Eylül 2026',read:'7 dk',tags:['Cesaret','Korku','Karar'],title:'Cesaret Nedir, Ne Değildir?',excerpt:'Cesaret, korkusuzluk değildir. Cesaret, korkuya rağmen harekete geçmektir.',lead:'Cesaret, korkusuzluk değildir. Korkusuzluk, çoğu zaman aptallıktır. Cesaret, korkuya rağmen harekete geçmektir.',body:`<p>Erkekler, çoğu zaman cesareti yanlış anlar. Cesareti, korkusuzluk sanır. Korkmayan erkek cesurdur, korkan erkek korkaktır. Bu, tamamen yanlıştır.</p><p>Gerçek cesaret, korkunun varlığını kabul etmek ve yine de harekete geçmektir. Savaşa giden asker korkar. Ama gider. İşte cesaret budur.</p><h2>Korkusuzluk nedir?</h2><p>Korkusuzluk, çoğu zaman bir hastalık belirtisidir. Beynin tehlike sinyallerini algılayamamasıdır. Bu, bir üstünlük değil, bir kırılganlıktır.</p><p>Cesur insanlar ise korkar. Yükseklikten, başarısızlıktan, reddedilmekten, ölümden. Ama korku, onları durdurmaz. Korku, onlara yol gösterir. Korku, onlara sınırı gösterir ve der ki: "Burada bir şey var. Ya kaç, ya da geç."</p><blockquote>Cesaret, korkunun yokluğu değil; korkuya rağmen yürümektir.</blockquote><h2>Cesaretin üç türü</h2><p><strong>Fiziksel cesaret.</strong> Bedeni riske atma cesareti. Kavga, doğa, spor, savaş. Bu en görünür cesarettir. Ama en kolay olanıdır, çünkü biyolojik bir dürtüdür.</p><p><strong>Ahlaki cesaret.</strong> Bir yanlışa hayır deme cesareti. Kalabalığa rağmen doğruyu söyleme cesareti. Bu, çok daha zordur.</p><p><strong>Duygusal cesaret.</strong> Zayıflığını kabul etme cesareti. Sevme cesareti. "Sana ihtiyacım var" diyebilme cesareti. Bu, en zor olanıdır.</p><h2>Cesaret nasıl büyür?</h2><p>Cesaret, doğuştan gelen bir özellik değildir. Bir kas gibidir: kullanılırsa büyür, kullanılmazsa körelir. Her gün küçük bir cesaret egzersizi yap.</p><p>Yabancıya merhaba de. Toplantıda fikrini söyle. Beğendiğin bir insana iltifat et. Bir haksızlığa itiraz et. Küçük küçük. Ama her gün.</p><p>Bir yıl sonra, bu küçük egzersizler, bir karakter haline gelir. Artık korku seni yönetmez; sen korkuyu yönetirsin.</p><h2>Korkaklık nedir?</h2><p>Korkaklık, korkmak değildir. Korkaklık, korkuya teslim olmaktır. Bir erkek, hayatında bir kere korkaklık yapabilir. Ama korkaklık bir alışkanlık haline geldiğinde, o erkek artık kendisi değildir.</p><h2>Sonuç</h2><p>Cesaret, bir dürtü değil, bir karardır. Bugün küçük bir cesaret egzersizi yap. Bir yıl sonra, korkusuna rağmen yürüyen bir adam olacaksın.</p>`},
{id:48,cat:'Karakter',date:'31 Ağustos 2026',read:'7 dk',tags:['Minnettarlık','Şükür','Karakter'],title:'Minnettarlık: Sahip Olduğunun Değerini Bilmek',excerpt:'Minnettar erkek, sahip olduğuyla mutlu olandır.',lead:'Minnettarlık, hayatın en basit ve en güçlü erdemidir. Ama modern erkek, şükretmeyi unutmuştur. Çünkü hep daha fazlasını ister.',body:`<p>Modern erkek, sürekli bir yarış içindedir. Daha fazla para, daha büyük ev, daha iyi araba. Ama bu yarış, bir tuzaktır. Çünkü her kazanç, yeni bir istek doğurur. Ve mutluluk, hep bir sonraki hedefe ertelenir.</p><p>Minnettarlık, bu tuzağın panzehiridir. Minnettarlık, sahip olduğun şeylerin değerini görmektir.</p><h2>Minnettarlık nedir?</h2><p>Minnettarlık, bir duygudur ama aynı zamanda bir pratiktir. Yani öğrenilebilir ve geliştirilebilir. Doğuştan gelmez; tekrarla büyür.</p><p>Minnettarlık, sadece "iyi şeylere şükretmek" değildir. Zor şeylere de şükretmektir. Bir hastalık, bir kayıp, bir başarısızlık — hepsi bir ders, bir büyüme fırsatıdır.</p><blockquote>Minnettar erkek, sahip olduğuyla mutlu olandır. Minnettar olmayan erkek, sahip olmadığıyla mutsuz olandır.</blockquote><h2>Faydaları</h2><ul><li><strong>Mutluluk.</strong> Araştırmalar, minnettar insanların daha mutlu olduğunu gösterir.</li><li><strong>Sağlık.</strong> Kan basıncını düşürür, bağışıklığı güçlendirir, uykuyu iyileştirir.</li><li><strong>İlişkiler.</strong> Minnettar erkek, daha iyi eş, daha iyi baba, daha iyi arkadaştır.</li><li><strong>Dayanıklılık.</strong> Zorluklarla daha iyi başa çıkar.</li></ul><h2>Pratikler</h2><p><strong>1. Minnettarlık günlüğü.</strong> Her akşam, üç şeye şükret. Yaz.</p><p><strong>2. Sabah şükür.</strong> Sabah uyandığında, üç şeye şükret.</p><p><strong>3. Şükür mesajı.</strong> Haftada bir kez, birine teşekkür mesajı at.</p><p><strong>4. Zor şeylere şükür.</strong> Bir zorluk yaşadığında, sor: Bu bana ne öğretti?</p><h2>Düşmanları</h2><p>Karşılaştırma, beklenti, acele, şikâyet, dijital tüketim. Hepsi, minnettarlığı zayıflatır.</p><h2>Sonuç</h2><p>Minnettarlık, mutluluğun en basit yoludur. Bugün üç şeye şükret. Bir yıl sonra, minnettar bir adam olacaksın.</p>`},
{id:49,cat:'Karakter',date:'29 Ağustos 2026',read:'8 dk',tags:['Sabır','Disiplin','Karakter'],title:'Sabır: Modern Erkeğin Kayıp Erdemi',excerpt:'Sabır, beklemek değildir. Sabır, doğru zamanı bekleyerek emek vermektir.',lead:'Sabır, modern erkeğin en kayıp erdemidir. Anında sonuç isteyen bir dünyada, sabır, neredeyse bir isyan haline geldi.',body:`<p>Modern dünya, hız üzerine kuruludur. Anında mesaj, anında teslimat, anında tatmin. Ama hayatın en değerli şeyleri — aşk, kariyer, karakter, sağlık — zamanla inşa edilir. Ve bu zaman, sabır gerektirir.</p><h2>Sabır nedir?</h2><p>Sabır, beklemek değildir. Sabır, doğru zamanı bekleyerek emek vermektir. Pasif bir kabullenme değil, aktif bir dayanıklılıktır.</p><p>Çiftçi, tohumu eker ve bekler. Ama bu sürede sulama yapar, toprağı işler, zararlıları temizler. İşte sabır budur.</p><blockquote>Sabır, acıya dayanma değil, sürece güvenme sanatıdır.</blockquote><h2>Sabrın üç türü</h2><p><strong>1. Kısa vadeli sabır.</strong> Bir işi bitirmek, bir sınavı geçmek, bir projeyi tamamlamak. Bu, en kolay olanıdır.</p><p><strong>2. Orta vadeli sabır.</strong> Bir kariyer kurmak, bir ilişkiyi büyütmek, bir beceri öğrenmek. Yıllar sürer.</p><p><strong>3. Uzun vadeli sabır.</strong> Bir hayat inşa etmek, bir karakter oluşturmak, bir miras bırakmak. Onlarca yıl sürer.</p><h2>Sabırsızlığın bedeli</h2><p>Sabırsız erkek, yarım işler bırakır. Yarıda kalan ilişkiler, bitirilmemiş projeler, terk edilen yollar. Hepsi, sabırsızlığın eseridir.</p><p>Sabırsız erkek, kolay olanı seçer. Zor ama değerli olanı değil, kolay ama ucuz olanı. Ve zamanla, hayatı ucuzlar.</p><h2>Sabır nasıl büyür?</h2><p><strong>1. Küçük beklemeler.</strong> Yemek yerken acele etme. Yürürken hızlı olma. Küçük bekleyişler, sabrı büyütür.</p><p><strong>2. Uzun vadeli hedefler.</strong> Bir yıl, beş yıl, on yıl sonrasını düşün. Kısa vadeli hazlar, uzun vadeli hedeflere feda edilir.</p><p><strong>3. Sürece odaklan.</strong> Sonuca değil, sürece odaklan. Süreç, seni inşa eder.</p><p><strong>4. Anı yaşa.</strong> Geleceği beklerken bugünü kaçırma. Şimdi, burada, tamamen burada ol.</p><h2>Sonuç</h2><p>Sabır, kayıp bir erdem değildir. Sadece unutulmuş bir erdemdir. Bugün küçük bir sabır pratiği yap. Yarın bir tane daha. Bir yıl sonra, sakin, dayanıklı, olgun bir adam olacaksın.</p>`},
{id:50,cat:'Karakter',date:'27 Ağustos 2026',read:'7 dk',tags:['Alçakgönüllülük','Kibir','Karakter'],title:'Alçakgönüllülük: Sessiz Gücün İfadesi',excerpt:'Alçakgönüllülük, kendini küçük görmek değildir. Kendini doğru görmektir.',lead:'Alçakgönüllülük, zayıflık değildir. Kendini olduğundan küçük göstermek de değildir. Alçakgönüllülük, kendini doğru görmektir. Ne eksik, ne fazla.',body:`<p>Modern dünya, kibri teşvik eder. Kendini pazarlamak, kendini övmek, kendini göstermek. Ama bu, uzun vadede yorucudur. Çünkü kibir, bir maskedir. Ve maske, her zaman düşer.</p><h2>Alçakgönüllülük nedir?</h2><p>Alçakgönüllülük, kendini değersiz görmek değildir. Aksine, kendini gerçekçi görmektir. Güçlü yönlerini bilirsin, ama abartmazsın. Zayıf yönlerini bilirsin, ama utanmazsın.</p><p>Alçakgönüllü erkek, övünmez. Ama kendini küçültmez de. Sadece yaptığı işi yapar, başarısını gösterişe çevirmez.</p><blockquote>Alçakgönüllülük, kendini küçük görmek değil, kendini doğru görmektir.</blockquote><h2>Kibir neden yorucudur?</h2><p>Kibirli erkek, sürekli kanıtlamak zorundadır. Her ortamda, her sohbette, her karşılaşmada. Bu, bir yüktür. Ve zamanla, insanları uzaklaştırır.</p><p>Kibirli erkek, hata yapamaz. Çünkü hata, maskeyi düşürür. Bu yüzden, hata yapmaktan korkar. Ve korku, hayatı daraltır.</p><h2>Alçakgönüllülüğün gücü</h2><p><strong>1. Öğrenmeye açık.</strong> Alçakgönüllü erkek, bilmediğini kabul eder. Ve bu, öğrenmenin başlangıcıdır.</p><p><strong>2. Dinlemeye açık.</strong> Kibirli erkek, konuşmayı sever. Alçakgönüllü erkek, dinlemeyi. Ve dinlemek, öğrenmenin anahtarıdır.</p><p><strong>3. İlişkileri güçlü.</strong> İnsanlar, alçakgönüllü erkeği sever. Çünkü onunla rekabet etmek zorunda değildir.</p><p><strong>4. İç huzur.</strong> Alçakgönüllü erkek, kendisiyle barışıktır. Kanıtlamak zorunda değildir. Sadece kendisi olur.</p><h2>Alçakgönüllülük nasıl gelişir?</h2><p><strong>1. Hatalarını kabul et.</strong> "Yanılmışım" diyebilmek, alçakgönüllülüğün başlangıcıdır.</p><p><strong>2. Öğrenmeye devam et.</strong> Bildiğin şeyden emin olduğunda, öğrenme durur. Emin olmamak, öğrenmeyi açar.</p><p><strong>3. Başkalarını dinle.</strong> Sadece konuşma, dinle. Herkesin bir şey öğretecek bir bilgisi vardır.</p><p><strong>4. Başarılarını küçült ama inkâr etme.</strong> "Şanslıydım" demek, sahtekârlıktır. "Çok çalıştım" demek, kibirdir. "Doğru zamanda doğru yerdeydim, çok çalıştım, ve yardım aldım" demek, alçakgönüllülüktür.</p><h2>Sonuç</h2><p>Alçakgönüllülük, sessiz gücün ifadesidir. Bugün bir alçakgönüllülük pratiği yap. Bir hatanı kabul et. Birini dinle. Bir şeyi bilmediğini söyle.</p>`},
{id:51,cat:'Karakter',date:'25 Ağustos 2026',read:'7 dk',tags:['Dürüstlük','Ahlak','Karakter'],title:'Dürüstlük: En Pahalı Sermaye',excerpt:'Dürüstlük, kaybedilebilecek en pahalı sermayedir. Bir kere kaybettin mi, geri gelmez.',lead:'Dürüstlük, bir erkeğin en pahalı sermayesidir. Kaybetmesi kolay, kazanması zordur. Ve bir kere kaybettin mi, kolay kolay geri gelmez.',body:`<p>Bir erkeğin itibarı, yıllar içinde inşa edilir. Bir yalanla yıkılır. Bir doğruyla tekrar inşa edilir, ama artık üzerinde bir leke vardır.</p><h2>Dürüstlük nedir?</h2><p>Dürüstlük, sadece yalan söylememek değildir. Dürüstlük, gerçeği söylemek, sözünü tutmak, kendine ve başkalarına karşı şeffaf olmaktır.</p><p>Dürüst erkek, kimsenin görmediği yerde bile aynıdır. Vergi kaçırmaz, çünkü kimse görmüyor diye. Eşine sadıktır, çünkü kimse bilmiyor diye değil, kendi karakteri gereği.</p><blockquote>Dürüstlük, kimsenin görmediği yerde bile aynı kalmaktır.</blockquote><h2>Dürüstlüğün bedeli</h2><p>Dürüst olmak, kolay değildir. Bazen para kaybettirir. Bazen fırsat kaçırır. Bazen insanları üzer. Ama uzun vadede, kazandırır.</p><p>Dürüst erkek, güvenilirdir. Güvenilir erkek, iş hayatında değerlidir. İlişkilerde saygı görür. Çocukları ona özenir.</p><h2>Küçük yalanlar, büyük bedeller</h2><p>"Beyaz yalan" diye bir şey yoktur. Her yalan, bir kapı açar. Ve o kapıdan, daha büyük yalanlar girer. Başlangıçta zararsız görünür. Ama zamanla, hayatın dokusunu çürütür.</p><h2>Dürüstlük nasıl gelişir?</h2><p><strong>1. Kendine dürüst ol.</strong> Kendine yalan söylüyorsan, başkalarına da söylersin. Kendi hatalarını, korkularını, isteklerini kabul et.</p><p><strong>2. Söylediğin sözü tut.</strong> Küçük sözlerden başla. "Yarın ararım" dediysen, ara.</p><p><strong>3. Yanlışı kabul et.</strong> Hata yaptığında, özür dile. "Hatalıydım, düzelteceğim." Bu, zayıflık değil, güçtür.</p><p><strong>4. Doğruyu söyle, ama nazikçe.</strong> Dürüstlük, kırıcılık değildir. Doğruyu söylemek, karşı tarafı yıkmak anlamına gelmez.</p><h2>Sonuç</h2><p>Dürüstlük, en pahalı sermayedir. Bir yalanla yıkılır, bir ömürle inşa edilir. Bugün bir doğru söyle. Küçük bir doğru. Ve kendine verdiğin sözü tut.</p>`},
{id:52,cat:'Karakter',date:'23 Ağustos 2026',read:'7 dk',tags:['Adalet','Doğruluk','Karakter'],title:'Adalet Duygusu: Doğru Olanı Yapmak',excerpt:'Adalet, hukuk değildir. Adalet, doğru olanı yapmaktır, kimse görmese bile.',lead:'Adalet, hukuk kitaplarında değildir. Adalet, bir erkeğin içindedir. Doğru olanı yapmak, kimse görmese bile. İşte karakter budur.',body:`<p>Adalet, sadece mahkemelerde aranmaz. Adalet, günlük hayatta, küçük kararlarda, kimsenin görmediği anlarda ortaya çıkar.</p><h2>Adalet nedir?</h2><p>Adalet, herkese hak ettiğini vermektir. Ama bu, kolay değildir. Çünkü bazen hak ettiğini vermek, karşı tarafı üzer. Bazen bize zarar verir.</p><p>Adil erkek, öfkeli olduğunda bile doğruyu söyler. Kendi çıkarı söz konusu olduğunda bile yanlışı savunmaz. Zayıf olanı korur, güçlü olanı değil.</p><blockquote>Adalet, kimsenin görmediği yerde bile doğru olanı yapmaktır.</blockquote><h2>Adaletin üç alanı</h2><p><strong>1. Kişisel adalet.</strong> Kendine karşı dürüst olmak. Kendi hatalarını kabul etmek. Kendine söz verdiğin şeyi tutmak.</p><p><strong>2. Sosyal adalet.</strong> Başkalarına adil davranmak. Çalışanlarına, ailesine, arkadaşlarına, yabancılara.</p><p><strong>3. Toplumsal adalet.</strong> Haksızlığa itiraz etmek. Zayıfın yanında olmak. Yanlış gördüğünde susmamak.</p><h2>Adaletsizliğe karşı</h2><p>Adil erkek, adaletsizliğe sessiz kalmaz. Ama tepkisi, öfke değil, eylemdir. Bir haksızlık gördüğünde:</p><ul><li><strong>Sor.</strong> "Bu neden böyle?" Belki bir sebep var.</li><li><strong>Konuş.</strong> Haksızlığı dile getir. Ama nazikçe, kırıcı olmadan.</li><li><strong>Hareket et.</strong> Söz yeterli değilse, eyleme geç.</li><li><strong>Kabul et.</strong> Bazı adaletsizlikler, senin gücünün ötesindedir. O zaman, kabullenmek ve devam etmek gerekir.</li></ul><h2>Adalet nasıl gelişir?</h2><p><strong>1. Empati.</strong> Karşı tarafın yerine kendini koy. Ne hissederdi?</p><p><strong>2. İlkeli ol.</strong> Kendi değerlerin olsun. Ve o değerlerden taviz verme.</p><p><strong>3. Küçükten başla.</strong> Küçük haksızlıklara itiraz et. Büyükleri zamanla gelir.</p><p><strong>4. Kendini sorgula.</strong> "Ben adil miyim?" diye sor. Cevap, her zaman evet olmayabilir.</p><h2>Sonuç</h2><p>Adalet, karakterin en sessiz ama en güçlü ifadesidir. Bugün bir adaletsizliği düzelt. Küçük bir tane. Ve kendine söz ver: Bir daha susmayacağım.</p>`},

/* ===== YENİ YAZILAR — BECERİ (7) ===== */
{id:53,cat:'Beceri',date:'21 Ağustos 2026',read:'8 dk',tags:['Doğa','Ateş','Hayatta Kalma'],title:'Ateş Yakma Sanatı: Doğada Hayatta Kalmanın İlk Adımı',excerpt:'Ateş yakmak, bir hayatta kalma becerisi değildir. Bir uygarlık becerisidir.',lead:'Ateş yakmak, bir hayatta kalma becerisi değildir. Bir uygarlık becerisidir. İnsanlığın ilk büyük buluşu, ateştir. Ve her erkek, bu ilk buluşu kendi elleriyle tekrar keşfetmelidir.',body:`<p>Modern hayatta çoğu erkek, ateşi sadece bir çakmakla görür. Oysa ateş yakmak, bir beceri ve bir ritüeldir. Doğada bir ateş yakmak, size hem sıcaklık, hem ışık, hem güvenlik, hem de bir tür iç huzur verir.</p><h2>Ateşin üç unsuru</h2><p>Her ateş, üç şeye ihtiyaç duyar:</p><ul><li><strong>Yakıt.</strong> Odun, yaprak, kağıt. Kuru olmalı.</li><li><strong>Oksijen.</strong> Hava akışı. Ateş boğulursa söner.</li><li><strong>Isı.</strong> Kıvılcım, alev, sürtünme.</li></ul><p>Bu üçünden biri eksikse, ateş yanmaz.</p><blockquote>Ateş, aceleyi sevmez. Acele eden erkek, elini yakar.</blockquote><h2>Ateş katmanları</h2><p><strong>1. Kav (tinder).</strong> Kolayca tutuşan malzeme. Kuru ot, ince ağaç kabuğu, pamuk, kuru yaprak.</p><p><strong>2. Çıra (kindling).</strong> Parmak kalınlığında dallar. Ateş yandıktan sonra bu katman devreye girer.</p><p><strong>3. Odun (fuel).</strong> Kalın dallar, kütükler. Yumuşak ağaç (çam) çabuk yanar, sert ağaç (meşe) uzun yanar.</p><h2>Ateş yakma yöntemleri</h2><p><strong>Çakmak veya kibrit.</strong> En kolay yöntem. Ama doğada her zaman yanında olmayabilir.</p><p><strong>Çakmak taşı ve çelik.</strong> Kıvılcım çıkararak kavı tutuşturma.</p><p><strong>Büyüteç.</strong> Güneş ışığını odaklayarak ateş yakma.</p><p><strong>Sürtünme.</strong> Yay ve matkap yöntemi. En zor ama en öğretici olanı.</p><h2>Ateş yerleşimi</h2><p>Rüzgardan korunaklı, yerden biraz yüksek, çevresinde yanıcı madde olmayan bir yer seç. Ateş çukuru kaz ya da taşlarla çevrele.</p><h2>Sonuç</h2><p>Ateş yakmak, bir beceri olduğu kadar bir ritüeldir. Bugün bir kere deneyin. Küçük bir ateş. Ateş yandığında, sadece bir alev görmeyeceksiniz. Kendi emeğinizin karşılığını göreceksiniz.</p>`},
{id:54,cat:'Beceri',date:'19 Ağustos 2026',read:'7 dk',tags:['Bıçak','Bakım','Alet'],title:'Bıçak Bileme ve Bakımı: Keskin Bir Bıçağın Felsefesi',excerpt:'Keskin bir bıçak, güvenli bir bıçaktır.',lead:'Keskin bir bıçak, güvenli bir bıçaktır. Körelmiş bıçak, daha çok kaza yapar. Bu, ilk bakışta tuhaf gelebilir ama doğrudur.',body:`<p>Bir erkeğin bıçağı, sadece bir alet değildir. Bir sorumluluktur. Onu bilemek, temiz tutmak, doğru kullanmak — hepsi bir erkeğin karakterinin bir yansımasıdır.</p><h2>Bıçak neden körelir?</h2><p><strong>Aşınma.</strong> Bıçak ne kadar keskin olursa olsun, zamanla aşınır. Kesme işlemi, mikroskobik düzeyde bıçağın kenarını yuvarlar.</p><p><strong>Yanlış kullanım.</strong> Bıçağı seramik tabağa sürtmek, cam üzerinde kesmek, bulaşık makinesine atmak — hepsi bıçağı hızla köreltir.</p><blockquote>Bıçağını koruyan erkek, işini de korur.</blockquote><h2>Bileme yöntemleri</h2><p><strong>1. Çelik çubuk (honing steel).</strong> Bıçağı keskinleştirmez; sadece mevcut keskinliği düzeltir.</p><p><strong>2. Bileme taşı (whetstone).</strong> Bıçağı gerçek anlamda keskinleştirir. İki yüzü vardır: kaba ve ince.</p><p><strong>3. Bileme aleti (sharpener).</strong> Pratik ama sınırlı.</p><h2>Bileme taşıyla bileme</h2><p>Taşı suya batır, 10 dakika beklet. Bıçağı 15–20 derece açıyla taşa yerleştir. Bir taraftan 10–15 kez sürt, sonra diğer taraftan.</p><h2>Bıçak bakımı</h2><p><strong>Temizlik.</strong> Her kullanımdan sonra ılık su ve sabunla yıka.</p><p><strong>Yağlama.</strong> Karbon çelik bıçaklar için, hafif bir yağ sür.</p><p><strong>Saklama.</strong> Bıçağı kuru bir yerde sakla. Kılıf ya da manyetik şerit kullan.</p><h2>Sonuç</h2><p>Keskin bir bıçak, güvenli bir bıçaktır. Bakımlı bir bıçak, uzun ömürlü bir bıçaktır. Bugün mutfak bıçağını bile.</p>`},
{id:55,cat:'Beceri',date:'17 Ağustos 2026',read:'8 dk',tags:['Konuşma','Sunum','Topluluk'],title:'Topluluk Önünde Konuşma: Korkuyu Aşmanın Yolları',excerpt:'Topluluk önünde konuşmak, dünyanın en büyük korkularından biri. Ama öğrenilebilir bir beceridir.',lead:'Topluluk önünde konuşmak, dünyanın en büyük korkularından biri olarak gösterilir. Ama bu korku, öğrenilebilir ve yönetilebilir bir korkudur.',body:`<p>Birçok erkek, topluluk önünde konuşmaktan kaçar. Toplantıda susar, düğünde kısa keser, sunumdan kaçınır. Oysa iyi konuşan bir erkek, hayatın her alanında avantaj kazanır.</p><h2>Korku neden bu kadar büyük?</h2><p>Korkunun temeli, değerlendirilme korkusudur. Ama gerçek şu: insanlar senin konuşmanı hatırlamaz. Kendi hayatlarıyla meşguldür.</p><blockquote>Korku, hakkında konuşmadığın sürece büyür.</blockquote><h2>Hazırlık: korkunun panzehiri</h2><p><strong>1. İçerik.</strong> Üç ana fikir, her birine iki-üç destek noktası.</p><p><strong>2. Yapı.</strong> Giriş, gövde, sonuç.</p><p><strong>3. Prova.</strong> Yüksek sesle, en az üç kez. Prova, korkuyu %80 azaltır.</p><h2>Beden dilini kullan</h2><p>Omuzlar geri, çene düz, gözler dinleyiciyle temas. Ellerini kullan. Yavaş hareket et.</p><h2>Sesi yönet</h2><p>Yavaşla, duraklama kullan, sesini alçalt, nefes al.</p><h2>Kaygıyı yönet</h2><p>Nefes egzersizi, gevşeme, olumlu iç konuşma, fiziksel ısınma.</p><h2>Sonuç</h2><p>Topluluk önünde konuşmak, bir erkeğin hayatını değiştirir. Bugün küçük bir konuşma yap. Altı ay sonra, o eski korkunu hatırlamayacaksın.</p>`},
{id:56,cat:'Beceri',date:'15 Ağustos 2026',read:'8 dk',tags:['İlk Yardım','Sağlık','Beceri'],title:'İlk Yardım: Hayat Kurtaran Temel Bilgiler',excerpt:'İlk yardım, sadece sağlıkçıların işi değildir. Her erkeğin bilmesi gereken bir sorumluluktur.',lead:'İlk yardım, sadece sağlıkçıların işi değildir. Her erkeğin bilmesi gereken bir sorumluluktur. Çünkü kriz anında, en yakındaki kişi sensin.',body:`<p>Bir kaza anında, ilk 3–5 dakika hayati önemdedir. Ambulans gelene kadar, senin yapabileceklerin, bir hayatı kurtarabilir ya da kaybettirebilir.</p><h2>Temel ilk yardım adımları</h2><p><strong>1. Bilinç kontrolü.</strong> Kişiye seslen, omzuna dokun. Cevap veriyor mu?</p><p><strong>2. Solunum kontrolü.</strong> Nefes alıyor mu? Göğsü kalkıyor mu?</p><p><strong>3. 112'yi ara.</strong> Yardım çağır. Sakin konuş, adres ve durumu net söyle.</p><h2>Kanama</h2><p>Temiz bir bezle yaraya bastır. Kanama durmazsa, yaranın üstüne ikinci bir bez ekle. Turnike sadece uzuv kanamalarında ve son çare olarak kullanılır.</p><h2>Boğulma (Heimlich manevrası)</h2><p>Kişinin arkasına geç. Kollarını beline dolа. Yumruğunu göbek deliğinin üstüne yerleştir. Diğer elinle kavra ve içeri-yukarı doğru bastır.</p><h2>Kalp masajı (CPR)</h2><p>Kişiyi sert bir zemine yatır. Ellerini göğsün ortasına yerleştir. Dakikada 100–120 bası, 5–6 cm derinlikte.</p><h2>Yanık</h2><p>Soğuk su altında 10–20 dakika tut. Buz kullanma. Yağ sürme. Temiz bir bezle ört.</p><h2>Kırık</h2><p>Hareket ettirme. Sabitle. Soğuk uygula. Ambulans çağır.</p><h2>Sonuç</h2><p>İlk yardım, bir sorumluluktur. Kızılay'ın ücretsiz eğitimleri var. Bir hafta sonunu ayır.</p>`},
{id:57,cat:'Beceri',date:'13 Ağustos 2026',read:'7 dk',tags:['Marangozluk','Ahşap','Beceri'],title:'Basit Marangozluk: Ahşapla Çalışmanın Zevki',excerpt:'Ahşapla çalışmak, bir erkeğe sabrı ve zanaatı öğretir.',lead:'Ahşapla çalışmak, bir erkeğe sabrı ve zanaatı öğretir. Modern dünyada, elle bir şey üretmek, neredeyse bir isyan haline geldi.',body:`<p>Bir çekmece rafı, bir kitaplık, bir tamir — ahşap işleri, erkeğin el becerisini geliştirir. Ama daha ötesi, bir zanaatkâr ruhu aşılar.</p><h2>Başlangıç ekipmanı</h2><ul><li><strong>Testere.</strong> El testeresi ya da dekupaj.</li><li><strong>Matkap.</strong> Kablosuz, değişken hızlı.</li><li><strong>Zımpara.</strong> Elektrikli ya da kağıt.</li><li><strong>Marangoz kalemi.</strong> Kurşun kalemden daha iyi.</li><li><strong>Gönye.</strong> Doğru açı için.</li></ul><h2>İlk proje önerileri</h2><p><strong>1. Basit raf.</strong> Dört ahşap parça, birkaç vida.</p><p><strong>2. Kuş evi.</strong> Küçük, eğlenceli, öğretici.</p><p><strong>3. Kesme tahtası.</strong> Tek parça ahşap, zımparala, yağla.</p><p><strong>4. Basit kutu.</strong> Altı parça, tutkal ve vida.</p><h2>Temel teknikler</h2><p><strong>Ölç.</strong> İki kere ölç, bir kere kes. Bu, marangozluğun altın kuralıdır.</p><p><strong>Kes.</strong> Yavaş ve dikkatli. Testere bıçağı yavaş hareket etsin.</p><p><strong>Zımparala.</strong> Pürüzsüz yüzey, iyi işin işaretidir.</p><p><strong>Birleştir.</strong> Tutkal + vida en dayanıklı bağlantıdır.</p><h2>Sonuç</h2><p>Ahşapla çalışmak, bir erkeğe sabrı, dikkati ve emeğin değerini öğretir. Bugün basit bir proje seç. Yarın bir tane daha. Bir yıl sonra, kendi ellerinle yaptığın mobilyalarla çevrili bir evin olacak.</p>`},
{id:58,cat:'Beceri',date:'11 Ağustos 2026',read:'7 dk',tags:['Yön','Harita','Doğa'],title:'Yön Bulma ve Harita Okuma: Kaybolmamak Sanatı',excerpt:'Telefon şarjı bittiğinde, yön bulma becerisi hayat kurtarır.',lead:'Telefon şarjı bittiğinde, yön bulma becerisi hayat kurtarır. Modern erkek, harita okumayı unuttu. Oysa bu, en eski hayatta kalma becerisidir.',body:`<p>Modern dünyada, herkes bir GPS kullanır. Ama GPS, bir pille çalışır. Pil bittiğinde, ne yapacaksın?</p><h2>Temel yön bulma yöntemleri</h2><p><strong>1. Güneş.</strong> Sabah doğuda, akşam batıda. Kuzey, güneşin tam tepe noktasında.</p><p><strong>2. Yıldızlar.</strong> Kuzey yarımkürede Kutup Yıldızı, kuzeyi gösterir.</p><p><strong>3. Ağaçlar.</strong> Yosun, genellikle kuzey tarafında daha çok büyür. Ağaç dalları güneye doğru daha yoğun.</p><p><strong>4. Kar.</strong> Kuzeye bakan yamaçlar, daha uzun süre karla kaplı kalır.</p><p><strong>5. Pusula.</strong> En güvenilir. Ama kalibrasyonu doğru yapılmalı.</p><h2>Harita okuma</h2><p><strong>1. Ölçek.</strong> 1:50.000 ölçek, haritada 1 cm'nin gerçekte 500 m olduğunu gösterir.</p><p><strong>2. Eş yükselti eğrileri.</strong> Aynı yükseklikteki noktaları birleştirir. Sık olan çizgiler, dik yamacı gösterir.</p><p><strong>3. Semboller.</strong> Her harita, bir lejant içerir. Yollar, nehirler, binalar, ormanlar.</p><p><strong>4. Pusula ile yön.</strong> Haritayı kuzeye doğru çevir. Pusulayı haritaya yerleştir, hedefi bul.</p><h2>Doğada kaybolursan</h2><ul><li><strong>Dur.</strong> Panik yapma.</li><li><strong>Düşün.</strong> Nereden geldin? Son tanıdık nokta nerede?</li><li><strong>Gözlemle.</strong> Yüksek bir yere çık, çevreyi incele.</li><li><strong>Su.</strong> Aşağı doğru git. Su, genellikle yerleşime götürür.</li><li><strong>İşaret bırak.</strong> Yoluna taş, dal, kazık bırak.</li></ul><h2>Sonuç</h2><p>Yön bulma, bir hayatta kalma becerisidir. Bugün basit bir harita çıkar. Yarın pusula kullanmayı öğren. Bir ay sonra, doğada güvende olacaksın.</p>`},
{id:59,cat:'Beceri',date:'9 Ağustos 2026',read:'7 dk',tags:['Bisiklet','Tamir','Bakım'],title:'Bisiklet Tamiri: İki Tekerlekli Özgürlük',excerpt:'Bisikletini tanıyan erkek, yolda kalmaz.',lead:'Bisikletini tanıyan erkek, yolda kalmaz. Bisiklet, hem spor hem ulaşım hem özgürlüktür. Ve bakımı, bir erkeğin temel becerisidir.',body:`<p>Bisiklet, modern şehirde en akıllı ulaşım aracıdır. Trafiksiz, park sorunu olmayan, sağlıklı. Ama bisikletini tanımazsan, yolda kalırsın.</p><h2>Temel parçalar</h2><ul><li><strong>Zincir.</strong> Temiz ve yağlı olmalı.</li><li><strong>Fren.</strong> Ön ve arka. Aşınmış pabuçlar, tehlike yaratır.</li><li><strong>Lastik.</strong> Basınç kontrolü, ayda bir.</li><li><strong>Vites.</strong> Kablolar gergin, dişliler temiz.</li><li><strong>Sele.</strong> Doğru yükseklik, dizin hafif bükük olması.</li></ul><h2>Lastik tamiri</h2><p>1. İç lastiği çıkar.<br>2. Patlak yeri bul (su kabı yöntemi).<br>3. Zımparala, yama yapıştır.<br>4. Kuruduktan sonra iç lastiği yerleştir.<br>5. Şişir, kontrol et.</p><h2>Zincir bakımı</h2><p>Ayda bir, zinciri temizle. Özel temizleyici ya da gazyağı. Sonra yağla. Yağ, hafif olmalı — fazlası, kir tutar.</p><h2>Fren ayarı</h2><p>Fren kollarını sık, pabuçlar jantı ortalasın. Pabuçlar jantla tam temas etmeli, ama tekerleği sıkmamalı.</p><h2>Vites ayarı</h2><p>Vites kablolarını kontrol et. Dişlilerin temiz olduğundan emin ol. Vites geçişleri pürüzsüz olmalı.</p><h2>Sonuç</h2><p>Bisikletini tanıyan erkek, yolda kalmaz. Bugün bir bakım yap. Yarın bir tamir. Bir ay sonra, bisiklet, senin uzantın olacak.</p>`},

/* ===== YENİ YAZILAR — SAĞLIK (9) ===== */
{id:60,cat:'Sağlık',date:'7 Ağustos 2026',read:'8 dk',tags:['Antrenman','40 Yaş','Güç'],title:'Fiziksel Güç: 40 Yaşında Formda Olmanın Gerçek Yolu',excerpt:'Kas kaybetmek kaçınılmaz değil. Doğru antrenmanla 40 yaşında 25 yaşından güçlü olabilirsin.',lead:'40 yaş, çoğu erkeğin "artık geçti" dediği yaştır. Oysa doğru yaklaşımla 40 yaş, en güçlü dönemin başlangıcıdır.',body:`<p>30’lu yaşlardan sonra, çoğu erkek yılda %1 ila %2 oranında kas kütlesi kaybeder. Ama bu kayıp kaçınılmaz değildir.</p><p>Bilim bize şunu söylüyor: <strong>kuvvet antrenmanı yapan 60 yaşındaki bir erkek, yapmayan 30 yaşındaki bir erkekten daha güçlü olabilir.</strong></p><h2>Antrenman: üç kural</h2><p><strong>1. Ağırlık kaldır.</strong> Haftada 2–3 gün. Temel hareketler: squat, deadlift, bench press, row, overhead press, pull-up.</p><p><strong>2. Az ama düzenli.</strong> Haftada 2 gün, ama 5 yıl boyunca. Süreklilik, yoğunluktan önemlidir.</p><p><strong>3. Kardiyo ihmal edilmesin.</strong> Haftada 150 dakika orta yoğunlukta kardiyo.</p><blockquote>Kas, sadece bedenin değil, iradenin de göstergesidir.</blockquote><h2>Beslenme</h2><p>Kilo başına 1,6–2,2 gram protein. 80 kiloysanız günde 130–175 gram.</p><h2>Uyku</h2><p>Kas uykuda büyür. Hedef: 7–8 saat.</p><h2>Stres</h2><p>Kronik stres, kortizolü yükseltir; kortizol da kas yıkar. Stresi azalt: doğa, meditasyon, nefes.</p><h2>Sonuç</h2><p>40 yaşında formda olmak, daha az kahramanlık, daha çok disiplin ister. Ama sonuç aynıdır: güçlü, sağlıklı, enerjik bir beden.</p>`},
{id:61,cat:'Sağlık',date:'5 Ağustos 2026',read:'7 dk',tags:['Şeker','Beslenme','Sağlık'],title:'Şeker ve Erkek Sağlığı: Sessiz Yıkıcı',excerpt:'Şeker, sadece kilo aldırmaz. Testosteronu düşürür, kalbi yorar, zihni bulandırır.',lead:'Şeker, modern erkeğin sessiz düşmanıdır. Sadece kilo aldırmaz. Testosteronu düşürür, kalbi yorar, zihni bulandırır.',body:`<p>Bir erkeğin günlük şeker tüketimi, çoğu zaman farkında olmadığı bir rakama ulaşır. Dünya Sağlık Örgütü, günde 25 gramdan az şeker önerir. Modern erkek, bunun 4–5 katını tüketir.</p><h2>Şeker bedende ne yapar?</h2><ul><li><strong>İnsülin direnci.</strong> Diyabet yolu açılır.</li><li><strong>Karaciğer yağlanması.</strong> Modern bir salgın.</li><li><strong>Kilo alımı.</strong> Kalorili, ama doyurucu değil.</li><li><strong>İnflamasyon.</strong> Kalp hastalığı, kanser, bunama ile ilişkili.</li><li><strong>Testosteron düşüşü.</strong> Libido, kas, enerji, ruh hali üzerinde doğrudan etki.</li></ul><blockquote>Şeker, sadece tatlı değildir. Bağımlılıktır.</blockquote><h2>Gizli şeker kaynakları</h2><p>Meyve suları, gazlı içecekler, soslar, kahvaltılık gevrekler, meyveli yoğurt, beyaz ekmek, "yağsız" ürünler.</p><h2>Şekeri nasıl azaltırsın?</h2><ol><li>Etiketleri oku.</li><li>Su iç.</li><li>Kahveyi sade iç.</li><li>Tatlıyı haftada bire indir.</li><li>Meyveyi tercih et.</li><li>Proteini artır.</li><li>Uyku ve stresi düzelt.</li></ol><h2>Sonuç</h2><p>Şeker, modern erkeğin en büyük gizli düşmanıdır. Bugün bir gazlı içeceği suyla değiştir. Bir ay sonra, bedenin ve zihnin farklı olacak.</p>`},
{id:62,cat:'Sağlık',date:'3 Ağustos 2026',read:'8 dk',tags:['Testosteron','Hormon','Sağlık'],title:'Testosteron: Doğal Yollarla Artırmanın Yolları',excerpt:'Testosteron, bir erkeğin enerjisini, kasını, libidosunu belirler. Doğal yollarla artırılabilir.',lead:'Testosteron, bir erkeğin enerjisini, kasını, libidosunu, motivasyonunu belirleyen ana hormondur. Modern hayat bu hormonu düşürür. Ama doğal yollarla artırmak mümkündür.',body:`<p>Son 50 yılda erkeklerin ortalama testosteron seviyesi %20 civarında düştü. Sebepler: hareketsizlik, işlenmiş gıda, obezite, stres, uyku yetersizliği.</p><h2>Testosteronu düşüren şeyler</h2><ul><li>Uyku yetersizliği.</li><li>Obezite.</li><li>Kronik stres.</li><li>Aşırı alkol.</li><li>İşlenmiş gıda.</li><li>Hareketsizlik.</li><li>Kimyasallar (BPA, ftalat).</li></ul><blockquote>Testosteron, bir erkeğin yakıtıdır.</blockquote><h2>Doğal artırmanın 10 yolu</h2><ol><li>Ağırlık antrenmanı.</li><li>HIIT kardiyo.</li><li>7–9 saat uyku.</li><li>Stresi azalt.</li><li>Yeterli protein.</li><li>Sağlıklı yağlar.</li><li>D vitamini.</li><li>Çinko ve magnezyum.</li><li>Alkolü azalt.</li><li>Sigarayı bırak.</li></ol><h2>Ne zaman doktora?</h2><p>Sürekli yorgunluk, libido kaybı, depresyon, kas kaybı varsa, bir doktora danış.</p><h2>Sonuç</h2><p>Mucize takviye yoktur. Yol basittir: ağırlık kaldır, iyi uyu, stresten kaçın, doğru ye.</p>`},
{id:63,cat:'Sağlık',date:'1 Ağustos 2026',read:'7 dk',tags:['Sırt','Duruş','Ağrı'],title:'Sırt Ağrısı: Modern Erkeğin Laneti',excerpt:'Sırt ağrısı, yaşlanmanın değil, yanlış alışkanlıkların sonucudur.',lead:'Sırt ağrısı, modern erkeğin en yaygın sağlık şikâyetlerinden biri. Ama çoğu sırt ağrısı, yaşlanmanın değil, yanlış alışkanlıkların sonucudur. Ve önlenebilir.',body:`<p>Otuz yaşından sonra erkeklerin %80'i hayatının bir noktasında sırt ağrısı çeker. Bu, bir kader değildir. Bir sonuçtur.</p><h2>Sırt ağrısının sebepleri</h2><p><strong>Uzun süre oturmak.</strong> Günde 8 saat ofis sandalyesinde oturmak, sırt kaslarını zayıflatır.</p><p><strong>Yanlış duruş.</strong> Kambur, öne eğik, telefon başında bükülmüş.</p><p><strong>Zayıf karın ve sırt kasları.</strong></p><p><strong>Ağır kaldırma, yanlış teknik.</strong></p><p><strong>Stres.</strong> Kronik stres, sırt kaslarını sürekli gergin tutar.</p><blockquote>Sırtını ihmal eden erkek, bir gün yatağa düşer.</blockquote><h2>Doğru duruş</h2><p>Ayakta: kulak, omuz, kalça, diz, ayak bileği aynı hizada.</p><p>Otururken: sırt sandalyeye yaslanmış, ayaklar yerde, ekran göz hizasında. Her 30 dakikada bir kalk.</p><h2>Sırtı güçlendiren egzersizler</h2><p>Plank, dead bug, bird dog, glute bridge, cat-cow, yürüyüş, yüzme.</p><h2>Ne zaman doktora?</h2><p>Bacağa yayılan ağrı, idrar kontrolünde zorluk, ani kilo kaybı, kaza sonrası ağrı.</p><h2>Sonuç</h2><p>Bugün duruşunu düzelt. Yarın bir egzersiz ekle. Bir ay sonra, sırtın sana teşekkür edecek.</p>`},
{id:64,cat:'Sağlık',date:'30 Temmuz 2026',read:'6 dk',tags:['Nefes','Stres','Sağlık'],title:'Nefes: En Güçlü İlaç, En Basit Araç',excerpt:'Nefes, tek istemli kontrol edilebilen otonom fonksiyondur.',lead:'Nefes, bedenin tek istemli kontrol edilebilen otonom fonksiyonudur. Bu, inanılmaz bir güçtür.',body:`<p>Bir erkek, günde yaklaşık 20.000 kez nefes alır. Ama çok azı bu nefesi fark eder. Oysa nefes, stresi yönetir, zihni sakinleştirir, performansı artırır.</p><h2>Nefes neden bu kadar güçlü?</h2><p>Nefes, otonom sinir sistemini doğrudan etkiler. Yavaş, derin nefes, parasempatik sistemi aktive eder. Hızlı, sığ nefes, sempatik sistemi.</p><blockquote>Nefesini kontrol eden erkek, zihnini kontrol eder.</blockquote><h2>Beş nefes tekniği</h2><p><strong>1. Kutu nefesi (4-4-4-4).</strong> Stres ve kaygı için.</p><p><strong>2. 4-7-8 nefesi.</strong> Uykuya dalmak için.</p><p><strong>3. Fizyolojik iç çekme.</strong> Ani stres için.</p><p><strong>4. Diafram nefesi.</strong> Günlük pratik için.</p><p><strong>5. Buteyko.</strong> Kronik hiperventilasyon için.</p><h2>Diafram nefesi nasıl yapılır?</h2><p>Bir elini göğsüne, bir elini karnına koy. Nefes alırken, karındaki el yükselmeli. 4 saniye al, 2 saniye tut, 6 saniye ver.</p><h2>Sonuç</h2><p>Nefes, bedava, her yerde, her zaman yanında. Bugün bir nefes egzersizi yap. Bir hafta sonra, hem bedenin hem zihnin farklı olacak.</p>`},
{id:65,cat:'Sağlık',date:'28 Temmuz 2026',read:'7 dk',tags:['Yürüyüş','Egzersiz','Sağlık'],title:'Yürümenin Gücü: En Basit ve En Etkili Egzersiz',excerpt:'Yürümek, dünyanın en basit egzersizidir. Ama faydaları, en pahalı spor salonundan fazladır.',lead:'Yürümek, dünyanın en basit egzersizidir. Ama faydaları, en pahalı spor salonundan fazladır.',body:`<p>Modern erkek, egzersizi karmaşıklaştırdı. Spor salonu, protein tozu, akıllı saat. Oysa en etkili egzersiz, hep yanı başımızdaydı: yürümek.</p><h2>Yürümenin faydaları</h2><p><strong>Kalp sağlığı.</strong> Kalp krizi riskini %30–40 azaltır.</p><p><strong>Kilo kontrolü.</strong> 30 dakika tempolu yürüyüş, 150–200 kalori yakar.</p><p><strong>Kan şekeri.</strong> Yemek sonrası 15 dakika yürümek, kan şekerini dengeler.</p><p><strong>Zihin sağlığı.</strong> Endorfin salgılar. Depresyon ve kaygı üzerinde ilaç kadar etkili olabilir.</p><p><strong>Hafıza.</strong> Hipokampusu büyütür.</p><p><strong>Uyku.</strong> Akşam yürüyüşü, uyku kalitesini artırır.</p><blockquote>Yürüyen erkek, düşünen erkektir.</blockquote><h2>Ne kadar yürümeli?</h2><p>Haftada 150 dakika orta yoğunlukta. Ya da günde 8.000–10.000 adım.</p><h2>Yürüyüş türleri</h2><p>Sabah, öğle, akşam, hafta sonu uzun yürüyüşü.</p><h2>Sonuç</h2><p>Yürümek, en basit ve en güçlü egzersizdir. Ne ekipman, ne abonelik, ne bahane. Bugün bir yürüyüşe çık.</p>`},
{id:66,cat:'Sağlık',date:'26 Temmuz 2026',read:'8 dk',tags:['Kalp','Sağlık','Önlem'],title:'Kalp Sağlığı: Sessiz Katili Önlemek',excerpt:'Kalp hastalığı, erkeklerin bir numaralı ölüm sebebidir. Ama önlenebilir.',lead:'Kalp hastalığı, erkeklerin bir numaralı ölüm sebebidir. Ama büyük ölçüde önlenebilir. Ve önlem, bugün başlar.',body:`<p>Her yıl milyonlarca erkek, kalp krizi nedeniyle hayatını kaybediyor. Ve çoğu, hiçbir belirti göstermeden. Bu yüzden kalp hastalığı, "sessiz katil" olarak anılır.</p><h2>Risk faktörleri</h2><ul><li><strong>Sigara.</strong> En büyük risk.</li><li><strong>Yüksek tansiyon.</strong></li><li><strong>Yüksek kolesterol.</strong></li><li><strong>Diyabet.</strong></li><li><strong>Obezite.</strong></li><li><strong>Hareketsizlik.</strong></li><li><strong>Stres.</strong></li><li><strong>Aile öyküsü.</strong></li></ul><blockquote>Kalbin, senin en sadık hizmetkârındır. Ona iyi bak.</blockquote><h2>Önleme yolları</h2><ol><li>Sigara içme.</li><li>Düzenli egzersiz (haftada 150 dk).</li><li>Sağlıklı beslenme (Akdeniz tipi).</li><li>Kilo kontrolü.</li><li>Stres yönetimi.</li><li>Yeterli uyku.</li><li>Düzenli kontrol (tansiyon, kolesterol, şeker).</li></ol><h2>Belirtiler</h2><p>Göğüs ağrısı, nefes darlığı, çarpıntı, yorgunluk, kol veya çeneye yayılan ağrı. Bu belirtiler varsa, hemen doktora git.</p><h2>Sonuç</h2><p>Kalp sağlığı, sadece bugün değil, bir ömür boyu önemlidir. Bugün bir yürüyüş yap. Yarın bir sigara bırak. Bir ay sonra, kalbin sana teşekkür edecek.</p>`},
{id:67,cat:'Sağlık',date:'24 Temmuz 2026',read:'7 dk',tags:['Bağışıklık','Sağlık','Önlem'],title:'Bağışıklık: Bedenin Kalkanı',excerpt:'Bağışıklık sistemi, senin en iyi savunma hattıdır. Onu güçlendirmek, senin elinde.',lead:'Bağışıklık sistemi, senin en iyi savunma hattıdır. Onu güçlendirmek, senin elinde. Ama modern hayat, onu zayıflatıyor.',body:`<p>Bağışıklık sistemi, vücudun savunma mekanizmasıdır. Virüsler, bakteriler, parazitler — hepsine karşı savaşır. Ama modern hayat, bu sistemi zayıflatır.</p><h2>Bağışıklığı zayıflatan şeyler</h2><ul><li>Uyku yetersizliği.</li><li>Kronik stres.</li><li>İşlenmiş gıda.</li><li>Şeker.</li><li>Alkol.</li><li>Sigara.</li><li>Hareketsizlik.</li><li>Aşırı temizlik (mikrop çeşitliliği azalır).</li></ul><blockquote>Bağışıklık, bir kalkan değil, bir bahçedir. Onu beslemek gerekir.</blockquote><h2>Bağışıklığı güçlendirme</h2><ol><li>7–9 saat uyku.</li><li>Dengeli beslenme (sebze, meyve, protein).</li><li>Düzenli egzersiz.</li><li>Stres yönetimi.</li><li>D vitamini (güneş).</li><li>C vitamini, çinko, magnezyum.</li><li>Probiyotikler (yoğurt, kefir).</li><li>Elleri yıkamak.</li></ol><h2>Sonuç</h2><p>Bağışıklık, bir günde güçlenmez. Ama her gün yapılan küçük şeylerle büyür. Bugün bir yürüyüş yap. Yarın bir uyku düzenle. Bir ay sonra, kendini daha güçlü hissedeceksin.</p>`},
{id:68,cat:'Sağlık',date:'22 Temmuz 2026',read:'8 dk',tags:['Zihin','Kaygı','Sağlık'],title:'Zihinsel Sağlık: Kaygıyla Baş Etmek',excerpt:'Kaygı, zayıflık değildir. Bir sinyaldir. Ve yönetilebilir.',lead:'Kaygı, modern erkeğin en yaygın zihinsel sorunudur. Ama çoğu erkek, kaygısını kabul etmez. "Ben iyiyim" der. Oysa kaygı, zayıflık değildir. Bir sinyaldir.',body:`<p>Modern hayat, kaygıyı besler. Ekonomik belirsizlik, iş baskısı, sosyal medya, aile beklentileri. Ve erkekler, genellikle bu kaygıyı bastırır.</p><h2>Kaygı nedir?</h2><p>Kaygı, bir tehlike sinyalidir. Beden, bir tehdit algılar ve harekete geçmek için enerji üretir. Bu, biyolojik bir savunma mekanizmasıdır. Sorun, bu mekanizmanın sürekli tetiklenmesidir.</p><h2>Belirtileri</h2><ul><li>Sürekli endişe.</li><li>Uyku bozukluğu.</li><li>Konsantrasyon sorunu.</li><li>Fiziksel belirtiler (terleme, çarpıntı, titreme).</li><li>Kaçınma davranışı.</li></ul><blockquote>Kaygı, kaçılan şeyin büyüdüğü yerdir.</blockquote><h2>Baş etme yolları</h2><ol><li>Nefes egzersizleri.</li><li>Düzenli egzersiz.</li><li>Yeterli uyku.</li><li>Kafeini azalt.</li><li>Alkolü azalt.</li><li>Konuş (bir arkadaş, bir terapist).</li><li>Yazma (günlük tut).</li><li>Profesyonel yardım.</li></ol><h2>Ne zaman yardım almalı?</h2><p>Kaygı, günlük hayatı engelliyorsa. Uyku, iş, ilişki etkileniyorsa. Panik atak geliyorsa. Bu durumda, bir uzmana git.</p><h2>Sonuç</h2><p>Kaygı, utanç değildir. Yardım istemek, zayıflık değildir. Aksine, cesarettir. Bugün bir nefes egzersizi yap. Yarın bir arkadaşınla konuş. Bir ay sonra, kendini daha iyi hissedeceksin.</p>`},
