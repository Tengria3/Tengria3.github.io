<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erkeklik Sanatı — Zamansız Erdemler, Modern Bir Rehber</title>
    <meta name="description" content="Karakter, beceri, sağlık ve ilişkiler üzerine zamansız erdemler ve modern rehberler sunan bağımsız bir yayın.">
    
    <!-- SEO & Social Tags -->
    <meta property="og:title" content="Erkeklik Sanatı — Zamansız Erdemler, Modern Bir Rehber">
    <meta property="og:description" content="Derinlemesine yazılar ve pratik rehberler ile erkekliği yeniden düşünmek.">
    <meta property="og:type" content="website">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        
        :root{
            --bg:#faf8f3;--bg-2:#f2ede3;--surface:#fff;--surface-2:#f7f3ec;
            --text:#171412;--text-2:#3d3833;--muted:#78716c;
            --border:#e7e0d3;--border-2:#d9d0bf;
            --accent:#c2410c;--accent-2:#9a3412;--gold:#b45309;
            --shadow:0 4px 16px -4px rgba(23,20,18,.08);
            --shadow-lg:0 24px 48px -16px rgba(23,20,18,.18);
            --radius:14px;--radius-lg:22px;
            --maxw:1240px;--narrow:720px;
            --ease:cubic-bezier(.22,1,.36,1)
        }

        [data-theme="dark"]{
            --bg:#0b0a09;--bg-2:#141210;--surface:#171412;--surface-2:#1f1b17;
            --text:#f5f0e8;--text-2:#d6cec2;--muted:#a29a8e;
            --border:#2a2520;--border-2:#3b342c;
            --accent:#fb923c;--accent-2:#fdba74;--gold:#fbbf24
        }

        html{scroll-behavior:smooth}
        body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .3s,color .3s}
        
        h1,h2,h3,h4{font-family:'Fraunces',Georgia,serif;font-weight:600;letter-spacing:-.02em;line-height:1.12;color:var(--text)}
        a{color:inherit;text-decoration:none}
        
        .container{max-width:var(--maxw);margin:0 auto;padding:0 24px;width:100%}
        .narrow{max-width:var(--narrow);margin:0 auto;padding:0 24px}

        /* Header */
        .site-header{position:sticky;top:0;z-index:100;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(160%) blur(18px);-webkit-backdrop-filter:saturate(160%) blur(18px);border-bottom:1px solid var(--border)}
        .site-header .container{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;gap:24px}
        
        .logo{display:flex;align-items:center;gap:9px;font-family:'Fraunces',serif;font-weight:700;font-size:1.4rem;letter-spacing:-.03em;color:var(--text);padding:0;background:none;border:none;cursor:pointer}
        .logo .mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--gold));display:grid;place-items:center;color:#fff;font-size:1rem;font-weight:900;font-family:'Fraunces',serif;box-shadow:0 4px 12px -2px color-mix(in srgb,var(--accent) 40%,transparent);flex-shrink:0}
        .logo em{font-style:normal;color:var(--accent)}
        
        .nav{display:flex;align-items:center;gap:2px}
        .nav button{padding:8px 14px;border-radius:8px;font-size:.9rem;font-weight:500;color:var(--text-2);transition:all .2s var(--ease);background:none;border:none;cursor:pointer}
        .nav button:hover{color:var(--accent);background:var(--surface-2)}
        
        .header-actions{display:flex;align-items:center;gap:8px}
        .icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--text-2);border:1px solid var(--border);background:var(--surface);transition:all .2s var(--ease);padding:0;cursor:pointer}
        .icon-btn:hover{color:var(--accent);border-color:var(--accent)}
        .icon-btn svg{width:17px;height:17px}
        
        .menu-btn{display:none}
        .nav-mobile{display:none;flex-direction:column;background:var(--surface);border-bottom:1px solid var(--border);padding:8px 24px 20px}
        .nav-mobile.open{display:flex}
        .nav-mobile button{padding:14px 0;border-bottom:1px solid var(--border);font-weight:500;color:var(--text-2);width:100%;background:none;border-left:none;border-right:none;border-top:none;cursor:pointer;text-align:left}
        .nav-mobile button:last-child{border-bottom:none}

        /* Hero Section */
        .hero{position:relative;padding:90px 0 100px;overflow:hidden;background:radial-gradient(circle at 20% 0%,color-mix(in srgb,var(--accent) 12%,transparent),transparent 55%),radial-gradient(circle at 85% 30%,color-mix(in srgb,var(--gold) 14%,transparent),transparent 50%),var(--bg)}
        .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(var(--border) 1px,transparent 1px) 0 0/100% 80px,linear-gradient(90deg,var(--border) 1px,transparent 1px) 0 0/80px 100%;mask-image:radial-gradient(circle at center,black 10%,transparent 75%);-webkit-mask-image:radial-gradient(circle at center,black 10%,transparent 75%);opacity:.5;pointer-events:none}
        
        .hero-inner{position:relative;z-index:2;display:grid;grid-template-columns:1.25fr .85fr;gap:60px;align-items:center}
        
        .hero-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:100px;font-size:.78rem;font-weight:500;background:var(--surface);border:1px solid var(--border);color:var(--text-2);margin-bottom:24px;box-shadow:var(--shadow)}
        .hero-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
        @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}
        
        .hero h1{font-size:clamp(2.4rem,5.2vw,4.4rem);font-weight:500;letter-spacing:-.035em;line-height:1.02;margin-bottom:24px}
        .hero h1 em{font-style:italic;font-weight:400;background:linear-gradient(120deg,var(--accent),var(--gold));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
        .hero p.lead{font-size:1.15rem;color:var(--text-2);max-width:560px;margin-bottom:34px;line-height:1.6}
        
        .hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:44px}
        .btn{display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border-radius:12px;font-size:.95rem;font-weight:600;background:var(--text);color:var(--bg);border:1px solid var(--text);transition:all .25s var(--ease);cursor:pointer}
        .btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
        .btn svg{width:15px;height:15px;flex-shrink:0}
        .btn-accent{background:linear-gradient(135deg,var(--accent),var(--gold));color:#fff;border-color:transparent;box-shadow:0 8px 24px -8px color-mix(in srgb,var(--accent) 60%,transparent)}
        .btn-ghost{background:transparent;color:var(--text);border-color:var(--border-2)}
        .btn-ghost:hover{background:var(--surface);border-color:var(--accent);color:var(--accent)}
        
        .hero-stats{display:flex;gap:40px;flex-wrap:wrap}
        .stat .num{font-family:'Fraunces',serif;font-size:1.9rem;font-weight:600;letter-spacing:-.03em;line-height:1;color:var(--text)}
        .stat .lbl{font-size:.78rem;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.1em;font-weight:500}
        
        .hero-visual{position:relative;height:480px;display:flex;justify-content:center;align-items:center}
        .float-card{position:absolute;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-lg);width:260px;transition:transform .6s var(--ease)}
        .float-card .tag{font-size:.7rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;font-family:'JetBrains Mono',monospace}
        .float-card .title{font-family:'Fraunces',serif;font-size:1.1rem;font-weight:600;line-height:1.3;letter-spacing:-.02em;margin-bottom:8px;color:var(--text)}
        .float-card .meta{font-size:.78rem;color:var(--muted)}
        
        .fc-1{top:20px;left:0;transform:rotate(-6deg);animation:float1 6s ease-in-out infinite}
        .fc-2{bottom:40px;right:0;transform:rotate(5deg);animation:float2 7s ease-in-out infinite}
        .fc-3{top:50%;left:50%;transform:translate(-50%,-50%) rotate(-2deg);z-index:3;width:290px;animation:float3 8s ease-in-out infinite}
        
        @keyframes float1{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(-6deg) translateY(-12px)}}
        @keyframes float2{0%,100%{transform:rotate(5deg) translateY(0)}50%{transform:rotate(5deg) translateY(-14px)}}
        @keyframes float3{0%,100%{transform:translate(-50%,-50%) rotate(-2deg)}50%{transform:translate(-50%,calc(-50% - 10px)) rotate(-2deg)}}

        section{padding:80px 0;position:relative}
        
        .section-head{margin-bottom:44px;display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap}
        .section-head .kicker{font-family:'JetBrains Mono',monospace;font-size:.72rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:12px;display:block}
        .section-head h2{font-size:clamp(1.8rem,3.2vw,2.6rem);letter-spacing:-.03em;font-weight:500;max-width:640px}
        .section-head p{color:var(--muted);margin-top:12px;max-width:520px;font-size:1rem}
        
        .link-arrow{font-size:.88rem;font-weight:600;color:var(--accent);display:inline-flex;align-items:center;gap:6px;padding:6px 0;background:none;border:none;cursor:pointer}

        /* Bento Grid */
        .bento{display:grid;grid-template-columns:1.5fr 1fr 1fr;grid-template-rows:auto auto;gap:20px}
        .bento-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;transition:all .35s var(--ease);display:flex;flex-direction:column;width:100%;cursor:pointer;text-align:left}
        .bento-item:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--shadow-lg)}
        .bento-hero{grid-column:span 2;grid-row:span 2;min-height:420px;justify-content:flex-end;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 8%,var(--surface)),var(--surface))}
        .bento-hero h3{font-size:clamp(1.6rem,2.6vw,2.2rem);font-weight:500;line-height:1.15;margin-bottom:14px}
        .bento-item h3{font-size:1.18rem;font-weight:600;line-height:1.3;margin-bottom:10px}
        .bento-item p{color:var(--muted);font-size:.92rem;line-height:1.6;flex:1}
        .bento-item .tag{font-family:'JetBrains Mono',monospace;font-size:.68rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:14px;display:inline-block}
        .bento-item .meta{font-size:.78rem;color:var(--muted);margin-top:16px;display:flex;align-items:center;gap:10px}
        .bento-item .meta .dot{width:3px;height:3px;border-radius:50%;background:var(--muted)}

        /* Categories */
        .cats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
        .cat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px 20px;transition:all .3s var(--ease);width:100%;cursor:pointer;text-align:left}
        .cat-card:hover{border-color:var(--accent);transform:translateY(-3px)}
        .cat-card .icon{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);color:var(--accent);margin-bottom:16px;transition:all .3s var(--ease)}
        .cat-card:hover .icon{background:var(--accent);color:#fff;transform:rotate(-6deg) scale(1.05)}
        .cat-card .icon svg{width:20px;height:20px}
        .cat-card h3{font-size:1.02rem;font-weight:600;margin-bottom:4px}
        .cat-card .count{font-size:.78rem;color:var(--muted);font-family:'JetBrains Mono',monospace}

        /* Filters & Articles Grid */
        .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:32px}
        .chip{padding:8px 16px;border-radius:100px;font-size:.84rem;font-weight:500;border:1px solid var(--border);background:var(--surface);color:var(--text-2);transition:all .2s var(--ease);cursor:pointer}
        .chip:hover{border-color:var(--accent);color:var(--accent)}
        .chip.active{background:var(--text);color:var(--bg);border-color:var(--text)}

        .articles-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
        .art-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column;transition:all .35s var(--ease);width:100%;cursor:pointer;text-align:left}
        .art-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg);border-color:var(--border-2)}
        .art-visual{aspect-ratio:16/9;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--surface-2),var(--bg-2));display:grid;place-items:center}
        .art-visual .mono-letter{font-family:'Fraunces',serif;font-size:5rem;font-weight:900;font-style:italic;color:color-mix(in srgb,var(--accent) 22%,transparent);line-height:1;transition:transform .5s var(--ease)}
        .art-card:hover .art-visual .mono-letter{transform:scale(1.12) rotate(-3deg);color:color-mix(in srgb,var(--accent) 40%,transparent)}
        .art-body{padding:22px;display:flex;flex-direction:column;flex:1}
        .art-body .tag{font-family:'JetBrains Mono',monospace;font-size:.68rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
        .art-body h3{font-size:1.15rem;font-weight:600;line-height:1.3;margin-bottom:10px;transition:color .2s}
        .art-card:hover .art-body h3{color:var(--accent)}
        .art-body p{font-size:.9rem;color:var(--muted);line-height:1.6;flex:1;margin-bottom:16px}
        .art-body .foot{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;color:var(--muted);padding-top:14px;border-top:1px solid var(--border)}
        .art-body .foot .read{color:var(--accent);font-weight:600}

        /* Quote Band */
        .quote-band{background:var(--text);color:var(--bg);padding:90px 0;position:relative;overflow:hidden}
        .quote-band::before{content:"";position:absolute;top:-40%;right:-10%;width:600px;height:600px;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 30%,transparent),transparent 65%);pointer-events:none}
        .quote-band .container{position:relative;z-index:2;text-align:center;max-width:820px}
        .quote-band blockquote{font-family:'Fraunces',serif;font-size:clamp(1.5rem,3.2vw,2.4rem);font-weight:400;font-style:italic;line-height:1.3;letter-spacing:-.02em;margin-bottom:28px}
        .quote-band cite{font-style:normal;font-family:'JetBrains Mono',monospace;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:color-mix(in srgb,var(--bg) 65%,transparent)}

        /* Newsletter */
        .newsletter{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:60px 40px;text-align:center;position:relative;overflow:hidden}
        .newsletter::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--accent),var(--gold),var(--accent))}
        .newsletter h2{font-size:1.8rem;margin-bottom:12px}
        .newsletter p{color:var(--muted);margin-bottom:24px;max-width:400px;margin-inline:auto}
        #newsletterForm{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
        #newsletterForm input{padding:12px 16px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);min-width:250px;font-family:inherit}
        .newsletter small{display:block;color:var(--muted);font-size:.78rem;margin-top:14px}

        /* Reader View */
        .reader{padding:70px 0}
        .reader .back{display:inline-flex;align-items:center;gap:8px;font-size:.88rem;font-weight:600;color:var(--accent);margin-bottom:40px;padding:6px 0;background:none;border:none;cursor:pointer}
        .reader .kicker{font-family:'JetBrains Mono',monospace;font-size:.72rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:18px;display:block}
        .reader h1{font-size:clamp(2rem,4vw,3.2rem);font-weight:500;letter-spacing:-.03em;line-height:1.05;margin-bottom:22px}
        .reader .meta{display:flex;align-items:center;gap:14px;padding-bottom:28px;margin-bottom:44px;border-bottom:1px solid var(--border);font-size:.86rem;color:var(--muted);flex-wrap:wrap}
        .reader .meta .dot{width:4px;height:4px;border-radius:50%;background:var(--muted)}
        .reader .content .lead{font-family:'Fraunces',serif;font-size:1.35rem;line-height:1.5;color:var(--text-2);font-style:italic;margin-bottom:36px;font-weight:400}
        .reader .content p{margin-bottom:22px;font-size:1.08rem;line-height:1.75;color:var(--text-2)}
        .reader .content h2{font-size:1.6rem;font-weight:600;letter-spacing:-.02em;margin:48px 0 18px;color:var(--text);position:relative;padding-left:18px}
        .reader .content h2::before{content:"";position:absolute;left:0;top:.35em;bottom:.35em;width:3px;background:linear-gradient(180deg,var(--accent),var(--gold));border-radius:2px}
        .reader .content ul,.reader .content ol{margin:0 0 24px 22px}
        .reader .content li{margin-bottom:12px;font-size:1.05rem;line-height:1.7;color:var(--text-2)}
        .reader .content li strong{color:var(--text);font-weight:600}
        .reader .content blockquote{border-left:3px solid var(--accent);background:var(--surface-2);padding:22px 26px;margin:32px 0;border-radius:0 var(--radius) var(--radius) 0;font-family:'Fraunces',serif;font-style:italic;font-size:1.18rem;line-height:1.5;color:var(--text)}
        .reader .content strong{color:var(--text);font-weight:600}
        .reader .tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:48px;padding-top:28px;border-top:1px solid var(--border)}
        .reader .tags span{font-size:.78rem;padding:6px 14px;background:var(--surface-2);border-radius:100px;color:var(--text-2);font-weight:500}

        /* About Page */
        .about-hero{padding:80px 0 40px;text-align:center}
        .about-hero h1{font-size:clamp(2rem,4vw,3.2rem);letter-spacing:-.03em;font-weight:500;margin-bottom:20px}
        .about-hero p{font-size:1.15rem;color:var(--text-2);max-width:640px;margin:0 auto}
        .about-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;margin:60px 0}
        .about-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:30px}
        .about-card .num{font-family:'Fraunces',serif;font-size:1.4rem;font-weight:600;color:var(--accent);margin-bottom:14px}
        .about-card h3{font-size:1.15rem;font-weight:600;margin-bottom:10px}
        .about-card p{color:var(--muted);font-size:.94rem;line-height:1.65}

        /* Footer */
        .site-footer{background:var(--surface);border-top:1px solid var(--border);padding:70px 0 30px;margin-top:40px}
        .footer-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:48px;margin-bottom:50px}
        .footer-brand .logo{margin-bottom:18px}
        .footer-brand p{color:var(--muted);font-size:.92rem;max-width:320px;line-height:1.7}
        .footer-col h4{font-family:'Inter',sans-serif;font-size:.76rem;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--text);margin-bottom:18px}
        .footer-col button{display:block;color:var(--muted);font-size:.9rem;padding:6px 0;transition:color .2s;width:100%;background:none;border:none;cursor:pointer;text-align:left}
        .footer-col button:hover{color:var(--accent)}
        .footer-bottom{padding-top:30px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:.84rem;color:var(--muted);flex-wrap:wrap;gap:16px}

        /* Back to Top */
        .back-top{position:fixed;bottom:30px;right:30px;width:48px;height:48px;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center;border:none;cursor:pointer;opacity:0;visibility:hidden;transition:all .3s var(--ease);z-index:90;box-shadow:var(--shadow-lg)}
        .back-top.visible{opacity:1;visibility:visible}
        .back-top:hover{transform:translateY(-3px)}
        .back-top svg{width:20px;height:20px}

        /* Progress Bar */
        .progress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--gold));z-index:1000;transition:width .1s linear;width:0}

        /* Animations */
        .fade{opacity:0;transform:translateY(20px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
        .fade.in{opacity:1;transform:translateY(0)}

        /* Responsive */
        @media (max-width:1020px){
            .hero-inner{grid-template-columns:1fr;gap:40px}
            .hero-visual{height:380px;max-width:520px;margin:0 auto}
            .bento{grid-template-columns:1fr 1fr}
            .bento-hero{grid-column:span 2;grid-row:auto}
            .footer-grid{grid-template-columns:1fr 1fr;gap:36px}
        }
        @media (max-width:700px){
            section{padding:60px 0}
            .hero{padding:50px 0 60px}
            .nav{display:none}
            .menu-btn{display:grid}
            .hero-stats{gap:24px}
            .stat .num{font-size:1.5rem}
            .hero-visual{height:340px}
            .float-card{width:220px;padding:16px}
            .fc-3{width:240px}
            .bento{grid-template-columns:1fr}
            .bento-hero{grid-column:auto;min-height:320px}

        const ARTICLES=[
            // --- KARAKTER (10) ---
            {id:101,cat:'Karakter',date:'12 Ekim 2026',read:'8 dk',tags:['Disiplin','Alışkanlık'],title:'Sessiz Disiplin: Görünmeyen Zaferler',excerpt:'Gerçek güç, alkışlanmak için değil, doğru olanı yapmak için harekete geçmektir.',lead:'Toplum, sesli başarıyı ödüllendirir. Ama karakter, sessiz kaldığında inşa edilir. İşte görünmeyen zaferlerin anatomisi.',body:`<p>Birçok insan disiplini bir ceza olarak görür. Oysa disiplin, özgürlüğün anahtarıdır. Kendi dürtülerinize köle olmamak, seçimlerinizi bilinçli kılmaktır.</p><h2>Neden Sessiz?</h2><p>Sosyal medya çağı, performansa dayalı bir kültür yarattı. "Ben yapıyorum" demek, "yapıyorum"dur. Ama gerçek değişim, kimse izlemiyorken gerçekleşir. Sabah alarm çaldığında kalkmak, kimse görmese de spor salonuna gitmek, zor bir konuşmadan kaçmamak... Bunlar, karakterin temelleridir.</p><h2>Pratik Adımlar</h2><ul><li><strong>Mikro-Sözler Ver:</strong> Büyük vaatler yerine, günlük küçük taahhütler belirle.</li><li><strong>Takip Et:</strong> Bir defter tut. Ne yaptığını yaz. Kendinle yüzleş.</li><li><strong>Acele Etme:</strong> Sonuçlar zaman alır. Sürece odaklan.</li></ul><blockquote>Kimse seni izlemediğinde ne yaptığın, senin kim olduğunu belirler.</blockquote>`},
            {id:102,cat:'Karakter',date:'11 Ekim 2026',read:'7 dk',tags:['Dürüstlük','Güven'],title:'Radikal Dürüstlük: Rahatsız Edici Gerçekler',excerpt:'Doğruyu söylemek kolay değildir. Ama yalan söylemenin maliyeti daha ağırdır.',lead:'Dürüstlük, sosyal bir norm değil, stratejik bir avantajdır. Güvenilir olmak, en değerli para birimidir.',body:`<p>Yalanlar, kısa vadede sorunları örtbas eder gibi görünür. Uzun vadede ise itibarınızı yerle bir eder. Radikal dürüstlük, incitmek için değil, netlik sağlamak için kullanılır.</p><h2>Nasıl Yapılır?</h2><p>Eleştiri alırken savunmaya geçmeyin. Hata yaptığınızda kabul edin. Karşı tarafın duygularını incitmemeye özen gösterirken, gerçeği çarpıtmayın.</p><h2>Faydası</h2><p>İnsanlar size güvenmeye başladığında, kapılar açılır. İş fırsatları, derin dostluklar ve iç huzur... Hepsi dürüstlüğün meyveleridir.</p>`},
            {id:103,cat:'Karakter',date:'10 Ekim 2026',read:'9 dk',tags:['Sabır','Uzun Vade'],title:'Maraton Koşucusu Zihniyeti',excerpt:'Hayat bir sprint değil, maratondur. Hız değil, süreklilik kazandırır.',lead:'Çoğu erkek, hızlı sonuçlar arar. Ama kalıcı başarı, yavaş ve istikrarlı adımlarla gelir. İşte maraton zihniyetini benimsemek.',body:`<p>Patlama enerjisi, tükenmişliğe yol açar. Maraton koşucusu ise ritmini bilir. Ne çok hızlı başlar ne de durur. Sadece devam eder.</p><h2>Ritim Bulmak</h2><p>Kendi kapasitenizi tanıyın. Başkalarının hızıyla yarışmayın. Bugün dün olduğunuzdan biraz daha iyi olun. Yarın da bugünden.</p><h2>Tuzaklar</h2><p>"Ya hep ya hiç" düşüncesinden kurtulun. Bir gün aksadınız diye her şeyi bırakmayın. Devam etmek, mükemmellikten önemlidir.</p>`},
            {id:104,cat:'Karakter',date:'09 Ekim 2026',read:'6 dk',tags:['Empati','Anlayış'],title:'Karşı Tarafın Ayakkabısını Giymek',excerpt:'Empati, zayıflık değil, güçlü bir iletişim aracıdır.',lead:'Farklı bakış açılarını anlamak, çatışmaları azaltır ve bağları güçlendirir. Empati kasını geliştirmenin yolları.',body:`<p>Empati, onay vermek değildir. Anlamaktır. Karşınızdakinin neden böyle hissettiğini sorgulamak, tartışmayı diyaloga dönüştürür.</p><h2>Pratik</h2><ul><li>Dinlerken cevap vermeyi düşünmeyin.</li><li>Soru sorun: "Bu seni nasıl etkiledi?"</li><li>Kendi önyargılarınızın farkında olun.</li></ul>`},
            {id:105,cat:'Karakter',date:'08 Ekim 2026',read:'8 dk',tags:['Cesaret','Korku'],title:'Korkuyla Dans Etmek',excerpt:'Cesaret, korkusuzluk değildir. Korkuya rağmen harekete geçmektir.',lead:'Herkes korkar. Fark, korkunun sizi yönetmesine izin verip vermemekte yatar. Cesaret, bir kas gibidir; çalıştıkça güçlenir.',body:`<p>Korku, doğal bir tepkidir. Bizi tehlikelerden korur. Ama modern dünyada, korku genellikle hayali tehditlere yönelir: Başarısızlık, reddedilme, yargılanma.</p><h2>Eylem Planı</h2><ol><li>Korkunuzu isimlendirin.</li><li>En kötü senaryoyu hayal edin. Genellikle dayanılmaz değildir.</li><li>Küçük bir adım atın.</li></ol><blockquote>Cesaret, korkunun yokluğu değil, korkudan daha önemli bir şeye sahip olmaktır.</blockquote>`},
            {id:106,cat:'Karakter',date:'07 Ekim 2026',read:'7 dk',tags:['Sadakat','Söz'],title:'Sözünün eri Olmak',excerpt:'Verdiğiniz söz, kişiliğinizin imzasıdır.',lead:'İtibar, yıllarda kazanılır, saniyelerde kaybedilir. Sözünüzü tutmak, kendinize olan saygının dışavurumudur.',body:`<p>Basit görünen ama en zor erdemlerden biri sadakattir. "Yaparım" dediğinizde, gerçekten yapın. Yapamayacaksanız, baştan söyleyin.</p><h2>Neden Önemli?</h2><p>İnsanlar, güvenilirliğini bilen kişilerle iş yapar, arkadaş olur ve yaşar. Güvenilirlik, pasif bir özellik değil, aktif bir tercihtir.</p>`},
            {id:107,cat:'Karakter',date:'06 Ekim 2026',read:'9 dk',tags:['Alçakgönüllülük','Ego'],title:'Egonu Terbiye Et',excerpt:'Alçakgönüllülük, kendini küçümsemek değildir. Gerçekçi olmak demektir.',lead:'Ego, öğrenmeyi engeller. "Ben biliyorum" diyen adam, yeni bir şey duyamaz. Alçakgönüllülük, büyümenin kapısıdır.',body:`<p>Alçakgönüllü insanlar, eleştiriyi kabul eder ve hatadan ders çıkarır. Egosunu korumaya çalışanlar ise savunmacı olur ve stagnasyona mahkûm kalır.</p><h2>Pratik</h2><ul><li>Bilmediklerinizi itiraf edin.</li><li>Başkalarından öğrenmeye açık olun.</li><li>Övgüleri nazikçe karşılayıp ekibe yönlendirin.</li></ul>`},
            {id:108,cat:'Karakter',date:'05 Ekim 2026',read:'6 dk',tags:['Sorumluluk','Suçlama'],title:'Radyoaktivite Yasası',excerpt:'Başkalarını suçlamak, kendi gücünüzü teslim etmektir.',lead:'Hayatınızda kontrol edebildiğiniz tek şey, kendi tepkilerinizdir. Suçlamak, kurban rolüne düşmektir.',body:`<p>Stoacıların öğretilerinden biri: Olayları kontrol edemezsiniz ama tepkilerinizi edersiniz. Sorumluluk almak, mağduriyetten çıkış biletidir.</p><h2>Adımlar</h2><ol><li>"Neden ben?" yerine "Ne yapabilirim?" deyin.</li><li>Hatanızı kabul edin.</li><li>Çözüm odaklı olun.</li></ol>`},
            {id:109,cat:'Karakter',date:'04 Ekim 2026',read:'8 dk',tags:['Odak','Dağınıklık'],title:'Dikkatin Ekonomisi',excerpt:'Dikkatiniz, en değerli varlığınızdır. Onu harcarken seçici olun.',lead:'Modern dünya, dikkatinizi çalmak için milyarlarca dolar harcar. Odaklanmak, direniş eylemidir.',body:`<p>Çoklu görev (multitasking) bir mittir. Beyin, görevler arasında hızla geçiş yapar ve enerji kaybeder. Tek bir işe odaklanmak, verimi artırır.</p><h2>Nasıl Korunur?</h2><ul><li>Bildirimleri kapatın.</li><li>Telefonu başka odaya koyun.</li><li>Derin çalışma blokları oluşturun.</li></ul>`},
            {id:110,cat:'Karakter',date:'03 Ekim 2026',read:'7 dk',tags:['Minnettarlık','Şükür'],title:'Şükretmenin Bilimi',excerpt:'Mutluluk, elde etmekten değil, takdir etmekten gelir.',lead:'Nörobilim, minnettarlığın beyin kimyasını değiştirdiğini kanıtlıyor. Şükretmek, pozitif bir döngü yaratır.',body:`<p>Her akşam üç şeye şükredin. Küçük şeyler olsun: Sıcak bir yatak, lezzetli bir yemek, sağlıklı nefes. Bu alışkanlık, perspektifinizi değiştirir.</p><h2>Etkisi</h2><p>Minnettar insanlar, daha az stres yaşar, daha iyi uyur ve daha güçlü ilişkilere sahiptir.</p>`},

            // --- BECERİ (10) ---
            {id:201,cat:'Beceri',date:'12 Ekim 2026',read:'10 dk',tags:['Yemek','Mutfak'],title:'Erkek Mutfağı: Temel Teknikler',excerpt:'Yemek yapmak, bir sanat değil, bir hayatta kalma becerisidir.',lead:'Hazır gıda bağımlılığından kurtulmanın yolu, tencerenin başına geçmektir. Basit ama etkili tarifler ve teknikler.',body:`<p>İyi yemek yapmak için Michelin yıldızlı şef olmanıza gerek yok. Doğru ısı, tuz ve zamanlama yeterlidir.</p><h2>Temel Teknikler</h2><ul><li><strong>Sote:</strong> Yüksek ateşte hızlı pişirme.</li><li><strong>Kızartma:</strong> Altın sarısı renk ve çıtırlık.</li><li><strong>Haşlama:</strong> Sebze ve tahıllar için ideal.</li></ul><h2>Başlangıç Tarifleri</h2><p>Omlet, makarna sosu, tavuk pirzola. Bunları mükemmel yapın, gerisi gelir.</p>`},
            {id:202,cat:'Beceri',date:'11 Ekim 2026',read:'9 dk',tags:['Tamirat','Ev'],title:'Ev Tamircisi Olmak',excerpt:'Bir tesisatçı çağırmadan önce, vidayı sıkmayı deneyin.',lead:'Küçük tamirler, büyük tasarruf sağlar. Ve özgüven verir. İşte evdeki en sık karşılaşılan sorunlar ve çözümleri.',body:`<p>Damlayan musluk, tıkanmış lavabo, gevşemiş menteşe... Bunlar uzmanlık gerektirmez. Sadece doğru alet ve bilgi gerekir.</p><h2>Gerekli Aletler</h2><ul><li>İngiliz anahtarı</li><li>Tornavida seti</li><li>Matkap</li><li>Su terazisi</li></ul><h2>Altın Kural</h2><p>Elektriğe dokunuyorsanız, sigortayı kesin. Suyu kesmeden boru sökmeyin.</p>`},
            {id:203,cat:'Beceri',date:'10 Ekim 2026',read:'8 dk',tags:['Araba','Bakım'],title:'Kaputun Altındaki Dünya',excerpt:'Arabanızın dilini anlayın. Yolda kalmak kader değildir.',lead:'Lastik değişimi, yağ kontrolü ve akü takviyesi. Hayati önem taşıyan temel araç bakım bilgileri.',body:`<p>Modern araçlar karmaşıktır ama temel prensipler aynıdır. Motor yağı, soğutma suyu, fren hidroliği...</p><h2>Aylık Kontrol Listesi</h2><ol><li>Yağ seviyesini kontrol et.</li><li>Lastik basınçlarını ölç.</li><li>Akü kutuplarını temizle.</li></ol><blockquote>Bakımlı bir araç, güvenli bir yolculuktur.</blockquote>`},
            {id:204,cat:'Beceri',date:'09 Ekim 2026',read:'7 dk',tags:['İlk Yardım','Hayat'],title:'İlk Müdahale Sanatı',excerpt:'Profesyoneller gelene kadar geçen dakikalar, hayat kurtarır.',lead:'Boğulma, yanık, kanama... İlk yardım eğitimi almak, vicdani bir sorumluluktur.',body:`<p>Kızılay veya AFAD'ın ücretsiz eğitimlerine katılın. Heimlich manevrası, CPR (kalp masajı) ve turnike uygulamayı öğrenin.</p><h2>Temel Kurallar</h2><ul><li>Önce güvenliği sağlayın.</li><li>Acil servisi arayın.</li><li>Panik yapmayın.</li></ul>`},
            {id:205,cat:'Beceri',date:'08 Ekim 2026',read:'9 dk',tags:['Finans','Bütçe'],title:'Para Akışını Yönetmek',excerpt:'Zengin olmak, çok kazanmak değil, az harcamaktır.',lead:'Gelir-gider dengesi, finansal özgürlüğün temelidir. İşte bütçe yapmanın basit yolları.',body:`<p>50/30/20 kuralını uygulayın: %50 ihtiyaç, %30 istek, %20 birikim.</p><h2>Tasarruf Taktikleri</h2><ul><li>Gereksiz abonelikleri iptal et.</li><li>Markasız ürünleri tercih et.</li><li>Evde yemek yap.</li></ul>`},
            {id:206,cat:'Beceri',date:'07 Ekim 2026',read:'8 dk',tags:['Bahçe','Doğa'],title:'Toprakla Temas',excerpt:'Bir fidan dikmek, geleceğe yatırımdır.',lead:'Bahçecilik, stresi azaltır ve sabrı öğretir. Kendi sebzenizi yetiştirmenin tadı başka.',body:`<p>Domates, biber, maydanoz... Başlangıç için ideal bitkilerdir. Toprağı hazırlayın, sulamayı ihmal etmeyin.</p><h2>Faydaları</h2><ul><li>Taze ve organik gıda.</li><li>Fiziksel aktivite.</li><li>Zihinsel rahatlama.</li></ul>`},
            {id:207,cat:'Beceri',date:'06 Ekim 2026',read:'7 dk',tags:['Dikiş','Onarım'],title:'İpliğin Gücü',excerpt:'Yırtılan bir gömlek, çöpe atılmak zorunda değildir.',lead:'Temel dikiş tekniklerini öğrenmek, giysi ömrünü uzatır ve israfı önler.',body:`<p>Düğme dikmek, yırtık onarmak, paça kısaltmak... Bunlar, birkaç saatte öğrenilebilir becerilerdir.</p><h2>Gerekli Malzemeler</h2><ul><li>İğne ve iplik seti</li><li>Makas</li><li>Ütü</li></ul>`},
            {id:208,cat:'Beceri',date:'05 Ekim 2026',read:'10 dk',tags:['Teknoloji','Kodlama'],title:'Dijital Okuryazarlık',excerpt:'Algoritmaların kölesi değil, efendisi ol.',lead:'Temel kodlama mantığını anlamak, teknolojiyi daha bilinçli kullanmanızı sağlar.',body:`<p>Python veya JavaScript'e giriş yapın. Web sitesi nasıl çalışır? Veri nasıl işlenir? Bunları bilmek, dijital dünyada güç verir.</p><h2>Kaynaklar</h2><ul><li>FreeCodeCamp</li><li>Codecademy</li><li>YouTube Eğitimleri</li></ul>`},
            {id:209,cat:'Beceri',date:'04 Ekim 2026',read:'8 dk',tags:['Fotoğraf','Sanat'],title:'Işığı Yakalamak',excerpt:'Her fotoğraf, bir hikayedir. İyi bir göz, iyi bir kameradan önemlidir.',lead:'Kompozisyon kurallarını öğrenerek, telefonunuzla bile profesyonel kareler çekebilirsiniz.',body:`<p>Üçler kuralı, ışık yönü, perspektif... Temel fotoğrafçılık prensipleri, görsel hafızanızı güçlendirir.</p><h2>Pratik</h2><ul><li>Her gün bir fotoğraf çek.</li><li>Işığı takip et.</li><li>Düzenlemeyi öğren.</li></ul>`},
            {id:210,cat:'Beceri',date:'03 Ekim 2026',read:'9 dk',tags:['Sunum','Konuşma'],title:'Kalabalıklar Önünde Konuşmak',excerpt:'Sahne korkusu, hazırlıkla yenilir.',lead:'Etkili sunum teknikleri, kariyerinizde ve özel hayatınızda kapılar açar.',body:`<p>STAR tekniğini kullanın: Durum, Görev, Aksiyon, Sonuç. Hikaye anlatımı, veriden daha etkilidir.</p><h2>Taktikler</h2><ul><li>Göz teması kur.</li><li>Yavaş konuş.</li><li>Prova yap.</li></ul>`},

            {id:301,cat:'Sağlık',date:'12 Ekim 2026',read:'8 dk',tags:['Uyku','Dinlenme'],title:'Uyku Hijyeni',excerpt:'Az uyumak kahramanlık değil, intihardır.',lead:'Kaliteli uyku, fiziksel ve zihinsel sağlığın temelidir. İşte daha iyi uyumanın yolları.',body:`<p>Oda serin, karanlık ve sessiz olmalı. Yatmadan önce ekranlardan uzak durun. Düzenli saatlerde yatıp kalkın.</p><h2>Faydaları</h2><ul><li>Bağışıklık sistemi güçlenir.</li><li>Testosteron seviyesi artar.</li><li>Öğrenme kapasitesi yükselir.</li></ul>`},
            {id:302,cat:'Sağlık',date:'11 Ekim 2026',read:'9 dk',tags:['Beslenme','Diyet'],title:'Protein Odaklı Beslenme',excerpt:'Kas, proteinden yapılır. Yetersiz protein, zayıflıktır.',lead:'Günlük protein ihtiyacınızı karşılamak, metabolizmanızı hızlandırır ve tokluk hissi verir.',body:`<p>Yumurta, tavuk, balık, baklagiller... Protein kaynaklarınızı çeşitlendirin. Şeker ve işlenmiş gıdalardan kaçının.</p><h2>Öneriler</h2><ul><li>Kilo başına 1.6-2.2g protein.</li><li>Su tüketimini artır.</li><li>Lifli gıdaları ihmal etme.</li></ul>`},
            {id:303,cat:'Sağlık',date:'10 Ekim 2026',read:'7 dk',tags:['Egzersiz','Hareket'],title:'Günlük Hareket Ritüeli',excerpt:'Salona gitmek şart değil. Önemli olan hareket etmektir.',lead:'Oturarak geçen saatler, sigara içmek kadar zararlıdır. Aktif bir yaşam tarzı benimseyin.',body:`<p>Merdiven çıkın, yürüyüş yapın, esneme hareketleri uygulayın. Haftada 150 dakika orta yoğunlukta egzersiz hedefleyin.</p><h2>Basit Egzersizler</h2><ul><li>Şınav</li><li>Mekik</li><li>Squat</li><li>Plank</li></ul>`},
            {id:304,cat:'Sağlık',date:'09 Ekim 2026',read:'8 dk',tags:['Stres','Mediasyon'],title:'Stres Yönetimi Teknikleri',excerpt:'Stres kaçınılmazdır. Tepki vermek seçimdir.',lead:'Kronik stres, hastalıkların habercisidir. Meditasyon, nefes egzersizleri ve doğa yürüyüşleriyle stresi yönetin.',body:`<p>4-7-8 nefes tekniğini deneyin. Günde 10 dakika meditasyon yapın. Dijital detoks uygulayın.</p><h2>Faydaları</h2><ul><li>Kortizol seviyesi düşer.</li><li>Zihin berraklaşır.</li><li>Uyku kalitesi artar.</li></ul>`},
            {id:305,cat:'Sağlık',date:'08 Ekim 2026',read:'6 dk',tags:['Hygiene','Bakım'],title:'Kişisel Bakım Standartları',excerpt:'Temizlik, imanındandır. Ve saygının göstergesidir.',lead:'Diş fırçalama, tıraş, saç bakımı... Bunlar, özsaygının dışavurumudur.',body:`<p>Günde iki kez diş fırçalayın. Sakalınıza özen gösterin. Tırnaklarınızı temiz tutun. Kokusuz olmanız, hijyenik olduğunuz anlamına gelmez.</p><h2>Ürünler</h2><ul><li>Deodorant</li><li>Şampuan/Sabun</li><li>Nemlendirici Krem</li></ul>`},
            {id:306,cat:'Sağlık',date:'07 Ekim 2026',read:'9 dk',tags:['Check-up','Doktor'],title:'Yıllık Kontroller',excerpt:'Erkekler doktordan kaçar. Bu, ölümcül bir hatadır.',lead:'Erken teşhis, hayat kurtarır. Tansiyon, kolesterol ve şeker ölçümlerini ihmal etmeyin.',body:`<p>30 yaşından sonra yıllık check-up yaptırın. Testis muayenesini öğrenin. Prostat kontrollerini aksatmayın.</p><h2>Önemli Testler</h2><ul><li>Kan tahlili</li><li>Tansiyon ölçümü</li><li>Göz muayenesi</li></ul>`},
            {id:307,cat:'Sağlık',date:'06 Ekim 2026',read:'7 dk',tags:['Alkol','Sigara'],title:'Zehirlerden Arınmak',excerpt:'Alkol ve sigara, kısa vadeli keyif, uzun vadeli acıdır.',lead:'Bu maddelerden uzak durmak, organ sağlığınızı korur ve ömrünüzü uzatır.',body:`<p>Alkol, karaciğeri yorar. Sigara, akciğerleri tahrip eder. Nikotin ve alkol bağımlılığından kurtulmak için destek alın.</p><h2>Alternatifler</h2><ul><li>Bitki çayları</li><li>Spor</li><li>Hobi edinme</li></ul>`},
            {id:308,cat:'Sağlık',date:'05 Ekim 2026',read:'8 dk',tags:['Göz','Ekran'],title:'Dijital Göz Yorgunluğu',excerpt:'Ekranlara bakarak geçirdiğimiz saatler, gözlerimizi yakıyor.',lead:'20-20-20 kuralını uygulayın: Her 20 dakikada, 20 saniye boyunca, 20 feet (6 metre) uzağa bakın.',body:`<p>Mavi ışık filtreli gözlük kullanın. Ekran parlaklığını ayarlayın. Göz kırpmayı unutmayın.</p><h2>Belirtiler</h2><ul><li>Kuru göz</li><li>Bulanık görme</li><li>Baş ağrısı</li></ul>`},
            {id:309,cat:'Sağlık',date:'04 Ekim 2026',read:'6 dk',tags:['Postür','Duruş'],title:'Dik Durmak, Dik Yaşamak',excerpt:'Kambur duruş, özgüvensizliği yansıtır.',lead:'Omurganızı düzeltmek, nefes almanızı iyileştirir ve enerjinizi artırır.',body:`<p>Computer ergonomisine dikkat edin. Monitör göz hizasında olmalı. Sandalyeniz bel desteği sağlamalı.</p><h2>Egzersizler</h2><ul><li>Boyun germeleri</li><li>Sırt güçlendirme</li><li>Core antrenmanı</li></ul>`},
            {id:310,cat:'Sağlık',date:'03 Ekim 2026',read:'9 dk',tags:['Su','Hidrasyon'],title:'Su İçmenin Önemi',excerpt:'Beynin %75'i sudur. Susuz kalmak, aptallaştırır.',lead:'Günde en az 2-3 litre su içmek, metabolizmayı hızlandırır ve cildi güzelleştirir.',body:`<p>Kahve ve gazlı içecekler su yerine geçmez. Yanınızda her zaman bir su şişesi bulundurun.</p><h2>Faydaları</h2><ul><li>Detoks etkisi</li><li>Cilt sağlığı</li><li>Böbrek fonksiyonları</li></ul>`},

            {id:401,cat:'İlişkiler',date:'12 Ekim 2026',read:'8 dk',tags:['Arkadaşlık','Sosyal'],title:'Erkek Arkadaşlığının Krizi',excerpt:'Otuzundan sonra dost bulmak zorlaşır. Bunun nedeni sizsiniz.',lead:'Pasif bekleyiş, yalnızlığı getirir. İnisiyatif alın, buluşma teklif edin, duygusal derinlik katın.',body:`<p>Erkekler, rekabet ve statü üzerinden bağ kurar. Ama gerçek dostluk, kırılganlığı paylaşmaktır.</p><h2>Çözüm</h2><ul><li>Ortak hobi bulun.</li><li>Düzenli buluşmalar planlayın.</li><li>Açık ve dürüst olun.</li></ul>`},
            {id:402,cat:'İlişkiler',date:'11 Ekim 2026',read:'9 dk',tags:['Romantik','Partner'],title:'Sağlıklı Romantik İlişkiler',excerpt:'Aşk, duygu değil, eylemdir.',lead:'Saygı, güven ve iletişim, sağlam bir ilişkinin üç sütunudur. Sahiplenme değil, ortaklık kurun.',body:`<p>Partnerinizin bireyselliğine saygı duyun. Ortak hedefler belirleyin. Kriz anlarında takım ruhuyla hareket edin.</p><h2>Tuzaklar</h2><ul><li>Kıskançlık</li><li>İletişimsizlik</li><li>Beklenti yüklemesi</li></ul>`},
            {id:403,cat:'İlişkiler',date:'10 Ekim 2026',read:'7 dk',tags:['İletişim','Dinleme'],title:'Aktif Dinleme Sanatı',excerpt:'Çoğu insan, dinlemek için değil, cevap vermek için dinler.',lead:'Karşınızdakini gerçekten anlamak, empati kurmanın ilk adımıdır.',body:`<p>Göz teması kurun. Sözünü kesmeyin. Duygularını doğrulayın. "Seni anlıyorum" demek, sihirli bir cümledir.</p><h2>Teknikler</h2><ul><li>Parafraz yapma</li><li>Açık uçlu sorular sorma</li><li>Vücut dilini okuma</li></ul>`},
            {id:404,cat:'İlişkiler',date:'09 Ekim 2026',read:'8 dk',tags:['Sınır','Hayır'],title:'Hayır Diyebilme Gücü',excerpt:'Her isteğe evet demek, kendinize hayır demektir.',lead:'Sağlıklı sınırlar koymak, ilişkileri korur. Nezaketli ama kararlı olun.',body:`<p>"Hayır" demek bencilce değildir. Kendi önceliklerinizi korumaktır. Suistimal eden insanları hayatınızdan çıkarın.</p><h2>İfadeler</h2><ul><li>"Maalesef şu an müsait değilim."</li><li>"Bu konuda farklı düşünüyoruz."</li><li>"Bu benim sınırım."</li></ul>`},
            {id:405,cat:'İlişkiler',date:'08 Ekim 2026',read:'6 dk',tags:['Aile','Genç'],title:'Ebeveynlerle İletişim',excerpt:'Yetişkin olsanız da, aile bağları karmaşıktır.',lead:'Geçmiş travmaları anlamak, bugünkü ilişkileri düzeltir. Saygıyı koruyarak sınır koyun.',body:`<p>Anne-babanızı olduğu gibi kabul edin. Onları değiştirmeye çalışmayın. Kendi hayatınızı kurarken onları dışlamayın.</p><h2>Strateji</h2><ul><li>Duygusal mesafe koyma</li><li>Net iletişim</li><li>Affedicilik</li></ul>`},
            {id:406,cat:'İlişkiler',date:'07 Ekim 2026',read:'9 dk',tags:['Çatışma','Çözüm'],title:'Kazan-Kazan Çatışma Yönetimi',excerpt:'Tartışmada haklı olmak mı, mutlu olmak mı istersiniz?',lead:'Çatışmalar, yanlış yönetilirse yıkıcı, doğru yönetilirse yapıcı olabilir.',body:`<p>Ego savaşlarından kaçının. Problemi kişiselleştirmeyin. Ortak çözüm arayın. Dinleyin, anlayın, sonra konuşun.</p><h2>Adımlar</h2><ol><li>Sakinleşin.</li><li>Gerçekleri listeleyin.</li><li>Seçenekleri değerlendirin.</li><li>Anlaşmaya varın.</li></ol>`},
            {id:407,cat:'İlişkiler',date:'06 Ekim 2026',read:'7 dk',tags:['Yalnızlık','Kabul'],title:'Yalnız Kalmayı Öğrenmek',excerpt:'Yalnızlık, ceza değil, fırsattır.',lead:'Kendi şirketinizden keyif alabilen insan, başkalarına bağımlı olmaz.',body:`<p>Yalnız vakit geçirmek, öz-farkındalığı artırır. Kitap okuyun, düşünün, yaratın. Kalabalıkta yalnız olmaktansa, yalnızken dolu olun.</p><h2>Pratik</h2><ul><li>Solo seyahat</li><li>Restoranda tek başına yemek</li><li>Sinema keyfi</li></ul>`},
            {id:408,cat:'İlişkiler',date:'05 Ekim 2026',read:'8 dk',tags:['Flört','Tanışma'],title:'Modern Flört Dinamikleri',excerpt:'Uygulamalar tanışmayı kolaylaştırdı ama derinleştirmeyi zorlaştırdı.',lead:'İlk izlenimde samimiyet ve özgüven anahtardır. Rol yapmayın, kendiniz olun.',body:`<p>Profil fotoğraflarınız doğal olsun. Mesajlaşmada klişelerden kaçının. Buluşmayı hızlıca teklif edin. Reddedilmekten korkmayın.</p><h2>Tips</h2><ul><li>Gülümseyin</li><li>Soru sorun</li><li>Dinleyin</li></ul>`},
            {id:409,cat:'İlişkiler',date:'04 Ekim 2026',read:'6 dk',tags:['Güven','Sadakat'],title:'Güven İnşa Etmek',excerpt:'Güven, kırılsa da onarılabilir. Ama izi kalır.',lead:'Tutarlı davranışlar, güvenilirliğin temelidir. Sözünüzü tutun, şeffaf olun.',body:`<p>Yalan söylemek, kısa yoldur. Dürüstlük, uzun yoldur ama sağlamdır. Partnerinize ve dostlarınıza karşı açık kitap olun.</p><h2>Belirtiler</h2><ul><li>Şeffaflık</li><li>Tutarlılık</li><li>Duygusal erişilebilirlik</li></ul>`},
            {id:410,cat:'İlişkiler',date:'03 Ekim 2026',read:'9 dk',tags:['Ayrılık','İyileşme'],title:'Ayrılık Sonrası İyileşme',excerpt:'Kalp kırıklığı, ruhun yeniden yapılanmasıdır.',lead:'Acı çekmek normaldir. Ama geçmişe saplanıp kalmak, geleceği çalar.',body:`<p>No Contact (Temassızlık) kuralını uygulayın. Kendinize odaklanın. Spor yapın, hobiler edinin. Yeni insanlarla tanışın ama acele etmeyin.</p><h2>Aşamalar</h2><ol><li>İnkâr</li><li>Öfke</li><li>Pazarlık</li><li>Depresyon</li><li>Kabullenme</li></ol>`},

            {id:501,cat:'Aile',date:'12 Ekim 2026',read:'8 dk',tags:['Babalık','Varlık'],title:'Baba Olmak: Nitelik Zamanı',excerpt:'Çocuğunuz saatleri değil, nasıl hissettiğini hatırlar.',lead:'Telefonu bırakıp çocuğunuza tam dikkat verin. 10 dakika kaliteli zaman, 1 saat yarım dikkatten iyidir.',body:`<p>Oyun oynayın, kitap okuyun, sohbet edin. Çocuklarınızın dünyasına girin. Onları dinleyin, yargılamayın.</p><h2>Pratik</h2><ul><li>Haftalık baba-çocuk randevusu</li><li>Yatmadan önce masal</li><li>Birlikte yemek pişirme</li></ul>`},
            {id:502,cat:'Aile',date:'11 Ekim 2026',read:'9 dk',tags:['Evlilik','Ortaklık'],title:'Evlilikte Ortaklık Ruhu',excerpt:'Evlilik, iki yarım insanın bütünü olması değil, iki bütün insanın ortak yaratmasıdır.',lead:'Rolleri paylaşın. Duygusal yükü dağıtın. Birbirinizin hayallerini destekleyin.',body:`<p>İletişimi canlı tutun. Randevulaşın. Flört edin. Kriz anlarında birbirinize sırt çevirmeyin, omuz verin.</p><h2>Tuzaklar</h2><ul><li>Rutinleşme</li><li>İletişimsizlik</li><li>Bireyselcilik</li></ul>`},
            {id:503,cat:'Aile',date:'10 Ekim 2026',read:'7 dk',tags:['Çocuk','Eğitim'],title:'Çocuk Yetiştirme Prensipleri',excerpt:'Katı disiplin de, aşırı hoşgörü de yanlıştır. Denge şart.',lead:'Sevgi ve sınır birlikte olmalı. Çocuklarınızın duygularını ifade etmesine izin verin ama davranışlarını yönlendirin.',body:`<p>Tutarlı olun. Kuralların sebebini açıklayın. Model olun. Çocuklar, söylediklerinizi değil, yaptıklarınızı taklit eder.</p><h2>Yaş Grupları</h2><ul><li>0-3: Güven ve Bağlanma</li><li>4-7: Keşif ve Oyun</li><li>8-12: Sorumluluk ve Sosyal</li><li>13+: Özgürlük ve Rehberlik</li></ul>`},
            {id:504,cat:'Aile',date:'09 Ekim 2026',read:'8 dk',tags:['Kardeş','Bağ'],title:'Kardeş Rekabetini Yönetmek',excerpt:'Kıskançlık, doğal bir duygudur. Önemli olan onu nasıl yönettiğinizdir.',lead:'Çocuklarınızı karşılaştırmayın. Her birinin bireyselliğini kutlayın. Adaleti eşitlik olarak algılamayın.',body:`<p>Bireysel ilgi alanları yaratın. Kardeşler arası işbirliğini teşvik edin. Çatışmalarda hakem değil, moderatör olun.</p><h2>Taktikler</h2><ul><li>"Senin için ayrıcalık" oyunu</li><li>Ortak projeler</li><li>Duyguları isimlendirme</li></ul>`},
            {id:505,cat:'Aile',date:'08 Ekim 2026',read:'6 dk',tags:['Torun','Dede'],title:'Dede/Nene Rolü',excerpt:'Deneyim ve şefkat, nesiller arası köprüdür.',lead:'Torunlarınıza hikayeler anlatın. Onlara değer verdiğinizi gösterin. Ama ebeveynlik rolünü üstlenmeyin.',body:`<p>Rehber olun, müdahil olmayın. Sevginizi koşulsuz verin. Gelenekleri aktarın ama dogmatik olmayın.</p><h2>Faydaları</h2><ul><li>Çocuklarda güvenlik hissi</li><li>Yaşlılarda amaç duygusu</li><li>Aile bağlarının güçlenmesi</li></ul>`},
            {id:506,cat:'Aile',date:'07 Ekim 2026',read:'9 dk',tags:['Bütçe','Plan'],title:'Aile Finansal Planlaması',excerpt:'Para, aileyi yıkar da inşa da eder. Fark, yönetimindedir.',lead:'Ortak hesap mı, ayrı hesap mı? Hangisi sizin dinamiğinize uygunsa onu seçin. Önemli olan şeffaflıktır.',body:`<p>Bütçe yapın. Acil durum fonu oluşturun. Emeklilik planı yapın. Çocukların eğitimi için yatırım aracını belirleyin.</p><h2>Adımlar</h2><ol><li>Gelir/Gider analizi</li><li>Hedef belirleme</li><li>Otomasyon kurma</li><li>Aylık toplantı</li></ol>`},
            {id:507,cat:'Aile',date:'06 Ekim 2026',read:'7 dk',tags:['Gelenek','Ritüel'],title:'Aile Ritüelleri Oluşturmak',excerpt:'Gelenekler, aidiyet duygusunu pekiştirir.',lead:'Pazar kahvaltısı, bayram ziyaretleri, tatil gelenekleri... Bunlar, çocukların anılarında yer eder.',body:`<p>Tutarlı olun. Katılımı teşvik edin. Eğlenceli hale getirin. Gelenekleri modernize edin ama köklerinden koparmayın.</p><h2>Örnekler</h2><ul><li>Yılbaşı dilek kutusu</li><li>Doğum günü ritüeli</li><li>Haftalık film gecesi</li></ul>`},
            {id:508,cat:'Aile',date:'05 Ekim 2026',read:'8 dk',tags:['Boşanma','Çocuk'],title:'Boşanma Sürecinde Çocuklar',excerpt:'Anne-baba ayrılığı, çocuk için travma olabilir. Ama yanlış yönetilirse daha büyük travmadır.',lead:'Çocuğunuzu silah olarak kullanmayın. Diğer ebeveyni kötülemeyin. İstikrar ve sevgi sunun.',body:`<p>İletişimi açık tutun. Rutinleri koruyun. Duygularını ifade etmesine izin verin. Profesyonel destek almaktan çekinmeyin.</p><h2>Altın Kurallar</h2><ul><li>Çocuk taraftar değildir</li><li>Sevgi bölünmez, çoğalır</li><li>Yetişkin sorunları çocuklara yüklenmez</li></ul>`},
            {id:509,cat:'Aile',date:'04 Ekim 2026',read:'6 dk',tags:['Kaynanaca','Dengе'],title:'Kayınvalide/Kayınpeder İlişkisi',excerpt:'Saygı çerçevesinde sınır koymak, evliliği korur.',lead:'Eşinizle birlik olun. Ayrı bir aile birimi oluşturduğunuzu hatırlatın. Nazik ama kararlı olun.',body:`<p>Müdahalelere tolerans göstermeyin ama kavga da etmeyin. Eşinizin ailesine saygı duyun ama kendi kararlarınızı kendiniz verin.</p><h2>Strateji</h2><ul><li>Ortak cephe</li><li>Net iletişim</li><li>Duygusal mesafe</li></ul>`},

            {id:803,cat:'Zihin',date:'10 Ekim 2026',read:'7 dk',tags:['Journaling','Yazı'],title:'Günlük Tutma Sanatı',excerpt:'Kağıda dökmek, zihni boşaltır.',lead:'Düşüncelerinizi, duygularınızı ve hedeflerinizi yazın. Otomatik pilot modundan çıkın.',body:`<p>Sabah sayfaları (Morning Pages). Minnettarlık günlüğü. Hedef takibi. Serbest yazım. Sansürsüz olun.</p><h2>Teknikler</h2><ul><li>Stream of Consciousness</li><li>Prompt-based writing</li><li>Gratitude Log</li></ul>`},
            {id:804,cat:'Zihin',date:'09 Ekim 2026',read:'8 dk',tags:['Digital Detox','Ekran'],title:'Dijital Oruç',excerpt:'Bildirimlerden uzaklaşmak, özgürlüktür.',lead:'Haftada bir gün, telefondan uzak durun. Doğa ile iç içe olun. Can sıkıntısına izin verin.',body:`<p>Screen time limitleri koyun. Gece modu kullanın. Sosyal medya diyeti. Gerçek bağlantılar kurun.</p><h2>Adımlar</h2><ol><li>Farkındalık</li><li>Planlama</li><li>Uygulama</li><li>Değerlendirme</li></ol>`},
            {id:805,cat:'Zihin',date:'08 Ekim 2026',read:'6 dk',tags:['Creativity','Yaratıcılık'],title:'Yaratıcılığı Tetiklemek',excerpt:'Yaratıcılık, ilham değil, terdir.',lead:'Farklı disiplinleri birleştirin. Bol bol okuyun. Düşünün. Yazın. Çizin.',body:`<p>Mind mapping. Brainstorming. SCAMPER tekniği. Çevrenizi değiştirin. Yeni deneyimler yaşayın.</p><h2>Engeller</h2><ul><li>Mükemmeliyetçilik</li><li>Korku</li><li>Rutin</li></ul>`},
            {id:806,cat:'Zihin',date:'07 Ekim 2026',read:'9 dk',tags:['Philosophy','Stoa'],title:'Stoacı Felsefe Günümüzde',excerpt:'Kontrol edebildiklerinize odaklanın, edemediklerinizi kabul edin.',lead:'Epictetus, Seneca, Marcus Aurelius. Erken kalkmak, zorluklara hazırlanmak, ölümü hatırlamak.',body:`<p>Amor Fati (Kaderini Sev). Memento Mori (Öleceğini Hatırla). Dichotomy of Control. Virtue Ethics.</p><h2>Pratik</h2><ul><li>Akşam refleksi</li><li>Pre-meditatio malorum (Olumsuzlukları önceden düşünme)</li><li>Günlük journaling</li></ul>`},
            {id:807,cat:'Zihin',date:'06 Ekim 2026',read:'7 dk',tags:['Learning','Metod'],title:'Hızlı Öğrenme Teknikleri',excerpt:'Feynman Tekniği: Basitleştirerek Öğren.',lead:'Bir konuyu sanki 5 yaşındaki bir çocuğa anlatıyormuş gibi açıklayın. Anlamadığınız yerleri tespit edin.</p><body:`<p>Active Recall (Aktif Hatırlama). Spaced Repetition (Aralıklı Tekrar). Interleaving (Karışık Pratik). Chunking (Gruplama).</p><h2>Araçlar</h2><ul><li>Anki Flashcards</li><li>Notion Templates</li><li>Mind Maps</li></ul>`},
            {id:808,cat:'Zihin',date:'05 Ekim 2026',read:'8 dk',tags:['Decision','Karar'],title:'Karar Alma Stratejileri',excerpt:'Analitik felçten kaçının. Yeterince iyi kararı verin.',lead:'10/10/10 Kuralı: 10 dakika, 10 ay, 10 yıl sonra bu karar nasıl görünecek? Regret Minimization Framework.',body:`<p>Opsiyonları listeleyin. Artı/Eksi analizi yapın. Sezgisel dinleyin. Riskleri hesaplayın. Hızlı karar verin, gerekirse düzeltin.</p><h2>Tuzaklar</h2><ul><li>Status Quo Bias</li><li>Sunk Cost Fallacy</li><li>Confirmation Bias</li></ul>`},
            {id:809,cat:'Zihin',date:'04 Ekim 2026',read:'6 dk',tags:['Resilience','Dayanıklılık'],title:'Psikolojik Dayanıklılık',excerpt:'Darbelere karşı esnek olmak, kırılmamaktır.',lead:'Travma sonrası büyüme (PTG). Destek sistemleri. Pozitif yorumlama. Anlam arayışı.',body:`<p>Zorlukları fırsat olarak görün. Duygularınızı bastırmayın, işlemeyin. Topluluk hissini güçlendirin. Kendinize şefkat gösterin.</p><h2>Adımlar</h2><ol><li>Akılcı inançlar geliştirme</li><li>Duygusal regülasyon</li><li>Sosyal destek arama</li><li>Anlam bulma</li></ol>`},
            {id:810,cat:'Zihin',date:'03 Ekim 2026',read:'9 dk',tags:['Flow','Akış'],title:'Akış Haline Girmek',excerpt:'Zamanın durduğu, eylem ve bilincin birleştiği an.',lead:'Csikszentmihalyi'nin Flow teorisi. Net hedefler, anlık geri bildirim, zorluk-beceri dengesi.',body:`<p>Dikkat dağıtıcı unsurları elimine edin. Göreve dalın. Kontrollü risk alın. Keyif alın. Performans artışı sağlar.</p><h2>Koşullar</h2><ul><li>Net hedefler</li><li>Anlık geri bildirim</li><li>Zorluk/Beceri dengesi</li><li>Derin konsantrasyon</li></ul>`}
        ];

        // State Management
        let state = { view: 'home', filter: '', articleId: null };
        const app = document.getElementById('app');

        // Utility Functions
        function esc(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function renderHome() {
            // Filter logic for main grid
            const filteredList = state.filter ? ARTICLES.filter(a => a.cat === state.filter) : ARTICLES;
            const title = state.filter ? state.filter + ' Yazıları' : 'Tüm Yazılar';
            
            // Dynamic Bento Picks based on filter
            const bentoPicks = filteredList.slice(0, 5);

            const bentoHTML = bentoPicks.map((a, i) => `
                <button type="button" class="bento-item fade ${i === 0 ? 'bento-hero' : ''}" data-action="article" data-id="${a.id}">
                    <span class="tag">${esc(a.cat)}</span>
                    <h3>${esc(a.title)}</h3>
                    <p>${esc(a.excerpt)}</p>
                    <div class="meta"><span>${esc(a.date)}</span><span class="dot"></span><span>${esc(a.read)} okuma</span></div>
                </button>
            `).join('');

            const catsHTML = CATEGORIES.map(c => {
                const count = ARTICLES.filter(a => a.cat === c.name).length;
                return `<button type="button" class="cat-card fade" data-action="cat" data-cat="${esc(c.name)}">
                    <div class="icon">${c.icon}</div>
                    <h3>${esc(c.name)}</h3>
                    <div class="count">${count} yazı</div>
                </button>`;
            }).join('');

            const chipsHTML = `<button type="button" class="chip ${!state.filter ? 'active' : ''}" data-action="cat" data-cat="">Tümü</button>` +
                CATEGORIES.map(c => `<button type="button" class="chip ${state.filter === c.name ? 'active' : ''}" data-action="cat" data-cat="${esc(c.name)}">${esc(c.name)}</button>`).join('');

            const cardsHTML = filteredList.length ? filteredList.map(a => `
                <button type="button" class="art-card fade" data-action="article" data-id="${a.id}">
                    <div class="art-visual"><span class="mono-letter">${esc(a.title.charAt(0))}</span></div>
                    <div class="art-body">
                        <span class="tag">${esc(a.cat)}</span>
                        <h3>${esc(a.title)}</h3>
                        <p>${esc(a.excerpt)}</p>
                        <div class="foot"><span>${esc(a.date)}</span><span class="read">${esc(a.read)} →</span></div>
                    </div>
                </button>
            `).join('') : '<p style="color:var(--muted);grid-column:1/-1;text-align:center;padding:40px;">Bu kategoride henüz yazı yok.</p>';

            return `
            <section class="hero">
                <div class="container hero-inner">
                    <div>
                        <div class="hero-badge"><span class="dot"></span>Her pazar yeni bir yazı · Bağımsız yayın</div>
                        <h1>Zamansız erdemler,<br><em>modern bir erkek</em> için.</h1>
                        <p class="lead">Karakter, beceri, sağlık ve ilişkiler üzerine derinlemesine yazılar. Erkekliği bir kalıp değil, bir yolculuk olarak görenler için.</p>
                        <div class="hero-cta">
                            <button type="button" class="btn btn-accent" data-action="scroll" data-target="featured">Yazıları Keşfet 
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
                            </button>
                            <button type="button" class="btn btn-ghost" data-action="about">Hakkımızda</button>
                        </div>
                        <div class="hero-stats">
                            <div class="stat"><div class="num" data-count="80">0</div><div class="lbl">Özgün Yazı</div></div>
                            <div class="stat"><div class="num" data-count="8">0</div><div class="lbl">Kategori</div></div>
                            <div class="stat"><div class="num" data-count="600">0</div><div class="lbl">Dakika Ortalama</div></div>
                        </div>
                    </div>
                    <div class="hero-visual">
                        <div class="float-card fc-1">
                            <div class="tag">Karakter</div>
                            <div class="title">Sessiz Disiplin: Görünmeyen Zaferler</div>
                            <div class="meta">8 dk okuma</div>
                        </div>
                        <div class="float-card fc-2">
                            <div class="tag">Beceri</div>
                            <div class="title">Erkek Mutfağı: Temel Teknikler</div>
                            <div class="meta">10 dk okuma</div>
                        </div>
                        <div class="float-card fc-3">
                            <div class="tag">Zihin</div>
                            <div class="title">Mindfulness Pratiği</div>
                            <div class="meta">8 dk okuma</div>
                        </div>
                    </div>
                </div>
            </section>

            <section id="featured">
                <div class="container">
                    <div class="section-head fade">
                        <div>
                            <span class="kicker">— Bu Hafta Öne Çıkanlar</span>
                            <h2>${state.filter ? esc(state.filter) + ' Kategorisi' : 'Yeni ve derinlemesine yazılar'}</h2>
                            <p>${state.filter ? 'Seçtiğiniz kategoriden en güncel yazılar.' : 'Her yazı; zamansız bir ilkeyi, modern hayatın gerçekleriyle buluşturur.'}</p>
                        </div>
                        <button type="button" class="link-arrow" data-action="cat" data-cat="">Tüm yazılar →</button>
                    </div>
                    <div class="bento">${bentoHTML}</div>
                </div>
            </section>

            <section>
                <div class="container">
                    <div class="section-head fade">
                        <div>
                            <span class="kicker">— Keşfet</span>
                            <h2>Kategoriler</h2>
                        </div>
                    </div>
                    <div class="cats-grid">${catsHTML}</div>
                </div>
            </section>

            <section>
                <div class="container">
                    <div class="section-head fade">
                        <div>
                            <span class="kicker">— Kütüphane</span>
                            <h2>${esc(title)}</h2>
                        </div>
                    </div>
                    <div class="filters">${chipsHTML}</div>
                    <div class="articles-grid">${cardsHTML}</div>
                </div>
            </section>

            <section class="quote-band">
                <div class="container">
                    <blockquote>“İnsan, kendisini bekleyen işi yapmadığı her gün, biraz daha küçülür.”</blockquote>
                    <cite>— Erkeklik Sanatı</cite>
                </div>
            </section>

            <section>
                <div class="container">
                    <div class="newsletter fade">
                        <h2>Her pazar, tek bir sağlam fikir.</h2>
                        <p>Spam yok. Reklam yok. Sadece haftanın en iyi yazısı ve düşünmeye değer bir soru.</p>
                        <form id="newsletterForm">
                            <input type="email" placeholder="merhaba@ornek.com" required>
                            <button type="submit" class="btn btn-accent">Abone Ol</button>
                        </form>
                        <small>İstediğin zaman çıkabilirsin. Sözümüz söz.</small>
                    </div>
                </div>
            </section>
            `;
        }

        function renderArticle() {
            const a = ARTICLES.find(x => x.id === state.articleId);
            if (!a) return '<div class="container" style="padding:80px 24px;text-align:center;"><p>Yazı bulunamadı.</p></div>';
            return `
            <div class="reader">
                <div class="container narrow">
                    <button type="button" class="back" data-action="home">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                        Tüm Yazılar
                    </button>
                    <span class="kicker">— ${esc(a.cat)}</span>
                    <h1>${esc(a.title)}</h1>
                    <div class="meta">
                        <span>${esc(a.date)}</span>
                        <span class="dot"></span>
                        <span>${esc(a.read)} okuma</span>
                        <span class="dot"></span>
                        <span>Erkeklik Sanatı</span>
                    </div>
                    <div class="content">
                        <p class="lead">${esc(a.lead)}</p>
                        ${a.body}
                    </div>
                    <div class="tags">
                        ${a.tags.map(t => `<span>#${esc(t)}</span>`).join('')}
                    </div>
                </div>
            </div>
            `;
        }

        function renderAbout() {
            return `
            <div class="container">
                <div class="about-hero">
                    <span class="kicker" style="font-family:'JetBrains Mono',monospace;font-size:.72rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);">— Hakkında</span>
                    <h1 style="margin-top:16px;">Erkekliği yeniden <em style="font-style:italic;color:var(--accent);">düşünmek</em> üzerine.</h1>
                    <p>Erkeklik Sanatı, erkeklerin karakter, beceri ve amaç bakımından daha sağlam bir hayat kurmalarına yardımcı olmak için kurulmuş bağımsız bir yayındır.</p>
                </div>
                <div class="about-grid">
                    <div class="about-card">
                        <div class="num">01</div>
                        <h3>Zamansız ilkeler</h3>
                        <p>Moda akımların değil, yüzyıllardır işe yarayan ilkelerin peşindeyiz.</p>
                    </div>
                    <div class="about-card">
                        <div class="num">02</div>
                        <h3>Modern gerçekler</h3>
                        <p>Gelenek körü körüne tekrarlanmaz. Bugünün dünyasında ne anlama geldiğini sorgularız.</p>
                    </div>
                    <div class="about-card">
                        <div class="num">03</div>
                        <h3>Pratik bilgi</h3>
                        <p>Her yazının sonunda uygulanabilir bir adım vardır.</p>
                    </div>
                    <div class="about-card">
                        <div class="num">04</div>
                        <h3>Bağımsız ses</h3>
                        <p>Algoritma bize ne yazacağımızı söylemez. Reklamveren değil, okur önce gelir.</p>
                    </div>
                </div>
                <div class="narrow" style="padding:20px 0 40px;">
                    <div class="reader content" style="display:block;padding:0;">
                        <h2>Neden varız?</h2>
                        <p>Bugünün erkeği, tarihte hiç olmadığı kadar çok bilgiye, ama çok az rehberliğe sahip. Bir yanda "erkek adam ağlamaz" diyen katı bir gelenek; diğer yanda köklerinden kopmuş bir modernlik. İkisi de eksik.</p>
                        <p>Biz üçüncü bir yol öneriyoruz: <strong>sorumluluk alan, ama duygularını bastırmayan; güçlü olan, ama kibirli olmayan; öğrenmeye devam eden, ama kendine dürüst kalan bir erkeklik.</strong></p>
                        <blockquote>Erkeklik bir kalıp değil, bir yolculuktur. Varış yok, yön var.</blockquote>
                        <p>Burada bulacağın her yazı, bu yolculuğun bir durağıdır. Acele etme. Oku. Düşün. Uygula.</p>
                        
                        <h2>İki Tuzağı Tanı</h2>
                        <p><strong>Birinci tuzak: katı gelenek.</strong> Bu tuzağa düşen erkek, duygularını bastırır. Ağlamaz, korkmaz, yorulmaz. Sürekli güçlü görünmek zorundadır. Bu tutum, kısa vadede saygı kazandırır; uzun vadede içini çürütür. Yalnızlık, öfke, depresyon — bunlar bu tuzağın kaçınılmaz sonuçlarıdır.</p>
                        <p><strong>İkinci tuzak: köksüz modernlik.</strong> Bu tuzağa düşen erkek, her şeyi reddeder. Ailesini, geleneği, dini, aidiyeti. Kendini "modern" ve "özgür" ilan eder. Ama bu özgürlük, çoğu zaman bir boşluktur. Kim olduğunu, neye bağlı olduğunu, niçin yaşadığını bilemez.</p>
                        <p>İkisi de eksiktir. İkisi de bir insanı tam yapmaz.</p>

                        <h2>Üçüncü Yol</h2>
                        <p>Sağlam bir erkeklik, ne tam gelenek ne tam modernliktir. İkisinden de öğrenir. Ve üçüncü bir yol kurar.</p>
                        <ul>
                            <li><strong>Sorumluluk al.</strong> Aile, iş, çevre, ülke. Sorumluluktan kaçan erkek, özgür değildir; sadece kayıptır. Gerçek özgürlük, taşıdığın yükü kabul etmekle başlar.</li>
                            <li><strong>Duyguları tanı.</strong> Bastırmak değil, ifade etmek. Öfke, üzüntü, sevinç... Hepsi insanidir. Onları inkâr etme, yönetmeyi öğren.</li>
                            <li><strong>Köklerini bil.</strong> Nereden geldiğini bilmeyen, nereye gittiğini de bilemez. Aileni tanı, tarihini oku, kültürünü anla. Bunları reddetmek zorunda değilsin; ama bilmek zorundasın.</li>
                            <li><strong>Kendine dürüst ol.</strong> Başkasının hayatını yaşamak, en yaygın erkeklik tuzağıdır. Babanın istediği meslek, annenin hayal ettiği evlilik, çevrenin beklediği başarı — bunlar senin değil, onların hayatıdır.</li>
                            <li><strong>Topluluğa katıl.</strong> İnsan, yalnız yaşayamaz. Bir dernek, bir cemaat, bir mahalle, bir takım. Kendinden büyük bir şeye ait olmak, köksüzlüğü iyileştirir.</li>
                        </ul>
                        <blockquote>Erkeklik bir kalıp değil, bir yolculuktur. Varış yok, yön var.</blockquote>

                        <h2>Türkiye’nin Kendine Has Zorluğu</h2>
                        <p>Bu ülkede erkek olmak, aynı zamanda bir <em>geçiş</em> meselesidir. Bir ayağın Anadolu'da, diğeri İstanbul'da. Bir yanın gelenekten, diğer yanın modernlikten. Bu geçiş, kolay değildir. Ama bu toprakların erkeği, bu geçişi yüzyıllardır yapıyor. Yani bir maharet var.</p>
                        <p>Bu maharet, denge kurmaktır. Ne geçmişi tamamen reddetmek, ne bugüne tamamen teslim olmak. İkisinden de doğru olanı almak. Ve kendi yolunu kurmak.</p>

                        <h2>Sonuç</h2>
                        <p>Erkeklik, bir sınav değildir. Bir yolculuktur. Kimse mükemmel erkek olarak doğmaz. Kimse mükemmel erkek olarak ölmez. Ama herkes, her gün biraz daha iyi olabilir. Biraz daha dürüst, biraz daha cesur, biraz daha şefkatli, biraz daha sağlam.</p>
                        <p>Bu topraklarda erkek olmak, tam da bu yüzden zordur ve güzeldir. Çünkü burada, iki dünyayı birleştirmek gibi bir iş vardır. Ve bu iş, bir erkeğin ömürlük işidir.</p>
                    </div>
                </div>
            </div>
            `;
        }

        function render() {
            if (state.view === 'home') app.innerHTML = renderHome();
            else if (state.view === 'article') app.innerHTML = renderArticle();
            else if (state.view === 'about') app.innerHTML = renderAbout();
            
            triggerFade();
            animateCounters();
            window.scrollTo(0, 0);
        }

        // Event Listeners
        document.addEventListener('click', e => {
            const target = e.target.closest('[data-action]');
            if (!target) return;
            e.preventDefault();
            e.stopPropagation();
            
            const action = target.getAttribute('data-action');
            
            if (action === 'home') {
                state.view = 'home';
                state.filter = '';
                closeMenu();
                render();
            } else if (action === 'about') {
                state.view = 'about';
                closeMenu();
                render();
            } else if (action === 'article') {
                const id = parseInt(target.getAttribute('data-id'), 10);
                if (!isNaN(id)) {
                    state.view = 'article';
                    state.articleId = id;
                    closeMenu();
                    render();
                }
            } else if (action === 'cat') {
                const cat = target.getAttribute('data-cat') || '';
                state.view = 'home';
                state.filter = cat;
                closeMenu();
                render();
            } else if (action === 'scroll') {
                const targetId = target.getAttribute('data-target');
                const el = document.getElementById(targetId);
                if (el) el.scrollIntoView({ behavior: 'smooth' });
            } else if (action === 'top') {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else if (action === 'privacy') {
                alert('Bu site özgün bir yayındır.');
            } else if (action === 'contact') {
                alert('İletişim: merhaba@erkekliksanati.example');
            }
        });

        // Mobile Menu
        const menuBtn = document.getElementById('menuBtn');
        const navMobile = document.getElementById('navMobile');
        
        function closeMenu() {
            if (navMobile) navMobile.classList.remove('open');
        }

        if (menuBtn && navMobile) {
            menuBtn.addEventListener('click', () => {
                navMobile.classList.toggle('open');
            });
        }

        // Theme Toggle
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;
        
        function updateThemeIcon(theme) {
            const icon = document.getElementById('themeIcon');
            if (!icon) return;
            icon.innerHTML = theme === 'dark' ? 
                '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>' : 
                '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
        }

        if (themeToggle) {
            themeToggle.addEventListener('click', () => {
                const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                html.setAttribute('data-theme', next);
                localStorage.setItem('theme', next);
                updateThemeIcon(next);
            });
        }

        // Init Theme
        const savedTheme = localStorage.getItem('theme') || 'light';
        html.setAttribute('data-theme', savedTheme);
        updateThemeIcon(savedTheme);

        // Scroll Effects
        const backTop = document.getElementById('backTop');
        const progress = document.getElementById('progress');

        window.addEventListener('scroll', () => {
            // Show/Hide Back to Top
            if (window.scrollY > 500) {
                backTop?.classList.add('visible');
            } else {
                backTop?.classList.remove('visible');
            }

            // Update Progress Bar
            const scrollTop = window.scrollY;
            const docHeight = document.body.scrollHeight - window.innerHeight;
            const scrollPercent = (scrollTop / docHeight) * 100;
            if (progress) progress.style.width = scrollPercent + '%';
        });

        // Fade Animation Observer
        let fadeObserver;
        function triggerFade() {
            if (fadeObserver) fadeObserver.disconnect();
            fadeObserver = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('in');
                        fadeObserver.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.05, rootMargin: '0px 0px -40px 0px' });
            document.querySelectorAll('.fade:not(.in)').forEach(el => fadeObserver.observe(el));
        }

        // Counter Animation
        function animateCounters() {
            document.querySelectorAll('[data-count]').forEach(el => {
                const target = parseInt(el.getAttribute('data-count'));
                let current = 0;
                const increment = target / 50;
                const timer = setInterval(() => {
                    current += increment;
                    if (current >= target) {
                        el.textContent = target;
                        clearInterval(timer);
                    } else {
                        el.textContent = Math.floor(current);
                    }
                }, 20);
            });
        }

        // Initial Render
        render();
    </script>
</body>
</html>
